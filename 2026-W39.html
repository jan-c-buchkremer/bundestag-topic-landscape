<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Themenlandschaft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1f2328; --muted: #6b7280; --faint: #a1a1aa; --line: #e7e7e3; --accent: #2563eb; --accent-soft: #e8efff;
  --cdu: #2f2f2f; --spd: #d7263d; --afd: #1f8fd6; --gru: #3f9a3f; --lin: #c0397d; --frl: #8a8a8a; --reg: #a08a2e;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.5 Inter, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }

header { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: var(--card); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
header h1 a { color: inherit; }
header .meta { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.weekwrap { position: relative; }
.weekbtn { font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.weekbtn:hover { border-color: #cdcdc8; background: var(--bg); }
.weekbtn::before { content: ''; width: 11px; height: 11px; border: 1.5px solid var(--muted); border-top-width: 4px; border-radius: 2px; }
#weekCal { position: absolute; left: 0; top: 36px; z-index: 30; display: none; gap: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); padding: 12px 14px 10px; }
#weekCal.open { display: flex; }
#weekCal b { display: block; font-size: 12px; margin-bottom: 6px; }
#weekCal .mo { display: flex; gap: 3px; align-items: center; margin-bottom: 3px; }
#weekCal .mo span { width: 30px; font-size: 11px; color: var(--faint); }
#weekCal .wk { width: 26px; height: 22px; line-height: 22px; text-align: center; border-radius: 6px; font-size: 11px; color: #cfcfca; font-variant-numeric: tabular-nums; }
#weekCal .wk.has { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
#weekCal .wk.has:hover { background: var(--accent); color: #fff; text-decoration: none; }
#weekCal .wk.cur { background: var(--accent); color: #fff; }
#dayScale { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; display: none; align-items: center; gap: 14px; pointer-events: none;
  background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
#dayScale i { display: inline-block; width: 44px; height: 8px; border-radius: 4px; vertical-align: middle; margin-right: 6px; }
#dayScale .hint { color: var(--faint); }
header .help { color: var(--faint); font-size: 12.5px; }

#layout { display: grid; grid-template-columns: 270px 1fr 390px; height: calc(100% - 52px); }
aside, #panel { background: var(--card); overflow-y: auto; }
aside { border-right: 1px solid var(--line); padding: 14px 16px 24px; }
#panel { border-left: 1px solid var(--line); padding: 22px 24px 32px; }
#map { min-width: 0; position: relative; }
#tip { position: absolute; z-index: 5; width: 300px; pointer-events: none; display: none; transform: translate(-50%, -100%);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 9px; box-shadow: 0 6px 20px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05); font-size: 12.5px; line-height: 1.45; }
#tip::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: var(--card); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.lbl { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px;
  background: rgba(255,255,255,.72); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.06);
  font-size: 11.5px; font-weight: 500; color: #374151; letter-spacing: -.005em; transition: transform .15s, box-shadow .15s; }
.lbl .dot { width: 7px; height: 7px; }
.lbl .n { color: var(--faint); font-weight: 400; font-size: 10.5px; }
.lbl:hover { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 4px 12px rgba(0,0,0,.12); border-color: currentColor; z-index: 4; }
.lbl.zoomed { font-size: 12.5px; padding: 4px 11px 4px 8px; }
#tip.below { transform: translate(-50%, 0); }

/* tours */
.tourbtn { font-size: 12.5px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.tourbtn:hover { border-color: #cdcdc8; background: var(--bg); }
#tourMenu { position: absolute; right: 22px; top: 46px; z-index: 30; width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); padding: 6px; display: none; }
#tourMenu.open { display: block; }
#tourMenu .t { display: block; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: inherit; }
#tourMenu .t:hover { background: var(--bg); text-decoration: none; }
#tourMenu .t b { display: block; font-weight: 600; font-size: 13px; }
#tourMenu .t span { color: var(--muted); font-size: 12px; }
#tourDim { position: fixed; inset: 0; z-index: 20; background: rgba(15,23,42,.32); pointer-events: none; display: none; }
#tourDim.show { display: block; }
.tour-target { position: relative; z-index: 21; border-radius: 8px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 7px var(--accent-soft); background: var(--card); }
#map.tour-target { border-radius: 0; box-shadow: inset 0 0 0 3px var(--accent); background: transparent; }
#map.tour-keep { position: relative; z-index: 21; }
#tourCard { position: fixed; z-index: 22; width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 14px 16px 12px; display: none; font-size: 13px; line-height: 1.5; }
#tourCard.show { display: block; }
#tourCard .bar { height: 3px; margin: 0 0 10px; background: var(--line); }
#tourCard .bar i { background: var(--accent); }
#tourCard .step { color: var(--faint); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
#tourCard h4 { margin: 2px 0 6px; font-size: 14px; font-weight: 600; }
#tourCard p { margin: 0 0 10px; color: var(--muted); }
#tourCard p b { color: var(--text); font-weight: 500; }
#tourCard .row { display: flex; gap: 12px; align-items: center; }
#tourCard .row .spacer { flex: 1; }
#tourCard .next { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
#tourCard .wait { color: var(--accent); font-size: 12.5px; }
#tourCard.done { border-color: #3f9a3f; box-shadow: 0 0 0 3px #e3f3e3, 0 10px 30px rgba(0,0,0,.14); }
#tourCard.done .wait { color: #3f9a3f; }
#tip.below::after { bottom: auto; top: -6px; transform: translateX(-50%) rotate(-135deg); }
.tipbox .who { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tipbox .who span { font-weight: 400; color: var(--muted); }
.tipbox .when { color: var(--faint); font-size: 11.5px; margin-bottom: 5px; }
.tipbox .top { color: var(--text); margin-bottom: 1px; }
.tipbox .topic { color: var(--accent); font-size: 11.5px; margin-bottom: 6px; }
.tipbox .excerpt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; mask-image: linear-gradient(#000 45%, transparent 100%); -webkit-mask-image: linear-gradient(#000 45%, transparent 100%); }
#map .cursor-move { cursor: default !important; }  /* Plotly's four-arrow pan cursor */

.sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.sidebar-head b { font-size: 13px; font-weight: 600; }
#count { color: var(--muted); font-size: 12px; }
.linkbtn { font-size: 12.5px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.linkbtn:hover { text-decoration: underline; }

.group { border-top: 1px solid var(--line); padding: 8px 0; }
.group .title { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 3px 0; }
.group .title .arrow { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--faint); transition: transform .2s; margin-left: auto; }
.group.collapsed .title .arrow { transform: rotate(-90deg); }
.group .title .badge { font-size: 10.5px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 6px; }
.group .title .reload { font-size: 13px; color: var(--faint); cursor: pointer; padding: 0 2px; }
.group .title .reload:hover { color: var(--text); }
.group .content { padding-top: 4px; }
.group.collapsed .content { display: none; }
.list { max-height: 264px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.item { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 6px; cursor: pointer; font-size: 12.5px; line-height: 1.35; }
.item:hover { background: var(--bg); }
.item:hover .name { color: var(--accent); }
.item input { margin: 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .n { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.item.zero { opacity: .45; }
.item.day { font-weight: 600; margin-top: 6px; }
.item.day:first-child { margin-top: 0; }
.item.day .dot { width: 22px; border-radius: 4px; }
.item:not(.day)[data-key=agenda] { padding-left: 14px; }
.item .x { color: var(--faint); font-size: 14px; line-height: 1; padding: 0 2px; }
.item .x:hover { color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }

.searchrow { display: flex; gap: 0; margin-bottom: 6px; }
.searchrow input { flex: 1; min-width: 0; border-radius: 8px 0 0 8px; }
.searchrow button { border: 1px solid var(--line); border-left: 0; background: var(--bg); color: var(--text); border-radius: 0 8px 8px 0; padding: 0 10px; font-size: 12.5px; cursor: pointer; }
.searchrow button:hover { background: #ecece8; }
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 6px; }
.segmented button { border: 0; background: transparent; border-radius: 6px; padding: 5px 2px; font-size: 12px; color: var(--muted); cursor: pointer; }
.segmented button.on { background: var(--card); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
select, input[type=text] { width: 100%; font: inherit; font-size: 12.5px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
select:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; cursor: pointer; font-size: 12.5px; }
.toggle input { appearance: none; width: 30px; height: 18px; border-radius: 999px; background: #d9d9d4; position: relative; cursor: pointer; margin: 0; transition: background .15s; flex: none; }
.toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { left: 14px; }

#panel .hint { color: var(--muted); }
#panel .hint kbd { font: inherit; font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--bg); }
#panel h2 { font-size: 16px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; line-height: 1.35; }
#panel .meta { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-bottom: 16px; }
#panel .meta b { color: var(--text); font-weight: 500; }
#panel p { margin: 0 0 10px; }
#panel p.comment { color: var(--faint); font-style: italic; font-size: 12.5px; padding-left: 12px; border-left: 2px solid var(--line); }
#panel p.chair { color: var(--muted); font-size: 12.5px; padding-left: 12px; border-left: 2px solid #cfd8ea; }
#panel mark { background: #fff3a8; color: inherit; border-radius: 2px; }
#panel h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
#panel table { border-collapse: collapse; width: 100%; font-size: 13px; }
#panel td { padding: 4px 0; vertical-align: top; }
#panel td:last-child { text-align: right; color: var(--muted); white-space: nowrap; padding-left: 10px; }
#panel ul { padding-left: 0; margin: 0; list-style: none; }
#panel li { margin-bottom: 6px; }
#panel li .sub { color: var(--faint); font-size: 12px; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; }
.similar { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; margin-bottom: 6px; transition: border-color .12s, background .12s; }
.similar:hover { border-color: #cdcdc8; background: var(--bg); }
.similar .who { font-weight: 500; }
.similar .who span { color: var(--faint); font-weight: 400; }
.similar .what { color: var(--muted); font-size: 12px; }
.similar .kind { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.similar.marker { margin: 4px 0 12px; }
.similar .full { display: none; margin-top: 6px; }
.similar.open .full { display: block; }
.similar.open .what { display: none; }
#panel .similar .full p { font-size: 12.5px; margin: 0 0 6px; }
#panel table.dist tr { cursor: pointer; }
#panel table.dist tr:hover td:first-child { color: var(--accent); }
#panel details summary { color: var(--muted); font-size: 12px; cursor: pointer; margin: 2px 0 4px; }
.close { float: right; color: var(--faint); background: none; border: 0; font-size: 18px; line-height: 1; cursor: pointer; margin: -4px -6px 0 0; }
.close:hover { color: var(--text); }

/* desktop: the sheet is only a wrapper, its children sit in the three grid columns */
#sheet { display: contents; }
#sheetHead { display: none; }
aside { grid-area: 1 / 1; } #map { grid-area: 1 / 2; } #panel { grid-area: 1 / 3; }
@media (hover: none) {
  .item:hover, .similar:hover { background: none; } .item:hover .name { color: inherit; } .lbl:hover { transform: translate(-50%, -50%); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
}

/* phones: map on top, a bottom sheet with the tabs Filter | Details; heights are set in JS (layoutSheet) */
@media (max-width: 900px), (pointer: coarse) and (max-width: 1100px) {
  html, body { overflow: hidden; overscroll-behavior: none; }
  header { height: 48px; padding: 0 12px; gap: 10px; position: relative; z-index: 12; }
  header .meta, header .help { display: none; }
  header h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #weekCal { position: fixed; left: 8px; right: 8px; top: 52px; flex-direction: column; max-height: calc(100dvh - 70px); overflow-y: auto; }
  #weekCal .wk { width: 32px; height: 32px; line-height: 32px; font-size: 12px; }
  #weekCal .mo span { width: 34px; }
  #tourMenu { position: fixed; left: 8px; right: 8px; top: 52px; width: auto; }
  #tourMenu .t { padding: 12px; }
  #layout { display: block; height: auto; }
  #map, #map.tour-target, #map.tour-keep { position: fixed; top: 48px; left: 0; right: 0; height: 50dvh; touch-action: none; }
  #dayScale { flex-wrap: wrap; justify-content: center; gap: 4px 12px; max-width: calc(100% - 16px); border-radius: 12px; bottom: 8px; }
  .lbl { padding: 5px 11px 5px 9px; }
  #sheet { display: flex; flex-direction: column; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: 50dvh;
    background: var(--card); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.08), 0 -1px 0 var(--line); transition: height .25s ease; }
  #sheet.dragging { transition: none; }
  body.tour-sheet #sheet { z-index: 21; }
  #sheetHead { display: block; flex: none; touch-action: none; }
  .grip { height: 22px; display: flex; align-items: center; justify-content: center; }
  .grip::before { content: ''; width: 38px; height: 4px; border-radius: 2px; background: #d4d4d0; }
  #peek { margin: 0 12px 8px; padding: 9px 12px 8px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  #peek[hidden] { display: none; }
  #peek .who .go { margin-left: auto; color: var(--accent); font-weight: 500; white-space: nowrap; }
  #peek .excerpt { -webkit-line-clamp: 2; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin: 0 12px 8px; background: var(--bg); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; background: transparent; border-radius: 8px; padding: 7px; font-size: 14px; color: var(--muted); }
  body[data-tab=filter] .tabs [data-tab=filter], body[data-tab=detail] .tabs [data-tab=detail] { background: var(--card); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  #filterBadge:not(:empty) { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  aside, #panel { flex: 1; min-height: 0; border: 0 !important; overscroll-behavior: contain; padding-bottom: calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line) !important; }
  aside { padding-top: 10px; }
  #panel { padding-top: 16px; font-size: 14.5px; }
  body[data-tab=filter] #panel, body[data-tab=detail] aside { display: none; }
  .list { max-height: none; }
  .item { min-height: 40px; font-size: 14px; }
  .item input { width: 18px; height: 18px; }
  .item .n { font-size: 12px; }
  .group .title { padding: 9px 0; font-size: 12px; }
  .group .title .reload { font-size: 18px; padding: 0 12px; margin: -6px 0; }
  .segmented button { padding: 9px 2px; font-size: 13px; }
  .toggle { padding: 9px 0; font-size: 14px; }
  .toggle input { width: 38px; height: 22px; } .toggle input::after { width: 18px; height: 18px; } .toggle input:checked::after { left: 18px; }
  select, input[type=text] { font-size: 16px; padding: 8px 10px; }  /* under 16px iOS zooms into the field */
  .searchrow button { padding: 0 16px; font-size: 18px; }
  .similar { padding: 10px 12px; }
  #panel table.dist td { padding: 7px 0; }
  #panel details summary { padding: 8px 0; font-size: 13px; }
  .close { font-size: 26px; padding: 4px 10px; margin: -10px -14px 0 0; }
  #tourCard { width: auto; right: 8px; }
  /* landscape phones: the sheet is a fixed right-hand column, no dragging */
  @media (orientation: landscape) and (max-height: 500px) {
    #map, #map.tour-target, #map.tour-keep { right: 42%; height: auto !important; bottom: 0; }
    #sheet { top: 48px; left: auto; width: 42%; height: auto !important; border-radius: 0; box-shadow: -1px 0 0 var(--line); }
    .grip { display: none; }
    #sheetHead { padding-top: 8px; }
  }
}
</style>
</head>
<body>
<header>
  <h1><a href="index.html">Themenlandschaft</a></h1>
  <span class="weekwrap"><button class="weekbtn" id="weekBtn" title="Sitzungswoche wählen"></button><div id="weekCal"></div></span>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span class="help">Scrollen: Zoom · Ziehen: Verschieben · Doppelklick: Zurücksetzen</span>
  <button class="tourbtn" id="tourBtn">Tour</button>
  <div id="tourMenu"></div>
</header>
<div id="tourDim"></div><div id="tourCard"></div>
<div id="layout">
  <div id="sheet">
  <div id="sheetHead"><div class="grip" title="Größe ändern"></div><div id="peek" class="tipbox" hidden></div>
    <div class="tabs"><button data-tab="filter">Filter <span id="filterBadge"></span></button><button data-tab="detail">Details</button></div></div>
  <aside>
    <div class="sidebar-head"><b>Filter</b><span><span id="count"></span> · <button class="linkbtn" id="reset">zurücksetzen</button></span></div>
    <div class="group" id="g-search"><div class="title">Suche<span class="arrow"></span></div><div class="content">
      <div class="searchrow"><input type="text" id="search" placeholder="Text, Name, Tagesordnungspunkt…"><button id="addSearch" title="Suchbegriff als Filter speichern (Enter)">+</button></div>
      <div class="list" id="searchList"></div>
    </div></div>

<script>
const DATA = {"week": "2026-W39", "weeks": ["2025-W13", "2025-W19", "2025-W20", "2025-W21", "2025-W23", "2025-W26", "2025-W28", "2025-W37", "2025-W38", "2025-W39", "2025-W41", "2025-W42", "2025-W45", "2025-W46", "2025-W48", "2025-W49", "2025-W51", "2026-W03", "2026-W05", "2026-W09", "2026-W10", "2026-W12", "2026-W13", "2026-W16", "2026-W17", "2026-W19", "2026-W21", "2026-W24", "2026-W26", "2026-W28", "2026-W37", "2026-W39"], "clusters": [{"id": 0, "terms": ["wallet", "digitale", "digitalen", "you"], "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "n": 8}, {"id": 1, "terms": ["tropfen", "opfer", "täter", "frauen"], "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "n": 14}, {"id": 2, "terms": ["progression", "wohnungen", "einkommen", "rädern"], "agenda": "Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen", "n": 20}, {"id": 3, "terms": ["bundeswehr", "nato", "gleichzeitig", "zeigen"], "agenda": "Befragung der Bundesregierung", "n": 12}, {"id": 4, "terms": ["antisemitismus", "berlin", "linken", "partei"], "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "n": 19}, {"id": 5, "terms": ["linnemann", "beitragssatzstabilisierungsgesetz", "eltern", "bundesgesundheitsminister"], "agenda": "Befragung der Bundesregierung", "n": 17}, {"id": 6, "terms": ["thema", "system", "kommission", "nächsten"], "agenda": "Befragung der Bundesregierung", "n": 15}, {"id": 7, "terms": ["thema", "notfallreform", "ersteinschätzung", "glaube"], "agenda": "Befragung der Bundesregierung", "n": 10}], "speeches": [{"id": "ID219500100", "x": -7.136, "y": 1.714, "cluster": -1, "speaker": "Dr. Irene Mihalic", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/1", "agenda": "Zur Geschäftsordnung", "top": "Zur Geschäftsordnung", "drucksachen": [], "chars": 3010, "comments": 10, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500400", "ID219500200", "ID219500700", "ID219500300", "ID219514900"], "next": "ID219500200", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Meine Damen und Herren! Leider müssen wir heute über etwas diskutieren, das eigentlich eine Selbstverständlichkeit sein sollte, nämlich über die Befassung dieses Hauses mit einem Gesetzentwurf des Bundesrates. Der Bundesrat hat bereits im September 2025 einen Gesetzentwurf zur Ergänzung von Artikel 3 des Grundgesetzes um das Merkmal der sexuellen Identität beschlossen – auf Initiative des Landes Berlin, getragen von CDU und SPD, unterstützt von vielen weiteren Bundesländern."], ["comment", "(Stephan Brandner [AfD]: Aber nicht von uns!)"], ["text", "Seit nunmehr fast einem Jahr liegt dieser Gesetzentwurf nun hier vor, hat es aber bis heute nicht auf die Tagesordnung des Deutschen Bundestages geschafft. Das ist der Grund für diese Geschäftsordnungsdebatte hier."], ["text", "Wir beantragen, den Gesetzentwurf des Bundesrates zur Ergänzung von Artikel 3 auf die Tagesordnung zu setzen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie der Abg. Ina Latendorf [Die Linke])"], ["text", "Es geht also darum, meine Damen und Herren, dass der Deutsche Bundestag die Chance bekommt, sich überhaupt mit diesem Gesetzentwurf zu befassen, ihn zu beraten und anschließend auch darüber abzustimmen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie der Abg. Ina Latendorf [Die Linke])"], ["text", "Und es ist vollkommen unverständlich, dass Sie von der Koalition dem Hohen Haus die Befassung damit bisher verweigert haben."], ["comment", "(Zuruf des Abg. Falko Droßmann [SPD])"], ["text", "Nach dem schrecklichen islamistischen Anschlag auf den Christopher Street Day in Berlin ist diese Frage umso drängender. Zu Recht wurden Konsequenzen gefordert. Auch aus der SPD-Spitze kamen klare Worte. Der Vizekanzler Lars Klingbeil und die Ministerin Bärbel Bas haben sich dafür ausgesprochen, den Schutz queerer Menschen im Grundgesetz zu verankern. Aber solche Aussagen müssen auch mal zu parlamentarischen Beratungen führen; denn sonst sind sie nichts wert."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie der Abg. Ina Latendorf [Die Linke])"], ["text", "Genau diese Beratungen verhindern Sie bislang. Inzwischen hat sich sogar die Sozialsenatorin des Landes Berlin als Beauftragte des Bundesrates an die Bundestagspräsidentin gewandt und darum gebeten, die Befassung voranzubringen. Seitdem ist wieder nichts passiert."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Dabei geht es hier um eine Initiative der Länder, die nicht parteipolitisch, sondern eben parteiübergreifend geprägt ist. Ein gutes Beispiel ist übrigens die Ehe für alle. Dieser Gesetzentwurf kam auch aus dem Bundesrat und hat eine jahrzehntelange Debatte entscheidend vorangebracht."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Länderinitiativen können also festgefahrene Prozesse überwinden, meine Damen und Herren, und sie verdienen Beratung und nicht das politische Abstellgleis."], ["text", "Deshalb meine Frage an Sie von der Union und von der SPD: Was spricht eigentlich dagegen? Was spricht objektiv dagegen, diesen Gesetzentwurf auf die Tagesordnung zu setzen? Wenn Sie ihn ablehnen oder da Änderungsbedarf sehen, ja, dann lassen Sie uns doch hier im Parlament darüber diskutieren."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Aber Nichtbefassung ist keine politische Position. Sie verhindert nur die Debatte."], ["text", "Geben Sie sich doch einen Ruck. Setzen Sie den Gesetzentwurf auf die Tagesordnung. Lassen Sie uns hier im Bundestag darüber beraten. Das ist keine Frage von Regierung oder Opposition. Das ist eine Frage des Respekts vor dem Bundesrat, aber auch vor diesem Parlament."], ["text", "Ganz herzlichen Dank."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Für die Fraktion CDU/CSU hat nun Frau Abgeordnete Catarina dos Santos-Wintz das Wort. Bitte sehr."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219500200", "x": -7.283, "y": 1.454, "cluster": 1, "speaker": "Catarina dos Santos-Wintz", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/1", "agenda": "Zur Geschäftsordnung", "top": "Zur Geschäftsordnung", "drucksachen": [], "chars": 2778, "comments": 7, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500100", "ID219500700", "ID219500400", "ID219500300", "ID219516700"], "next": "ID219500300", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Liebe Kolleginnen und Kollegen! Vor weniger als einem Jahr haben wir genau an dieser Stelle 60 Minuten lang zu einem Gesetzentwurf der Grünen zur Aufnahme des Merkmals der sexuellen Identität in Artikel 3 des Grundgesetzes debattiert."], ["comment", "(Dr. Bernd Baumann [AfD]: Das ist doch was anderes!)"], ["text", "Wir haben das selbstverständlich getan; denn natürlich kann jede Fraktion hier ihre Gesetzentwürfe aufsetzen. In dieser Debatte fiel eine Aussage Ihrer Kollegin Nyke Slawik, die sagte, dass dieser Gesetzentwurf wortgleich zu dem Entwurf des Bundesrates sei, den die Grünen jetzt in dieser Woche im Plenum beraten wollen. Das heißt, wir hatten eine ausführliche Debatte. Wir haben jetzt ein noch laufendes Gesetzgebungsverfahren. Die Argumente haben wir hier im Plenum ausgetauscht, und der Entwurf befindet sich nun im Ausschussverfahren."], ["text", "Wir als Union haben in der damaligen Debatte wie heute deutlich gemacht: Niemand darf aufgrund seiner sexuellen Orientierung diskriminiert oder benachteiligt werden. Allerdings sind wir nicht überzeugt davon, dass es dafür einer weiteren Regelung im Grundgesetz bedarf."], ["comment", "(Dr. Bernd Baumann [AfD]: Kollege Wüst aber schon!)"], ["text", "Warum? Schon heute schützt Artikel 3 des Grundgesetzes jeden Menschen in Deutschland vor Diskriminierung. Darüber hinaus gewährleistet auch Artikel 2 über das allgemeine Persönlichkeitsrecht den Schutz der geschlechtlichen Identität. Die Stärke unseres Grundgesetzes liegt auch in der Präzision seiner Formulierung und in seiner Konzentration auf das Wesentliche, liebe Kolleginnen und Kollegen. Nicht jede Konkretisierung, die die Rechtsprechung aus den Grundrechten entwickelt, muss deshalb auch zusätzlich ausdrücklich in den Verfassungstext aufgenommen werden."], ["comment", "(Dr. Bernd Baumann [AfD]: Herr Wüst will das aber!)"], ["text", "Das Argument, mit einer Ergänzung vor allem ein gesellschaftspolitisches Signal setzen zu wollen, reicht für uns als Rechtfertigung einer Grundgesetzänderung daher nicht aus."], ["comment", "(Beifall bei der CDU/CSU)"], ["text", "Diese und im Übrigen auch andere inhaltliche Argumente sind in der Kernzeitdebatte vom letzten Oktober bereits ausführlich ausgetauscht worden. Seitdem befindet sich dieser Gesetzentwurf in den Ausschussberatungen."], ["text", "Der Gesetzentwurf des Bundesrates verfolgt dasselbe Ziel, betrifft dieselbe Verfassungsänderung wie Ihr eigener Gesetzentwurf, liebe Kolleginnen und Kollegen der Fraktion Bündnis 90/Die Grünen. Ich sehe daher weder, welche zusätzlichen Erkenntnisse wir als Parlament aus einer erneuten Debatte haben sollten, noch erschließt sich meiner Fraktion, welchen Vorteil es für das parlamentarische Verfahren bringen soll, wenn wir eine faktische zweite erste Lesung zum identischen Regelungsgegenstand machen."], ["comment", "(Dr. Bernd Baumann [AfD]: Anderes Gesetz!)"], ["text", "Kurzum gibt es aus unserer Sicht weder einen sachlichen noch einen formalen Grund, dieselbe Grundgesetzänderung in dieser Woche erneut in erster Lesung zu beraten. Deswegen lehnen wir den Aufsetzungsantrag der Grünen ab."], ["text", "Herzlichen Dank."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Für die AfD-Fraktion hat Herr Abgeordneter Dr. Bernd Baumann das Wort. Bitte."], ["comment", "(Beifall bei der AfD)"]]}, {"id": "ID219500300", "x": -7.481, "y": 1.451, "cluster": -1, "speaker": "Dr. Bernd Baumann", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/1", "agenda": "Zur Geschäftsordnung", "top": "Zur Geschäftsordnung", "drucksachen": [], "chars": 2449, "comments": 11, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500100", "ID219500200", "ID219500400", "ID219515800", "ID219500700"], "next": "ID219500400", "paragraphs": [["text", "Frau Präsidentin! Meine Damen und Herren! Ein Beben geht durch Deutschland. Die Wähler haben am Wochenende die CDU, einst staatstragende Partei Konrad Adenauers, geradezu zertrümmert und erstmals aus einem deutschen Parlament geworfen. Jeder kann jetzt sehen, meine Damen und Herren: Die Strategie der Union, –"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Zur Geschäftsordnung, bitte."], ["text", "– konservativ bürgerliche Wähler einzusammeln –"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Ich halte ganz kurz die Zeit an."], ["text", "– und dann mit der SPD und den Grünen zu paktieren, ist gescheitert, meine Damen und Herren."], ["comment", "(Beifall bei der AfD)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Herr Dr. Baumann, ich bitte Sie, zur Geschäftsordnung zu reden und nicht zur Nachlese von Wahlergebnissen. Es ist eine Geschäftsordnungsdebatte."], ["text", "Das war die Einleitung zu genau dem. Vielen Dank, Frau Präsidentin. – Genau diese Doppelzüngigkeit der Union ist auch die Ursache dieser GO-Debatte."], ["comment", "(Stephan Brandner [AfD]: Aha!)"], ["text", "Denn die CDU-geführte Bundesregierung will heute die Aufsetzung eines Gesetzentwurfs verhindern. Was ist der Hintergrund? Seit Jahren schon drängen SPD, Grüne und die Partei Die Linke darauf: Sie wollen ihr wokes Weltbild per Verfassungsänderung in unser Grundgesetz hineinschreiben."], ["comment", "(Falko Droßmann [SPD]: Der einzige Woke hier sind Sie!)"], ["text", "Queere Identitäten sollen in Artikel 3 ausdrücklich aufgenommen werden. Dabei ist doch allen Verfassungsexperten klar: Unser Grundgesetz ist mit das freiheitlichste dieser Welt. Es schützt bereits jedwede geschlechtliche Orientierung. Da muss nichts geändert werden."], ["comment", "(Beifall bei der AfD)"], ["text", "Trotzdem brachten die linken Parteien diese Gesetzesinitiative im Bundesrat ein. Der Bundesrat, die deutsche Länderkammer, hat dieser Machtdemonstration der Linken, die ihre Ideologie in unser Grundgesetz schreiben wollen, zugestimmt. Unfassbar, meine Damen und Herren!"], ["comment", "(Mirze Edis [Die Linke]: Das nennt sich Demokratie!)"], ["text", "Wie konnte das im Bundesrat geschehen? Das passierte, weil die Länderchefs der CDU, allen voran Wüst und Günther, dieser queeren Verfassungsänderung zugestimmt haben. Sie haben sich mit den Woken und Linksgrünen vollends gemeingemacht."], ["comment", "(Stephan Brandner [AfD]: Nicht zu fassen!)"], ["text", "Das ist die Wahrheit über diese CDU/CSU, meine Damen und Herren."], ["comment", "(Beifall bei der AfD)"], ["text", "Genau das bringt die CDU hier im Bundestag jetzt in die Klemme."], ["comment", "(Falko Droßmann [SPD]: Setzen wir es jetzt auf oder nicht?)"], ["text", "Hier möchte sie ja immer noch so tun, als sei sie irgendwie konservativ und als sei die Verfassung heilig. Deshalb will die von Merz geführte Regierung heute mit aller Macht die Aufsetzung und Abstimmung dieses Gesetzes im Bundestag verhindern. Sonst müsste sie ja bei der Abstimmung dem links-grünen Paktieren ihrer CDU-Länderchefs hier vor aller Augen zustimmen. Und dann würde hier im Bundestag überdeutlich, wie sehr die CDU ihre konservativen Wähler verrät, meine Damen und Herren."], ["comment", "(Beifall bei der AfD)"], ["text", "Dieses Gesetz muss auf die Tagesordnung, damit jeder in Deutschland sehen kann, wie bodenlos, wie verschlagen und wie doppelzüngig diese Merz-Union tatsächlich ist."], ["comment", "(Beifall bei der AfD – Falko Droßmann [SPD]: Kommen wir jetzt zum Antrag?)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Für die Fraktion der SPD hat nun Herr Abgeordneter Dirk Wiese das Wort. Bitte."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"]]}, {"id": "ID219500400", "x": -7.195, "y": 1.169, "cluster": -1, "speaker": "Dirk Wiese", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/1", "agenda": "Zur Geschäftsordnung", "top": "Zur Geschäftsordnung", "drucksachen": [], "chars": 3266, "comments": 15, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500100", "ID219500700", "ID219515300", "ID219515200", "ID219517200"], "next": "ID219500500", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Kolleginnen und Kollegen! Wenn sich die Fraktionen des Deutschen Bundestages nicht über die Tagesordnung einigen können, dann muss darüber mehrheitlich abgestimmt werden. Das ist ein normales Prozedere, und darum führen wir diese Geschäftsordnungsdebatte jetzt auch."], ["text", "Aber: Ich will darauf hinweisen, dass es bei den Grünen eher nicht so um die inhaltliche Diskussion geht, sondern es geht um politische Taktiererei zum kurzfristigen Geländegewinn."], ["comment", "(Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN]: Ja, ja!)"], ["text", "Ich will auch deutlich machen, warum."], ["comment", "(Zuruf der Abg. Agnieszka Brugger [BÜNDNIS 90/DIE GRÜNEN])"], ["text", "Dieser Gesetzentwurf im Bundesrat, den die Grünen gerne debattieren möchten – die Kollegin Santos-Wintz hat es angesprochen –, befindet sich wortgleich zur Beratung im Rechtsausschuss im Deutschen Bundestag."], ["comment", "(Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN]: Ja! Weil ihr den im Bundesrat nicht aufsetzen wolltet!)"], ["text", "Dort befassen wir uns bereits mit einem Gesetzentwurf zu einem inhaltlich richtigen Punkt,"], ["comment", "(Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN]: Ihr wolltet ja damals schon nicht den Gesetzentwurf des Bundesrates aufsetzen! Deswegen haben wir das gemacht!)"], ["text", "nämlich zur Ergänzung von Artikel 3 im Grundgesetz. Wir als SPD befürworten das. Aber wir nehmen auch wahr und zur Kenntnis, dass unser Koalitionspartner hier eine andere Auffassung hat, und darum muss man darüber debattieren und darüber sprechen. Auch bei der Ehe für alle hat es sehr lange gedauert, bis es am Ende zu einer Lösung gekommen ist. Aber: Der Gesetzentwurf befindet sich bereits zur Debatte im Rechtsausschuss, und dort findet aktuell auch die Diskussion darüber statt."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"], ["text", "Jetzt finde ich Folgendes interessant: Frau Mihalic, Sie haben hier gerade deutlich gemacht, dass Sie unbedingt darüber sprechen wollen und wie wichtig es Ihnen ist, diesen Gesetzentwurf diese Woche auf die Tagesordnung zu setzen – was ich Ihnen auch abnehme."], ["comment", "(Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN]: Ja! Sonst hätten wir ihn nicht selber eingebracht!)"], ["text", "Jetzt will ich Ihnen aber eine Geschichte von heute Morgen aus dem Rechtsausschuss erzählen. Im Rechtsausschuss hatte Ihre Fraktion nach Fristablauf die Möglichkeit, eine Anhörung für Ihren Gesetzentwurf zu genau dem Thema zu beantragen. -"], ["comment", "(Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN]: Ja, machen wir ja auch! – Gegenruf des Abg. Falko Droßmann [SPD]: Jetzt redet euch doch nicht raus!)"], ["text", "Das haben Sie heute Morgen verpasst."], ["comment", "(Dr. Janosch Dahmen [BÜNDNIS 90/DIE GRÜNEN]: Ihr redet euch doch nur raus!)"], ["text", "Ihren Kolleginnen und Kollegen im Rechtsausschuss ist das nämlich durchgerutscht. Sie haben das zu Beginn der Tagesordnung nicht beantragt. Ihnen schien es nicht wichtig gewesen zu sein, einen normalen Prozess dort im Ausschuss, wo die Debatte stattfindet, aufzusetzen."], ["comment", "(Falko Droßmann [SPD]: Meine Güte!)"], ["text", "Es waren die Koalitionsfraktionen aus SPD und CDU/CSU, die Ihre Kollegen im Rechtsausschuss auf diesen Fehler hingewiesen haben."], ["comment", "(Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN]: Sollen wir jetzt Danke sagen, oder was? – Stephan Brandner [AfD]: Jetzt meinen Sie den Innenausschuss! Was hat der Rechtsausschuss damit zu tun?)"], ["text", "Wir haben es Ihnen möglich gemacht, da, wo debattiert werden soll, weiter über diesen Gesetzentwurf zu diskutieren. Das heißt: Das ist reine Schaufensterpolitik. Dort, wo es nicht debattiert wird, haben Sie es gemacht."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"], ["text", "Das Einzige, was Sie machen wollen, ist: Sie wollen Teile der Koalition in dieser Woche durch eine namentliche Abstimmung vorführen. Das sind politische Taschenspielertricks zum kurzfristigen Geländegewinn."], ["comment", "(Falko Droßmann [SPD]: Ganz genau!)"], ["text", "Ich sage es Ihnen aber ganz offen: Nach den Landtagswahlen sollten Sie überlegen, ob das noch die richtige Vorgehensweise zwischen den demokratischen Fraktionen ist."], ["comment", "(Zuruf des Abg. Dr. Janosch Dahmen [BÜNDNIS 90/DIE GRÜNEN])"], ["text", "Ganz offen, ein Wort zum Schluss: Herr Baumann, ich habe Ihre Rede gerade gehört; ich habe sie zur Kenntnis genommen. Ich sage Ihnen aber auch ganz offen: Wer zu Hause in der Kellerbar die alte Reichskriegsflagge hängen hat, der soll mir nicht irgendetwas über Schwarz-Rot-Gold oder Regenbogenfahnen erklären. Die stehen für Demokratie, Rechtsstaat und für die Vielfalt in diesem Land. Das vertreten Sie nicht."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU – Tino Chrupalla [AfD]: Herr Baumann hat eine Bodenplatte! Der hat gar keinen Keller!)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Herr Dr. Baumann ist eben persönlich angesprochen worden. Ich gebe ihm die Möglichkeit, darauf zu antworten."], ["comment", "(Widerspruch bei Abgeordneten der CDU/CSU, der SPD und des BÜNDNISSES 90/DIE GRÜNEN – Stephan Brandner [AfD]: Was machen Sie in Herrn Baumanns Keller, Herr Wiese?)"], ["chair", "– Leute, Leute! Er ist persönlich angesprochen worden. Da müssen Sie es nicht kommentieren, wenn ich eine Reaktion zulasse. Herr Wiese kann dann auch darauf antworten. Das ist hier die normale Gepflogenheit, egal wer Absender und wer Empfänger ist. – Bitte sehr."]]}, {"id": "ID219500500", "x": -8.419, "y": 0.933, "cluster": 4, "speaker": "Dr. Bernd Baumann", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/1", "agenda": "Zur Geschäftsordnung", "top": "Zur Geschäftsordnung", "drucksachen": [], "chars": 816, "comments": 4, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515200", "ID219500600", "ID219515300", "ID219515500", "ID219518400"], "next": "ID219500600", "paragraphs": [["text", "Herr Wiese, Sie haben gerade behauptet, ich hätte die Reichskriegsflagge im Keller. Ich weiß überhaupt nicht, wie Sie darauf kommen. Ich weiß, dass Sie verzweifelt sind."], ["comment", "(Falko Droßmann [SPD]: Ach Gott!)"], ["text", "Man kann ja mit Menschen mitfühlen, die verzweifelt sind. Aber was Sie hier im Bundestag als Politiker äußern, zeigt das Ausmaß an Verzweiflung einer untergehenden Partei, die keine Argumente mehr hat, die völlig wehrlos ist."], ["comment", "(Beifall bei der AfD)"], ["text", "Sie waren ja mal die Arbeiterpartei. Sie waren nach dem Ersten Weltkrieg eine staatstragende Partei. Wenn es die SPD nicht gegeben hätte, hätte Deutschland gar nicht weitermachen können. Sie hatten mal einen Helmut Schmidt. Was wir heute hier erblicken, ist eine SPD, die weite Teile der Arbeiterschaft verraten hat, die sich verraten fühlt und die nur noch eine linke Klientel bedient."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Ich halte die Zeit an. – Herr Dr. Baumann, Sie wollten darauf, dass Sie persönlich angesprochen wurden, antworten. Aber es geht jetzt nicht um Abrechnung und weitere Beschimpfungen von Parteien."], ["comment", "(Stephan Brandner [AfD]: Das ist doch keine Beschimpfung!)"], ["chair", "Meine Bereitschaft, Sie reden zu lassen, bezieht sich auf das, was Sie angemeldet hatten."], ["text", "Ich habe niemanden beschimpft."], ["comment", "(Lachen bei Abgeordneten der CDU/CSU, der SPD und des BÜNDNISSES 90/DIE GRÜNEN – Britta Haßelmann [BÜNDNIS 90/DIE GRÜNEN]: Das ist der normale Umgang!)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Herr Wiese, bitte."]]}, {"id": "ID219500600", "x": -8.468, "y": 1.066, "cluster": 4, "speaker": "Dirk Wiese", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/1", "agenda": "Zur Geschäftsordnung", "top": "Zur Geschäftsordnung", "drucksachen": [], "chars": 1086, "comments": 4, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515500", "ID219515200", "ID219515300", "ID219500400", "ID219515600"], "next": "ID219500700", "paragraphs": [["text", "Sehr geehrter Herr Dr. Baumann, ich möchte gerne auf Ihre Punkte antworten. Ich will Ihnen eines sagen: Diese SPD hat eine 163-jährige Geschichte. Es ist schon einmal versucht worden, sie kaputtzumachen – von Ihren ideologischen Vorgängerinnen und Vorgängern."], ["comment", "(Beifall bei der SPD sowie des Abg. Mirze Edis [Die Linke] – Lachen bei der AfD – Dr. Bernd Baumann [AfD]: Wieder so ein Ding!)"], ["text", "Wir werden uns mit allem dagegenstellen, kann ich Ihnen sagen. Diese Partei werden Sie nicht kleinkriegen. Da können Sie sich warm anziehen. Das sage ich auch mit vollem Selbstbewusstsein."], ["text", "Dann will ich Ihnen noch etwas entgegnen, weil Sie es angesprochen haben: Ihre ideologische Grundüberzeugung ist, dass die Zeit von 1933 bis 1945 ein Vogelschiss der Geschichte ist."], ["comment", "(Dr. Bernd Baumann [AfD]: Das ist nicht unsere Überzeugung!)"], ["text", "Bei einem Mitarbeiter Ihrer Spitzenkandidatin wurden NS-Devotionalien im Haus gefunden. Es gibt Leute in Mecklenburg-Vorpommern, die in der Identitären Bewegung sind, die der NPD-Jugendorganisation angehört haben. Ich will Ihnen ganz deutlich sagen: Sie vertreten nicht die Farben Schwarz, Rot und Gold in diesem Land. Sie vertreten die alten Fahne der Restauration. Das ist Schwarz, Weiß und Rot, die alte Reichskriegsflagge. Zu der Aussage stehe ich."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU und des BÜNDNISSES 90/DIE GRÜNEN)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Nun hat abschließend für die Fraktion Die Linke Frau Abgeordnete Ina Latendorf zur Geschäftsordnung das Wort. Bitte."], ["comment", "(Beifall bei der Linken)"]]}, {"id": "ID219500700", "x": -7.136, "y": 1.553, "cluster": -1, "speaker": "Ina Latendorf", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/1", "agenda": "Zur Geschäftsordnung", "top": "Zur Geschäftsordnung", "drucksachen": [], "chars": 2325, "comments": 5, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500100", "ID219500400", "ID219500200", "ID219515500", "ID219515900"], "next": "ID219500800", "paragraphs": [["text", "Sehr geehrte Präsidentin! Zurück zur Geschäftsordnungsdebatte. Die Bundesratsinitiative zur Einführung des Merkmals der sexuellen Identität in Artikel 3 des Grundgesetzes sollte hier im Bundestag eingebracht und beraten werden. Der von der Koalition gegen diese Bundesratsinitiative vorgebrachte Widerstand, sie hier überhaupt zu debattieren, wirft jedoch Fragen auf: Welches Verständnis von Demokratie, von demokratischem Diskurs liegt denn bei Ihnen tatsächlich vor? Da reicht es nicht, zu sagen, wir hätten das Thema hier schon mal beraten."], ["comment", "(Falko Droßmann [SPD]: Heute!)"], ["text", "Es geht hier nicht um denselben Gesetzentwurf, auch wenn der Inhalt ähnlich oder gleich ist. Wir reden hier über die Bundesratsinitiative und nicht über den Gesetzentwurf der Grünen."], ["comment", "(Beifall bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"], ["text", "Die Argumente, die ich bisher gehört habe, sprechen nicht gegen die Aufsetzung. Sie verweigern sich dem Erkenntnisgewinn, den ich Ihnen durchaus zutraue: nach einem Jahr gedanklich vielleicht ein bisschen weiter zu sein. Und mal ehrlich: Was hat die Koalition gegen eine Grundgesetzänderung, die auch von Ländern mitgetragen wird, in denen ihre Parteien zum Teil regieren oder mitregieren? Es ist aus parlamentarischer Sicht absolut unverständlich, warum der Antrag von Bündnis 90/Die Grünen zur Aufsetzung, den wir natürlich mittragen, von vornherein abgelehnt wird."], ["text", "Sie, meine Damen und Herren der Koalition, könnten doch auch erst einmal das parlamentarische Verfahren ermöglichen, debattieren, und zwar inhaltlich, und dann abstimmen. Sie könnten den Gesetzentwurf ja auch ablehnen, wenn Ihnen der Inhalt nicht passt. Aber stellen Sie sich diesem Thema, und reden Sie mit uns darüber! Der Schutz von Minderheiten, der Schutz von Gruppen, die besonderen Anfeindungen ausgesetzt sind, kann Ihnen doch nicht egal sein."], ["comment", "(Falko Droßmann [SPD]: Immer Minderheiten!)"], ["text", "Oder doch?"], ["text", "Sie verhindern diese Debatte. Aber warum? Weil Sie Farbe bekennen und die Vielfalt des Lebens und der Perspektiven anerkennen müssten? Ihre Inkonsequenz – ich würde sagen: Feigheit – wird auf dem Rücken derjenigen ausgetragen, um die es hier geht."], ["comment", "(Falko Droßmann [SPD]: Nö!)"], ["text", "Es geht um diejenigen, die für die Anerkennung ihrer sexuellen Identität als Grundrecht kämpfen, die dafür einstehen und diese Petition immer wieder an uns herantragen."], ["text", "Ändern Sie Ihre Haltung! Stimmen Sie der Aufsetzung zu, damit wir uns inhaltlich austauschen können – und zwar schon am Freitag hier im Plenum."], ["comment", "(Beifall bei der Linken sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"]]}, {"id": "ID219500800", "x": -6.073, "y": 0.623, "cluster": 3, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 3267, "comments": 3, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219501100", "ID219501500", "ID219517000", "ID219514500", "ID219515700"], "next": "ID219500900", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Meine sehr geehrten Kolleginnen und Kollegen! Unsere Sicherheit ist kostbar. Sie ist Voraussetzung für unser Leben in Sicherheit und in Freiheit. Aber diese Sicherheit ist in Gefahr, und zwar so sehr wie schon seit Langem nicht."], ["text", "Die Bedrohung durch Russland hat sich über die letzten Wochen weiter zugespitzt. Die sprengstoffbeladene Drohne über Litauen, die von NATO-Jets abgeschossen wurde, der russische Angriff auf den polnisch-ukrainischen Grenzübergang vor zehn Tagen und nicht zuletzt der Anschlagsversuch in Leipzig Ende August sind Eskalationsstufen, die wir so bisher nicht erlebt haben. Sie zeigen: Die Bedrohung wird konkreter. Sie ist ernst, sie ist akut, und sie wird immer sichtbarer. Das ist genau das, was der russische Präsident will. Moskau testet unsere Reaktion, Putin will den Menschen bei uns Angst machen. Aber er verkalkuliert sich auch hier einmal mehr. Deutschland hat nach den Vorfällen in Leipzig entschlossen, aber besonnen und nicht eskalierend reagiert. Auch bei der Ukraineunterstützung lassen wir nicht nach. Das ist und bleibt Leitlinie unseres Handelns, meine Damen und Herren."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"], ["text", "Die Bedrohungslage macht sehr deutlich: Wir haben keine Zeit zu verlieren, um unsere Verteidigungsfähigkeit schnellstmöglich weiter zu stärken. Genau daran arbeiten wir, und zwar mit Hochdruck und in allen Bereichen. Wir investieren in modernes Gerät, das schnellstmöglich bei der Truppe ankommt. Wir verschlanken unsere Beschaffungswege noch weiter und gestalten sie effizienter. Wir nehmen deutlich mehr Geld für Forschung, Technologie und Entwicklung in die Hand. Die Ausgaben hierfür steigen im Jahr 2027 auf 6,25 Milliarden Euro. Das ist ein enormer Aufwuchs um fast das Dreifache im Vergleich zu den rund 2,3 Milliarden Euro im Jahr 2022."], ["text", "Wir fördern Innovationen stärker. Bereits heute geben wir knapp die Hälfte unserer Investitionen für modernste Zukunftstechnologien aus. Darauf bauen wir auf und bringen unter anderem mit unseren Innovationszentren neue Produkte schneller in die Truppe."], ["text", "Unsere Bundeswehr wächst auf. Die Bewerber- und Einstellungszahlen zeigen, wie attraktiv die Streitkräfte geworden sind. Schon 2025 haben wir rund 25 000 neue Soldatinnen und Soldaten eingestellt, so viele wie nie zuvor seit Aussetzung der Wehrpflicht, meine Damen und Herren."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"], ["text", "Dieser positive Trend setzt sich fort. Bis Ende August dieses Jahres hatten wir bereits rund 17 000 Neueinstellungen zu verzeichnen. Das sind noch einmal 13 Prozent mehr als im Vorjahresmonat. Bei den Bewerbungen beträgt das Plus im Vergleich sogar fast 30 Prozent."], ["text", "Meine Damen und Herren, unsere Arbeit trägt Früchte, und sie wird geschätzt von unseren Partnern in Europa und auf der anderen Seite des Atlantiks. Das wurde mir auch vergangene Woche bei meinem Besuch in den Vereinigten Staaten immer wieder gesagt. Gleichzeitig will ich klar sagen: Wir tun all das nicht, um irgendjemandem zu gefallen. Wir tun dies für die Sicherheit Deutschlands und Europas. Wir tun dies für die Menschen in diesem Land und auf diesem Kontinent, meine Damen und Herren. Für sie leisten die Soldatinnen und Soldaten unserer Bundeswehr jeden Tag ihren Dienst. Dafür will ich ihnen meinen großen Dank aussprechen, auch im Namen dieses Hauses."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU und der Abg. Sara Nanni [BÜNDNIS 90/DIE GRÜNEN])"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Das Wort für den zweiten einleitenden Bericht hat nun der Bundesminister für Gesundheit, Herr Dr. Carsten Linnemann. Bitte."]]}, {"id": "ID219500900", "x": -5.219, "y": -2.87, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 3259, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517000", "ID219503100", "ID219516900", "ID219518700", "ID219501900"], "next": "ID219501000", "paragraphs": [["text", "Vielen Dank. – Frau Präsidentin! Liebe Kolleginnen und Kollegen! Meine Damen! Meine Herren! Es besteht gerade bei Regierungsbefragungen immer die Gefahr, dass man schnell ins Detail geht. Deswegen nutze ich die ersten Minuten – ähnlich wie der Kollege Pistorius –, um grundsätzlich die Lage zu beschreiben und auch das zu beschreiben, was für mich Leitlinie einer guten Gesundheitspolitik für Deutschland ist. Deswegen würde ich gerne das Pferd von hinten aufzäumen und einleitend sagen: Die beste Gesundheitspolitik lässt Krankheiten gar nicht erst entstehen. Wer gesund ist, soll es so lange wie möglich bleiben; denn Gesundheit ist am Ende auch ein Stück Freiheit."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Sie ermöglicht es, arbeiten zu können, reisen zu können und die Enkel aufwachsen zu sehen."], ["text", "Unseren Erfolg messen wir an mehr gesunden Lebensjahren und daran, dass wir kranken und pflegebedürftigen Menschen verlässlich helfen. Wer krank ist, soll schnell Hilfe bekommen. Gute Versorgung und Bezahlbarkeit, das ist ja das zentrale Gespann. Das ist kein Gegensatz. Wer beides will, muss die Systeme effizienter machen. Wir haben mehr als 1 Milliarde Arztkontakte im Jahr. Wir geben allein in der GKV, in der gesetzlichen Krankenversicherung, jeden Tag mehr als 1 Milliarde Euro aus. Das heißt mit anderen Worten: Da gibt es ein extremes Potenzial für die Menschen in Deutschland, für die Patienten, indem wir Strukturen reformieren, Bürokratie wegräumen und Abläufe digitalisieren, damit Zeit und Geld genau dort ankommen, wo behandelt, gepflegt und geheilt wird. Und ich finde, wir haben in Deutschland die besten Voraussetzungen – ich will nicht von einer Vision sprechen, auch nicht von einem Kurzfristziel –, dass unser Gesundheitssystem eines der leistungsfähigsten der Welt wird, von Menschen für Menschen. Mehr als 6 Millionen Menschen arbeiten im Gesundheitswesen. Die gilt es weiter zu stärken."], ["text", "Zu meiner persönlichen Leitlinie, Politik für die Menschen zu machen, passen die ganzen Reformen, die wir jetzt bis Weihnachten angehen: die Reform der Notfallversorgung, die Einführung der Primärversorgung. Das alles machen wir, um die Strukturen effizienter zu machen, damit – erstens – die Menschen mehr davon haben und – zweitens – die Finanzierbarkeit und Bezahlbarkeit des Systems und damit unser Wohlstand gewährleistet sind. Wir müssen alles dafür tun, dass die Beiträge in Schach gehalten werden, weil die Beitragsbelastung eine der größten Herausforderungen für die Wettbewerbsfähigkeit Deutschlands ist. Da gilt es, Arbeitnehmern und Arbeitgebern das Signal zu geben: Wir wollen keine Beitragserhöhungen, sondern perspektivisch unser Ziel erreichen, Beiträge zu senken."], ["text", "Der letzte Punkt. Ich glaube, es gibt kein anderes System oder nur wenig andere Systeme, die für den Zusammenhalt dieses Landes so entscheidend sind wie das Gesundheitssystem. Ich lese in der Zeitung, dass medizinisches Personal angegriffen wird. Das dürfen wir nicht zulassen. Und die Menschen, die zu Hause pflegen – auch das gehört zum Thema Zusammenhalt –, sind nicht nur wichtig, um das System tragfähig zu halten, sondern geben als Alltagshelden auch ein entscheidendes Signal an die Gesellschaft, nämlich ein Signal des Zusammenhalts. – Das ist mein Leitbild, und das sind meine Leitlinien."], ["text", "Danke."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Liebe Kolleginnen und Kollegen, jetzt beginnt der eigentliche Frageteil. Ich bitte Sie, zunächst Fragen zu den beiden Berichten und zu den Geschäftsbereichen der anwesenden Regierungsmitglieder zu stellen. Kurzer Hinweis: Jetzt kommt die erste Fraktionsrunde. Der Fragesteller oder die Fragestellerin hat nach der Hauptfrage die Möglichkeit zu einer Nachfrage, die anderen danach allerdings nicht."], ["chair", "Es startet mit der Opposition: von der AfD der Abgeordnete Jan Nolte. Bitte."]]}, {"id": "ID219501000", "x": -6.814, "y": 0.569, "cluster": 3, "speaker": "Jan Ralf Nolte", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1131, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219501100", "ID219500800", "ID219501200", "ID219515200", "ID219515300"], "next": "ID219501100", "paragraphs": [["text", "Vielen Dank, auch für den Bericht, Herr Minister. – Sie stellen es gerne so dar, als sei die Brigade „Litauen“ die Voraussetzung dafür, Litauen verteidigen zu können. Dabei gab es ursprünglich ganz andere Pläne: Vorgeschobene Kräfte hätte es geben sollen, ein Rotationsmodell, und der Kern der Brigade wäre in Deutschland verblieben. Wir hätten vielleicht 1 500 Soldaten in Litauen gehabt. Ähnlich läuft das in Lettland und Estland. Sie selber haben dann entschieden: „Nein, wir machen das mit der ganzen Brigade“, haben auch die Bundeswehr damit überrascht."], ["text", "Jetzt bekommen Sie die Brigade aber nicht voll. Sie werden Soldaten verpflichten müssen. Das wird das Leben von Einzelnen verändern; daran gehen vielleicht Familien kaputt. So etwas ist sehr belastend, kann ich Ihnen sagen. Als ehemaliger Soldat kenne ich viele, die damit zu kämpfen haben. Jahrelang werden die jetzt dahin müssen, weil Sie eigenmächtig diese Entscheidung getroffen haben."], ["text", "Wäre es nicht besser gewesen, an den militärisch fundierten Plänen, die die Bundeswehr dafür bereits hatte und die in Estland und Lettland mit Erfolg verfolgt werden, festzuhalten?"]]}, {"id": "ID219501100", "x": -6.471, "y": 0.668, "cluster": -1, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1290, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219501000", "ID219500800", "ID219501500", "ID219514500", "ID219515900"], "next": "ID219501200", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrter Herr Abgeordneter, nein, das wäre nicht besser gewesen, weil die Lage sich weiter verändert hat. Wir haben 2023, abgestimmt zwischen dem BMVg und dem Generalinspekteur, entschieden, nicht weiter eine Rotation zu favorisieren, sondern eine feststehende, dauerhaft stationierte, kampfbereite Brigade. Das haben wir umgesetzt, das ist auf dem Weg, und wir haben keine Probleme, diese Brigade zu füllen. Dass es in bestimmten Bereichen Ressourcenknappheit gibt, auch was gut ausgebildetes Personal angeht, überrascht uns nicht. Wir stehen – Stand heute – bei etwas über 80 Prozent Freiwilligenbesatz dieser Brigade. Die Tendenz ist weiter steigend. Am Ende reden wir über einen mittleren dreistelligen Betrag von Soldatinnen und Soldaten, die versetzt werden müssen."], ["comment", "(Stephan Brandner [AfD]: Über einen „Betrag“ von Soldaten?)"], ["text", "Aber als ehemaliger Soldat wissen Sie sehr gut: Auftrag und Einsatzbereitschaft haben erste Priorität. In der Truppe gibt es da übrigens auch gar keine Unruhe. Wir werden das alles einvernehmlich miteinander regeln, so wie in der Vergangenheit auch."], ["text", "Die Entscheidung, eine permanente Brigade in Litauen zu stationieren, ist nach wie vor richtig. Sie ist dort, um das noch mal deutlich zu machen, nicht zum Schutz Litauens stationiert, –"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke schön."], ["text", "– sondern zum Schutz der NATO-Ostflanke. – Vielen Dank."], ["comment", "(Beifall bei der SPD und der CDU/CSU)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Eine Nachfrage. Bitte."]]}, {"id": "ID219501200", "x": -6.435, "y": 0.631, "cluster": -1, "speaker": "Jan Ralf Nolte", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 672, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500800", "ID219501300", "ID219501000", "ID219500700", "ID219501100"], "next": "ID219501300", "paragraphs": [["text", "Genau. Vielen Dank. – Sie sagen, die Einsatzbereitschaft habe Priorität. Das sehe ich natürlich auch so. Sie sagen auch, die Lage habe sich verändert. Jetzt würde ich sagen, dass die Briten und die Kanadier durchaus genauso wie die Bundeswehr die militärische Lage beurteilen, aber nicht zu demselben Schluss gekommen sind wie Sie, dass wir dort eine ganze Brigade brauchen. Es liegt nahe, dass diese Brigade eher ein politisches Symbol, vielleicht ein politisches Denkmal für Sie persönlich sein soll."], ["text", "Vielleicht können Sie ausführen, welche Erkenntnisse Sie dazu bewogen haben, die die Bundeswehr nicht hatte, die die Kanadier nicht hatten, die die Briten nicht hatten."], ["comment", "(Stephan Brandner [AfD]: Brigade „Pistorius“!)"]]}, {"id": "ID219501300", "x": -6.488, "y": 0.735, "cluster": 3, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 606, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500800", "ID219501200", "ID219501500", "ID219513900", "ID219515300"], "next": "ID219501400", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Herr Abgeordneter, meine Erkenntnisse über die Sicherheitslage sind die gleichen wie die der Franzosen, der Kanadier, der Briten und aller anderen auch. Wir sind in der NATO aber völlig einer Meinung, dass der Schutz der Ostflanke ein klares Signal der Abschreckung von höchster Priorität ist. Deswegen werden Sie in der NATO niemanden finden, der unsere Entscheidung infrage stellt oder kritisiert."], ["comment", "(Sara Nanni [BÜNDNIS 90/DIE GRÜNEN]: Genau!)"], ["text", "Ganz im Gegenteil: Unsere Alliierten sind voller Hochachtung für diesen mutigen Schritt, den es in dieser Art in der Geschichte der deutschen Bundeswehr noch nie gegeben hat."], ["comment", "(Beifall bei der SPD und der CDU/CSU sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Für die Fraktion der CDU/CSU hat Herr Abgeordneter Thomas Erndl das Wort."]]}, {"id": "ID219501400", "x": -5.855, "y": 0.233, "cluster": 3, "speaker": "Thomas Erndl", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 896, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219501500", "ID219500800", "ID219500900", "ID219517200", "ID219517000"], "next": "ID219501500", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Sehr geehrter Herr Bundesminister, das war in der Tat ein sehr mutiger, aber notwendiger und wichtiger Schritt, der von einer breiten Mehrheit in diesem Parlament getragen wurde."], ["text", "Ganz wichtige Schritte hat dieses Parlament in der letzten Periode zweimal gemacht: mit dem Sondervermögen"], ["comment", "(Stephan Brandner [AfD]: Mit Schulden!)"], ["text", "und mit der Bereichsausnahme. Damit haben wir auch im nächsten Jahr einen Rekordhaushalt für Verteidigung. Damit entstehen viele Möglichkeiten, geht aber dann auch viel Verantwortung einher."], ["text", "Meine Frage vor dem Hintergrund der Wortmeldungen aus der Wissenschaft, die durchaus unterschiedlich waren – es gab auch kritische Wortmeldungen, dass wir nicht das Richtige rüsten –: Wie stellen Sie sicher, dass wir mit dem Geld effizient umgehen und es so einsetzen, dass es nachvollziehbar ist, die Gesellschaft es mitträgt und wir insgesamt die Bundeswehr für die Zukunft rüsten?"]]}, {"id": "ID219501500", "x": -5.695, "y": 0.537, "cluster": 3, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 976, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219501400", "ID219500800", "ID219513900", "ID219510100", "ID219500900"], "next": "ID219501700", "paragraphs": [["text", "Frau Präsidentin! Lieber Herr Kollege, wir stellen das sicher, indem wir das gemeinsam machen. Und Sie haben völlig recht: Die Beträge, die wir investieren müssen, sind enorm, übrigens nach 35 Jahren, in denen praktisch nichts mehr in Landes- und Bündnisverteidigung investiert worden ist. Es geht jetzt darum, die Lücken schnell zu schließen, und zwar mit State-of-the-Art-Material, und gleichzeitig die Beschaffung modernster Systeme auf den Weg zu bringen. Ich habe es vorhin gesagt: 50 Prozent fließen inzwischen in modernste Technologie."], ["text", "Wie stellen wir das sicher? Indem wir erstens die richtigen Prioritäten setzen, uns an den NATO-Fähigkeitszielen und den eigenen Ambitionen orientieren, und – zweitens – mit dem Parlament, dem Haushalts- und dem Verteidigungsausschuss engstens zusammenarbeiten. Wenn es dann Kritik einzelner Wissenschaftler aus ressortfremden Wissenschaftszweigen gibt, dann nehme ich sie zur Kenntnis. Sie ist aber für mich nicht handlungsleitend."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Eine Nachfrage."]]}, {"id": "ID219501700", "x": -6.622, "y": -0.918, "cluster": 2, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 664, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517000", "ID219518700", "ID219516900", "ID219517300", "ID219500800"], "next": "ID219501800", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrter Herr Kollege, Sie wissen, dass es mehrere Ursachen für diese Preissteigerungen gibt. Eine Ursache wohnt dem Wesen des Kapitalismus inne, nämlich: Angebot und Nachfrage bestimmen den Preis. Wir haben eine steigende Nachfrage weltweit, und das führt zu erhöhten Preisen. Eine andere Ursache liegt in der noch nicht in vollem Tempo laufenden Hochskalierung der Produktionskapazitäten."], ["text", "Unsere Instrumente dagegen sind im Rahmen des neuen Beschaffungswesens bessere Preiskontrollen, Lieferkettenkontrollen, um damit sicherzustellen, dass durch Zeitverzögerungen und anderes keine unnötigen oder vermeidbaren Preissteigerungen entstehen."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Wir fahren fort. Nun hat für Bündnis 90/Die Grünen der Abgeordnete Herr Dr. Janosch Dahmen das Wort. Bitte."]]}, {"id": "ID219501800", "x": -4.217, "y": -2.84, "cluster": 5, "speaker": "Dr. Janosch Dahmen", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 860, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503000", "ID219502000", "ID219506400", "ID219500900", "ID219503100"], "next": "ID219501900", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Ich würde gerne eine Frage an den Bundesgesundheitsminister richten. Herr Bundesgesundheitsminister, der Bundeskanzler hat am Montag in einer bemerkenswerten Pressekonferenz gesagt – ich zitiere mit der Erlaubnis der Präsidentin –:"], ["text", "„Wenn in der Bevölkerung sich der Eindruck verfestigt, dass diejenigen, die privat versichert sind, sofort jede Leistung bekommen, und diejenigen, die gesetzlich krankenversichert sind, Wochen und Monate darauf warten müssen, dann ist das genau ein solches Gerechtigkeitsproblem.“"], ["text", "Und weiter der Bundeskanzler:"], ["text", "„Es gibt gute Gründe für beide Systeme, aber wenn die Bevölkerung das als ein so massives Problem ansieht – und ich teile die Einschätzung –, dann müssen wir daran etwas ändern […].“"], ["text", "Teilen Sie die Einschätzung des Bundeskanzlers? Und was konkret gedenken Sie wann dagegen zu tun?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219501900", "x": -4.926, "y": -3.057, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1031, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503100", "ID219504300", "ID219500900", "ID219503000", "ID219502000"], "next": "ID219502000", "paragraphs": [["text", "Vielen Dank, Herr Kollege, für die Frage. – Erstens glaube ich, dass die Strukturprobleme, die wir im Moment in der gesetzlichen Krankenkasse haben, mit dem Vorschlag nicht gelöst werden. Wir haben allein im ersten Halbjahr eine Ausgabensteigerung von mehr als 7 Prozent gehabt. Zweitens hat der Bundeskanzler ja gestern noch mal deutlich gemacht, dass es ihm nicht um die Abschaffung der privaten Krankenkassen geht. Im Gegenteil: Das duale System sorgt für Innovationsoffenheit und für Qualitätssicherung. Es geht darum, dass wir in der Patientensteuerung einfach besser werden. Das Beispiel der Wartezeit ist bekannt; sie liegt für einen gesetzlich Versicherten im Moment bei 36 bis 41 Tagen, je nachdem, welchen Studienansatz man verfolgt. Da müssen wir besser werden. Wir gehen das Thema beispielsweise durch die Notfallreform oder durch die Primärversorgung an. Darüber hinaus ist der Vorschlag, –"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke schön."], ["text", "– die PKV abzuschaffen, –"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke. Die Redezeit ist abgelaufen."], ["text", "– verfassungsrechtlich nicht nur schwierig, sondern meines Erachtens auch abzulehnen."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke schön. Kurzer Hinweis, weil das Ihre erste Regierungsbefragung in der Funktion als Minister ist: Wir haben oben die Farbleiste: Wenn sie gelb ist, wird sie danach rot, und dann komme ich."], ["comment", "(Heiterkeit bei Abgeordneten der CDU/CSU)"], ["text", "Vielen Dank."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Eine Nachfrage. Bitte 30 Sekunden Frage, 30 Sekunden Antwort."]]}, {"id": "ID219502000", "x": -4.378, "y": -2.898, "cluster": -1, "speaker": "Dr. Janosch Dahmen", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 719, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219501800", "ID219501900", "ID219500900", "ID219503000", "ID219506400"], "next": "ID219502300", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Der Bundeskanzler hat nicht nur von Warteschlangen, Wartezimmern oder einzelnen Terminen gesprochen, sondern auch von der Ungerechtigkeit zwischen privater und gesetzlicher Krankenversicherung im gesamten Leistungsspektrum."], ["text", "Sie sind ja Ihren politischen Einlassungen zufolge ein Mann des Marktes. Finden Sie es nicht richtig, dass in einem ersten Schritt ohne Abschaffung der privaten Krankenversicherung ein ordnungspolitischer Rahmen geschaffen wird, ein Risikostrukturausgleich zwischen privater und gesetzlicher Krankenversicherung, damit nicht um die reichsten und die am wenigsten kranken Versicherten konkurriert wird, –"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke schön. Die Zeit. Es leuchtet rot."], ["text", "– sondern um Effizienz, Wirtschaftlichkeit und Qualität?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219502300", "x": -6.144, "y": 0.14, "cluster": 3, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 787, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500800", "ID219517000", "ID219507900", "ID219510100", "ID219501500"], "next": "ID219502600", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Sehr geehrte Frau Kollegin, wir tun zweierlei: Wir reaktivieren alte, deaktivierte Kasernen in den nächsten Jahren intensiv in verschiedenen Regionen Deutschlands. Gleichzeitig gehen wir in die Bestandskasernen und sanieren mit entsprechender Prioritätensetzung. Vor allem aber errichten wir Unterkunftsgebäude, zunächst in einer mobilen Art und Weise. In ihnen werden in den nächsten Jahren über 8 000 Betten stehen. Das ist eine vorübergehende Maßnahme bis zur Fertigstellung einer dauerhaften Lösung. Die wiederum realisieren wir mit G-CAP Inland. Das wird ab 2027 beginnen und wird die Kapazität von 54 000 Betten für Wehrdienstleistende und von 9 000 für Ausbilder schaffen. All das hat begonnen und wird nächstes Jahr durch G-CAP Inland intensiviert."], ["comment", "(Julia-Christina Stange [Die Linke]: Die Kommunen bleiben auf den Kosten sitzen! – Gegenruf des Abg. Falko Droßmann [SPD]: Quatsch!)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Entschuldigung. Die Linken sind gleich dran mit ihren Fragen. Jetzt hat aber die Kollegin die Möglichkeit zur Nachfrage. Bitte."]]}, {"id": "ID219502600", "x": -3.728, "y": -2.627, "cluster": 5, "speaker": "Stella Merendino", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 894, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503000", "ID219503600", "ID219506400", "ID219510400", "ID219509800"], "next": "ID219502700", "paragraphs": [["text", "Meine Frage richtet sich an Bundesminister Linnemann. Vor Kurzem gab Ihr Ministerium bekannt, dass die Finanzlage der gesetzlichen Krankenkassen weiterhin dramatisch ist, und dies, obwohl Ihre Vorgängerin mit der Koalition ein Gesetz beschlossen hat, das genau das Gegenteil versprochen hat. Statt dieser Schieflage nun zu begegnen, verantworten Sie in Ihrer nahezu ersten Amtshandlung die Kürzungen des Bundeszuschusses für den Gesundheitsfonds."], ["text", "Angesichts dieses brutalen Spargesetzes, das unsere Gesundheitsversorgung massiv unter Druck setzt, angesichts der wahrscheinlichen Lohnkürzungen der Beschäftigten im Gesundheitsbereich und der steigenden Kosten für Medikamente bei den Patientinnen und Patienten ist meine Frage ganz konkret: Können Sie den Menschen, den 75 Millionen Versicherten, zusichern, dass ihre Beiträge für die Krankenversicherung im kommenden Jahr nicht steigen werden?"]]}, {"id": "ID219502700", "x": -5.219, "y": -3.122, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 976, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500900", "ID219517000", "ID219504300", "ID219503100", "ID219504000"], "next": "ID219502900", "paragraphs": [["text", "Es ist mein Ziel. Am 13., 14. Oktober trifft sich der Schätzerkreis. Der wird sich anschauen, wie der Gesundheitsfonds ausgestaltet ist, welche Ansprüche gedeckt sind und welche nicht, und er wird dann entscheiden. Ich werde alles tun, was ich als Minister tun kann, das Parlament zu unterstützen. Wir müssen in den Verhandlungen zum „Beitragssatzstabilisierungsgesetz II“, so nenne ich es jetzt mal, noch Restanten angehen. Ich denke an die Protokollerklärung der Bundesregierung, wo es um die Unterstützung der Krankenhäuser und der Unikliniken in Deutschland geht; da reden wir über 495 Millionen Euro respektive 550 Millionen Euro. Wir reden über das Thema Psychotherapie, wo wir jetzt noch Verbesserungen angehen wollen, aber auch über das Thema „Fixkostendegression für die Ärzte“. Das alles muss seriös gegenfinanziert werden, damit wir das Ziel „Beitragssatzstabilität“ halten. Und da spreche ich für die gesamte Bundesregierung, nicht n
