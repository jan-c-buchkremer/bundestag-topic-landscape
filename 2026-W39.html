ur als Minister für Gesundheit."], ["comment", "(Beifall bei der CDU/CSU sowie der Abg. Claudia Moll [SPD])"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Bitte Ihre Nachfrage."]]}, {"id": "ID219502900", "x": -5.904, "y": -1.56, "cluster": 2, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 628, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517000", "ID219516900", "ID219517200", "ID219500900", "ID219518700"], "next": "ID219503000", "paragraphs": [["text", "Also erst einmal möchte ich persönlich sagen, dass das Auswüchse einer Zinspolitik sind, die faktisch Wirtschaftspolitik betreibt. Ich mische mich nicht ein in die Zinspolitik der Europäischen Zentralbank; aber die Zinsen sind künstlich sehr niedrig gewesen, gerade 2017 bis 2021. Sie waren meines Erachtens kein Marktzins. Und das sorgt dafür, dass gerade Krankenkassen oder andere Institutionen überlegen, wie sie jetzt Renditen machen können."], ["text", "Ich nehme nicht nur wahr, was da passiert, sondern ich hake da sehr stark nach."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke schön."], ["text", "Ich glaube, heute Morgen im Ausschuss war das auch Thema. Wir werden schauen, was wir da tun können."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Liebe Kolleginnen und Kollegen, nach Abschluss dieser Runde kommen wir nun zu Fragen zu den vorangegangenen Kabinettssitzungen, zu weiteren Geschäftsbereichen sowie zu allgemeinen Fragen."], ["chair", "Das Wort hat nun für die AfD-Fraktion Herr Abgeordneter Martin Sichert. Bitte."]]}, {"id": "ID219503000", "x": -3.958, "y": -2.729, "cluster": 5, "speaker": "Martin Sichert", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1124, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219501800", "ID219503100", "ID219501900", "ID219502600", "ID219506400"], "next": "ID219503100", "paragraphs": [["text", "Meine Frage geht an Bundesgesundheitsminister Linnemann. Wir haben es ja vorhin schon gehört, ich will aber noch mal darauf zurückkommen. Der Kanzler hat am Montag dieser Woche gesagt – Zitat –:"], ["text", "„Wenn in der Bevölkerung sich der Eindruck verfestigt, dass diejenigen, die privat versichert sind, sofort jede Leistung bekommen und diejenigen, die gesetzlich krankenversichert sind, Wochen und Monate darauf warten müssen, dann ist das genau ein solches Gerechtigkeitsproblem. Wir sehen das Problem. Wir haben in der Koalition verabredet, dass wir die Entscheidungen in der gesetzlichen Krankenversicherung wirkungsgleich auch auf die private Krankenversicherung übertragen. Und das haben wir bis jetzt nicht gemacht, so, und das werden wir nachholen müssen.“"], ["text", "Zitat Ende."], ["text", "Bei den gesetzlich Versicherten haben wir unerträglich lange Wartezeiten. Und statt dafür zu sorgen, dass diese kürzer werden, will der Kanzler jetzt die Wartezeiten für die Privatversicherten verlängern. Wäre es nicht viel sinnvoller, wenn man die Wartezeiten für die gesetzlich Versicherten reduziert, indem man die unsägliche Budgetierung abschafft?"]]}, {"id": "ID219503100", "x": -5.576, "y": -3.563, "cluster": 7, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1107, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500900", "ID219512700", "ID219501900", "ID219503300", "ID219512100"], "next": "ID219503200", "paragraphs": [["text", "Der Bundeskanzler hat nicht gesagt, dass er die Wartezeiten für die Privatversicherten verlängern will. Aber die Wartezeiten bei den gesetzlich Versicherten sind einfach zu lang. Ich gebe Ihnen mal das Beispiel Notfallaufnahme: 20, 30 Prozent der sogenannten Notfälle sind keine Notfälle, und ich mache keinem Patienten einen Vorwurf. Aber das ist einfach ein System, das nicht gesteuert ist. Wir haben zu viele Arztkontakte im Jahr, mehr als 1 Milliarde, pro Kopf gerechnet so viele wie in keinem anderen Land auf diesem Globus. Und genau deshalb gehen wir jetzt das Thema Notfallreform an. Und genau deshalb gehen wir jetzt das Thema Primärversorgung an. Und genau deshalb gehen wir auch das Thema „digitale Ersteinschätzung über die 116 117“ an. Wir wollen da besser werden. Der Bundeskanzler hat damit einen Punkt angesprochen, den wir gerade im parlamentarischen Verfahren bearbeiten. Ich gehe davon aus, dass der Entwurf der Bundesregierung zum Thema Primärversorgung jetzt im November kommt. Das Thema Notfallreform müssen wir in diesem Jahr abschließen, damit sie nächstes Jahr in Kraft treten kann."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke schön. – Haben Sie eine Nachfrage?"]]}, {"id": "ID219503200", "x": -5.759, "y": -3.905, "cluster": 7, "speaker": "Martin Sichert", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 563, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503300", "ID219512100", "ID219503100", "ID219500900", "ID219512700"], "next": "ID219503300", "paragraphs": [["text", "Sie haben gerade die Notfallversorgung angesprochen. Das ist ein gutes Beispiel dafür, wie die Budgetierung künftig dafür sorgen wird, dass die Menschen länger in die Notaufnahme brauchen, weil der Rettungsdienst jetzt nämlich budgetiert ist und die Krankenhäuser auf dem Land sterben. Sie haben selber vorhin gesagt: Wer krank ist, soll schnell Hilfe bekommen. – Wenn Sie den Menschen in den Mittelpunkt stellen wollen und wenn Sie wirklich wollen, dass die Menschen schnell Hilfe bekommen, dann muss die Budgetierung abgeschafft werden. Wann werden Sie das tun?"]]}, {"id": "ID219503300", "x": -5.565, "y": -3.915, "cluster": 7, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 703, "comments": 3, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219512700", "ID219503100", "ID219512100", "ID219503200", "ID219511900"], "next": "ID219503600", "paragraphs": [["text", "Es geht doch im Kern der Notfallreform nicht in erster Linie um die Budgetierung, sondern darum, dass wir integrierte Notfallzentren bauen wollen,"], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["text", "die in ein Krankenhaus eingegliedert sind."], ["text", "Hat der Patient wirklich einen Notfall, sodass er in die Notfallaufnahme gehen muss, oder muss er sich an den Bereitschaftsdienst der Kassenärztlichen Vereinigung wenden? Das sind doch die Themen, die wir jetzt angehen müssen. Wenn die Notfallaufnahme in bis zu 30 Prozent der Fälle von Patienten beispielsweise bei einem harmlosen Infekt aufgesucht wird – was man auch anderweitig lösen kann –,"], ["comment", "(Stephan Brandner [AfD]: Ja wie denn?)"], ["text", "dann „verstopft“ – in Anführungsstrichen – das die Notfallaufnahmen. Und deswegen wollen wir dieses Thema angehen."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Liebe Kolleginnen und Kollegen, ich habe bereits jetzt bei der ersten Frage in dieser Runde schon vier Nachfragen. Ich bitte darum, es mir nachzusehen – wir wollen ja auch durchkommen und bei den anderen fair sein –, dass ich es jetzt bei den vier Nachfragen belasse."], ["chair", "Für Bündnis 90/Die Grünen hat Herr Dr. Janosch Dahmen das Wort. Bitte."]]}, {"id": "ID219503600", "x": -3.441, "y": -2.585, "cluster": 5, "speaker": "Dr. Paul Schmidt", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 603, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219502600", "ID219509600", "ID219503000", "ID219509800", "ID219503100"], "next": "ID219503700", "paragraphs": [["text", "Herr Minister Linnemann, Sie haben vorhin in Ihrem Eingangsstatement gesagt: „Wer krank ist, soll schnell Hilfe bekommen.“ Aber mit Ihrem neuen Stabilisierungsgesetz werden ja viele Kliniken geschlossen, der Weg zur nächsten Klinik wird im Notfall länger. Mit wie vielen Klinikschließungen rechnen Sie im nächsten Jahr? Und welche durchschnittliche zusätzliche Fahrzeit erwarten Sie im Notfall? Und wie viele zusätzliche Todesfälle erwarten Sie im nächsten Jahr in Deutschland dadurch, dass die Fahrzeit zur Notaufnahme nach einem Unfall deutlich länger wird und damit auch die Überlebenschancen sinken?"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke sehr."]]}, {"id": "ID219503700", "x": -5.426, "y": -3.741, "cluster": 7, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 783, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219512700", "ID219500900", "ID219503100", "ID219511100", "ID219503300"], "next": "ID219503800", "paragraphs": [["text", "Erst mal möchte ich, dass es in Deutschland auch in den nächsten Jahren und Jahrzehnten eine Versorgungssicherheit gibt, auch und vor allem im ländlichen Raum. In den größeren Städten haben Sie meistens nicht die Probleme, ein Krankenhaus aufzusuchen. Nach meinen Informationen gibt es allein in Berlin mehr als 50 Krankenhäuser. Aber dieses Beispiel macht deutlich, dass die Krankenhausreform, die aus drei Gesetzen besteht und die wir jetzt angehen, genau richtig ist, weil sie auf Spezialisierung und Fokussierung ausgerichtet ist. Wir sagen: Natürlich gibt es eine Grundversorgung und eine Akutversorgung, aber es macht beispielsweise keinen Sinn, dass mehrere Krankenhäuser –"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke."], ["text", "– in einem Umkreis von drei Kilometern alle Knieoperationen anbieten. Das müssen Spezialisten machen."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU und der SPD)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Für die CDU/CSU-Fraktion hat Frau Abgeordnete Simone Borchardt das Wort. Bitte."]]}, {"id": "ID219503800", "x": -4.227, "y": -3.544, "cluster": 5, "speaker": "Simone Borchardt", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 699, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500900", "ID219504000", "ID219512200", "ID219504200", "ID219501800"], "next": "ID219503900", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Herr Bundesgesundheitsminister, vielleicht können Sie noch mal erklären – damit es auch der Letzte versteht –, dass unser System momentan sehr teuer und nicht gut ist und dass wir das Beitragssatzstabilisierungsgesetz brauchen, um verhärtete und verkrustete Strukturen aufzulösen, und nicht, um nur die Beiträge niedrig zu halten,"], ["comment", "(Stephan Brandner [AfD]: Um Beiträge niedrig zu halten? Die sind exorbitant hoch!)"], ["text", "sondern auch die Versorgungsqualität zu verbessern: nämlich mit einer Notfallreform, mit einem Primärversorgungssystem und mit einem besseren Digitalisierungssystem. Denn wir haben so klassische, veraltete Strukturen, und ich bin sehr dankbar – nicht nur Frau Warken, sondern auch Ihnen –, dass Sie das endlich mutig angehen. – Danke."]]}, {"id": "ID219503900", "x": -5.114, "y": -3.693, "cluster": 7, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 635, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219511100", "ID219511900", "ID219500900", "ID219503100", "ID219501900"], "next": "ID219504000", "paragraphs": [["text", "Ja, vielen Dank. – Ich kann diese Frage ja auch einmal nutzen, um Werbung zu machen für die 116 117. Das ist eine Ersteinschätzung, die da getroffen wird. Im letzten Jahr hatten wir darüber 2 Millionen Vermittlungen an Fachärzte innerhalb von zehn Tagen. Das heißt, wir müssen auch die neuen Formen der Digitalisierung und der künstlichen Intelligenz für die Patienten nutzen. Das machen wir im Digitalgesetz, das machen wir bei der digitalen Ersteinschätzung und auch bei vielem mehr. Und, Frau Kollegin, Sie haben völlig recht: Es wird höchste Zeit, das zu tun, und ich bin dankbar, dass wir das hier im Parlament jetzt auch angehen."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Die abschließende Nachfrage zu dieser Frage stellt von Bündnis 90/Die Grünen Frau Dr. Kirsten Kappert-Gonther. Bitte."]]}, {"id": "ID219504000", "x": -3.927, "y": -3.624, "cluster": 5, "speaker": "Dr. Kirsten Kappert-Gonther", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 717, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219510800", "ID219503800", "ID219512200", "ID219508800", "ID219500900"], "next": "ID219504100", "paragraphs": [["text", "Danke, Frau Präsidentin, dass Sie die Frage zulassen. – Herr Minister, mit dem Beitragssatzstabilisierungsgesetz haben Sie auch die Axt an die zukünftige psychische Versorgung gelegt. Wir haben enorme Wartezeiten im Bereich der Psychotherapie; die verlängern sich jetzt aufgrund der Einschnitte im Beitragssatzstabilisierungsgesetz. Aber auch in den psychiatrischen Krankenhäusern haben wir enorme Problemlagen. Der Hilfebedarf ist höher als das Hilfsangebot, unter anderem auch infolge des Beitragssatzstabilisierungsgesetzes. Und ich frage Sie: Wann werden Sie die angekündigten Verbesserungen –"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Danke sehr."], ["text", "– aus dem Entschließungsantrag umsetzen, und wann werden Sie die Modellprojekte in den Kliniken in die Fläche bringen?"], ["comment", "(Beifall bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"]]}, {"id": "ID219504100", "x": -5.127, "y": -1.495, "cluster": 1, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 573, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219510500", "ID219506300", "ID219500700", "ID219500100", "ID219517000"], "next": "ID219504200", "paragraphs": [["text", "Also, zunächst einmal, Frau Kollegin: Ich teile Ihren Befund und Ihre Beschreibung der aktuellen Situation. Sie ist besorgniserregend; das muss man einfach sagen. Die Zahl der Fälle nimmt zu, wir nehmen das auch im Lichte des Coronaausbruchs und der Jahre danach wahr. Wir müssen viel mehr über das Thema Prävention reden, wie es beispielsweise auch die Bildungsministerin macht. Nur um mal ein kleines Beispiel zu nennen: Social Media. Und zum Abschluss die Antwort auf Ihre Frage: Vor dem 14. Oktober 2026 muss das im Ausschuss sein, damit wir die Beiträge stabil halten."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Wir kommen zur nächsten Hauptfrage und damit zur CDU/CSU. Herr Abgeordneter Albert Stegemann, bitte."]]}, {"id": "ID219504200", "x": -3.847, "y": -2.97, "cluster": 5, "speaker": "Albert Stegemann", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 509, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219506400", "ID219503800", "ID219504800", "ID219504000", "ID219504300"], "next": "ID219504300", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Auch meine Frage richtet sich an den Bundesgesundheitsminister. Lieber Carsten Linnemann, wir haben jetzt sehr viel über das Beitragssatzstabilisierungsgesetz gesprochen. Wir sind froh, dass wir die Dinge gut auf den Weg gebracht haben. Allerdings schlagen die Kostenentwicklungen im Bereich der Pflegeversicherung durch die Demografie genauso brutal zu. Was haben Sie mit dem Pflegeneuordnungsgesetz vor, und was sind die Charaktereigenschaften des Pflegeneuordnungsgesetzes?"]]}, {"id": "ID219504300", "x": -5.052, "y": -2.641, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 837, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219506100", "ID219505200", "ID219501900", "ID219500900", "ID219506700"], "next": "ID219504500", "paragraphs": [["text", "Vielen Dank, Herr Kollege, für die Frage. – Wir geben für die Pflegeversicherung rund 74 Milliarden Euro im Jahr aus, und wir müssen für das nächste Jahr 8 Milliarden Euro einsparen. Das zeigt schon, welche Herausforderung das ist. Wir wollen das Pflegeneuordnungsgesetz nächsten Mittwoch ins Kabinett bringen. Das ist das Ziel, um auch nächstes Jahr ein sicheres System zu haben, mit dem die Auszahlungen funktionieren. An dieser Stelle will ich aber auch ehrlich sagen, dass das nicht ausreicht, um das System auch für die 30er-Jahre zukunftsfest zu machen. Und deshalb möchte ich eine Kommission einberufen, die sehr kurzfristig – ähnlich wie die Kommission zum Thema Gesundheit, ähnlich wie die Kommission zum Thema Rente – Vorschläge macht, damit wir auch in den 30er-Jahren ein sicheres Pflegesystem, ein Teilkaskosystem vorzeigen."], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Es gibt eine Nachfrage. – Bitte."]]}, {"id": "ID219504500", "x": -5.404, "y": -2.795, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 530, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219505900", "ID219505000", "ID219505800", "ID219517000", "ID219505100"], "next": "ID219504700", "paragraphs": [["text", "Vom Grundsatz her habe ich den Entwurf übernommen, der bereits vorlag, als ich dieses Amt übernommen habe. An einer Stelle habe ich aber gesagt: Da braucht es dringendst eine Änderung. – Das ist das Thema „pflegende Angehörige“. Wir müssen diejenigen, die zu Hause pflegen, unterstützen, indem wir sagen: Ihr werdet genauso behandelt, als wenn ihr arbeiten würdet. – Jemand, der eine Person mit Pflegegrad 5 unterstützt, muss auch einen Rentenpunkt bekommen. Es darf keine Abstriche bei der Rente von pflegenden Angehörigen geben."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU und der SPD)"]]}, {"id": "ID219504700", "x": -5.307, "y": -2.468, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 637, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504300", "ID219501900", "ID219500900", "ID219518700", "ID219506700"], "next": "ID219504800", "paragraphs": [["text", "Herr Kollege, vielen Dank für die Frage. – Es war schon immer ein Teilkaskosystem, es war nie eine Vollversicherung. Ein Beispiel sind die Leistungszuschüsse, die für diejenigen gezahlt werden, die ins Pflegeheim gehen, und in dem Zusammenhang die Ausgaben der Kommunen. Durch die immer höhere Anzahl der zu Pflegenden und die immer höheren Ausgaben in Form von Leistungszuschüssen kommt es dazu, dass die Kommunen für die Hilfe zur Pflege immer mehr Geld ausgeben, ohne dass sie darauf Einfluss haben. Und das geht nicht. Wir brauchen ein faires System, das dafür sorgt, dass Kommunen nicht für das bezahlen, was wir hier verabschieden."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU und der SPD)"], ["chair", "Präsidentin Julia Klöckner:"], ["chair", "Eine weitere Nachfrage: für die AfD-Fraktion Frau Abgeordnete Nicole Hess."]]}, {"id": "ID219504800", "x": -3.594, "y": -2.926, "cluster": -1, "speaker": "Nicole Hess", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 668, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504200", "ID219504900", "ID219513000", "ID219506400", "ID219513600"], "next": "ID219504900", "paragraphs": [["text", "Herzlichen Dank, Frau Präsidentin, dass Sie die Frage zulassen. – Herr Bundesminister Linnemann, bezüglich des Pflegeneuordnungsgesetzes wurde vor wenigen Monaten vonseiten des BMG während eines Berichterstattergesprächs die Zielvorgabe geäußert, dass die Bürokratie in der Pflege massiv reduziert werden soll. Auf meine Nachfrage, wie viel Zeit eine Pflegekraft täglich mit Dokumentation und Berichtswesen verbringt, wurde mir gesagt, dass diese Zahlen nicht erhoben werden. Jetzt frage ich Sie: Wie wollen Sie die Bürokratie reduzieren, wenn Sie diese Zahlen nicht haben? Woher kommt das Desinteresse, bzw. wann werden Sie beginnen, diese Zahlen zu erheben? – Danke."]]}, {"id": "ID219504900", "x": -4.913, "y": -3.378, "cluster": -1, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 535, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504800", "ID219511100", "ID219516300", "ID219501900", "ID219503900"], "next": "ID219505000", "paragraphs": [["text", "Also, da gibt es überhaupt kein Desinteresse. Ich war am Montag beim Krankenhausgipfel. Dort hat man eigene, verifizierte Zahlen veröffentlicht und kam auf 2,7 Stunden am Tag, in denen sich eine Pflegekraft mit Bürokratie und Dokumentation beschäftigt. Nina Warken hat bereits ein erstes Gesetz dazu erarbeitet. Wir werden jetzt schauen, ob das ausreicht. Ich selbst habe mal eine ambulante Pflegekraft begleitet und gesehen, dass sie sehr viel Zeit für Dokumentation braucht und wenig Zeit für den Patienten hat. Das muss sich ändern."], ["comment", "(Beifall bei der CDU/CSU)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Jetzt hat das Wort die Abgeordnete Simone Fischer für Bündnis 90/Die Grünen."]]}, {"id": "ID219505000", "x": -4.151, "y": -2.56, "cluster": 5, "speaker": "Simone Fischer", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 580, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219506400", "ID219505800", "ID219504200", "ID219502600", "ID219504800"], "next": "ID219505100", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrter Herr Minister Linnemann, meine Frage geht an Sie. Sie haben über das Einsparziel und die Rentenversicherungsbeiträge pflegender Angehöriger gesprochen. Da wird ein Ungerechtigkeitsgefühl sichtbar; Sie haben es angesprochen. Mich würde interessieren, inwiefern Sie zusichern können, dass pflegebedürftige Menschen und ihre Angehörigen nicht mit noch weiteren Kürzungen und Einschnitten rechnen müssen, bzw. ob Sie dies ausschließen können, und wie Sie das Einsparziel von 10 Prozent erreichen und die Rentenversicherungsbeiträge finanzieren möchten."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219505100", "x": -5.56, "y": -2.894, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 573, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500900", "ID219505900", "ID219511300", "ID219517000", "ID219518700"], "next": "ID219505200", "paragraphs": [["text", "Ich sage als Bundesminister für Gesundheit ganz klar: Ich möchte nicht, dass ein Gesetz durch den Bundestag geht, das Rentenkürzungen bei den pflegenden Angehörigen vorsieht. Das sind die stillen Helden unserer Gesellschaft. Sie stehen nicht jeden Tag in der Zeitung, sondern arbeiten im Verborgenen. Und ich spreche bewusst von Arbeit. Das ist genauso eine Arbeit wie die Arbeit in der Wirtschaft oder der Verwaltung. Vielleicht ist sie sogar noch wichtiger; denn diese Menschen tragen unser System und sorgen dafür, dass der Zusammenhalt in Deutschland gewährleistet ist."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD – Simone Fischer [BÜNDNIS 90/DIE GRÜNEN]: Wie wird das finanziert? Das war leider keine Antwort!)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Als Nächstes hat das Wort für die CDU/CSU-Fraktion die Abgeordnete Emmi Zeulner."]]}, {"id": "ID219505200", "x": -5.022, "y": -2.673, "cluster": 6, "speaker": "Emmi Zeulner", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 530, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504300", "ID219506100", "ID219505800", "ID219511300", "ID219512400"], "next": "ID219505300", "paragraphs": [["text", "Sehr geehrter Herr Minister, vielen herzlichen Dank für die Möglichkeit der Fragestellung. – Ich bin dankbar, dass Sie Verantwortung übernehmen und eben weitere Reformschritte angekündigt haben, um die Pflegeversicherung an sich, aber auch die Strukturen in den 2030er-Jahren zu sichern. Deswegen würde ich Sie gern bitten, kurz zu skizzieren, was diese Kommission leisten soll, was Sie sich da vorstellen. Es ist, wie gesagt, ganz wichtig, dass wir jetzt nicht stoppen; denn wir müssen auch auf die nächsten Generationen schauen."]]}, {"id": "ID219505300", "x": -4.892, "y": -2.783, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 752, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504300", "ID219500400", "ID219506700", "ID219500700", "ID219506400"], "next": "ID219505400", "paragraphs": [["text", "Vielen Dank, Frau Kollegin. Wenn Sie gestatten, will ich noch kurz auf die Frage der Kollegin von den Grünen eingehen."], ["text", "Entschuldigung, dass ich Ihre Frage nicht direkt beantwortet habe. – Über die Gegenfinanzierung beraten wir gerade in der Bundesregierung. Ziel ist, am 30.09., also nächsten Mittwoch, die Gegenfinanzierung vorzulegen und im Kabinett einen Beschluss zum Pflegeneuordnungsgesetz zu fassen."], ["text", "Dieses Gesetz – und das ist die Brücke zu Ihrer Frage, Frau Kollegin Zeulner – wird aber nur sicherstellen, dass die Pflege im nächsten Jahr noch funktioniert. Für die 2030er-Jahre brauchen wir mehr. Wir müssen das Thema Tagespflege noch mal angehen, –"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Minister."], ["text", "– das Thema Kommunen und das Thema, dass die Einzahlungen die Auszahlungen decken müssen."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU und der Abg. Claudia Moll [SPD])"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Danke schön. – Damit kommen wir zur nächsten Hauptfrage. Für die Fraktion Bündnis 90/Die Grünen hat jetzt das Wort der Abgeordnete Robin Wagener."]]}, {"id": "ID219505400", "x": -7.657, "y": 0.87, "cluster": 4, "speaker": "Robin Wagener", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1283, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219505500", "ID219515900", "ID219515100", "ID219515300", "ID219515700"], "next": "ID219505500", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Herr Minister Pistorius, nachdem klar wurde, dass auf absehbare Zeit ein Einsatz in der Straße von Hormus nicht möglich sein wird, haben wir im Sommer erlebt, wie das Minenjagdboot „Fulda“ und der Tender „Mosel“ ins Mittelmeer zurückverlegt wurden, nachdem die Besatzungen teilweise monatelang unter zum Teil erschwerten Bedingungen auch im Hafen von Dschibuti eingesetzt waren. Ich weiß aus Gesprächen mit Soldaten, dass das Warten auf einen Einsatz und die Ungewissheit, ob jemals etwas passieren wird, besonders zermürbend sind. Jetzt kann man sagen: „Ist halt deren Auftrag“, aber ich finde, man muss auch sehen, dass hinter jedem Soldaten Familien stehen und eine Trennung ohne irgendeine Aussicht nicht wirklich förderlich dafür ist. Ich finde, es ist unsere Verantwortung, darauf zu achten."], ["text", "Warum haben Sie diese beiden Boote nicht sofort nach Deutschland zurückgeholt, sondern sie erst mal in diesem Raum belassen? Und warum rotieren Sie jetzt mit dem Tender „Rhein“, um die Einsatzbereitschaft noch länger aufrechtzuerhalten, obwohl doch offensichtlich ist, dass die Voraussetzungen in der Straße von Hormus auf längere Sicht nicht gegeben sein werden, weil sich das iranische Regime dieses Faustpfand nicht aus der Hand nehmen lassen wird?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219505500", "x": -7.43, "y": 0.83, "cluster": -1, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 806, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219505400", "ID219500800", "ID219514100", "ID219500700", "ID219500400"], "next": "ID219505600", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrter Herr Kollege, ich teile zunächst Ihre Einschätzung, was unsere Soldatinnen und Soldaten vor Ort angeht. Es ist für sie in der Tat eine große Herausforderung, auf einen Einsatz zu warten, ohne zu wissen, ob und wann er kommt."], ["text", "Wir haben uns entschieden, den Tender „Rhein“ runterzuschicken, um den Tender „Mosel“ abzulösen, weil die Situation noch unklar ist. Wir haben ihn zurückgezogen, um Risiken zu minimieren und statt Langeweile vernünftige Übungstätigkeiten zu ermöglichen. Wir werden wöchentlich überprüfen, wie lange wir es bei diesem Zustand belassen werden. Das ist eine Entscheidung, die wir innerhalb der Bundesregierung treffen – übrigens immer auch in Abstimmung mit unseren Partnern und immer mit Blick darauf, was sich in der Straße von Hormus ereignen kann."]]}, {"id": "ID219505600", "x": -6.118, "y": -1.099, "cluster": 2, "speaker": "Robin Wagener", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 695, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516900", "ID219517000", "ID219517100", "ID219518400", "ID219518700"], "next": "ID219505700", "paragraphs": [["text", "Vielen Dank, Herr Minister. – Ich bleibe beim Minenräumen. Die Minentaucher leisten lebensgefährliche Arbeit unter wirklich schwierigen Bedingungen: In großer Tiefe, teils im Dunkeln müssen sie ertasten, um welche Minen es sich handelt, und sie dann händisch entschärfen. Dafür erhalten sie eine monatliche Zulage von 550 Euro, die ich, ehrlich gesagt, für diese gefährliche Tätigkeit beschämend niedrig finde. Aus Ihrem Haus weiß ich, dass Sie nicht planen, diese Zulage anzupassen – höchstens eine inflationsbedingte Anhebung –, die Leistung der Minentaucher also nicht besonders honorieren wollen. Ist es tatsächlich Ihre Einschätzung, dass die 550 Euro diese Tätigkeit entsprechend abgelten?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219505700", "x": -6.022, "y": -0.855, "cluster": 2, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 580, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516900", "ID219504100", "ID219517000", "ID219500700", "ID219517300"], "next": "ID219505800", "paragraphs": [["text", "Sehr geehrter Herr Kollege, ich weiß ja um Ihr Engagement für dieses Thema und respektiere und schätze das sehr. Das sollte Sie aber nicht dazu verleiten, mir zu unterstellen, mir sei das wurscht. Wir haben das Problem, dass wir bei allen Zulagen, über die wir hier reden, immer auch über das Zulagensystem des gesamten öffentlichen Dienstes reden. Eine Zulage hier zu erhöhen, bedeutet einen Anspruch dort. Das muss abgewogen werden. Ich könnte mir das vorstellen. Mir erscheint das auch zu niedrig, aber das Konstrukt ist etwas komplizierter, als es Ihre Fragestellung nahelegt."], ["comment", "(Claudia Moll [SPD]: Richtig!)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Ich sehe keine Nachfragen dazu. – Deswegen kommen wir zur nächsten Frage. Das Wort hat die Abgeordnete Claudia Moll für die SPD-Fraktion."]]}, {"id": "ID219505800", "x": -4.795, "y": -2.581, "cluster": -1, "speaker": "Claudia Moll", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 654, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219505200", "ID219504300", "ID219505000", "ID219500900", "ID219506400"], "next": "ID219505900", "paragraphs": [["text", "Meine Frage geht an den Bundesminister für Gesundheit. – Sehr geehrter Herr Minister, ich wünsche Ihnen zunächst einmal eine glückliche Hand in Ihrem neuen Amt. Sie wissen, zahlreiche Zuschriften zur Pflegereform sprechen Bände. Teile der Bevölkerung sind zumindest verunsichert. Als SPD unterstützen wir die von uns ohnehin geforderte Rücknahme der geplanten Einsparungen bei den Rentenversicherungsbeiträgen für pflegende Angehörige. Sie haben uns hier an Ihrer Seite."], ["comment", "(Stephan Brandner [AfD]: Schon verloren, wenn man die SPD an seiner Seite hat!)"], ["text", "Meine Frage: Welche weiteren Akzente wollen Sie setzen, und welche Botschaft haben Sie für die Betroffenen und ihre Angehörigen? Wer muss in der Pflege mehr Verantwortung übernehmen?"]]}, {"id": "ID219505900", "x": -5.691, "y": -3.032, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 945, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500900", "ID219506700", "ID219504300", "ID219517200", "ID219503100"], "next": "ID219506100", "paragraphs": [["text", "Zunächst einmal: Ich bin erst vor wenigen Wochen ins Amt gekommen. Der Vorschlag lag bereits vor. Er war zwar noch nicht im Kabinett, aber er war in großen Teilen geeint. Deswegen habe ich den Entwurf meiner Vorgängerin übernommen. Ich habe mich dann fokussiert auf das Thema „Rentenpunkte für pflegende Angehörige“. Wir sind gerade dabei, eine Gegenfinanzierung dafür zu finden, was natürlich wirklich schwierig ist, wenn man im System 10 Prozent einsparen muss."], ["text", "Darüber hinaus, glaube ich, brauchen wir in Deutschland eine viel stärkere Unterstützung der häuslichen Pflege. Schauen Sie sich andere Länder an! In Spanien zum Beispiel haben pflegende Angehörige ein ganz anderes Image in der Bevölkerung. Es gibt viele Menschen in Deutschland, die viel leisten, aber nicht jeden Tag in der Zeitung stehen. Und es ist unsere Aufgabe als Politiker in diesem Hohen Hause, diese Menschen in die Zeitung zu bringen. Deshalb gehe ich dieses Thema an."], ["comment", "(Beifall bei der CDU/CSU)"]]}, {"id": "ID219506100", "x": -5.58, "y": -2.617, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 614, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219506700", "ID219504300", "ID219505200", "ID219511300", "ID219500900"], "next": "ID219506200", "paragraphs": [["text", "Es läuft bereits ein Darlehen in Höhe von 3,2 Milliarden Euro. Die Experten aus meinem Hause und die Experten aus dem Bundesministerium der Finanzen begutachten das gerade. Aber es sieht so aus, dass das Geld nicht reichen wird. Es werden einige Hundert Millionen fehlen. Deshalb müssen wir noch mal in den Haushalt reingehen – da bitte ich auch um Unterstützung –, um das durchzubekommen. Dieses Beispiel zeigt, dass die Pflegeversicherung nicht auf Zukunft eingestellt ist. Deswegen: Wir brauchen diese Kommission, damit wir Planungssicherheit für alle Menschen in Deutschland auch in den 2030er-Jahren bekommen."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Jetzt hat das Wort für eine Nachfrage der Abgeordnete Johannes Wagner von Bündnis 90/Die Grünen."]]}, {"id": "ID219506200", "x": -5.811, "y": -2.979, "cluster": 6, "speaker": "Johannes Wagner", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 634, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219506300", "ID219500900", "ID219506700", "ID219504300", "ID219517000"], "next": "ID219506300", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Herr Minister, Pflegebedürftige und ihre Angehörigen haben viele Sorgen. Die Pflegereform, die jetzt kommt und einige Kürzungen vorsieht, ist eine davon, eine andere ist das Klima. In diesem Jahr war es in Deutschland so heiß wie noch nie zuvor. Es sind über 16 000 Menschen an Hitze gestorben."], ["comment", "(Stephan Brandner [AfD]: Das ist relativ weit weg von der Ausgangsfrage!)"], ["text", "Darunter waren viele ältere Menschen; auch pflegebedürftige Menschen waren darunter. Von der Bundesregierung kommt dazu sehr wenig. Wie gedenken Sie ältere Menschen in Einrichtungen – Pflegeeinrichtungen, aber auch Krankenhäusern – in Zukunft vor der Klimakrise, vor diesen Hitzewellen besser zu schützen?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219506300", "x": -5.942, "y": -3.013, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 739, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504300", "ID219506700", "ID219500900", "ID219505900", "ID219506100"], "next": "ID219506400", "paragraphs": [["text", "Vielen Dank, Herr Kollege. – Wir haben de facto 40, 50 Prozent an Räumen in Krankenhäusern und Pflegeheimen, die nicht gekühlt sind, richtig gut gekühlte nur 10 Prozent. Das zeigt schon, dass wir nicht gut genug vorbereitet sind, auch für die nächsten Jahre. Ich habe in der letzten Woche mit der Bildungsministerin gesprochen, weil sie ähnliche Herausforderungen im Kitabereich und im schulischen Bereich hat. Und man kann ja verschiedene Fonds nutzen. Natürlich ist das Thema „Investitionen in Pflegeheimen“ ein Länderthema. Ich will es aber trotzdem nicht wegschieben, weil die Menschen sich nicht dafür interessieren, ob das ein Länder- oder ein Bundthema ist. Wir wollen Maßnahmen treffen, dass das in den nächsten Jahren besser wird."], ["comment", "(Beifall bei der CDU/CSU)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Eine weitere Nachfrage hat die Abgeordnete Simone Fischer."]]}, {"id": "ID219506400", "x": -4.055, "y": -2.651, "cluster": 5, "speaker": "Simone Fischer", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 612, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219501800", "ID219505000", "ID219503000", "ID219502000", "ID219504200"], "next": "ID219506700", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Herr Minister Linnemann, Sie haben gestern Abend im Kanzleramt auch über das Thema Pflege beraten. Vielleicht können Sie uns sagen: Was wurde dort konkret für die Pflege vereinbart? Und nachdem der Herr Bundeskanzler – wir haben es gehört – das „Nebeneinander von privater und gesetzlicher Krankenversicherung“ und auch der Pflegeversicherung als „Gerechtigkeitsproblem“ bezeichnet hat: Haben Sie sich vielleicht auch darauf verständigt, einen Finanzausgleich zwischen privater und sozialer Pflegeversicherung auf den Weg zu bringen? Oder wie sehen Sie hier konkrete Möglichkeiten?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219506700", "x": -5.723, "y": -2.855, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 668, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219506100", "ID219504300", "ID219500900", "ID219505900", "ID219506300"], "next": "ID219506800", "paragraphs": [["text", "Wir haben im Moment mehr als 6 Millionen Pflegebedürftige in Deutschland; mehr als 4 Millionen werden zu Hause gepflegt. Ihre Frage zeigt, wie schwierig die Antwort ist. Wir werden es hinbekommen, das gegenzufinanzieren. Da gibt es verschiedene Möglichkeiten im System. Gleichzeitig werde ich nicht lockerlassen, weiterhin deutlich zu machen, dass es auch noch sogenannte Coronahilfen gibt, die zurückgezahlt werden müssen."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["text", "Ihr Beispiel zeigt: Wir müssen uns als Ergebnis dieser Kommission so aufstellen, dass wir uns nicht jedes Jahr hier treffen und über die Finanzierungsfrage streiten, sondern es ein Finanzierungskonzept für die nächsten 10, 20 Jahre geben wird."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Die nächste Frage stellt für die Fraktion Die Linke der Abgeordnete Ulrich Thoden."]]}, {"id": "ID219506800", "x": -5.954, "y": -0.36, "cluster": -1, "speaker": "Ulrich Thoden", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 671, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517000", "ID219500800", "ID219512200", "ID219507800", "ID219501400"], "next": "ID219507200", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Meine Frage geht an den Bundesminister der Verteidigung. Herr Minister, das ARD-Magazin „Kontraste“ hat in der vergangenen Woche, am 17. September, über auffällige Kostenexplosionen bei Beschaffungsvorhaben berichtet. Konkret möchte ich nach dem „Panther 8x8“ des Herstellers Rosenbauer fragen. Es handelt sich um ein Flughafenlöschfahrzeug. Wenn zivile Flughafenbetreiber dieses kaufen, dann zahlen sie dafür 900 000 Euro pro Stück weniger, und das, obwohl die Bundeswehr mit 35 Stück einen Großkauf getätigt hat. Begründet wird das vom Ministerium mit weiteren Leistungen, die man mit eingekauft hat. Welche Leistungen sind das konkret?"]]}, {"id": "ID219507200", "x": -7.093, "y": 0.828, "cluster": -1, "speaker": "Dr. Daniel Zerbin", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1051, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219507800", "ID219515100", "ID219515700", "ID219500800", "ID219515300"], "next": "ID219507600", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Herr Minister Pistorius, äußere und innere Sicherheit verschmelzen immer weiter. Wir haben dazu ja schon viele Zitate in diesem Hohen Haus gehört. Sie haben ja auch selbst schon gesagt, dass wir zwar keinen Krieg haben, aber auch keinen Frieden mehr. Vor diesem Hintergrund könnte man sagen: Gerade bei äußerer und innerer Sicherheit könnte die Feldjägertruppe, die Militärpolizei der Bundeswehr, eine wichtige Scharnierfunktion erfüllen. Sie ist ja gerade auch beim Planen von OPs in Deutschland wichtig, was die Verlegung angeht. Ich frage Sie deshalb, warum die Feldjäger eher stiefmütterlich behandelt werden."], ["text", "Ich ergänze drei Punkte: Erstens. Was den Personalansatz angeht, sind sie ja ein Brigadeäquivalent. Zweitens. Die Verortung in der Bundeswehr ist bei den Unterstützern; sie hat aber auch Überwachungsaufgaben. Drittens. Was die rechtlichen Grundlagen angeht: Wir haben ja kein Militärpolizeigesetz, wie wir das entsprechend bei der Bundespolizei oder bei den Länderpolizeien haben."], ["text", "Das wäre meine Frage."]]}, {"id": "ID219507600", "x": -7.239, "y": 0.19, "cluster": -1, "speaker": "Martin Sichert", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 600, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515100", "ID219514900", "ID219500800", "ID219516900", "ID219517300"], "next": "ID219507800", "paragraphs": [["text", "Der Kollege hat ja den Drohnenvorfall in Leipzig angesprochen. Da wäre meine konkrete Frage: Will man nicht seitens der Bundesregierung dafür sorgen, dass man künftig Rüstungsgüter nur noch über die Militärflughäfen transportiert? Es ist ja sehr schwierig, wenn wir die deutschen Zivilflughäfen jetzt faktisch zu Versorgungslinien in ein Kriegsgebiet und damit gegebenenfalls zu Anschlagszielen machen, weil das natürlich auch eine massive Gefährdung der zivilen Luftreisenden ist. Warum regelt man das nicht und verlegt die ganzen Rüstungstransporte und Munitionstransporte auf die Militärflughäfen?"]]}, {"id": "ID219507800", "x": -6.226, "y": 0.466, "cluster": 3, "speaker": "Diana Herbstreuth", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1060, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500800", "ID219507900", "ID219514400", "ID219507200", "ID219501400"], "next": "ID219507900", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Meine Frage richtet sich an unseren Bundesminister der Verteidigung, Herrn Boris Pistorius. Der Neue Wehrdienst, er ist ja nun eines der Kernelemente der Bundesregierung. Wir wollen dieses zentrale Vorhaben, die Einsatzbereitschaft der Bundeswehr, steigern. Wir wollen das Interesse junger Menschen an der Bundeswehr ebenfalls steigern, und natürlich wollen wir eine Antwort haben auf die sicherheitspolitischen Herausforderungen, auch in der Zukunft."], ["text", "Nun liegen neun Monate zurück, und die Zahlen, die Sie präsentiert haben, sind wunderbar. Wir wissen, dass der Neue Wehrdienst eine wirklich gute Entwicklung hat, was die Zahlen per se angeht, und das ist ein sehr gutes Signal von uns auch dann nach draußen. Aber ich möchte an dem Punkt anhalten. Zahlen allein zeigen eben noch nicht per se: Ist das Interesse wirklich gestiegen, und können wir diese jungen Menschen auch auf Zeit bei uns wirklich binden? Und da zielt meine Frage ab: Haben wir Potenzial und Nachsteuerungsbedarf bei der Ansprache für unsere jungen Menschen?"]]}, {"id": "ID219507900", "x": -6.278, "y": 0.375, "cluster": 3, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 835, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500800", "ID219507800", "ID219502300", "ID219517000", "ID219514500"], "next": "ID219508500", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrte Frau Kollegin, der Neue Wehrdienst ist, wie Sie richtigerweise sagen, Stand heute ein Erfolg. Wir haben hohe Bewerberzahlen. Bei der Wehrerfassung konnten wir sogar schon 1 000 Einplanungen für dieses Jahr aus dem Kreis derjenigen generieren, die jetzt erst 18 geworden sind und zum ersten Mal erfasst wurden. Das ist eine hohe Zahl. Insgesamt waren es 450 000 Erfassungsbögen, die an die 18-Jährigen gegangen sind, die in der Regel noch gar nicht zur Verfügung stehen. Trotzdem haben wir aus diesem Kreis schon 1 000 eingestellt, und für nächstes Jahr werden es schon 600 sein."], ["text", "Wir sprechen also gezielt an. 20 Prozent derjenigen, die die Erfassungsbögen zurückschicken, zeigen Interesse und wollen angesprochen werden. Das tun wir dann entsprechend dem Verfügbarkeitszeitraum, den sie angegeben haben."]]}, {"id": "ID219508500", "x": -5.525, "y": -0.958, "cluster": 2, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 712, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517000", "ID219507900", "ID219506300", "ID219517100", "ID219518700"], "next": "ID219508600", "paragraphs": [["text", "Frau Präsidentin! Herr Kollege, in der Tat liegt die Abbruchquote im Schnitt bei etwas unter 25 Prozent. Wenn man das allerdings mit anderen Ausbildungsberufen vergleicht – ich habe mich dazu mit Handwerks- und Handelskammern unterhalten –, liegt die Quote dort teilweise sogar noch deutlich höher, nämlich bei weit über 30 Prozent. Das ist zwar kein Trost für uns, macht aber deutlich, dass es eine grundsätzliche Herausforderung darstellt, unter welchen Bedingungen sich junge Menschen für Weg A, B oder C entscheiden. Wir können das beeinflussen durch die Frage: Warum scheidet ihr aus? Welche Maßnahmen können wir aus eurer Perspektive ergreifen, –"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Minister."], ["text", "– damit ihr nicht abbrecht? – Daran arbeiten wir intensiv."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Vielen Dank. – Wir kommen zur nächsten Hauptfrage. Für Bündnis 90/Die Grünen hat jetzt das Wort der Abgeordnete Johannes Wagner."]]}, {"id": "ID219508600", "x": -3.449, "y": -2.199, "cluster": 5, "speaker": "Johannes Wagner", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 629, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219509800", "ID219509000", "ID219503600", "ID219509600", "ID219503000"], "next": "ID219508800", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Herr Minister Linnemann, als Ampel haben wir die Kinderkrankentage für Eltern von 10 auf 15 Tage und für Alleinerziehende auf 30 Tage erhöht. Ziel war es, die Familien strukturell zu entlasten. Diese Regelung läuft Ende des Jahres aus. Bisher gibt es keinerlei Anstalten der Bundesregierung, sie danach zu verlängern. Es scheint so, als wollten Sie Geld auf Kosten von Eltern einsparen, die kranke Kinder zu Hause haben. Deswegen meine Frage an Sie: Können wir uns darauf verlassen, dass Sie sich dafür einsetzen werden, dass auch im nächsten Jahr Eltern 15 bis 30 Kinderkrankentage haben werden?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219508800", "x": -3.678, "y": -3.612, "cluster": 5, "speaker": "Johannes Wagner", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 537, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504000", "ID219511600", "ID219511400", "ID219512200", "ID219511200"], "next": "ID219509000", "paragraphs": [["text", "Kranke Kinder werden in Kinderarztpraxen behandelt. Auch dort wird ja nach dem Beitragssatzstabilisierungsgesetz gekürzt. Ich möchte Sie fragen, Herr Minister: Sehen auch Sie es als richtig an – das war ja unter Ihrer Vorgängerin –, dass jetzt bei den Kinderärzten und Hausärzten genauso wie bei der Psychotherapie eingespart wird und Kinderärzte auch bei der Weiterbildung nicht dieselbe Förderung erhalten wie andere Facharztrichtungen, zum Beispiel die Allgemeinmedizin? Was werden Sie tun, um die Kinderärzte im Land zu unterstützen?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219509000", "x": -3.511, "y": -2.29, "cluster": 5, "speaker": "Timon Dzienus", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 712, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219509800", "ID219506400", "ID219508600", "ID219502600", "ID219509600"], "next": "ID219509200", "paragraphs": [["text", "Herr Linnemann, „Kinderkrankentage“ ist ein wichtiges Stichwort. Sie haben auch über Prävention gesprochen. Unser gemeinsames Ziel muss sein, dass Kinder und Jugendliche seltener krank sind. Voraussetzung dafür ist eine gesunde Ernährung. Gerade verhandelt die Bundesregierung ja über die Regelsätze im Bürgergeld; dies ist ja eng verbunden mit dem Thema. Deswegen die Frage an Sie: Können Sie mir sagen, wie viel Geld 13-jährigen Jugendlichen im Bürgergeldbezug eigentlich am Tag für Essen zur Verfügung steht? Und halten Sie diesen Betrag für ausreichend, um sich gesund zu ernähren? Wenn nicht, würden Sie sich dann dafür einsetzen, dass die Grundsicherung für Kinder und Jugendliche entsprechend erhöht wird?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219509200", "x": -6.617, "y": 2.138, "cluster": 1, "speaker": "Dr. Zoe Mayer", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 559, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219510900", "ID219516100", "ID219516700", "ID219516400", "ID219500900"], "next": "ID219509500", "paragraphs": [["text", "Vielen Dank. – Herr Gesundheitsminister, auf das Thema Jugendschutz will ich auch gerne eingehen. Die Industrie macht gerade massiven Druck, Nikotinbeutel zu legalisieren. Wir wissen, dass gerade junge Menschen bei Nikotinbeuteln oft schwach werden. Sie kämpfen dann ein Leben lang mit der Sucht. Die Industrie sagt, dass sich die Steuereinnahmen dadurch massiv steigern lassen. Ich würde mir wünschen, dass Ihr Gesundheitsministerium hier eine klare Ansage wie „Das wird nicht legalisiert“ macht, um unsere Jugendlichen zu schützen. Können Sie dem zustimmen?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219509500", "x": -4.564, "y": -1.593, "cluster": -1, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 567, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500900", "ID219504100", "ID219510900", "ID219508800", "ID219515600"], "next": "ID219509600", "paragraphs": [["text", "Vielen Dank, Frau Borchardt, für Ihre Frage. – Sie sind gesundheitspolitische Sprecherin der CDU/CSU-Fraktion, und der Kollege Pantazis sitzt auch hier. Ich bekomme ja die Gespräche, die geführt werden, mit. Ich habe nicht an einem Punkt einen Dissens gesehen, weder in der Sache, dass das jetzt schnell umgesetzt wird, noch beim Zeitrahmen. Deshalb werden wir das machen: Kinder und Jugendliche werden weiter geschützt. Laufende Behandlungen sind gesichert. Für Akutfälle greifen Sonderregelungen. – Das werden wir ohne Wenn und Aber so schnell wie möglich umsetzen."], ["comment", "(Beifall bei der CDU/CSU)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Eine weitere Nachfrage hat der Abgeordnete Dr. Paul Schmidt."]]}, {"id": "ID219509600", "x": -3.664, "y": -2.179, "cluster": 5, "speaker": "Dr. Paul Schmidt", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 583, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503600", "ID219502600", "ID219509800", "ID219508800", "ID219509000"], "next": "ID219509700", "paragraphs": [["text", "Herr Minister Linnemann, wenn das eigene Kind krank ist, braucht man schnell Medizin. Man braucht also eine Apotheke vor Ort, wo man diese herbekommen kann."], ["text", "Sie haben am 15. September 2026 beim Deutschen Apothekertag versprochen, die Vor-Ort-Apotheken zu stabilisieren. Gleichzeitig hält Ihr Stabilisierungsgesetz aber an der Deckelung des Apothekenfixums fest, während das Apothekensterben insbesondere in der Fläche weitergeht. Welche konkreten Honorarerhöhungen setzen Sie noch in diesem Jahr durch, um das Schließen weiterer Apotheken, insbesondere in der Fläche, zu verhindern?"]]}, {"id": "ID219509700", "x": -5.231, "y": -1.329, "cluster": -1, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 559, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219509600", "ID219517000", "ID219516900", "ID219511300", "ID219501900"], "next": "ID219509800", "paragraphs": [["text", "Herr Kollege, ich will Ihnen nicht zu nahe treten, aber die Information ist falsch. Das Gegenteil ist richtig. Das Fixum für Apotheken lag seit 2013 bei 8,35 Euro. Es wird jetzt zum 01.01.2027 – das ist der zweite Schritt – auf 9,50 Euro erhöht."], ["text", "Und jetzt kommt das Neue: Die Honorarverhandlungen werden in Zukunft zwischen den Apotheken und der GKV selbst geführt. Das heißt, sie können sogar jährlich verhandeln, sodass sie nicht noch mal zehn, zwölf Jahre warten müssen, bis wir hier etwas beschließen. Die Information, die Sie haben, ist wirklich falsch."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Der Abgeordnete Helge Limburg hat noch eine Nachfrage."]]}, {"id": "ID219509800", "x": -3.305, "y": -2.358, "cluster": 5, "speaker": "Helge Limburg", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 882, "comments": 3, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219508600", "ID219502600", "ID219506400", "ID219509000", "ID219503000"], "next": "ID219510000", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Herr Minister Linnemann, ich möchte noch mal auf die Frage des Kollegen Wagner zu den Kinderkrankentagen zurückkommen. Ich finde Ihre Antwort, ehrlich gesagt, unglaublich."], ["text", "Herr Minister, Sie sind Teil einer Regierung, die beim Kindersofortzuschlag kürzt; Sie sind Teil einer Regierung, die beim Unterhaltsvorschuss kürzt; Sie sind Teil einer Regierung, die beim Elterngeld kürzt. Und jetzt sagen Sie hier lapidar auf die Frage des Kollegen,"], ["comment", "(Simone Borchardt [CDU/CSU]: Die ist aber richtig, die Antwort! Das war eine Coronamaßnahme!)"], ["text", "ob es denn wenigstens die Perspektive gibt, dass die Regelung für die Kinderkrankentage für die berufstätigen Eltern, die arbeiten müssen, verlängert wird: Ja, das war halt aus der Coronazeit."], ["comment", "(Simone Borchardt [CDU/CSU]: Ja, das ist ja auch so!)"], ["text", "Die fahren wir zurück."], ["text", "Herr Minister, was sollen denn die Eltern machen, wenn die Kinder nach 10 oder 20 Tagen noch nicht wieder gesund sind? Was ist denn Ihre Vorstellung davon, wie man dann damit umgehen soll?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN – Simone Borchardt [CDU/CSU]: Das hat früher auch funktioniert!)"]]}, {"id": "ID219510000", "x": -5.692, "y": 0.766, "cluster": 3, "speaker": "Falko Droßmann", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 505, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219510100", "ID219507800", "ID219500800", "ID219514400", "ID219514100"], "next": "ID219510100", "paragraphs": [["text", "Frau Präsidentin! Kollege Pistorius, leider wächst auch die militärische Bedeutung des Weltraums immer weiter an. Der französische Präsident hatte deshalb vor zwei Wochen zu einer großen internationalen Konferenz eingeladen, an der auch Sie teilgenommen haben. Die Bundesregierung hat 2025 eine erste Weltraumsicherheitsstrategie verabschiedet. Herr Minister, wie wird diese Weltraumstrategie in Ihrem Geschäftsbereich denn konkret umgesetzt, und wo stehen wir beim Fähigkeitsaufwuchs im Bereich Weltraum?"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Minister."]]}, {"id": "ID219510100", "x": -5.494, "y": 0.504, "cluster": -1, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1147, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219510000", "ID219500800", "ID219501500", "ID219510300", "ID219513900"], "next": "ID219510300", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrter Herr Kollege! In der Tat, die Weltraumsicherheitsstrategie, die Erste Ihrer Art in der Geschichte Deutschlands, ist in der Umsetzung. Wir sind im Rahmen des Weltraumkommandos dabei, ein European Space Component Command zu schaffen. Wir bauen eine resiliente Weltraumsicherheitsarchitektur auf, bestehend aus Bodenstationen, Satellitensystemen und entsprechenden Startkapazitäten, die in diesem Kontext von zentraler Bedeutung sind; das bauen wir weiter aus. Wir haben angekündigt, dafür 35 Milliarden Euro in den nächsten Jahren in die Hand zu nehmen."], ["text", "Wir sind sehr erfreut über den erfolgreichen Start von Isar Aerospace auf Andøya. Der zweite Startversuch war schon ein Erfolg. SpaceX hat vier gebraucht. Da geht also etwas voran. Aber das wird die Herausforderung der nächsten Jahre sein."], ["text", "Mir ist wichtig, dass wir das nicht in dem Glauben tun, wir könnten das national allein. Wir brauchen unsere europäischen Partner. Wir sind in engem Austausch mit Frankreich und anderen, um das so aufzustellen, dass wir wirklich Startkapazitäten haben, aber auch die richtigen Satelliten jederzeit ins All bringen können."]]}, {"id": "ID219510300", "x": -5.301, "y": 0.656, "cluster": -1, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 654, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219510100", "ID219514100", "ID219513900", "ID219500800", "ID219517000"], "next": "ID219510400", "paragraphs": [["text", "In der Tat! Wir arbeiten zum Beispiel mit Frankreich – –"], ["comment", "(Falko Droßmann [SPD]: Die AfD pöbelt irgendwas dazwischen! Das habe ich jetzt nicht verstanden! Der dicke Mann da vorne!)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Der Herr Minister ist jetzt mit der Antwort dran."], ["text", "Komischerweise höre ich das immer gar nicht. Ich weiß gar nicht, woran das liegt, aber egal. – Wir arbeiten sehr intensiv, insbesondere mit den Franzosen, zusammen, aber auch mit den Norwegern und anderen, um sicherzustellen, dass wir einerseits die Kapazitäten für die Starts haben, für unterschiedliche Größenklassen von Satelliten, aber insbesondere auch die Kommunikationsverbindung schaffen, zum Beispiel für eine satellitengestützte frühzeitige Raketenwarnsystematik. All das sind Dinge, die wir gerade vor allen Dingen mit den Franzosen, aber auch mit anderen in Europa planen und angehen."], ["comment", "(Beifall bei Abgeordneten der SPD – Falko Droßmann [SPD]: Danke!)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Zur nächsten Hauptfrage hat das Wort die Abgeordnete Evelyn Schötz für die Fraktion Die Linke."]]}, {"id": "ID219510400", "x": -3.474, "y": -3.366, "cluster": 5, "speaker": "Evelyn Schötz", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 616, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219502600", "ID219501900", "ID219504000", "ID219511400", "ID219510800"], "next": "ID219510500", "paragraphs": [["text", "Vielen Dank. – Herr Linnemann, ich würde Sie gern fragen: Mit dem GKV-Spargesetz ist die psychotherapeutische Versorgung faktisch erst einmal kaputtgespart. Jetzt legen Sie einen Entschließungsantrag vor, der uns einen Bruchteil dessen zurückgibt, was vorher schon da war, und verkaufen den Patientinnen und Patienten und Psychotherapeutinnen und -therapeuten das als großes Zugeständnis und politischen Erfolg. Also mit der einen Hand erst nehmen, mit der anderen ein Almosen zurückgeben und sich dafür feiern lassen: Ist das die Gesundheitspolitik dieser Legislatur, oder wird es mit Ihnen einen Kurswechsel geben?"]]}, {"id": "ID219510500", "x": -5.005, "y": -1.85, "cluster": -1, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 754, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504100", "ID219500100", "ID219500900", "ID219506300", "ID219504300"], "next": "ID219510700", "paragraphs": [["text", "Frau Kollegin, vielen Dank. – Der Entschließungsantrag wird nicht hier verabschiedet, der ist mit Mehrheit beschlossen worden. Ich glaube, das Parlament lässt sich dafür nicht feiern. Es geht ja auch nicht darum, sich für irgendwas in der Gesundheitspolitik zu feiern, sondern für die Menschen da zu sein, die wirklich Hilfe brauchen."], ["text", "Und ja, die Entwicklung der Fallzahlen ist besorgniserregend; das ist so. Und das können wir jetzt auch nicht mit diesem Gesetz oder mit einem Entschließungsantrag lösen, sondern da sagen wir, dass wir gerade bei den Gruppen, die besonders hilfebedürftig sind, noch mal etwas wieder verbessern. Aber es braucht insgesamt einen großen Präventionsansatz, damit wir in diesem Land nicht weiter steigende Fallzahlen haben."]]}, {"id": "ID219510700", "x": -6.894, "y": 1.757, "cluster": 1, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 572, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516300", "ID219516700", "ID219515600", "ID219515300", "ID219514900"], "next": "ID219510800", "paragraphs": [["text", "Ich habe mich nicht auf psychisch kranke Menschen bezogen, sondern auf psychisch kranke Gefährder."], ["text", "Ich habe nach dem Anschlag in Magdeburg ein Interview im Deutschlandfunk gegeben und habe mich auf psychisch kranke Gefährder bezogen. Wenn ein Gefährder in Niedersachsen entlassen wird und nach Bayern zieht oder flüchtet, dann muss Bayern das wissen. Da braucht es einen besseren Datenschutz."], ["text", "Deswegen bitte ich, diese Unterstellung zu unterlassen. Ich lese das immer noch täglich von Ihnen in Zeitungen. Es stimmt nicht! Ich meinte Gefährder und nicht psychisch Kranke."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Zu einer Nachfrage hat jetzt das Wort die Abgeordnete Dr. Kirsten Kappert-Gonther."]]}, {"id": "ID219510800", "x": -3.517, "y": -3.804, "cluster": -1, "speaker": "Dr. Kirsten Kappert-Gonther", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 550, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504000", "ID219511400", "ID219511600", "ID219510400", "ID219508800"], "next": "ID219510900", "paragraphs": [["text", "Schönen Dank, Frau Präsidentin. – Herr Minister, ich finde es ausdrücklich gut und richtig, dass Sie anerkennen, dass der beschlossene Entschließungsantrag zur Psychotherapie jetzt in die Umsetzung kommen muss, sie aber auch sagen, dass das längst nicht reicht."], ["text", "Darum möchte ich Sie fragen: Wir wissen, dass bei der psychotherapeutischen Berechnung der kassenärztlichen Sitze von Zahlen aus dem Jahr 1990 ausgegangen wird. Seitdem hat sich der Hilfebedarf in etwa verdoppelt. Wann beauftragen Sie den GBA endlich mit einer Reform der Bedarfsplanung?"], ["comment", "(Beifall bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"]]}, {"id": "ID219510900", "x": -6.79, "y": 1.929, "cluster": 1, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 688, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500100", "ID219516200", "ID219516400", "ID219516100", "ID219516300"], "next": "ID219511100", "paragraphs": [["text", "Auch das wird diskutiert, nicht nur bei mir im Hause, sondern auch in Deutschland. Da bitte ich darum, dem Ganzen etwas Zeit zu geben. Ich kann jetzt hier dazu noch keine Aussagen treffen. Aber ich möchte nochmals darauf hinweisen, dass die Lösung nicht allein in diesem Bereich, in der Verhandlung, liegt, sondern dass wir einen breiteren Ansatz brauchen. Wir haben eben über das Thema „Kinder und Jugendliche“ gesprochen. Dass es überhaupt begleitendes Trinken in Deutschland gab! Es ist richtig, dass das jetzt endlich abgeschafft wird. Social Media müssen wir restriktiv angehen; das ist richtig."], ["comment", "(Dr. Kirsten Kappert-Gonther [BÜNDNIS 90/DIE GRÜNEN]: Da haben wir keinen Dissens!)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Minister."], ["text", "All das müssen wir jetzt machen, damit wir in Zukunft nicht mehr so viele Fälle haben."]]}, {"id": "ID219511100", "x": -5.162, "y": -3.719, "cluster": 7, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 619, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503100", "ID219503900", "ID219500900", "ID219511900", "ID219512700"], "next": "ID219511200", "paragraphs": [["text", "Also, erst mal sitzen wir ja gerade am Entwurf für die Primärversorgung. Ich würde das Thema Ersteinschätzung komplett ausbauen und auch die Kassenärztliche Bundesvereinigung in der Hinsicht unterstützen. Das ist ein super Instrument. Wir sehen, dass im letzten Jahr 2 Millionen Termine bei Fachärzten innerhalb von zehn Tagen vergeben wurden. Das ist, glaube ich, das Erste, was wir machen müssen. Darüber hinaus brauchen wir eine Steuerung, sodass wir den Patienten begleiten und klar ist: Termine müssen nach Dringlichkeit vergeben werden; die medizinische Notwendigkeit ist entscheidend."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Minister."], ["text", "Und das Ziel gehen wir an."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Eine weitere Nachfrage hat jetzt die Abgeordnete Linda Heitmann."]]}, {"id": "ID219511200", "x": -4.081, "y": -3.443, "cluster": 5, "speaker": "Linda Heitmann", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 630, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503800", "ID219504000", "ID219517000", "ID219512200", "ID219511300"], "next": "ID219511300", "paragraphs": [["text", "Danke schön. – Herr Minister, ich möchte noch mal, wie auch Frau Schötz es in ihrer Frage gemacht hat, auf das GKV-Beitragssatzstabilisierungsgesetz zurückkommen. Die Kommission hatte ja unter anderem auch empfohlen, dass aus Steuermitteln mehr Geld für die Beiträge von Bürgergeldempfängerinnen und Bürgergeldempfängern in den Gesundheitsfonds fließen. Sie haben da zwei Modelle aufgemacht: entweder Mindestbeitrag oder kostendeckende Beiträge. Der Finanzminister hat das als Milchmädchenrechnung abgetan. Sie haben sich aber schon –"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Kommen Sie zu Ihrer Frage."], ["text", "– als Generalsekretär dafür ausgesprochen."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Minister, Sie haben die Möglichkeit, zu antworten."], ["text", "Wie stehen Sie jetzt als Gesundheitsminister dazu?"]]}, {"id": "ID219511300", "x": -5.343, "y": -2.539, "cluster": 6, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 635, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219504300", "ID219500900", "ID219506100", "ID219517000", "ID219503100"], "next": "ID219511400", "paragraphs": [["text", "Ich bleibe dabei: Das sind nicht Leistungen, die von GKV-Versicherten getragen werden dürfen. Das sind Leistungen, die nichts mit der Versicherung zu tun haben, und deswegen müssen die aus dem Haushalt finanziert werden. Deswegen bin ich dem Bundesfinanzminister und auch den Koalitionsfraktionen dankbar, dass jetzt endlich ein Einstieg gelungen ist mit 250 Millionen Euro nächstes Jahr, dann 500 Millionen Euro, 1 Milliarde Euro, 1,5 Milliarden Euro und ab 2031 dann 2 Milliarden Euro, dass wir einen Einstieg haben, dass wir das als gesamtgesellschaftliche Aufgabe verstehen und dass nicht die gesetzlich Versicherten dies bezahlen."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Die nächste Nachfrage kommt von dem Abgeordneten Martin Sichert von der AfD-Fraktion."]]}, {"id": "ID219511400", "x": -3.646, "y": -3.868, "cluster": -1, "speaker": "Martin Sichert", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 627, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219510800", "ID219511600", "ID219510400", "ID219504000", "ID219508800"], "next": "ID219511600", "paragraphs": [["text", "Herr Minister, wir sind uns ja einig darüber, dass bei der Psychotherapie, wie es ja hier gerade auch schon erwähnt worden ist, deutlicher Handlungsbedarf besteht. Nun hat die Regierung im Frühjahr dieses Jahres die Vergütung für Psychotherapeuten um 4,5 Prozent reduziert, und sie ist jetzt budgetiert mit dem GKV-Gesetz ab dem 01.01.2027. Man geht davon aus, dass dann künftig voraussichtlich 10 bis 15 Prozent weniger Behandlungen bei Psychotherapeuten stattfinden, weil sie sie schlicht nicht mehr vergütet bekommen. Was gedenkt die Bundesregierung an der Stelle in Bezug auf Vergütung und in Bezug auf Budgetierung zu tun?"]]}, {"id": "ID219511600", "x": -3.655, "y": -3.916, "cluster": -1, "speaker": "Emmi Zeulner", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesord
