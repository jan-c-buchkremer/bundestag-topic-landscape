 Topexperten entwickelt werden und die das Leben der Menschen einfacher und besser machen, schlechtzureden. Das ist völlig unverständlich."], ["comment", "(Beifall bei der CDU/CSU und der SPD)"], ["text", "Genau vor 20 Jahren wurde in Kalifornien ein neuer Bildschirm vorgestellt: der sogenannte Multi-Touch-Screen. Ziel war eine Bedienung, die sich intuitiv und natürlich anfühlt. Ein Jahr später wurde dann das iPhone vorgestellt. Diese Screens veränderten unsere Verbindung mit dem Gerät und unseren Zugang zur digitalen Welt. Vor allem aber wurde die Bedienung digitaler Technik plötzlich ganz selbstverständlich: tippen, wischen, navigieren, fotografieren – genau so, wie wir es intuitiv erwarten."], ["text", "Was damals neu war, ist heute längst selbstverständlich; diese intuitive Art, mit der digitalen Welt umzugehen, ist heute in fast allen Lebensbereichen angekommen. Aber eben nur in fast allen: Bei Verwaltungsdienstleistungen müssen wir uns teilweise noch durch Verfahren arbeiten, die wenig mit unserem digitalen Alltag zu tun haben. Aber auch bei der Eröffnung eines Bankkontos muss man sich gelegentlich sehr kompliziert identifizieren. Und manchmal zeigt sich die Lücke sogar in ganz alltäglichen Situationen. Ich denke da beispielsweise an Bahnfahrkarten, die man in der Regel auf dem Smartphone hat; aber wenn ein Kontrolleur kommt, muss man seinen Ausweis aus der Geldbörse holen. Da haben wir wieder analog und digital."], ["text", "Genau daran wird sich durch die neue „d-you“-App der digitalen Brieftasche grundlegend etwas ändern."], ["comment", "(Beifall bei der CDU/CSU sowie des Abg. Parsa Marvi [SPD])"], ["text", "Wir haben es bereits gehört: Die App bringt unseren digitalen Nachweis auf das Gerät, das wir ohnehin ständig bei uns haben. Sie folgt damit demselben Prinzip, das damals das iPhone so populär machte: Nicht der Mensch passt sich der Technik an, sondern die Technik passt sich stärker an das an, was wir tun möchten. Die „d-you“-App ist darum auch kein weiteres digitales Verwaltungsverfahren, sondern eine App, die wir ganz selbstverständlich im Alltag nutzen. Ich durfte den Piloten schon anschauen, und ich muss sagen: Es macht Spaß. Ich freue mich auf dann, wenn es diese App tatsächlich gibt."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Mit dem Digitale Identitätengesetz schaffen wir jetzt den rechtlichen Rahmen dafür. Aber „d-you“ wird nicht nur einfach eine gute App. Entscheidend ist auch das Ökosystem; darauf ist schon hingewiesen worden. Ich bin dem BMDS und Minister Wildberger sehr dankbar, dass er die „d-you“-App so vorangetrieben hat, dass wir sie im nächsten Jahr verfügbar haben. So wie das Smartphone unseren Zugang zur digitalen Welt einfacher und besser gemacht hat, wird die „d-you“-App unseren Alltag einfacher und besser machen."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der CDU/CSU und der SPD)"]]}, {"id": "ID219518400", "x": -7.068, "y": -0.579, "cluster": 2, "speaker": "Dr. Philipp Rottwilm", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/8", "agenda": "Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen", "top": "Tagesordnungspunkt 6", "drucksachen": ["21/6566", "21/7039", "21/6020", "21/6732"], "chars": 6673, "comments": 10, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518900", "ID219518700", "ID219515200", "ID219519000", "ID219518500"], "next": "ID219518500", "paragraphs": [["text", "Frau Präsidentin! Liebe Kolleginnen und Kollegen! Geldwäsche ist auf dem Immobilienmarkt ein ernstes Thema. Wir haben es ernst genommen und gehandelt. Deshalb gibt es heute Meldepflichten für Immobiliengeschäfte. Deshalb darf niemand mehr ein Haus mit Bargeld bezahlen. Und deshalb setzen wir die EU-Vorgabe zum Immobilienregister um: Behörden werden bis 2029 zentral abrufen können, wem ein Grundstück gehört und was es gekostet hat."], ["text", "Sie aber, liebe Kolleginnen und Kollegen von den Linken, wollen daraus ein Superregister für jede Wohnung in der Republik machen. Sie wollen jede Miete kennen, jede Änderung soll binnen vier Wochen gemeldet werden, jeder Mietvertrag soll Ihnen als PDF vorliegen – also Steuerung von ganz oben. Die 80-jährige Witwe, die ein Zimmer an eine Studentin vermietet, „darf“ also künftig Verträge einscannen, anonymisieren und auf einem Behördenportal hochladen – viel Spaß dabei!"], ["text", "Wir haben schon genug Bürokratie in diesem Land. Wo Daten den Ämtern ohnehin vorliegen, sollen sie gern zusammengeführt werden. Aber Millionen Menschen zu Datenlieferanten des Staates zu machen ohne einen konkreten Mehrwert, liebe Kolleginnen und Kollegen, da machen wir nicht mit."], ["comment", "(Beifall bei der SPD sowie des Abg. Dr. Florian Dorn [CDU/CSU])"], ["text", "In Ihrem zweiten Antrag wollen Sie einen Regelkatalog für Wohnungsunternehmen ab 50 Wohneinheiten aufstellen. Jedem Unternehmen, das gegen Ihre Regeln verstößt, wollen Sie die Vermietung verbieten. Und die Regeln sind, wie immer bei Ihnen, reichlich willkürlich und ideologiegeladen: Das Unternehmen wird an der Börse gehandelt? Zack, Lizenz weg. Das Unternehmen weist nicht genug Rückstellungen für Sanierungen nach? Zack, Lizenz weg. Das Unternehmen gibt keine Garantie ab, sich an weitaus strengere Regeln zu halten, als sie für alle anderen Vermieter in Deutschland gelten? Zack, Lizenz weg. Die Wohnungen müssen also verkauft werden."], ["text", "Ich habe mich beim Lesen ehrlich gesagt gefragt: Was soll dadurch eigentlich besser werden? Für die betroffenen Unternehmen gelten Mietpreisbremse, Kappungsgrenze und Kündigungsschutz genauso wie für jeden anderen Vermieter. Dieser Antrag verbessert also die aktuelle Lage nicht. Auch diesen lehnen wir ab."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"], ["text", "Nun diskutieren wir diese Anträge nicht im luftleeren Raum. Die Linke hat am Sonntag in Berlin eine Wahl gewonnen. Dazu gratuliere ich Ihnen. Und warum haben Sie gewonnen? Weil fast jeder zweite Wähler unter 35 Sie gewählt hat. Das sind genau die jungen Menschen, die gerade ihren ersten Job haben, die sich etwas aufbauen, die vielleicht eine Familie gründen wollen. Sie haben die Stimmen dieser Generation bekommen, weil Sie versprochen haben, Wohnen für sie wieder bezahlbar zu machen. Aber wie? Sie wollen die Mieten bei den landeseigenen Wohnungen einfrieren und dauerhaft niedrig halten."], ["comment", "(Caren Lay [Die Linke]: Ja! Ganz genau!)"], ["text", "So weit, so gut. Dem Land Berlin gehören 400 000 Wohnungen. Zählt man die Genossenschaften noch hinzu, dann ist jede dritte Mietwohnung in Berlin in gemeinwohlorientierter Hand. Wenn ein so großer Bestand günstig vermietet wird, dann drückt das die Mieten in der ganzen Stadt. So hat es Wien unter Sozialdemokraten seit den 1920er-Jahren vorgemacht. Das ist ein gutes Modell, dafür haben Sie die SPD in diesem Haus mit an Bord. Bis hierhin gehen wir mit."], ["text", "Aber dann beginnt bei Ihnen der Populismus, und Sie verlassen den Weg der Vernunft. Sie wollen die großen Wohnungskonzerne in Berlin enteignen – 220 000 Wohnungen –, nicht abkaufen, nein, enteignen. Das würde Sie 42 Milliarden Euro kosten, so eine Schätzung von 2021. Inzwischen sind die Preise noch einmal gestiegen. Das ist quasi der komplette Berliner Haushalt."], ["text", "Ich weiß, dass Sie jetzt sagen: Das kriegt man für 8 Milliarden Euro hin."], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Herr Kollege, es besteht der Wunsch nach einer Zwischenfrage aus der Fraktion Die Linke. Wollen Sie die zulassen?"], ["text", "Sehr gerne."], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Bitte schön."], ["zwischenfrage", "ID219518400-2"], ["text", "Nein, das ist kein Widerspruch, liebe Kollegin. Es geht darum, was Sie umsetzen wollen. Sie wollen eine Vergesellschaftung nach Artikel 15 Grundgesetz. Das ist noch nie angewandt worden, und das hat auch einen guten Grund. Insbesondere die Höhe der zulässigen Entschädigung – und darum wird es ja jetzt gehen – ist richterlich ungeklärt. Die Höhe der Entschädigung muss dem Verkehrswert entsprechen, und – genau darauf wollte ich gerade eingehen – den wollen Sie nicht zahlen. Die Maßnahme muss verhältnismäßig sein, und Ihr Haushalt ist ungefähr so groß wie das, was Sie bezahlen müssten, liebe Kollegin. Deswegen wird das so, wie Sie es sich vorstellen, nicht funktionieren und ist außerdem wirtschaftspolitischer Unsinn; das muss man Ihnen leider auch sagen. Wir werden Ihnen das nicht durchgehen lassen."], ["comment", "(Beifall bei der SPD und der CDU/CSU)"], ["text", "Ich weiß, Sie wollen das für 8 Milliarden Euro hinbekommen. Um das mal greifbar zu machen: Das würde bedeuten, dass Sie 37 000 Euro pro Wohnung zahlen, also einen Bruchteil des Wertes. Zum Glück haben wir ein Bundesverfassungsgericht, das Ihr Vorhaben verhindern wird. Würden Sie es umsetzen, dann würden Sie damit die soziale Marktwirtschaft in Berlin zu Grabe tragen."], ["comment", "(Widerspruch bei der Linken)"], ["text", "Denn wer einmal erlebt hat, dass der Staat sich nimmt, was er will, und dafür bezahlt, was ihm passt, und nicht, was es wert ist, der investiert hier nie wieder."], ["text", "Und was würden Sie erreichen? 220 000 Wohnungen, die es schon gibt, haben dann einen neuen Eigentümer. Die Staatskasse des Landes Berlin gerät in Schieflage. Die Kredite für die Entschädigungen müssen Sie dann übrigens auch noch bedienen. Fragen Sie mal unsere Freunde in Frankreich, was mit den Kreditzinsen für Staatsanleihen passiert ist, nachdem die Regierung 1982 Banken und Industrieunternehmen enteignet hat, wohlgemerkt zu Marktpreisen, nicht so, wie Sie das machen wollen. Die Zinsen auf französische Staatsanleihen sind danach auf über 17 Prozent gestiegen, 7 Prozent mehr als seinerzeit in Deutschland. Ich wünsche Ihnen viel Erfolg dabei, die Mieten dieser Wohnungen zu senken, wenn Sie zweistellige Zinssätze für Kredite bezahlen müssen. Das ist leider vollkommen unrealistisch."], ["comment", "(Beifall bei der SPD)"], ["text", "Nein, meine Damen und Herren, für die Mieter, die heute im Schnitt 8,30 Euro den Quadratmeter im Bestand bezahlen, ändert sich durch eine Enteignung nichts zum Besseren, auch wenn Sie das zehnmal erzählen. Für jeden, der in Berlin bauen will, ändert sich dagegen sehr viel. All denen senden Sie die klare Botschaft: Wir wollen sie hier nicht. – Mit Ihren Vergesellschaftungsfantasien verunsichern Sie nicht nur Investoren in unserer Hauptstadt, sondern in unserem Land."], ["comment", "(Zuruf der Abg. Denise Loop [BÜNDNIS 90/DIE GRÜNEN])"], ["text", "Das alles tun Sie nur, um Ihr altes Feindbild zu bedienen."], ["comment", "(Zurufe von der Linken)"], ["text", "Dabei sind die Konzerne nicht der Grund, warum in Berlin Wohnungen fehlen. Der Grund ist, dass über Jahrzehnte zu wenig gebaut wurde. Also nehmen Sie das Geld, das Sie für die Entschädigungen ausgeben wollen, und bauen Sie: mit den landeseigenen Gesellschaften, mit den Genossenschaften, mit dem Bund. Dabei haben Sie uns an Ihrer Seite – nicht beim Enteignen."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU – Zurufe von der Linken)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Wir führen keine Nebendebatte neben der Debatte."], ["chair", "Der nächste Redner in dieser Debatte ist für die AfD-Fraktion Dr. Paul Schmidt."], ["comment", "(Beifall bei der AfD)"]]}, {"id": "ID219518400-2", "x": -7.554, "y": -0.2, "cluster": 2, "speaker": "Caren Lay", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/8", "agenda": "Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen", "top": "Tagesordnungspunkt 6", "drucksachen": ["21/6566", "21/7039", "21/6020", "21/6732"], "chars": 600, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518400", "ID219518900", "ID219515200", "ID219518500", "ID219500400"], "next": "ID219518500", "paragraphs": [["text", "Herr Kollege Rottwilm, vielen Dank, dass Sie die Zwischenfrage zulassen. – Sie haben gerade gesagt, die Forderung nach einer Vergesellschaftung von großen privaten Wohnungskonzernen sei blanker Populismus. Wenn dem so sein sollte, dann frage ich mich allerdings, warum die SPD in Berlin auch diese Beschlusslage hat. Ihre Basis hat nämlich gesagt: Auch wir wollen, dass dieser demokratische Volksentscheid umgesetzt wird. – Wie erklären Sie also, dass Ihre Parteibasis in Berlin diesen Volksentscheid umsetzen will und Sie dies hier als Populismus abtun? Das ist doch offenbar ein großer Widerspruch."], ["comment", "(Beifall bei der Linken sowie der Abg. Denise Loop [BÜNDNIS 90/DIE GRÜNEN])"], ["antwort", "ID219518400"]]}, {"id": "ID219518500", "x": -7.311, "y": -0.756, "cluster": 2, "speaker": "Dr. Paul Schmidt", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/8", "agenda": "Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen", "top": "Tagesordnungspunkt 6", "drucksachen": ["21/6566", "21/7039", "21/6020", "21/6732"], "chars": 3382, "comments": 11, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518900", "ID219518400", "ID219519000", "ID219518700", "ID219518600"], "next": "ID219518600", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Liebe Kolleginnen und Kollegen! Sie von der Linken haben uns den Antrag mit dem Titel „Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen“ vorgelegt."], ["comment", "(Zuruf von der Linken: Wenigstens vorlesen kann er!)"], ["text", "Darin geht es Ihnen aber offensichtlich um viel mehr als nur um Geldwäsche. Sie wollen nicht nur wissen, wem eine Immobilie gehört und wer wirtschaftlich Berechtigter ist. Sie wollen für Wohnungen unter anderem die Nettokaltmiete, die Zimmerzahl, den Leerstand, die Energieeffizienz, die Sozialbindung und sogar die Mietverträge und spätere Vertragsänderungen erfassen. Eigentümer sollen Änderungen innerhalb von vier Wochen melden. Und all diese Daten wollen Sie nicht nur verschiedenen staatlichen Institutionen, sondern auch NGOs, Journalisten usw. zugänglich machen. Hier geht es also nicht um Geldwäsche. Sie wollen das alles wissen, Sie und Ihre NGOs,"], ["comment", "(Lachen bei Abgeordneten der Linken)"], ["text", "um Vermieter weiter gängeln und bevormunden zu können."], ["comment", "(Beifall bei der AfD)"], ["text", "Es stimmt: Deutschland muss aufgrund der EU-Geldwäscherichtlinie bis Juli 2029 eine zentrale Zugangsstelle für Immobiliendaten schaffen. Dafür braucht es Eigentümerdaten und Kaufpreise. Ihr Antrag geht aber weit darüber hinaus. Wir lehnen ihn ab."], ["comment", "(Beifall bei der AfD)"], ["text", "Ihr zweiter Antrag, mit dem Sie den „Marktzugang von Immobilienunternehmen einschränken“ wollen, hat zum Ziel, ganz viele Vermieter zu zwingen, ihre Wohnimmobilie zu verkaufen oder zumindest die Vermietung einzustellen. Zur Begründung beklagen Sie die hohen Gewinne börsennotierter Immobilienunternehmen. Es ist tatsächlich nicht zu verstehen, dass diese Unternehmen beim Erwerb von Wohnimmobilien – anders als private Vermieter – meistens keine Grunderwerbsteuer zahlen. Am 21. April 2021 haben wir als AfD-Fraktion hier im Deutschen Bundestag für echte Immobilienunternehmen eine Besteuerung beim Erwerb von mehr als 50 Prozent der Anteile – der sogenannte Share Deal – beantragt. Diesen Antrag haben Sie damals abgelehnt."], ["text", "Nun fordern Sie mit der Begründung, ganze 5 Prozent der Wohnungen im deutschen Geschosswohnungsbau seien im Besitz börsennotierter Wohnungsbauunternehmen, unter anderem, dass jedem Vermieter, der nicht nachweisen kann, dass er genügend Geld für die Instandsetzung und Erneuerung seiner Mietwohnung zurückgelegt hat, die Genehmigung zur gewerblichen Vermietung entzogen wird. So steht es in Ihrem Antrag. Das betrifft aber direkt die meisten privaten Vermieter. Das betrifft direkt die rund 15 Millionen privat vermieteten Wohnungen in Deutschland."], ["comment", "(Zuruf von der Linken: Verleumdung!)"], ["text", "Sie fordern bei jeder Gelegenheit mehr Mietwohnungen und bringen aktuell einen Antrag ein, der die Anzahl der Mietwohnungen per Gesetz um bis zu 15 Millionen reduziert."], ["comment", "(Caren Lay [Die Linke]: Das steht da doch gar nicht drin!)"], ["text", "Wir fordern dagegen, die bereits jetzt völlig übertriebene Gängelung privater Vermieter umgehend zu beenden."], ["comment", "(Beifall bei der AfD)"], ["text", "Laut einer Vermieterbefragung von Haus & Grund von 2026 haben – auch ohne Ihre Gesetzesvorhaben – bereits 60 Prozent der privaten Vermieter, die befragt wurden, angegeben, dass sie es für wahrscheinlich halten, ihre Vermietungstätigkeit ganz oder teilweise einzustellen."], ["comment", "(Zuruf von der Linken)"], ["text", "60 Prozent der befragten privaten Vermieter wollen nicht mehr vermieten."], ["comment", "(Zuruf der Abg. Caren Lay [Die Linke])"], ["text", "Wir brauchen aber doch ganz dringend mehr private Vermieter und nicht weniger. Wir als AfD fordern daher bessere Bedingungen für Wohneigentum, Vermögensbildung und einen funktionierenden Immobilienmarkt. Wir lehnen die Anträge der Linken ab."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Der nächste Redner in dieser Debatte ist Philip Hoffmann für die Unionsfraktion."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219518600", "x": -7.382, "y": -0.846, "cluster": 2, "speaker": "Philip M. A. Hoffmann", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/8", "agenda": "Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen", "top": "Tagesordnungspunkt 6", "drucksachen": ["21/6566", "21/7039", "21/6020", "21/6732"], "chars": 4774, "comments": 4, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518900", "ID219518500", "ID219519000", "ID219518400", "ID219518700"], "next": "ID219518700", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Liebe Kolleginnen und Kollegen! Es ist richtig, dass wir bei der Bekämpfung von Geldwäsche besser werden müssen, insbesondere auch im Nichtfinanzsektor. Das ist allerdings die einzige Gemeinsamkeit, die wir bei diesem Antrag mit dem Antragsteller haben; denn wir brauchen beim Thema Geldwäschebekämpfung deutlich mehr Wirkung und deutlich weniger Bürokratie."], ["text", "Die 6. EU-Geldwäscherichtlinie verpflichtet auch Deutschland, bis zum 10. Juli 2029 eine Zugangsstelle für Immobiliendaten einzurichten. Ziel ist es, den zuständigen Behörden einen schnellen digitalen Zugriff auf die für Geldwäscheermittlungen erforderlichen Informationen zu ermöglichen. Die Richtlinie nennt dabei ausdrücklich Mindestanforderungen. Sie eröffnet den Mitgliedstaaten damit Spielräume für weiter gehende Regelungen. Für uns gilt dabei jedoch der klare Grundsatz: kein überflüssiges Gold-Plating europäischer Vorgaben. Und bei der Geldwäschebekämpfung gilt: weniger Bürokratie, mehr Wirksamkeit. Genau dieser Grundsatz wird im Antrag der Linken verlassen."], ["text", "Aus Sicht der Linken ist es ein Instrument, das nicht nur der Geldwäschebekämpfung, sondern vor allem als umfassendes wohnungs- und verwaltungspolitisches Register dienen soll. Die EU-Richtlinie verlangt insbesondere Angaben zur Immobilie, zum Eigentümer, zum Kaufpreis, zur Belastung und zur Eigentumshistorie und relevante Dokumente. Das ist eigentlich schon sehr viel. Der Antrag der Linken sieht darüber hinaus unter anderem Angaben zu Nettokaltmieten, Mietverträgen, Vertragsveränderungen, Leerstand, Anzahl der Zimmer, energetischer Sanierung, Energieeffizienzklassen, öffentlichen Förderungen und zahlreiche weitere wohnungspolitische Informationen vor. Die Antwort auf die Frage, welchen konkreten Beitrag diese zusätzlichen Informationen zur Bekämpfung von Geldwäsche leisten, lautet: keinen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Stattdessen vermischt der Antrag unterschiedliche politische Ziele. Unter dem Schlagwort „Geldwäschebekämpfung“ sollen die Mietpreisentwicklung überwacht, Leerstände erfasst, die Zweckentfremdung bekämpft, der Zensus unterstützt, der Steuervollzug erleichtert und eine zusätzliche Datengrundlage für die Wohnungspolitik der Linken geschaffen werden. Das mag wohnungspolitisch vielleicht diskutiert werden können, hat mit Geldwäschebekämpfung aber nichts zu tun. Die Linke nutzt die europäische Vorgabe als Grundlage, um ein wohnungspolitisches Universalregister zu erstellen. Ich sehe darin ein Einbrecherverzeichnis, in dem potenzielle Einbrecher im Voraus erkennen können, wo sich ein Einbruch lohnt."], ["text", "Auch beim Datenzugang geht der Antrag deutlich über die Vorgabe hinaus. Die Richtlinie sieht einen schnellen digitalen Zugang für die zuständigen Behörden sowie für die europäische Anti-Geldwäschebehörde AMLA vor. Der Antrag möchte darüber hinaus einen Zugang unter anderem für Journalisten, Wissenschaftler, Nichtregierungsorganisationen, Nachbarschaftsinitiativen und weitere Personen mit angeblich berechtigtem Interesse eröffnen."], ["text", "Auch die von der Linken vorgesehene Meldepflicht geht deutlich weiter. Die Richtlinie verlangt aktuelle und zutreffende Daten. Das ist auch richtig so. Laut Antrag sollen die Eigentümer hingegen dazu verpflichtet werden, Änderungen innerhalb von vier Wochen zu melden, umfangreiche zusätzliche Informationen zu übermitteln und historische Daten dauerhaft vorzuhalten. Wenn Sie also eine Trockenbauwand einziehen, müssen Sie das melden. Wenn Sie sie abbauen, müssen Sie auch das melden. Dadurch entstünde ein erheblicher zusätzlicher bürokratischer Aufwand. Eigentümer müssten laufend neue Daten melden. Die Behörden müssten diese Daten erfassen, pflegen und auch kontrollieren. Gleichzeitig bleibt offen, welchen zusätzlichen Nutzen dies für die Bekämpfung von Geldwäsche tatsächlich bringen könnte."], ["text", "Die Linke verwechselt Datensammlung mit Problemlösung. Unser Anspruch ist es nicht, möglichst viele Informationen zu erfassen, sondern Geldwäsche wirksam zu bekämpfen. Wer nur immer mehr Daten sammelt, bekämpft nicht automatisch Geldwäsche. Deshalb setzen wir auf einen risikobasierten Ansatz. Wir brauchen die richtigen Informationen dort, wo sie für konkrete Ermittlungen tatsächlich benötigt werden. Unser Ansatz lautet: Weniger Bürokratie, mehr Wirksamkeit."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Wir setzen hier auf risikobasierte Kontrollen, gezielte Ermittlungen, einen effizienten Datenaustausch zwischen den zuständigen Behörden und die konsequente Anwendung bestehender geldwäscherechtlicher Instrumente. Wir setzen europäisches Recht konsequent um. Wir werden es aber nicht zum Anlass nehmen, neue Meldepflichten, neue Register mit einem uneingeschränkten Zugang für jedermann und neue Bürokratie weit über das erforderliche Maß hinaus aufzubauen. Deshalb lehnen wir den Antrag ab."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Die nächste Rednerin in dieser Debatte ist Hanna Steinmüller für die Fraktion Bündnis 90/Die Grünen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219518700", "x": -6.873, "y": -1.094, "cluster": 2, "speaker": "Hanna Steinmüller", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/8", "agenda": "Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen", "top": "Tagesordnungspunkt 6", "drucksachen": ["21/6566", "21/7039", "21/6020", "21/6732"], "chars": 4493, "comments": 6, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518400", "ID219518900", "ID219518500", "ID219518800", "ID219517300"], "next": "ID219518800", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Liebe Kolleginnen und Kollegen! Liebe Bürgerinnen und Bürger! Zu dieser Uhrzeit kann man sich auch mal erlauben, zu träumen. Wie sähe ein Wohnungsmarkt aus, der wirklich gerecht ist, wo die Miete nicht die Hälfte des Einkommens frisst, wo man keine Angst vor der nächsten Heizkostenabrechnung haben muss, wo Vermieter gleichzeitig ausreichend verdienen, ohne abzuzocken, wo Gewinne von Immobilienkonzernen so besteuert werden wie alle anderen auch, wo sich die junge Familie den Traum vom Eigenheim einfach leisten kann?"], ["text", "Auch das muss man um diese Uhrzeit klar sagen: Die Realität ist eine ganz andere. Der Wohnungsmarkt ist voller Ungerechtigkeiten. Viele Menschen machen sich Sorgen, dass sie sich ihre Wohnung nicht mehr leisten können. Anonyme Investoren machen Gewinne, ohne Steuern zu zahlen. Deshalb müssen wir heute hinschauen: hinschauen, wo abgezockt wird, hinschauen, wo spekuliert wird, aber auch hinschauen, wo es richtig gemacht wird."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Hinschauen, wo abgezockt wird, bedeutet vor allen Dingen, sich die Situation von Mieterinnen und Mietern anzuschauen; denn sie sind die ersten, die unter den Ungerechtigkeiten des Wohnungsmarktes leiden. Schauen wir auf die Mietpreisbremse. Die Mietpreisbremse wurde eingeführt, um Mieterinnen und Mieter zu schützen. In der Realität hat sie so viele Schlupflöcher, dass sie maximal ein Fächerchen ist, um vor teuren Mieten zu schützen. Möblierung, teure Vormiete, Sanierungen: Es gibt lauter Ausnahmetatbestände, die sie zu einem Schweizer Käse machen. Zur Mietpreisbremse gehört auch, dass sie nicht schützen kann, wenn sie am Ende nicht genutzt wird, weil Mieterinnen und Mieter zu Recht Sorge haben, dass sie mit einer Eigenbedarfskündigung bestraft werden, wenn sie gegen ihre Vermieter vorgehen. Bei Eigenbedarf ist die Angst oft berechtigt, selten leider der Eigenbedarf. Und auch das ist ein Problem. Wir haben eine sehr einfache Lösung. Man könnte den Eigenbedarf auf enge Familienmitglieder beschränken und gleichzeitig Familien sowie ältere Menschen eindeutig schützen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Hinschauen, wo spekuliert wird, bedeutet auch, zu schauen, wem unsere Städte gehören und wer daran verdient. Wer eine Wohnung mieten möchte, muss alles offenlegen: das Gehalt, den Arbeitgeber, die Schufa-Auskunft. Wer auf der anderen Seite steht, muss oft nur Firmennamen und Briefkasten im Ausland angeben. Von daher ist Transparenz wichtig. Ich bin froh, dass die Koalition in diesem Bereich ein bisschen was macht. Die Linken haben da auch einen Punkt. Die Voraussetzung für gerechte Steuern und Kontrolle ist Transparenz. Gleichzeitig müssen wir auch den Datenschutz beachten und datenschutzrechtliche Aspekte klären."], ["text", "Deswegen habe ich Ihnen heute Abend ein paar Beispiele mitgebracht, die zeigen, wo spekuliert wird. Etwa bei der Spekulationsfrist. Aktiengewinne werden immer besteuert. Wenn man jedoch eine Immobilie kauft, kann man sie nach zehn Jahren steuerfrei weiterverkaufen. Das ist komplett willkürlich und ungerecht. Wenn wir diese Gerechtigkeitslücke schließen, können wir 6 Milliarden Euro jedes Jahr zusätzlich einnehmen, die wir für etwas anderes verwenden könnten."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Das Gleiche gilt für Share Deals. Wenn man als Familie in Berlin eine Wohnung oder ein Haus kauft, zahlt man schnell 30 000 Euro Grunderwerbsteuer. Wenn Konzerne das über eine Share-Deal-Konstruktion machen, zahlen sie nichts. Das ist krass ungerecht. Eine Änderung würde dem Staat jedes Jahr 1 Milliarde Euro an Steuereinnahmen bringen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Daher sagen wir: Wir wollen gleiche Regeln für alle. Gewinne sollen gleich besteuert werden. Und wer im eigenen Zuhause wohnt, wäre davon gar nicht betroffen; denn das ist sowieso schon steuerfrei. Das ist die gute Nachricht. Von daher, liebe Kolleginnen und Kollegen, sollten wir die 7 Milliarden Euro nicht liegen lassen."], ["text", "Schauen wir zum Schluss, was gut gemacht wird. Es gibt ganz viele Beispiele von Genossenschaften, kommunalen Wohnungsunternehmen und kleinen Vermietern, die faire Mieten verlangen und es gut machen. Aber gerade bei der neuen Wohngemeinnützigkeit müssen wir vorankommen. Wir wollen, dass sie auch steuerlich unterstützt wird und es Investitionszuschüsse gibt, wenn man faire Mieten anbietet. Nur so wird dieser faire Wohnungsmarkt wirklich Realität."], ["text", "7 Milliarden Euro liegen auf der Straße, und Sie ändern daran nichts. Wir wollen bezahlbare Mieten. Lassen Sie uns nicht länger die Augen vor diesen Ungerechtigkeiten verschließen, sondern hinschauen und handeln!"], ["text", "Vielen Dank."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Die nächste Rednerin in dieser Debatte ist für die Fraktion Die Linke Isabelle Vandre."], ["comment", "(Beifall bei der Linken)"]]}, {"id": "ID219518800", "x": -7.119, "y": -1.007, "cluster": 2, "speaker": "Isabelle Vandre", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/8", "agenda": "Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen", "top": "Tagesordnungspunkt 6", "drucksachen": ["21/6566", "21/7039", "21/6020", "21/6732"], "chars": 2764, "comments": 12, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518700", "ID219518900", "ID219518500", "ID219518400", "ID219519000"], "next": "ID219518900", "paragraphs": [["text", "Frau Präsidentin! Werte Kolleginnen und Kollegen! Wem gehören unsere Städte? Wem gehören die Häuser, in denen wir wohnen? Eigentlich ganz einfache Fragen. Aber tatsächlich können sie viel zu viele Menschen nicht beantworten. Der Grund: unerreichbare Briefkastenfirmen mit Sitz in Steuerparadiesen, intransparente Gesellschafterstrukturen und Personen, die erfolgreich ihre Identität und damit die Eigentumsverhältnisse verschleiern. Damit muss Schluss sein!"], ["comment", "(Beifall bei der Linken)"], ["text", "Nicht nur Mieter/-innen müssen wissen, wem das Haus gehört, in dem sie wohnen. Auch die Städte, die Bezirksämter, ja, auch die Nachbarschaften brauchen dieses Wissen, um gegen Zerfall oder gegen Wuchermieten vorzugehen. Kurz: Wir brauchen Transparenz über die Eigentumsverhältnisse als Voraussetzung für eine wirkungsvolle Wohnungspolitik."], ["comment", "(Beifall bei der Linken)"], ["text", "Und es gibt noch einen Grund, warum wir ein besseres Transparenzregister brauchen: Transparenz schützt vor Mietsteigerung durch Geldwäsche. mafianeindanke e. V. schätzt, dass 15 bis 30 Prozent aller kriminell generierten Vermögenswerte im deutschen Immobiliensektor landen."], ["comment", "(Dr. Bernd Baumann [AfD]: Eure Clans!)"], ["text", "Das macht jährlich 30 Milliarden Euro aus. Deswegen ist es Zeit für ein wirkungsvolles Immobilientransparenzregister."], ["comment", "(Beifall bei der Linken)"], ["text", "Doch Transparenz allein wird die Mieterinnen und Mieter, die unter Mieterhöhungen ächzen und kaum noch eine bezahlbare Wohnung finden, nicht entlasten. Was wir brauchen, ist eine Mietenpolitik, die die Bedürfnisse der Menschen in den Mittelpunkt stellt und den Wohnraum statt der Profite der Wohnungskonzerne sichert."], ["comment", "(Beifall des Abg. Luke Hoß [Die Linke])"], ["text", "Wir finden: Es muss all jenen ein Riegel vorgeschoben werden, die nicht die Versorgung der Menschen mit leistbarem Wohnraum zum Ziel haben, sondern versuchen, so viel Geld wie möglich aus hart erarbeitetem Einkommen der Mieter/-innen an sich selbst umzuverteilen."], ["text", "Meine Kollegin Caren Lay hat errechnet, dass Vonovia 2025 im Durchschnitt pro Wohnung und Monat 166 Euro an ihre Aktionäre ausgeschüttet hat – 166 Euro, die den Mieterinnen und Mietern im Alltag fehlten"], ["comment", "(Dr. Bernd Baumann [AfD]: Volkseigentum!)"], ["text", "und die auch nicht – um mal mit der Mär zu brechen – für Instandsetzungen oder gar neue Wohnungen genutzt wurden."], ["text", "Das ist doch der eigentliche Skandal! Wo bleibt da Ihr Aufschrei?"], ["comment", "(Beifall bei der Linken sowie der Abg. Mayra Vriesema [BÜNDNIS 90/DIE GRÜNEN])"], ["text", "Wie können Sie mehr Angst vor der Umsetzung eines Volksentscheids haben als davor, dafür zu sorgen, dass solche skandalösen Geschäftspraktiken endlich beendet werden?"], ["comment", "(Beifall bei der Linken)"], ["text", "Konzerne, Fonds, Aktienunternehmen, die sich nur bereichern wollen, haben nichts auf dem Wohnungsmarkt verloren, und Private-Equity-Firmen müssen endlich stärker reguliert werden."], ["comment", "(Diana Zimmer [AfD]: Nein, müssen sie nicht!)"], ["text", "Mit unseren beiden Anträgen vermiesen wir den Miethaien und der Organisierten Kriminalität das Geschäft, damit Menschen sich ihre Miete wieder leisten können."], ["comment", "(Zuruf des Abg. Dr. Bernd Baumann [AfD])"], ["text", "Stimmen Sie mit uns gegen kriminelles Kapital sowie Miethaie und für unsere beiden Anträge!"], ["comment", "(Beifall bei der Linken)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Der nächste Redner in dieser Debatte ist Dr. Florian Dorn für die Unionsfraktion."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219518900", "x": -7.49, "y": -0.775, "cluster": 2, "speaker": "Dr. Florian Dorn", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/8", "agenda": "Immobilientransparenzregister einrichten – Geldwäsche bekämpfen, Transparenz über Eigentumsverhältnisse am Wohnungsmarkt herstellen", "top": "Tagesordnungspunkt 6", "drucksachen": ["21/6566", "21/7039", "21/6020", "21/6732"], "chars": 5260, "comments": 10, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518400", "ID219519000", "ID219518500", "ID219518700", "ID219518600"], "next": "ID219519000", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Sehr geehrte Kolleginnen und Kollegen! Ja, zur Bekämpfung von Geldwäsche müssen unsere Behörden wissen können, wem eine Immobilie tatsächlich gehört, wer wirtschaftlich hinter einer Gesellschaft steht und wohin verdächtige Geldströme fließen. Genau daran arbeitet ja auch unsere Koalition."], ["text", "Mit einem Aktionsplan gegen Organisierte Kriminalität stärken wir Zoll und BKA, verbessern den Informationsaustausch, bauen die automatisierte Datenanalyse aus und schaffen Strukturen für Geldwäsche- und Finanzermittlungen. Mit dem Zollfinanzgerechtigkeitsgesetz hat das Kabinett auch weitere Analyse- und Ermittlungsbefugnisse auf den Weg gebracht."], ["text", "Selbstverständlich werden wir auch das europäische Recht umsetzen. Bis Sommer 2029 wird Deutschland eine zentrale Zugangsstelle für Immobiliendaten schaffen. Behörden sollen dort digital auf Eigentümer, Kaufpreise und Transaktionshistorien zugreifen können. So können verdächtige Eigentumsstrukturen und Geldflüsse schneller nachvollzogen werden. Das ist, meine Damen und Herren, zielgerichtete Geldwäschebekämpfung."], ["text", "Europäisches Recht setzen wir um; aber wir brauchen keine neuen Parallelstrukturen und zusätzliche Bürokratie. Die Aufgabe muss doch sein, bestehende Daten und Register intelligenter miteinander zu verknüpfen. Digitalisierung, meine Damen und Herren, muss bedeuten: Der Staat organisiert seine vorhandenen Dat  Unternehmen vom Markt ausschließen, die ja gerade bereits heute zusätzlichen gesetzlichen Veröffentlichungs- und Beteiligungstransparenzpflichten unterliegen."], ["text", "Meine Damen und Herren, das Verrückteste ist ja: Sie schaffen damit keine einzige zusätzliche Wohnung. Im Gegenteil: Es schreckt doch jeden Investor ab, neues Wohnangebot zu schaffen. Es schreckt jeden ab, in privates Eigentum zu investieren. Wem ist damit geholfen?"], ["comment", "(Isabelle Vandre [Die Linke]: Den Mieterinnen!)"], ["text", "Niemandem, und vor allem nicht den Mieterinnen und Mietern – vor allem nicht denen! Denn was bringt ihnen eine weitere Regulierung, wenn am Ende weniger neue Wohnungen entstehen?"], ["comment", "(Beifall bei der CDU/CSU)"], ["text", "Gerade große Kapitalgesellschaften sind es doch, die über den Kapitalmarkt erhebliche Mittel auch für Neubau und Sanierung großer Wohnkomplexe mobilisieren können."], ["comment", "(Isabelle Vandre [Die Linke]: Das ist doch Quatsch! Das stimmt doch überhaupt nicht!)"], ["text", "Meine Damen und Herren, Bauen und mehr Angebot schafft mehr Wohnraum und bezahlbares Mieten. Die Linke erreicht mit ihrer Politik genau das Gegenteil. Am Ende trifft das die Menschen, die heute schon verzweifelt nach einer bezahlbaren Wohnung suchen: eine Familie, die eine größere Wohnung braucht, junge Menschen, die in die Stadt kommen, vielleicht zum Studium, und alle, die in unseren Ballungsräumen noch etwas Bezahlbares finden wollen."], ["comment", "(Caren Lay [Die Linke]: Ja, deren Probleme Sie nicht lösen! – Mayra Vriesema [BÜNDNIS 90/DIE GRÜNEN]: Da gibt’s aber nix!)"], ["text", "Die Linke plant Genehmigungsentzug und Veräußerungspflichten. Das heißt übersetzt auch Enteignungen. In seiner Begründung verweist der Antrag nämlich ausdrücklich auf die Vergesellschaftung großer Wohnungsbestände."], ["text", "Das Beispiel Berlin zeigt ja den ganzen Wahnsinn. Sie wollen lieber Milliarden an Steuergeldern oder vielleicht Gelder aus dem Länderfinanzausgleich function syncControls() {

// empty group = no filter; OR within a group, AND across groups; every active search term has to match
// days and agenda items form one group in the sidebar, so a ticked day and a ticked item of another day are OR-ed too
const dayOrItem = s => !(state.checked.weekday.size || state.checked.agenda.size) || state.checked.weekday.has(s.weekday) || state.checked.agenda.has(s.agenda_id);

  && state.terms.every(t => !t.on || s.haystack.includes(t.term.toLowerCase()))
  && (state.befragung || state.checked.speaker.size || state.checked.agenda.size || !s.befragung);  // an explicit speaker/TOP filter overrides the Befragung hide

// --- drawing --------------------------------------------------------------------------
const keyOf = { cluster: s => s.cluster, fraction: s => s.fraction, weekday: s => s.weekday, agenda: s => s.agenda_id, mdb: s => s.role ? 'Regierung' : 'Abgeordnete' };
const colorOf = { cluster: GROUPS.cluster.color, fraction: GROUPS.fraction.color, weekday: GROUPS.weekday.color, agenda: GROUPS.agenda.color, mdb: k => ROLE_COLORS[+(k !== 'Abgeordnete')] };
const nameOf = { cluster: clusterLabel, fraction: k => k, weekday: k => k, agenda: k => GROUPS.agenda.name(k).slice(0, 40), mdb: k => k };
const order = { cluster: GROUPS.cluster.order, fraction: GROUPS.fraction.order, weekday: GROUPS.weekday.order, agenda: GROUPS.agenda.order, mdb: (a, b) => a < b ? -1 : 1 };
const FONT = 'Inter, system-ui, sans-serif';
let lastShown = S, mapRange = null;  // mapRange: the zoomed view, passed to every redraw; a programmatic (touch) relayout is not kept by uirevision

function draw() {
  syncControls(); encodeState();
  const mode = state.mode, sizeBy = state.size;
  const shown = S.filter(matches), shownIds = new Set(shown.map(s => s.id));
  lastShown = shown;
  document.getElementById('count').textContent = `${shown.length} von ${S.length}`;
  for (const k in GROUPS) {
    const counts = Map.groupBy(shown, GROUPS[k].of);
    items(k).forEach(el => { const n = (counts.get(listOrder[k][+el.dataset.i]) || []).length; el.querySelector('.n').textContent = n; el.classList.toggle('zero', !n); });
  }
  document.querySelectorAll('#searchList .item').forEach((el, i) => el.querySelector('.n').textContent = S.filter(s => s.haystack.includes(state.terms[i].term.toLowerCase())).length);
  const size = s => sizeBy ? 5 + 11 * Math.sqrt(s.chars / 8000) : 8;
  const drawn = state.dim ? S : shown;
  const groups = Map.groupBy(drawn, keyOf[mode]);
  const traces = [...groups.keys()].sort(order[mode]).map(k => {
    const g = groups.get(k);
    return {
      type: 'scattergl', mode: 'markers', name: nameOf[mode](k),
      x: g.map(s => s.x), y: g.map(s => s.y), customdata: g.map(s => s.id), hoverinfo: 'none',
      marker: { color: mode === 'weekday' ? g.map(s => s.dayColor) : colorOf[mode](k), size: g.map(size), opacity: g.map(s => shownIds.has(s.id) ? .9 : .1), line: { width: 1, color: '#ffffff' } },
    };
  });
  const live = state.live.length > 1 ? drawn.filter(s => s.haystack.includes(state.live)) : [];
  if (live.length) traces.push({ type: 'scattergl', mode: 'markers', name: `Treffer „${state.live}“ (${live.length})`, hoverinfo: 'skip',
    x: live.map(s => s.x), y: live.map(s => s.y), customdata: live.map(s => s.id), marker: { color: 'rgba(0,0,0,0)', size: live.map(s => size(s) + 6), line: { width: 2, color: '#1f2328' } } });
  const open = byId[state.open];
  if (open) traces.push({ type: 'scattergl', mode: 'markers', name: 'geöffnet', showlegend: false, hoverinfo: 'skip',
    x: [open.x], y: [open.y], customdata: [open.id], marker: { color: 'rgba(0,0,0,0)', size: size(open) + 10, line: { width: 2, color: '#1f2328' } } });
  const peek = byId[state.peek];
  if (peek) traces.push({ type: 'scattergl', mode: 'markers', name: 'Vorschau', showlegend: false, hoverinfo: 'skip',
    x: [peek.x], y: [peek.y], customdata: [peek.id], marker: { color: 'rgba(0,0,0,0)', size: size(peek) + 12, line: { width: 3, color: css('--accent') } } });
  labelAnchors = DATA.clusters.map(c => {
    const g = shown.filter(s => s.cluster === c.id);
    return g.length < 3 ? null : { id: c.id, n: g.length, x: median(g.map(s => s.x)), y: median(g.map(s => s.y)) };
  }).filter(Boolean);
  Plotly.react('map', traces, {
    paper_bgcolor: css('--bg'), plot_bgcolor: css('--bg'), font: { color: css('--muted'), family: FONT, size: 12 },
    margin: { l: 16, r: 16, t: 16, b: 16 }, hovermode: 'closest',

    showlegend: mode === 'fraction' || mode === 'mdb', legend: { orientation: 'h', y: 0, x: 0.5, xanchor: 'center', yanchor: 'bottom', bgcolor: 'rgba(255,255,255,.7)' },
    uirevision: view,
  }, { responsive: true, scrollZoom: true, displayModeBar: false, doubleClick: 'reset' }).then(placeLabels);
  document.getElementById('dayScale').style.display = mode === 'weekday' ? 'flex' : 'none';
  tourCheck();
}

// --- topic labels: HTML pills over the plot, re-placed on every zoom/pan -------------------
const map = document.getElementById('map');
const SPAN = Math.max(...S.map(s => s.x)) - Math.min(...S.map(s => s.x));
let labelAnchors = [];
const labelLayer = document.getElementById('labels');
function placeLabels() {
  const fl = map._fullLayout;
  if (!fl || !state.showLabels) { labelLayer.innerHTML = ''; return; }
  const xa = fl.xaxis, ya = fl.yaxis, W = map.clientWidth, H = map.clientHeight;
  const zoom = SPAN / (xa.range[1] - xa.range[0]);  // 1 ≈ the whole week in view
  const terms = zoom > 2 ? 4 : 3, zoomed = zoom > 1.6;
  const px = a => ({ x: xa.l2p(a.x) + fl._size.l, y: ya.l2p(a.y) + fl._size.t });
  const items = labelAnchors.map(a => ({ ...a, ...px(a) })).filter(a => a.x > 0 && a.x < W && a.y > 0 && a.y < H).sort((a, b) => b.n - a.n);
  const colour = id => state.mode === 'cluster' ? GROUPS.cluster.color(id) : '#b4b4b0';  // labels carry the topic colour only when points do
  labelLayer.innerHTML = items.map(a => `<div class="lbl${zoomed ? ' zoomed' : ''}" data-c="${a.id}" style="left:${a.x}px;top:${a.y}px;color:${colour(a.id)}">${dot(colour(a.id))}<span style="color:#374151">${esc(clusterLabel(a.id, terms))}</span><span class="n">${a.n}</span></div>`).join('');
  // greedy overlap resolution: bigger clusters first; a colliding label slides up or down, else hides
  const placed = [];
  labelLayer.querySelectorAll('.lbl').forEach((el, i) => {
    const w = el.offsetWidth + 6, h = el.offsetHeight + 4, x = Math.min(Math.max(items[i].x, w / 2 + 4), W - w / 2 - 4);
    el.style.left = x + 'px';
    let y = items[i].y, ok = false;
    for (const dy of [0, -1, 1, -2, 2, -3, 3]) {
      const yy = items[i].y + dy * h;
      if (yy > h / 2 && yy < H - h / 2 && !placed.some(r => Math.abs(r.x - x) < (r.w + w) / 2 && Math.abs(r.y - yy) < (r.h + h) / 2)) { y = yy; ok = true; break; }
    }
    if (!ok) { el.remove(); return; }
    el.style.top = y + 'px'; placed.push({ x, y, w, h });
    el.onclick = () => showCluster(+el.dataset.c);
  });
}

  const near = list => {
    let best = null, bd = 26 ** 2;
    for (const s of list) { const d = (fl.xaxis.l2p(s.x) - px) ** 2 + (fl.yaxis.l2p(s.y) - py) ** 2; if (d < bd) { bd = d; best = s; } }
    return best;
  };
  return near(lastShown) || (state.dim ? near(S) : null);
}
function tapAt({ x, y, target }) {
  const lbl = target.closest?.('.lbl');
  if (lbl) return showCluster(+lbl.dataset.c);
  const s = speechAt(x, y);
  if (s) {  // first tap previews, a second tap opens, a tap on the open speech closes it
    gest.lastTap = null;
    if (s.id === state.open) return closeSpeech();
    if (s.id === state.peek) { showSpeech(s); return draw(); }
    state.peek = s.id; flags.hovered = true; renderPeek(); return draw();
  }
  const last = gest.lastTap;
  gest.lastTap = { x, y, t: Date.now() };
  if (last && gest.lastTap.t - last.t < 350 && Math.hypot(x - last.x, y - last.y) < 30) { gest.lastTap = null; return resetZoom(); }
  if (state.peek) { state.peek = ''; renderPeek(); draw(); }
}
function reveal(s) {  // pan (not zoom) so the opened speech is on screen
  const fl = map._fullLayout;
  if (!fl) return;
  const px = fl.xaxis.l2p(s.x), py = fl.yaxis.l2p(s.y), m = 24;
  if (px > m && px < fl._size.w - m && py > m && py < fl._size.h - m) return;
  const r = ranges(), dx = s.x - (r.x[0] + r.x[1]) / 2, dy = s.y - (r.y[0] + r.y[1]) / 2;
  applyRange({ x: r.x.map(v => v + dx), y: r.y.map(v => v + dy) });
}
const own = e => { e.stopPropagation(); if (e.cancelable) e.preventDefault(); };
map.addEventListener('touchstart', e => {
  own(e);
  weekCal.classList.remove('open'); tourMenu.classList.remove('open');  // no click follows a prevented touch
  if (!map._fullLayout) return;
  gestureStart(e.touches);
  gest.tap = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), target: e.target } : null;
}, { capture: true, passive: false });
map.addEventListener('touchmove', e => {
  own(e);
  if (!gest.start) return;
  if (gest.tap && Math.hypot(e.touches[0].clientX - gest.tap.x, e.touches[0].clientY - gest.tap.y) < 10) return;
  gest.tap = null;
  gestureMove(e.touches);
}, { capture: true, passive: false });
const touchEnd = e => {
  own(e);
  if (e.touches.length) return gestureStart(e.touches);  // a finger lifted: go on with the rest from here
  gest.start = null;
  if (gest.tap && e.type === 'touchend' && Date.now() - gest.tap.t < 500) tapAt(gest.tap);
  gest.tap = null;
};
map.addEventListener('touchend', touchEnd, { capture: true, passive: false });
map.addEventListener('touchcancel', touchEnd, { capture: true, passive: false });

const onLayoutChange = () => {
  mobile = mq.matches;
  if (panelKind === 'hint') showHint();
  layoutSheet();
};
mq.addEventListener('change', onLayoutChange);
side.addEventListener('change', () => layoutSheet());
addEventListener('resize', () => layoutSheet());
layoutSheet();

if (byId[state.open]) showSpeech(byId[state.open]); else showHint();
draw();
if (TOURS[startTourId]) startTour(startTourId);
map.on('plotly_relayouting', placeLabels);
map.on('plotly_relayout', e => {
  if (e['xaxis.autorange']) mapRange = null; else if ('xaxis.range[0]' in e || 'xaxis.range' in e) mapRange = ranges();  // uirevision alone let a zoom drift on redraw
  placeLabels();
});
map.on('plotly_afterplot', placeLabels);
window.addEventListener('resize', () => setTimeout(placeLabels, 50));
const tip = document.getElementById('tip');
function tipHtml(s, go = '') {
  return `<div class="who">${dot(GROUPS.fraction.color(s.fraction))}${esc(s.speaker)} <span>${esc(s.fraction)}</span>${go}</div>
    <div class="when">${s.weekday} ${fmt(s.date)} · ${esc(s.top)}${s.role ? ' · ' + esc(s.role) : ''}</div>
    <div class="top">${esc(s.agenda.slice(0, 120))}</div>
    <div class="topic">${esc(clusterLabel(s.cluster))}</div>
    <div class="excerpt">${esc(s.text.slice(0, 400))}</div>`;
}
map.on('plotly_hover', e => {
  const s = byId[e.points[0].customdata], ev = e.event, r = map.getBoundingClientRect();
  if (!s || !ev) return;
  tip.innerHTML = tipHtml(s);
  tip.style.display = 'block';
  flags.hovered = true; tourCheck();
  const x = Math.min(Math.max(ev.clientX - r.left, 160), r.width - 160), cy = ev.clientY - r.top;
  const below = cy - 16 < tip.offsetHeight + 8;
  tip.classList.toggle('below', below);
  tip.style.left = x + 'px'; tip.style.top = (below ? cy + 16 : cy - 16) + 'px';
});
map.on('plotly_unhover', () => tip.style.display = 'none');
map.addEventListener('mouseleave', () => tip.style.display = 'none');
map.on('plotly_click', e => {
  const id = e.points[0].customdata;
  if (id === state.open) return closeSpeech();  // second click on the open speech closes it
  showSpeech(byId[id]); draw();
});
</script>
</body>
</html>
