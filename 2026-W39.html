uldkult-These, eine Täter-Opfer-Umkehr und eine Relativierung und Verharmlosung der Shoah. Und egal, ob man religiös, nicht religiös, rechts oder links politisch ist: Dies ist zu verurteilen und nicht als Wahlkampfslogan zu benutzen, um Wählerinnen und Wähler zu mobilisieren. Das ist unerträglich, das ist erbärmlich."], ["comment", "(Beifall bei der SPD, der CDU/CSU und dem BÜNDNIS 90/DIE GRÜNEN)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter, würden Sie eine Zwischenfrage aus der AfD-Fraktion zulassen?"], ["text", "Bitte. Gerne."], ["comment", "(Mirze Edis [Die Linke]: Helge, ich zähl auf dich!)"], ["zwischenfrage", "ID219515500-2"], ["text", "Mir ist bekannt, dass Sie offensichtlich nicht zuhören. Zum einen finden sich selbstverständlich in den Kommentaren, in den Zuschriften Ihrer Wählerschaft – und ich bekomme ja sehr, sehr viele Zuschriften und Hasskommentare von Fans der AfD – verschwörungsideologische Stereotype, die auch antisemitisch sind. Zum anderen habe ich eben gar nicht gesagt, dass Sie antisemitisch sind,"], ["comment", "(Zuruf von der AfD: Doch!)"], ["text", "sondern dass Sie Relativierung und Verharmlosung des Nationalsozialismus betreiben – Stichwort „Vogelschiss“, Stichwort „Schuldkult“. Sie sollten genau zuhören."], ["comment", "(Zuruf der Abg. Beatrix von Storch [AfD])"], ["text", "Auch wenn man sich Ihre Fraktion anguckt, sieht man: Es wird eine Traditionslinie der deutschen Geschichte gezeichnet, bei der gerade diese Vernichtungsgeschichte und die Verbrechen fehlen. Und darum geht es: Wenn man selbst verharmlosend, relativierend, ausblendend und noch mit nationalistisch-völkischem Gestus mit dem Nationalsozialismus umgeht, sollte man sehr, sehr vorsichtig sein, anderen Nähe zu Shoah und Antisemitismus vorzuwerfen."], ["comment", "(Beifall bei der SPD und dem BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Darum geht es. Das ist der Punkt. Sie sind nicht in der Position, hier Ankläger zu sein."], ["comment", "(Nicole Höchst [AfD]: Wer entscheidet das?)"], ["text", "Und wenn Sie anderen vorwerfen, zu instrumentalisieren, sollten Sie es nicht selbst tun."], ["comment", "(Beifall bei Abgeordneten der SPD)"], ["text", "Also, etwas mehr Demut, genauer zuhören und Reflexion über den eigenen Umgang mit der Geschichte!"], ["text", "Denn wenn Sie es ernst meinen, Frau von Storch – ich nehme Ihnen das ja ab; Sie haben an vielen Stellen deutlich gesagt, dass Sie sich gegen Antisemitismus einsetzen, was richtig ist –, dann müssten Sie die Erste sein, die jetzt sagt: Ab diesem Moment hört die Relativierung der NS-Geschichte in der AfD auf."], ["comment", "(Otto Strauß [AfD]: Das stimmt doch überhaupt nicht! Was soll das?)"], ["text", "Ich nehme Sie beim Wort: Ab morgen werden Sie gegen das Völkische und Nationalistische in Ihrer Partei kämpfen. Davon gehe ich aus. Sonst ist das unredlich, was Sie getan haben."], ["comment", "(Beifall bei der SPD und dem BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der CDU/CSU)"], ["text", "Wir haben es damit zu tun, dass Antizionismus in vielerlei Zusammenhängen geradezu zu einer Mode geworden ist oder Zionismus zur Beschimpfung und zum Kampfbegriff. Das erschüttert mich; denn es blendet aus, was der Ursprung des Zionismus ist: Verfolgung, Vertreibung, Unterdrückung von Jüdinnen und Juden in Deutschland. Da reicht es nicht, von Einzelfällen zu sprechen, sondern wir müssen von strukturellen Problemen sprechen. Deshalb ist es inakzeptabel, zu erleben – auch hier im Berliner Wahlkampf –, wie Stimmung gemacht wird, wie Wählermobilisierung – „Wahl-Intifada“, hieß es – betrieben wird mit Slogans, die eindeutig den Kampf gegen Zionismus enthalten. Das ist der Türöffner für Antisemitismus – in diesem Land. In diesem Land, das Millionen von Jüdinnen und Juden – darum geht es doch – ermordet hat durch Ordnungspolizisten, durch die SS, durch ganz normale Männer."], ["text", "Wie können wir in dem Moment dann auch noch das Beispiel von Merz bringen! Das war eine absolut falsche Formulierung."], ["comment", "(Beifall bei Abgeordneten der SPD und des BÜNDNISSES 90/DIE GRÜNEN)"], ["text", "Aber man kann doch nicht ernsthaft behaupten, die CDU hätte dasselbe strukturelle Antisemitismusproblem wie leider Die Linke und insbesondere die Berliner Linke. Das kann doch nicht ernsthaft wahr sein."], ["comment", "(Beifall bei der SPD und der CDU/CSU)"], ["text", "Wir kennen Beispiele wie die LAG Palästinasolidarität. Und wir kennen vor allem aufrechte, tapfer und stabil jahrzehntelang gegen Rassismus, Antisemitismus, Faschismus, Rechtsextremismus kämpfende Linke: Martina Renner, Petra Pau, Katharina König-Preuss, die sich äußern – Zitat Frau Pau: „Ich habe die Faxen dicke.“; Zitat König-Preuss: Die Linke hat ein massives Antisemitismusproblem. – Sie hat auch noch darauf hingewiesen, dass es doch merkwürdig ist, wenn eine Partei nach vielen Diskussionen erst mal beschließen muss, dass sie das Existenzrecht Israels anerkennt – etwas, was selbstverständlich sein muss. Das muss man doch nicht extra mühsam diskutieren und beschließen. Darüber sprechen wir hier."], ["text", "Wir sprechen nicht nur über die Vorfälle, sondern über eine Situation, in der Ihr Bundesgeschäftsführer sagt: Wir sind eine antifaschistische Partei. Deshalb gehört für uns Antisemitismus zur DNA. – Das ist aber gerade nicht der Fall. Das ist doch kein Automatismus. Aber das ist die Position. Sagen Sie das mal Jüdinnen und Juden. Sie erleben Antizionismus und Antisemitismus, und jetzt sagt man ihnen: „Nein, das ist aber kein Antisemitismus. Wie kannst du das behaupten?“ Es wird geleugnet, und dann auch noch mit dem Gestus der moralischen Überlegenheit. Das ist der Kern der ganzen Debatte. Es geht nicht nur um die vielen, vielen Vorurteile. Es geht auch um den strukturell nicht hinzunehmenden, verharmlosenden Umgang mit diesen Vorgängen."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter."], ["text", "Es darf nicht sein, dass wir um Wählerstimmen kämpfen, ob nun von rechts und links, unter der Preisgabe unserer freiheitlich-demokratischen Grundordnung."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter."], ["text", "Wenn es ein Tabu geben muss, bedeutet das nicht einfach nur Faschismus meiden und Krieg meiden, sondern: Nie wieder Antisemitismus! Nie wieder Antizionismus in diesem Land!"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter."], ["text", "Das sind wir den Jüdinnen und Juden schuldig."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der SPD und der CDU/CSU sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Wir hören für Bündnis 90/Die Grünen Andreas Audretsch."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219515600", "x": -8.221, "y": 1.288, "cluster": 4, "speaker": "Andreas Audretsch", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 7421, "comments": 20, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515200", "ID219515100", "ID219515300", "ID219515500", "ID219515700"], "next": "ID219515700", "paragraphs": [["text", "Herr Präsident! Sehr geehrte Damen und Herren! Die AfD hat heute eine Aktuelle Stunde zu Antisemitismus, Extremismus und Clans aufgesetzt. Ich kann nur sagen: Gut, dass wir darüber reden. Und Sie wissen genau, wir werden über Sie reden müssen. Ich werde das tun. Ich verspreche Ihnen, ich komme darauf zurück. Verlassen Sie sich darauf."], ["comment", "(Dr. Bernd Baumann [AfD]: Wieso über uns?)"], ["text", "Einsteigen will ich aber einmal mit Blick auf Die Linke und vor allem mit Blick auf das, was bei uns in meinem Wahlkreis Neukölln passiert. Issa Rammo ist ein zentraler Kopf der Organisierten Kriminalität. Der taucht nicht aus Versehen auf Veranstaltungen auf. Den grüßt man nicht einfach. Dem schickt man nicht einfach Grüße mit Respekt an ihn in Nachrichten an seinen Sohn."], ["text", "Bei uns in Neukölln leiden Menschen jeden einzelnen Tag unter Organisierter Kriminalität. Läden, Restaurants werden in Neukölln mit Schutzgelderpressung überzogen. Menschen werden bedroht. Familien haben Angst um ihre Kinder, wenn sie in die Schule gehen. Das ist die Realität von Organisierter Kriminalität in Neukölln und nicht nur in Neukölln. Wenn man von dort aus auf die Frage schaut, wie man mit einer solchen Situation umgeht, dann kann es keine Lösung sein, freundliche Grüße auszurichten. Dann muss es eine klare Haltung geben: Organisierte Kriminalität grüßt man nicht, Organisierte Kriminalität bekämpft man!"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN, bei der CDU/CSU und der SPD)"], ["text", "Und auch Leute aus dem Umfeld der Terrororganisation PLFP sind nicht aus Versehen auf einer Feier. Ganz im Gegenteil. Das ist eine systematische Zusammenarbeit. Und genau das passiert, wie man jetzt an den verschickten E-Mails sieht. Die dokumentieren, dass es eben kein Zufall ist."], ["text", "Jüdische Menschen in Neukölln haben Angst. Rabbiner, die dort gearbeitet haben und noch vor wenigen Jahren Neukölln verteidigt haben, sagen mittlerweile: Es geht nicht mehr. In Neukölln ist es auch Realität, dass Imame und Menschen aus der palästinensischen Community mir sagen, sie hätten Angst vor der Bedrohung durch Extremisten, die es in Neukölln gibt. Wenn wir das ernst nehmen, dann muss ich auch die Worte von Heidi Reichinnek von gestern ernst nehmen: „Wir sehen, was passiert, wir arbeiten es […] auf.“ Das waren die Worte von Heidi Reichinnek gestern. Deswegen ist ganz klar: Es muss Konsequenzen geben. Das Ganze darf nicht ohne Konsequenzen beendet werden."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Die AfD beklagt Antisemitismus und Extremismus in Berlin. Ich würde vorschlagen, wir fangen einfach einmal bei Ihnen an. Am 15. September hat die Polizei in Berlin-Lichterfelde die Wohnung eines Mitarbeiters der AfD-Chefin Kristin Brinker durchsucht und dort Nazidevotionalien gefunden. Sie haben die Extremisten in Ihren Reihen, die Berlin gefährden."], ["text", "In Frankfurt am Main läuft gerade einer der größten Terrorprozesse Deutschlands. Hauptangeklagte ist Ihre Ex-Kollegin hier im Deutschen Bundestag, Birgit Malsack-Winkemann, weil sie mit einer Reichsbürgergruppe versucht hat, einen gewaltsamen Umsturz zu organisieren."], ["comment", "(Beatrix von Storch [AfD]: Seit vier Jahren! Nichts! Vier Jahre im Knast ohne Urteil! – Dr. Bernd Baumann [AfD]: Quatsch!)"], ["text", "In Sachsen-Anhalt, wo ein AfD-Ministerpräsident droht, wurden im August mehrere Objekte durchsucht. Der Vorwurf ist, dass zwei Ihrer Landtagsabgeordneten die völkisch-rassistische Neonazivereinigung Artgemeinschaft fortführen. Und natürlich wurden bei den Durchsuchungen Waffen gefunden."], ["text", "Bereits 2018 hat der Landesvorsitzende und vielleicht künftige Minister, Herr Tillschneider, von einem „Antisemitismushype“ gesprochen, den es nur gebe, um Ihnen mit der „Nazikeule“ zu schaden. Und die Relativierung des Holocaust ist in jedem einzelnen Dokument zu finden, das man von Ihnen lesen kann: von Herrn Björn Höcke, von Herrn Gauland und anderen. Wenn es um Terror geht, wenn es um Gewalt geht, wenn es um Antisemitismus geht, muss man bei Ihnen anfangen."], ["comment", "(Lachen des Abg. Dr. Bernd Baumann [AfD])"], ["text", "Sie sind diejenigen, die das Grundgesetz mit Füßen treten"], ["comment", "(Beatrix von Storch [AfD]: Der Verfassungsschutz sieht das deutlich anders!)"], ["text", "und die freie Gesellschaft hier in Deutschland in Gefahr bringen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter, würden Sie eine Zwischenfrage aus der CDU/CSU-Fraktion gestatten?"], ["text", "Ja, gerne."], ["zwischenfrage", "ID219515600-2"], ["text", "Ich kann Ihnen versprechen, dass ich noch dazu komme. – Ich will mit Blick auf Neukölln sagen: Das, was ich hier mitkriege, wird Neukölln nicht gerecht, in keiner Weise."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Das Allererste, was in Neukölln passieren muss, ist, dass die Kooperation mit der Organisierten Kriminalität beendet wird. Was in Neukölln passieren muss, ist, dass die Kooperation mit Extremisten, die den Menschen in Neukölln Angst machen, beendet werden muss. Und das richtet sich auch an die Linkspartei. Wenn man sich anschaut, was in den letzten Jahren passiert ist, und man mit Imamen spricht – und mir ist es wichtig, genau diese Perspektive hier einzubringen –, dann sagen sie mir: Wenn sie in ihrer Moschee predigen, haben sie Angst davor, wer durch die Tür kommen könnte."], ["text", "Es ist eine reale Gefahr."], ["comment", "(Alexander Throm [CDU/CSU]: Konsequenzen! Konsequenzen! Konsequenzen! – Zuruf des Abg. Mirze Edis [Die Linke])"], ["text", "Wenn man in Neukölln Politik macht, ist es wichtig, diese reale Gefahr im Blick zu haben. Deswegen muss das beendet werden."], ["comment", "(Alexander Throm [CDU/CSU]: Was heißt das für die Grünen?)"], ["text", "Jetzt sage ich Ihnen noch etwas. Wenn Sie mit Menschen in Neukölln in der Art und Weise sprechen, wie Sie es hier getan haben, dann werden Sie nichts in der Frage ändern, ob Menschen in Zukunft ein Bewusstsein dafür haben werden, dass Antisemitismus ein substanzielles Problem ist."], ["comment", "(Josef Oster [CDU/CSU]: Was machen die Grünen?)"], ["text", "– Lassen Sie mich den Punkt machen. – Wenn Kinder in Neukölln zum Beispiel in die Schule oder in Jugendeinrichtungen kommen und auf ihren Handys die Situation im Gazastreifen sehen, mit den Gräueltaten, die dort auch von einer rechtsextremen israelischen Regierung verübt werden, dann haben diese Kinder einen Anspruch darauf, dass man sich ernsthaft mit diesen Fragen auseinandersetzt, mit ihnen ernsthaft darüber ins Gespräch geht und am Ende versucht, mit ihnen aufzuarbeiten, was da passiert. Wenn man das ignoriert, dann werden Sie das Problem nie lösen."], ["comment", "(Alexander Throm [CDU/CSU]: Konsequenzen! Konsequenzen! Konsequenzen!)"], ["text", "Das ist es, was ich Ihnen vorwerfen würde. In Ihrer Rede haben Sie hier gerade alles in einen Topf geworfen. Sie haben Menschen palästinensischer Herkunft, Extremismus,"], ["comment", "(Zuruf des Abg. Josef Oster [CDU/CSU])"], ["text", "und Organisierte Kriminalität in einen Topf geworfen. Damit machen Sie das Problem jeden Tag schlimmer."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der Linken)"], ["text", "Das ist das, was ich Ihnen vorwerfen muss. Das hat nichts mit Sicherheitspolitik zu tun. Das ist das, was Sie ändern müssen."], ["text", "Und zu der Frage, wie wir in Berlin weitermachen: –"], ["comment", "(Josef Oster [CDU/CSU]: Wie ist das Verhältnis der Grünen zur Linken?)"], ["text", "– genau dazu komme ich jetzt; verlassen Sie sich darauf; daran werde ich nicht vorbeigehen –"], ["comment", "(Dr. Ottilie Klein [CDU/CSU]: Also keine Konsequenzen!)"], ["text", "Wenn wir uns anschauen, was in Berlin jetzt ansteht, dann ist es doch völlig klar und liegt auf der Hand. Erstens. Wir werden keinerlei Antisemitismus akzeptieren. Das wird es nicht geben. Zweitens. Wir werden keinerlei Verbindungen zu Organisierter Kriminalität zulassen. Gleichzeitig ist es aber auch klar: Wir werden uns von Akteuren wie Frau von Storch oder der AfD in unserem Handeln nicht treiben lassen. Jetzt ist es wichtig, dass es Leute gibt, die in der Lage sind, einen Kompass zu behalten und sich nicht treiben zu lassen, weder in die eine noch in die andere Richtung. Es muss klare Mechanismen in Berlin geben. Am Sonntag war ich mit Tobias Schulze, dem Fraktionsvorsitzenden der Linksfraktion im Abgeordnetenhaus, auf dem Podium. Er hat mir versprochen: „Wer die Hamas verherrlicht, verharmlost oder das Existenzrecht Israels infrage stellt, gehört nicht in die Linkspartei.“ Ich nehme Tobias Schulze beim Wort. Es muss Konsequenzen geben."], ["comment", "(Alexander Throm [CDU/CSU]: Die Grünen haben kein Rückgrat!)"], ["text", "Gleichzeitig ist auch klar: Wir wollen in Neukölln und in Berlin stabile Verhältnisse haben. Wir wollen in Berlin eine Regierung bilden, die dafür sorgt, dass Rassismus in Berlin keinen Platz hat und dass dezidiert Antisemitismus in Berlin keinen Platz hat."], ["comment", "(Zuruf des Abg. Johannes Wiegelmann [CDU/CSU])"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter."], ["text", "Selbstverständlich sprechen wir mit Elif Eralp darüber und auch mit Steffen Krach."], ["text", "Herzlichen Dank."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN – Zurufe der Abg. Alexander Throm [CDU/CSU] und Johannes Wiegelmann [CDU/CSU])"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die CDU/CSU-Fraktion darf ich Dr. Katja Strauss-Köster das Wort erteilen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219515600-2", "x": -8.168, "y": 1.185, "cluster": 4, "speaker": "Alexander Throm", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 734, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515300", "ID219515600", "ID219514900", "ID219515200", "ID219515900"], "next": "ID219515700", "paragraphs": [["text", "Herr Kollege Audretsch, herzlichen Dank, dass Sie die Zwischenfrage zulassen. – Sie haben die Situation in Neukölln, Ihrem Wahlkreis, beschrieben. Ich kann Ihnen da nur recht geben und auch dafür Respekt zollen, dass Sie diesbezüglich eine so klare Haltung einnehmen. Sie haben dann davon gesprochen, dass das Konsequenzen haben müsse. Sie sind dann aber auf halbem Weg stehen geblieben; denn Sie haben nicht gesagt, welche Konsequenzen das aus Ihrer Sicht, aus Sicht der Grünen, sein müssten: Konsequenzen nur in der Bundestagsfraktion, was den Abgeordneten Koçak anbelangt, oder auch für die Regierungsbildung in Berlin? Welche Konsequenzen fordern Sie von den Grünen ganz konkret? Bleiben Sie bitte nicht auf halber Strecke stehen."], ["comment", "(Beifall bei der CDU/CSU)"], ["antwort", "ID219515600"]]}, {"id": "ID219515700", "x": -7.852, "y": 1.068, "cluster": 4, "speaker": "Dr. Katja Strauss-Köster", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 4042, "comments": 5, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515300", "ID219515200", "ID219515100", "ID219515600", "ID219515500"], "next": "ID219515800", "paragraphs": [["text", "Herr Präsident! Liebe Kolleginnen und Kollegen! Meine sehr geehrten Damen und Herren! Wenn ich morgens in den Deutschen Bundestag komme und die deutsche Nationalflagge über dem Reichstag wehen sehe, dann erfüllt mich das mit Demut und Stolz."], ["text", "Heute allerdings schäme ich mich. Ich schäme mich dafür, dass Abgeordnete aus diesem Hohen Haus auf Wahlpartys, Kundgebungen und öffentlichen Veranstaltungen die Nähe zu Menschen suchen, die mit Organisierter Kriminalität, Judenhass oder der Verherrlichung terroristischer Gewalt in Verbindung stehen. Wenn führende Mitglieder, einschließlich des ehemaligen Berliner Kultursenator Klaus Lederer, die Partei wegen Antisemitismus verlassen, und wenn Petra Pau, die langjährige Bundestagsvizepräsidentin der Linken, diese Woche wiederholt innerparteilich Alarm schlägt, dann spricht das Bände."], ["text", "Wir sprechen in diesem Haus immer gemeinsam von Staatsräson. Wir sprechen von der besonderen Verantwortung, die wir haben. Wir sprechen von „Nie wieder ist jetzt“. Dann ist jetzt aber auch der Zeitpunkt gekommen, diesen Worten Taten folgen zu lassen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der SPD)"], ["text", "Ich sage das auch vor dem Hintergrund ganz persönlicher Erfahrungen, die mich bis heute tief bewegen. Gute Freunde haben Deutschland, ihr Geburts- und Heimatland, mit ihren drei Kindern verlassen. Ich glaube, es ist jetzt ein Jahr her. Sie sind Juden. Das war unter uns nie ein Thema. Konnte ich mir doch überhaupt nicht vorstellen, dass der Umstand, in Deutschland Jüdin oder Jude zu sein, jemals wieder eine Rolle spielen würde."], ["text", "Meine Freundin hatte einfach Angst – Angst, ihre Kinder in die Schule zu schicken oder sie mit Freunden um die Häuser ziehen zu lassen. Unsere Freunde und viele andere jüdische Familien glauben heute nicht mehr an das Schutzversprechen des Staates. Sie fühlen sich in Deutschland nicht mehr willkommen. Meine Damen und Herren, dafür sollten wir uns schämen."], ["text", "Es waren auch Unterstützer der Terrororganisation Volksfront für die Befreiung Palästinas auf der Wahlparty. Sie steht für eine Geschichte von Anschlägen, Entführungen und politisch motivierter Gewalt. Es gab enge Verbindungen zur RAF in Deutschland. Linksterroristen wurden in palästinensischen Lagern militärisch ausgebildet."], ["text", "Das ist keine Meinung. Das sind Fakten. Deshalb ist es unerträglich, wenn deren Vertreter am Sonntag für Selfies posieren und wenn terroristische Organisationen oder die Gewalt terroristischer Organisationen romantisiert, relativiert oder politisch verharmlost werden."], ["text", "Schauen wir nach Berlin. Die Berliner Linke ist auch für unsere Hauptstadt selbst ein Sicherheitsrisiko: Sie will polizeiliche Aufgaben durch Sozialarbeit ersetzen, Gelder für die innere Sicherheit kürzen, polizeiliche Befugnisse einschränken,"], ["comment", "(Zuruf des Abg. Mirze Edis [Die Linke])"], ["text", "den Verfassungsschutz abschaffen und Abschiebungen von Straftätern verhindern. Als ob das alles nicht schon schlimm genug wäre, läuft dann auch noch ein Clanchef über die Wahlparty – eine einzige sicherheitspolitische Bankrotterklärung."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und des Abg. Sebastian Fiedler [SPD])"], ["text", "Gerade gegen diese Strukturen gehen wir auf Bundesebene entschlossen vor. Mit unserem Aktionsplan gegen Organisierte Kriminalität stärken wir Zoll und Bundeskriminalamt, verbessern den Informationsaustausch zwischen den Sicherheitsbehörden und setzen dort an, wo es die Täter besonders trifft: bei illegal erworbenen Vermögen."], ["text", "Unser Rechtsstaat darf nicht dabei stehen bleiben, kriminelle Strukturen zu beobachten. Er muss sie aufdecken, ihre Finanzströme trockenlegen und ihnen die wirtschaftliche Grundlage entziehen. Und genau diese Entschlossenheit erwarte ich auch zukünftig von der Regierung unserer Bundeshauptstadt – eine Regierung, die weiß, wo die roten Linien unseres Rechtsstaates verlaufen, und die bereit ist, diese konsequent zu verteidigen."], ["text", "Antisemitismus ist eine rote Linie. Terrorverherrlichung ist eine rote Linie. Die Nähe zu Organisierter Kriminalität ist eine rote Linie. Wer diese Linien überschreitet oder ihre Bedeutung kleinredet, wird in uns als CDU/CSU immer einen entschlossenen Verteidiger unserer freiheitlichen Demokratie finden."], ["text", "Herzlichen Dank."], ["comment", "(Beifall bei der CDU/CSU)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die AfD-Fraktion darf ich Martin Hess das Wort erteilen."], ["comment", "(Beifall bei der AfD – Mirze Edis [Die Linke]: Da war mal was, ne, mit Hess in der Geschichte! – Gegenruf der Abg. Beatrix von Storch [AfD]: Eijeijei!)"]]}, {"id": "ID219515800", "x": -8.071, "y": 1.405, "cluster": 4, "speaker": "Martin Hess", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 4579, "comments": 13, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219514800", "ID219515200", "ID219514900", "ID219515300", "ID219515100"], "next": "ID219515900", "paragraphs": [["text", "Herr Präsident! Meine Damen und Herren! Eines hat nicht nur die heutige Debatte glasklar und eindeutig bewiesen: Die Linke ist der wahre Feind für unseren Rechtsstaat und unsere Demokratie."], ["comment", "(Ulle Schauws [BÜNDNIS 90/DIE GRÜNEN]: Ach hör doch auf!)"], ["text", "Die Linke darf nie wieder Regierungsverantwortung in Deutschland übernehmen – weder in Berlin noch anderswo."], ["comment", "(Beifall bei der AfD)"], ["text", "Berlin, meine sehr verehrten Damen und Herren, ist die Hauptstadt des Verbrechens. Nirgends ist die Gewalt und Schwerkriminalität so stark ausgeprägt wie in Berlin. Der islamistische Terror hat hier unfassbar viele Unterstützer, und Judenhass wird immer offener und immer häufiger auf offener Straße geradezu zelebriert. Und die Antwort der Linken auf diese von der CDU maßgeblich zu verantwortende, miserable Sicherheitsbilanz lautet: „Defund the Police“, übersetzt: eine massive Reduzierung der Befugnisse des Personals und der Finanzmittel der Polizei. Das ist keine fehlgeleitete Sicherheitspolitik mehr, das ist eine offene Verachtung unseres Rechtsstaates und aller gesetzestreuen und rechtschaffenen Bürger."], ["comment", "(Beifall bei der AfD)"], ["text", "Angesichts dieser Faktenlage ist es geradezu logisch, dass an der Wahlparty der Linken ganz offen und ohne jede Scheu ein hochrangiges Mitglied eines kriminellen Clans teilnimmt. Es ist auch nicht verwunderlich, dass der schon mehrfach durch extremistische Positionen aufgefallene MdB der Linken, Herr Koçak, beste Kontakte ins Berliner Clanmilieu pflegt. Und es ist geradezu folgerichtig, dass islamistische Terrorunterstützer und Antisemiten unverhohlen öffentlich damit prahlen, wie sie den Linken zum Wahlsieg verholfen haben."], ["text", "Man muss das mal in aller Deutlichkeit aussprechen, und man kann sich dazu eines Satzes von Willy Brandt bedienen, den er in einem anderen Zusammenhang verwendet hat: Hier wächst zusammen, was zusammengehört. – Rechtsstaatsfeinde wären die größten Profiteure einer linken Sicherheitspolitik, und deshalb muss diese ohne Wenn und Aber verhindert werden."], ["comment", "(Beifall bei der AfD)"], ["text", "Die Politik der Linken schafft keine Sicherheit; sie zerstört sie. Obwohl diese Tatsache unwiderlegbar für jeden offenkundig ist, ziehen die Grünen und die SPD ernsthaft in Erwägung, mit den Linken eine Koalition zu bilden. Ich formuliere es deshalb an die Kollegen der Grünen und der SPD ganz unmissverständlich: Wer so handelt, der macht sich zum Mittäter. Wer als Handlanger der Linken agiert, führt Berlin geradewegs in eine Katastrophe."], ["comment", "(Beifall bei der AfD)"], ["text", "Wenn sich die SPD in dieser Debatte zwar von den Linken distanziert, dann erscheint das aber völlig unglaubwürdig; denn der Vizekanzler und Finanzminister Lars Klingbeil von der SPD war es, der mitgeteilt hat, dass die Frage einer Koalition mit der Linken die SPD in Berlin entscheiden müsse. Das ist keine Distanzierung, sondern das glatte Gegenteil. Die SPD ist offenbar bereit, für den Machterhalt sämtliche rechtsstaatlichen Grundsätze über Bord zu werfen. Sie wollen in Berlin an der Macht bleiben, koste es, was es wolle. Damit versündigen Sie sich an unserem Land."], ["comment", "(Beifall bei der AfD)"], ["text", "Und was macht die CDU im Hinblick auf Die Linke? Sie schließt nicht etwa kategorisch jede Zusammenarbeit aus, nein, führende Vertreter wie der schleswig-holsteinische Ministerpräsident Günther plädieren für eine Kooperation mit dieser Partei, die nichts anderes ist als der parlamentarische Arm von Islamisten, von Antisemiten und Clankriminellen."], ["comment", "(Beifall bei der AfD)"], ["text", "Die CDU verrät damit alle konservativen Grundsätze, für die Ihre Partei jemals stand. Eine solche machtversessene, moralisch entkernte und prinzipienlose Partei braucht in Deutschland kein Mensch. Sie sind zu Recht zum ersten Mal in der bundesrepublikanischen Geschichte aus einem Landtag geflogen. Und ich prognostiziere Ihnen: Wenn Sie so weitermachen, war das nicht das letzte Mal. Sie werden in der politischen Bedeutungslosigkeit versinken."], ["comment", "(Beifall bei der AfD)"], ["text", "Auch heute wurde unserer AfD von einigen Vorrednern wieder Rechtsextremismus vorgeworfen und ihr das Recht abgesprochen, Die Linke für ihren staatsfeindlichen Kurs zu kritisieren. Zum Beleg dieses wahrheitswidrigen Narrativs benötigen Sie aber den Verfassungsschutz. Den müssen Sie politisch instrumentalisieren"], ["comment", "(Sebastian Fiedler [SPD]: Das hat doch Frau von Storch gerade gemacht! – Zuruf des Abg. David Mandrella [SPD])"], ["text", "und als Legitimationsobjekt missbrauchen."], ["text", "Doch zur Beurteilung der Linken braucht es keine Behörde. Es reichen die Bilder Ihrer Berliner Wahlparty"], ["comment", "(Zuruf der Abg. Katrin Fey [Die Linke])"], ["text", "und der Chat zwischen dem Linkenabgeordneten Koçak und einem Clankriminellen. Jeder rechtschaffene und aufrechte Bürger erkennt auf den ersten Blick: Diese Linke ist der Totengräber unserer Sicherheit und unserer Gesellschaft."], ["comment", "(Beifall bei der AfD)"], ["text", "Wer mit solchen Leuten kooperiert – Grüne, SPD, Union –, der ist keinen Deut besser. Im Gegensatz zu unserer AfD: Wir sind nicht rechtsextrem, sondern haben nur extrem recht."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Da es einen Zuruf am Beginn der Rede gegeben hat, wo der Nachname assoziativ angesprochen worden ist, möchte ich darauf hinweisen, dass das Reduzieren auf einen Namen nicht unbedingt hilfreich oder parlamentarisch akzeptabel ist. Deswegen mein deutlicher Hinweis darauf."], ["chair", "Für die CDU/CSU-Fraktion darf ich Siegfried Walch das Wort erteilen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219515900", "x": -8.193, "y": 1.22, "cluster": 4, "speaker": "Siegfried Walch", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 7721, "comments": 30, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515100", "ID219515300", "ID219515200", "ID219515800", "ID219515700"], "next": "ID219516000", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Liebe Kolleginnen und Kollegen! Ich möchte zu Beginn loswerden, liebe Kolleginnen und Kollegen der Linken: Es ist beschämend, wie Sie mit dieser Debatte umgehen: Kein Wort der Reue! Kein Wort der Einsicht! Sofort auf andere deuten, versuchen, die Schuld von sich wegzuschieben! Keinerlei Anzeichen, dass Sie irgendeinen Fehler einsehen! So geht das nicht."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und des Abg. Sebastian Fiedler [SPD])"], ["text", "Das zeigt, dass Sie ein strukturelles Problem haben, dass es sich eben nicht um Einzelfälle handelt. Ihr Verhalten ist der beste Beleg dafür."], ["text", "Und es tut mir sehr leid, aber ich weiß schon, wie es wieder werden wird: Wahrscheinlich wird Petra Pau ausgegrenzt und nicht der Kollege Koçak. – Ich kann mir vorstellen, dass es so in Ihrer Fraktion ablaufen wird, meine Damen und Herren."], ["comment", "(Beifall bei der CDU/CSU sowie des Abg. Sebastian Fiedler [SPD])"], ["text", "Liebe Kolleginnen und Kollegen, Organisierte Kriminalität, Antisemitismus, islamischer Extremismus, Linksextremismus: All dies sind Dinge, die scheinbar nichts miteinander zu tun haben. Wer sich aber mit innerer Sicherheit befasst, der weiß, dass die Grenzen längst verschwimmen, weil sich Extremisten bewusst der Organisierten Kriminalität bedienen und man bewusst die Strukturen des jeweils anderen nutzt."], ["comment", "(Zuruf von der AfD)"], ["text", "Der Bundestagsabgeordnete der Linken Ferat Koçak chattet munter mit Firas Rammo, dem Sohn von Issa Rammo; wir haben das schon gehört. Ich möchte es nur noch mal zitieren, weil es so bestechend ist: „Bruder“, schreibt er und: „Grüße […] zurück an deinen Vater“. Übrigens: Der Rammo-Clan hat eine zutiefst patriarchale Struktur; das sollten Sie an dieser Stelle auch nicht vergessen. – Er bittet darum, einen Clip seiner Bundestagsrede zu verbreiten. Genau in diesem Clip – das ist ja kein Zufall – bezeichnet Ferat Koçak das Wort „Clankriminalität“ als politischen Kampfbegriff, mindert so die Bedeutung und sagt, das alles wäre nur Rassismus. Hier macht sich Die Linke zum Handlanger dieser Strukturen."], ["text", "Und da müssen Sie sich abgrenzen; Sie können das so nicht stehen lassen, meine Damen und Herren. So geht das nicht."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU und der SPD)"], ["text", "Deswegen verlange ich von Ihnen ganz klar hier und jetzt die Abberufung von Ferat Koçak aus dem Innenausschuss. Unerträglich, dass der mit uns im Innenausschuss sitzt, meine Damen und Herren!"], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der Abg. Sebastian Fiedler [SPD] und Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN] – Katrin Fey [Die Linke]: Dann muss die AfD doch auch raus!)"], ["text", "Ende August auf einer Wahlkampfbühne der Linken in Neukölln: „Yalla, Yalla Intifada“ – wir haben es gehört –, und: „Death to the IDF“. Auf der Wahlparty ist dann Ibrahim Ibrahim von der Volksfront zur Befreiung Palästinas mit dabei. Das ist nicht irgendwer – auch an die Zuhörerinnen und Zuhörer –; das ist der Unterstützer einer terroristischen Vereinigung. Und die Reaktion aus dem Bezirk? Na ja, man habe halt zusammen gefeiert."], ["text", "Irgendwann reicht die Erklärung eben nicht, man hätte von nix gewusst."], ["comment", "(Zurufe von der Linken)"], ["text", "Sie haben diese Szene ganz bewusst im Wahlkampf genutzt, wollten die Stimmen und wollten die Strukturen. Es braucht endlich eine klare Abgrenzung; sonst verlieren Sie jede Glaubwürdigkeit, meine Damen und Herren."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD und des Abg. Sascha Lensing [AfD])"], ["text", "Die Frage ist doch: Warum fühlen sich so viele Beteiligte dieses Milieus so wohl in Ihrer Nähe und in Ihrem Umfeld? Ich kann schon eine Antwort geben: Die Linke kämpft immer wieder ganz konsequent gegen Befugnisse der Polizei, sie will weniger Polizei, weniger Befugnisse, Ende der Waffenverbotszonen, und sie stellt den Verfassungsschutz grundsätzlich infrage. Das gehört zusammen, weil Organisierte Kriminalität bewusst Schwachstellen des Staates sucht, Extremisten bewusst politische Anschlussfähigkeit suchen und Antisemiten Räume suchen, wo ihre Positionen zumindest geduldet werden. Da fehlt es bei Ihnen überall an klarer Abgrenzung."], ["comment", "(Beifall der Abg. Dr. Katja Strauss-Köster [CDU/CSU] und Sebastian Fiedler [SPD])"], ["text", "Deshalb muss Die Linke beantworten, warum offenbar gerade dieses Milieu bei ihr immer wieder Anschluss findet. Ich kann es Ihnen aber sagen: Die Linke hat ein veritables Antisemitismusproblem, Die Linke hat ein veritables Extremismusproblem, und damit hat Die Linke ein veritables Demokratieproblem,"], ["comment", "(Dr. Ottilie Klein [CDU/CSU]: So ist es!)"], ["text", "meine Damen und Herren. Natürlich sind sie eine Gefahr für diesen Rechtsstaat."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und des Abg. Sebastian Fiedler [SPD])"], ["text", "Besonders bitter ist das für die Personen, die vor diesen Ideologien und Strukturen geflohen sind: Juden, Iraner, Jesidinnen und Jesiden, Kurden, Christen aus dem Nahen Osten, die vor Islamismus, Terror und Unterdrückung geflohen sind."], ["comment", "(Dr. Fabian Fahl [Die Linke]: Die Taliban! – Katrin Fey [Die Linke]: Und die Taliban? Die Taliban haben Sie hierhingeholt!)"], ["text", "Sie suchen Rechtsstaatlichkeit, sie suchen Freiheit, und sie suchen Gleichberechtigung und nicht wieder Akzeptanz für die Unterdrücker, vor denen sie eigentlich geflohen sind."], ["comment", "(Beifall bei Abgeordneten der AfD)"], ["text", "Wer so was macht, bereitet der Demokratie und dem Humanismus einen Bärendienst, meine Damen und Herren von der Linken."], ["comment", "(Beifall bei Abgeordneten der AfD und der Abg. Dr. Ottilie Klein [CDU/CSU] und Sebastian Fiedler [SPD] – Luke Hoß [Die Linke]: Heuchelei, was Sie da machen!)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter, würden Sie eine Zwischenfrage aus der Fraktion Die Linke gestatten?"], ["text", "Ich bitte darum."], ["zwischenfrage", "ID219515900-2"], ["text", "Das waren sehr viele Fragen. Herr Präsident, ich bitte darum, alle beantworten zu dürfen."], ["text", "Schon die Art und Weise, wie die Fragestellung jetzt formuliert war, beweist ja das, was ich sagte: Es geht um Ihre Verfehlungen; es geht gerade um die Vorfälle des Wochenendes – und kein Wort der Reue,"], ["comment", "(Dr. Ottilie Klein [CDU/CSU]: So ist es!)"], ["text", "sondern gleich wieder die Frage, was andere denn falsch – –"], ["comment", "(Zuruf des Abg. Mirze Edis [Die Linke])"], ["text", "– Sie hören ja nicht mal jetzt zu. Sie haben doch die Frage gestellt. Hören Sie doch zu! Ich habe doch, ohne Ihren Fragesteller zu unterbrechen, komplett zugehört. Wieso hören Sie mir nicht zu?"], ["comment", "(Luke Hoß [Die Linke]: Lenken Sie jetzt auch ab?)"], ["text", "Sie haben bei dieser Fragestellung sofort – Sie tun es schon wieder – den Gegenangriff gestartet. Kein Wort der Einsicht!"], ["comment", "(Zuruf von der Linken)"], ["text", "Deswegen haben Sie mein Eingangsstatement bestätigt."], ["text", "Zweitens. Sie sprechen das Thema Taliban an. Tut mir leid, aber diesen Vorwurf kann ich so nicht mehr stehen lassen."], ["comment", "(Desiree Becker [Die Linke]: Dann fahren Sie doch mal nach Bonn! Ich habe Freunde aus Afghanistan, die sich nicht mehr trauen, dorthin zu gehen! Mann! Also wirklich!)"], ["text", "– Könnten Sie mal zuhören? Ich weiß, dass das schwierig ist, wenn man moralisch überlegen ist."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU – Heiterkeit bei Abgeordneten der AfD – Lachen der Abg. Cansin Köktürk [Die Linke])"], ["text", "Aber hier geht es darum, dass man sich auf einer Ebene trifft."], ["text", "Vertreter eines Staates zu dulden, ist etwas anderes, als radikalen Extremismus in den eigenen Reihen zu dulden."], ["comment", "(Lachen bei Abgeordneten der Linken – Luke Hoß [Die Linke]: Ist ja Wahnsinn!)"], ["text", "Wir haben Auslandsvertretungen vieler Staaten, mit deren Ideologie wir in keinster Weise übereinstimmen."], ["comment", "(Lorenz Gösta Beutin [Die Linke]: Die Taliban!)"], ["text", "– Nordkorea."], ["comment", "(Lorenz Gösta Beutin [Die Linke]: Nordkorea, ja, da habe ich auch keinen Bock drauf! – Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN]: Was ist das denn, Herr Kollege?)"], ["text", "– Natürlich haben wir keinen Bock darauf; aber wir dürfen auf Auslandsvertretungen doch nicht die eigene Ideologie anwenden. Alle Auslandsvertretungen sind hier in Berlin übrigens gerade aktiv, egal von welchem Staat."], ["comment", "(Desiree Becker [Die Linke]: Sie lassen das einfach zu!)"], ["text", "Und nicht die Taliban sind eingeladen, sondern der Staat Afghanistan, der leider – und hoffentlich zum Bedauern von uns allen – aktuell von den Taliban geführt wird. Aber nicht die Taliban wurden eingeladen, sondern der Staat Afghanistan."], ["comment", "(Desiree Becker [Die Linke]: Das ist unfassbar! Was sagen Sie denn zu Ihren Kollegen? – Luke Hoß [Die Linke]: Jetzt müssen Sie ja mit denen reden!)"], ["text", "Das ist etwas völlig anderes, und das müssen Sie auch einmal lernen auseinanderzuhalten."], ["comment", "(Ulle Schauws [BÜNDNIS 90/DIE GRÜNEN]: Ach so! Das sehen wir aber anders! Da habe ich ja massive Zweifel!)"], ["text", "Drittens. Sie setzen ja ständig das Wort „demokratisch“ vor das, was Sie tun; Sie haben auch gerade wieder von den „demokratischen Fraktionen“ gesprochen. Ich habe aber massive Zweifel, wenn ich mir die Vorkommnisse vom Wochenende bei Ihnen anschaue, dass Sie demokratisch auch meinen."], ["comment", "(Desiree Becker [Die Linke]: Wir wurden mit fast 26 Prozent gewählt! Im demokratischen Verfahren!)"], ["text", "Aber das ist ja immer gerne Ihre Taktik: den Begriff verwenden, um ihn dann umzudeuten. Auch das Regime im Osten unseres Landes hat „Deutsche Demokratische Republik“ geheißen."], ["comment", "(Beifall des Abg. Rainer Galla [AfD])"], ["text", "Nur das Verwenden des Begriffs macht einen nicht zum Demokraten, meine Damen und Herren von der Linkspartei."], ["text", "Ich hoffe, ich habe jetzt alles so weit beantwortet."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD)"], ["text", "Wenn nicht, dürfen Sie gerne nachfragen."], ["text", "Ich fordere – auch wegen dem, was wir jetzt in der Zwischenfrage gehört haben –:"], ["text", "Erstens. Ferat Koçak muss aus dem Innenausschuss abberufen werden."], ["text", "Zweitens. Sämtliche Kontakte müssen offengelegt werden. Und ich möchte auch wissen: Gab es Wahlkampfhilfe für die Partei Die Linke, organisatorisch, durch Sachleistungen oder Wahlkampfunterstützung durch finanzielle Zuwendungen?"], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD)"], ["text", "Die Linke muss ihre Verbindungen und Kontakte zu diesen Milieus offenlegen."], ["text", "Für uns als Parlament bedeutet das: Wir müssen entschlossen dafür kämpfen, dass unsere Behörden gegen jede Form des Extremismus, egal von welcher Seite, gleichermaßen und ohne politische Einflussnahme kämpfen können. Und ich möchte unbedingt, dass Die Linke wieder vom Verfassungsschutz beobachtet wird."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und des Abg. Sebastian Fiedler [SPD])"]]}, {"id": "ID219515900-2", "x": -8.69, "y": 1.176, "cluster": 4, "speaker": "Lorenz Gösta Beutin", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 1858, "comments": 4, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515200", "ID219515500", "ID219515700", "ID219515000", "ID219515300"], "next": "ID219516000", "paragraphs": [["text", "Herzlichen Dank, Herr Kollege. – Also, Sie haben den Zwischenruf „Die CDU/CSU hat die Taliban wieder nach Deutschland geholt und kooperiert mit den Taliban“ gerade wahrscheinlich gehört; das halte ich für ein veritables Problem, aber dazu will ich jetzt gar nicht viel sagen. Die Taliban sind nicht unser Bündnispartner und haben nichts mit freiheitlich-demokratischer Grundordnung zu tun."], ["text", "Aber davon abgesehen: Sie sprechen hier über ein strukturelles Problem des Antisemitismus, und ich will Ihnen zustimmen. Wir haben in unserer Gesellschaft ein veritables Antisemitismusproblem, und zwar ein wachsendes Antisemitismusproblem. Wir haben das Problem, dass sich Jüdinnen und Juden aus unterschiedlichsten Gründen hier in Deutschland nicht mehr sicher fühlen. Deswegen ist es Aufgabe jeder einzelnen demokratischen Partei in diesem Hohen Hause,"], ["comment", "(Dr. Bernd Baumann [AfD]: Da gehören Sie ja nicht dazu!)"], ["text", "den Antisemitismus zu bekämpfen."], ["text", "Dann will ich Sie gerne darauf hinweisen: Es gibt die Leipziger „Mitte“-Studie; die heißt „‚Mitte‘-Studie“, weil sie eben sehr deutlich macht, dass wir die Probleme des Rechtsradikalismus und des Antisemitismus eben nicht nur an den sogenannten Rändern haben, sondern auch in der sogenannten politischen Mitte. Diese Antisemitismusstudie kommt zum Ergebnis, dass wir bei fast 20 Prozent der Mitglieder der AfD-Fraktion manifesten Antisemitismus haben; aber wir haben auch bei 6 bis 8 Prozent der Mitglieder der Unionsfraktion Antisemitismus."], ["comment", "(Dr. Bernd Baumann [AfD]: Was sind das denn für Fantasiezahlen? – Martin Hess [AfD]: Meine Herren! Lass mich raten, wer der Verfasser der Studie ist! Jetzt kommt ihr mit irgendwelchen Studien von euren Leuten!)"], ["text", "Und am geringsten ist der Anteil der Mitglieder im Hinblick auf Antisemitismus, und zwar auch israelbezogenen Antisemitismus, laut dieser Studie bei den Grünen und bei der Linken."], ["comment", "(Nicole Höchst [AfD]: Traue keiner Studie, die du nicht beauftragt hast!)"], ["text", "Wir sind es immer wieder, die hier im Bundestag Anträge für die Opfer des Holocaust stellen, die das Thema des Antisemitismus in unserer Gesellschaft, auch des historischen, auf die Karte setzen. Also: Bitte kehren Sie erst einmal vor Ihrer eigenen Tür!"], ["comment", "(Beifall bei der Linken sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"], ["antwort", "ID219515900"]]}, {"id": "ID219516000", "x": -6.317, "y": 2.255, "cluster": 1, "speaker": "Frank Schwabe", "fraction": "SPD", "role": "Parl. Staatssekretär bei der Bundesministerin der Justiz und für Verbraucherschutz", "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 2689, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516500", "ID219516700", "ID219516400", "ID219516200", "ID219516300"], "next": "ID219516100", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Sehr geehrte Damen und Herren! Stellen Sie sich vor: ein Glas Wasser auf dem Tisch – farblos, geruchlos, geschmacklos. Nichts an diesem Glas Wasser verrät, was in den nächsten Stunden passieren wird. Und genau das ist das Perfide an K.-o.-Tropfen. Sie verlangen keine Überredung, keinen Kampf, keinen Widerstand, der gebrochen werden müsste; denn sie nehmen den Betroffenen die Möglichkeit, überhaupt Widerstand zu leisten. Sie löschen den Willen aus, bevor er überhaupt geäußert werden kann."], ["text", "Spätestens seit dem Fall von Gisèle Pelicot in Frankreich wissen wir: Der Einsatz von K.-o.-Tropfen zur Begehung einer Vergewaltigung ist eine besonders niederträchtige Form der Gewalt. Die Täter mischen ihren Opfern heimlich Substanzen unter, um sie gezielt wehrlos zu machen: in einer Bar, in einem Klub oder – und das wird zu oft vergessen – in der eigenen Wohnung, verabreicht von jemandem, dem man vertraut hat. Alles das sind entsetzliche Verbrechen."], ["text", "Bis vor Kurzem stand vor deutschen Gerichten die Frage im Raum: Sind K.-o.-Tropfen eigentlich gefährliche Werkzeuge? Der Bundesgerichtshof entschied 2024: Nein – auf Grundlage der heutigen Gesetzgebung. Damit gilt der Einsatz einer Substanz, die einen Menschen vollständig wehrlos macht, rechtlich als weniger schwerwiegend als der Einsatz einer Waffe oder eines Messers. Konsequenz ist drei Jahre Mindeststrafe, nicht fünf. Als wären diese Taten eine mildere Form der Gewalt."], ["text", "Und dabei bleibt es nicht: Die Täter organisieren sich. Sie agieren nicht einzeln im Verborgenen, sondern in Netzwerken mit Tausenden Mitgliedern. Sie stacheln sich gegenseitig an. Sie teilen Aufnahmen, geben sich Tipps. Das sind eben keine Einzelfälle mehr, sondern das ist ein System."], ["text", "Ich weiß nicht, wer von Ihnen heute das „Morgenmagazin“ gesehen hat. Kira Daviter, die Gründerin einer Selbsthilfegruppe von Frauen, die Opfer von K.-o.-Tropfen geworden sind, hat dort zu Recht darauf hingewiesen, dass das Strafrecht nicht alles ist, sondern dass wir ein Hilfsnetzwerk brauchen, dass wir eine Justiz brauchen, eine Gesellschaft brauchen, die versteht, wie man mit Opfern von K.-o.-Tropfen umgeht."], ["text", "Aber: Das Strafrecht ist nicht alles. Aber auch das Strafrecht muss eine deutliche Antwort geben und einen wirksameren Gewaltschutz bieten; und das erfordert eben auch konsequentere Strafen. Deshalb stellen wir klar: Wer K.-o.-Tropfen für eine Vergewaltigung einsetzt, muss künftig mit mindestens fünf Jahren Freiheitsstrafe rechnen. Damit senden wir ein eindeutiges Signal an die Täter, aber auch an die Betroffenen und die Gesellschaft insgesamt. Betroffene sollen wissen: Der Rechtsstaat steht an ihrer Seite."], ["text", "Vielen Dank."], ["comment", "(Beifall bei Abgeordneten der SPD und der CDU/CSU)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Wir hören für die AfD-Fraktion Knuth Meyer-Soltau."], ["comment", "(Beifall bei der AfD)"]]}, {"id": "ID219516100", "x": -6.488, "y": 2.443, "cluster": 1, "speaker": "Knuth Meyer-Soltau", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 2529, "comments": 6, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516400", "ID219516700", "ID219516200", "ID219516800", "ID219516000"], "next": "ID219516200", "paragraphs": [["text", "Herr Präsident! Meine Damen und Herren! Ich denke, die Reden werden sich heute etwas ähneln. – Stellen Sie sich vor: Sie gehen abends aus. Sie trinken etwas, und plötzlich verändert sich alles. Sie verlieren die Kontrolle über Ihren eigenen Körper. Sie können sich nicht mehr wehren, nicht mehr selbst entscheiden. – Genau darauf hat es der Täter abgesehen. K.-o.-Tropfen sind kein Kavaliersdelikt. Sie sind eine hinterhältige Waffe,"], ["comment", "(Beifall bei der AfD)"], ["text", "gezielt eingesetzt, um Menschen für Raub- oder Sexualdelikte wehrlos zu machen."], ["text", "Deshalb ist es überfällig und richtig, dass wir heute diese gravierende Strafbarkeitslücke im Strafgesetzbuch schließen. Denn keinem Bürger ist es vermittelbar, warum es von juristischen Spitzfindigkeiten abhängig sein soll, ob der Täter"], ["comment", "(Isabelle Vandre [Die Linke]: Hier ist das generische Maskulinum mal angebracht!)"], ["text", "ein Messer benutzt oder eine Substanz, die das Opfer genauso schutzlos macht. Für das Opfer macht diese Unterscheidung keinen Unterschied. Es ist betäubt und wehrlos. Unser Strafrecht muss das endlich widerspiegeln. Wir unterstützen diese Gesetzesänderung daher ausdrücklich."], ["comment", "(Beifall bei der AfD)"], ["text", "Aber, meine Damen und Herren, wir dürfen uns hier im Hohen Hause nicht selbst auf die Schulter klopfen. Ein höherer Strafrahmen auf dem Papier verhindert für sich allein keine einzige Straftat, und er überführt auch keinen einzigen Täter. Hier liegt das eigentliche praktische Problem. Viele dieser Substanzen bauen sich rasend schnell ab. Nach wenigen Stunden sind sie kaum noch nachweisbar. Wenn das Opfer am nächsten Tag mit einem Filmriss aufwacht, ist das forensische Zeitfenster oft schon geschlossen. Was nützt uns also das schärfste Gesetz, wenn Ermittlungsverfahren massenhaft eingestellt werden müssen oder es Freisprüche gibt, weil die Beweise fehlen?"], ["text", "Die Bundesregierung darf aus dieser Reform kein Beruhigungspflaster machen. Ein materielles Strafrecht greift zu kurz, wenn Bund und Länder nicht zugleich in der Praxis aufrüsten. Wir brauchen bundesweit einheitliche Standards bei Polizei und Justiz. Und wir brauchen Notaufnahmen, die bei Verdacht sofort toxikologische Schnelltests und eine gerichtsverwertbare Beweissicherung durchführen können – flächendeckend und ohne bürokratische Hürden. Schärfere Gesetze im Bund müssen Hand in Hand gehen mit einer effektiven Spurensicherung in den Ländern. Nur dann wird aus diesem Entwurf ein echtes Schutzinstrument für die Bürger und nicht bloß ein weiteres Gesetz für die Akten oder für die Gesetzbücher."], ["text", "Und Herr Laschet, wenn wir zusammen mit dem Zug nach Nordrhein-Westfalen fahren, können wir gern miteinander reden!"], ["comment", "(Zuruf von der CDU/CSU: Hä?)"], ["text", "Danke schön."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die CDU/CSU-Fraktion hat Susanne Hierl das Wort."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219516200", "x": -6.065, "y": 2.136, "cluster": 1, "speaker": "Susanne Hierl", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 2414, "comments": 4, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516800", "ID219516700", "ID219516500", "ID219516000", "ID219516100"], "next": "ID219516300", "paragraphs": [["text", "Herr Präsident! Verehrte Kolleginnen und Kollegen! Das Landgericht Münster hat im vergangenen Jahr einen Mann wegen schwerer Vergewaltigung verurteilt. Er hatte eine Frau heimlich mit K.-o.-Tropfen betäubt und sie dann brutalst vergewaltigt. Strafe waren sieben Jahre. Es gibt zurzeit keine Statistik, die uns ausweist, wie viele Verbrechen mithilfe von K.-o.-Tropfen begangen werden. Aber solche Fälle, wie ich sie Ihnen gerade geschildert habe, bekommen immer mehr Aufmerksamkeit."], ["text", "In meiner Jugend musste ich mir nicht jeden Abend, wenn ich ausgegangen bin, Gedanken machen, ob irgendjemand was in mein Glas tut; ich musste nicht ständig hinschauen. Genau diese Unbeschwertheit würde ich der heutigen Jugend wieder wünschen."], ["text", "Wir müssen uns eines immer vor Augen halten: Die Verantwortung in diesen Fällen, bei diesen Taten, trägt allein der Täter. Die Opfer müssen sich weder dafür rechtfertigen, noch müssen sie sich dafür schämen, dass sie ausgegangen sind, dass sie Spaß hatten oder dass sie einem anderen Menschen vertraut haben."], ["comment", "(Beifall bei der CDU/CSU und dem BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der SPD und der Linken)"], ["text", "Wer einen Menschen gezielt betäubt, um Vergewaltigungen zu begehen oder einen Raub, der handelt berechnend und macht das Opfer wehrlos. Genau dieses Unrecht muss sich auch im Strafrecht widerspiegeln. Und heute tut es das noch nicht."], ["text", "Liebe Kolleginnen und Kollegen, der BGH hat entschieden, dass der Einsatz von K.-o.-Tropfen bei Vergewaltigung, bei Raub kein gefährliches Werkzeug darstellt. Deshalb führt es eben nicht zu den höheren Strafen, die es geben würde, wenn eine Waffe eingesetzt worden wäre. Und ganz ehrlich: Diese Unterscheidung überzeugt mich nicht. Denn es kann doch keinen Unterschied machen, ob jemand wehrlos ist, weil er betäubt wurde oder weil eine Waffe benutzt wurde. Genau deshalb ist unser Ziel, dies jetzt zu ändern, den Einsatz von Betäubungsmitteln schärfer zu ahnden, genau dieses besondere Unrecht zu erfassen und eine praxistaugliche Regelung vorzulegen."], ["comment", "(Beifall bei der CDU/CSU und der SPD)"], ["text", "Liebe Kolleginnen und Kollegen, wir haben die elektronische Fußfessel eingeführt, wir haben Antigewaltkurse für Täter eingeführt. Das waren alles wichtige Schritte auf unserem Weg beim Schutz gegen Gewalt. Es geht noch weiter. Wir werden jetzt den digitalen Gewaltschutz auf den Weg bringen. Auch der vorliegende Gesetzentwurf ist Teil dieses Ansatzes. Mit dem Gesetzentwurf erhält die gezielte Betäubung in der Strafzumessung genau das Gewicht, das ihr zugehörig ist."], ["text", "Herzlichen Dank."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für Bündnis 90/Die Grünen darf ich Dr. Lena Gumnior das Wort erteilen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219516300", "x": -6.345, "y": 1.84, "cluster": 1, "speaker": "Dr. Lena Gumnior", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 4253, "comments": 9, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516400", "ID219516700", "ID219516000", "ID219516100", "ID219516200"], "next": "ID219516400", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Liebe Demokratinnen und Demokraten! Samstagabend, 23 Uhr: Eine Frau geht ausgelassen feiern. Sie geht mit einem Freund nach draußen rauchen. Er bietet ihr seine Vape an. Nichtsahnend nimmt sie einen Zug. Am nächsten Morgen wacht sie nackt neben ihm auf, sie erinnert sich an nichts. Und mit dieser Erfahrung ist sie nicht allein."], ["text", "Spiking – das sind eben nicht nur K.-o.-Tropfen in einem Getränk, es sind die unterschiedlichsten Substanzen in den unterschiedlichsten Formen. Am häufigsten sind es tatsächlich Kokain, Ketamin oder MDMA. Sie können in Getränken, in Drogen, in Vapes versteckt werden. Manche Frauen wachen am nächsten Morgen mit Nadelstichen auf. Und nicht einmal sedierend müssen diese Substanzen wirken; genauso gut kann man danach nicht müde werden, sondern eher dissoziieren oder komplett aufgeputscht sein. Dass das so viele – das merkt man auch gerade in der Debatte – nicht wissen, liegt an fehlender Aufklärung."], ["text", "Aber selbst wenn man es weiß: Wenn ein Mensch Opfer eines Sexualdelikts wird und der Täter dem Opfer vorher heimlich Betäubungsmittel verabreicht hat, führt das heute nicht zu einer schärferen Strafe. Das ist eine Lücke, die gerade für die Betroffenen nicht nachvollziehbar ist. Während nämlich bei einer Körperverletzung Menschen eine höhere Strafe erhalten, wenn sie solche Substanzen einsetzen, ist es im Sexualstrafrecht völlig egal, ob man sein Opfer nur vergewaltigt hat oder vorher noch betäubt."], ["comment", "(Ulle Schauws [BÜNDNIS 90/DIE GRÜNEN]: Genau!)"], ["text", "Besonders in Erinnerung geblieben ist der Fall von Gisèle Pelicot. Sie wurde jahrelang von ihrem damaligen Ehemann und Dutzenden anderen Männern sediert und vergewaltigt. Lange wusste sie nicht, was ihr angetan wurde. Erst nach jahrelanger Unwissenheit konnte sie ihren Ex-Mann anzeigen. Auch hier in Berlin gibt es aktuell Verhandlungen über einen ähnlichen Fall. Marvin S. vergewaltigte über Jahre Frauen, die er vorher sedierte. Lange wurde nicht richtig ermittelt, obwohl sogar die Polizei vor Ort am Tatort war. Erst das Durchhaltevermögen einer jungen Betroffenen und ihrer Familie vor Gericht führten zu einer Verurteilung und der grausamen Erkenntnis, dass es noch viele weitere Opfer gibt."], ["comment", "(Ulle Schauws [BÜNDNIS 90/DIE GRÜNEN]: Genau!)"], ["text", "Für die Betroffenen ist es so wichtig, dass nach solchen Taten selbstbestimmt darüber entschieden werden kann, ob sie die Taten anzeigen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie der Abg. Kathrin Gebel [Die Linke])"], ["text", "Aber für ein späteres Strafverfahren ist es notwendig, dass Betroffene möglichst schnell alle Spuren sichern lassen. Das muss für alle Menschen überall anonym und kostenfrei möglich sein, egal in welchem Bundesland und egal wie Sie versichert sind."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie der Abg. Kathrin Gebel [Die Linke])"], ["text", "Aber, liebe Koalition, Strafverschärfungen alleine werden sexualisierte Gewalt nicht verhindern. Gerade bei Spiking brauchen wir dringend eine bessere Datenlage über das Dunkelfeld. Studien wie die aktuelle Spiking-Studie an der Charité geben uns doch gerade erst mal ein Grundlagenwissen: Welche Mittel werden überhaupt eingesetzt? Was bedeuten die Taten für die Betroffenen? – Und ja, das kostet Geld, aber ohne Forschung geht es nicht."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der Linken)"], ["text", "Ohne Forschung gibt es auch eins nicht: eine wirksame Aufklärung. Und auch diese Arbeit kostet Geld. Denn anders, als viele glauben und auch gerade gesagt wurde, sind die Substanzen zum Teil lange nachweisbar. Es lohnt sich also, bei einem Verdacht im Krankenhaus Spuren davon im Blut zu sichern, auch wenn die Tat schon länger her ist. Auch beim Spiking sind es eben nicht „die fremden Täter“, sondern häufig der Partner, Freunde, Bekannte oder Arbeitskollegen. Die Substanzen wirken so unterschiedlich. Betroffene sollten immer ermutigt werden, sich Hilfe zu suchen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der Linken)"], ["text", "Und nicht nur das: Auch die Verantwortung muss endlich die Seite wechseln. Das hat zuletzt nach dem Europäischen Parlament auch der Bundesrat erkannt und die Bundesregierung aufgefordert, sich für eine „Nur Ja heißt Ja“-Regelung im Strafrecht einzusetzen."], ["comment", "(Axel Müller [CDU/CSU]: Das nordische Modell!)"], ["text", "Liebe Frau Hubig, worauf warten Sie noch? Legen Sie dazu einen Gesetzentwurf vor! Oder noch besser: Stimmen Sie unserem zu! Wir haben unseren Vorschlag gemacht. Von Ihnen kamen bisher nur Ankündigungen."], ["text", "Gisèle Pelicot war mutig. Sie hat das, was die Täter ihr angetan haben, in die Öffentlichkeit getragen und damit einen Satz geprägt, den ich allen Betroffenen heute mitgeben möchte: Die Scham muss endlich die Seite wechseln."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN und bei der Linken)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die Fraktion Die Linke darf ich Kathrin Gebel das Wort erteilen."], ["comment", "(Beifall bei der Linken)"]]}, {"id": "ID219516400", "x": -6.446, "y": 2.133, "cluster": 1, "speaker": "Kathrin Gebel", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 3088, "comments": 6, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516100", "ID219516300", "ID219516000", "ID219516700", "ID219516200"], "next": "ID219516500", "paragraphs": [["text", "Vielen Dank, Herr Präsident. – Der Fall Gisèle Pelicot hat weltweit für Aufsehen gesorgt. Wir alle bewunderten ihren Mut; aber wir alle hofften auch: Das ist doch sicherlich ein ganz krasser Ausnahmefall. – Aber inzwischen wissen wir: Das ist es nicht. In Aachen, in Frankfurt, in München, überall in der Bundesrepublik betäuben Männer Betroffene mit Medikamenten oder K.-o.-Tropfen, nehmen ihnen die Kontrolle über ihren Körper und vergewaltigen sie. – Und das hat einen Namen: chemische Unterwerfung."], ["text", "Und weil das Thema so wichtig ist, habe ich die Bundesregierung genau dazu befragt. Und die Antwort war: Wissen wir nicht, sind wir nicht zuständig, müssen die Länder machen. – Sie können nicht einmal sagen, wie viele Sexualstraftaten mit Betäubungsmitteln begangen werden, weil das in der Polizeilichen Kriminalstatistik gar nicht erst auftaucht."], ["text", "Die Bundesregierung will jetzt die Strafen dafür verschärfen, indem man Betäubungsmittel als gefährliches Mittel einstuft. Und das finde ich ja gar nicht schlecht. Aber ein höherer Strafrahmen nimmt in der Notaufnahme keine Blutprobe ab, sorgt nicht dafür, dass Fachpersonal chemische Unterwerfung erkennt, und verhindert vor allem keine Fälle. Aber genau das ist unsere Aufgabe."], ["comment", "(Beifall bei der Linken sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"], ["text", "Aber es kommt noch schlimmer: Die Täter tauschen sich im Netz darüber aus, wie man Frauen am besten betäubt und vergewaltigt. Sie laden Videos hoch, helfen sich bei der Beschaffung der Mittel, und es gibt noch viele andere Widerlichkeiten, die ich hier nicht ausbreiten will. Das passiert über die komplette Bundesrepublik hinweg und auch international vernetzt. Das Netzwerk ist durch eine NDR-Recherche seit zweieinhalb Jahren bekannt, und trotzdem gibt es keine zentrale Ermittlungsstelle, wie das auch zum Beispiel der Bund Deutscher Kriminalbeamter fordert. Ich muss feststellen: Die Bundesregierung weiß zu wenig, zählt zu wenig und tut zu wenig."], ["text", "Härtere Strafen allein reichen nicht, wenn Täterstrukturen nicht erkannt, wenn Plattformen nicht wirksam adressiert, Betroffene nicht konkret unterstützt werden und die Fälle in der Statistik letztendlich unsichtbar bleiben. Zu vielen Betroffenen wird nicht geglaubt, weil sie Erinnerungslücken haben. Sie brauchen überall einen schnellen und einfachen Zugang zu toxikologischen Untersuchungen und zu vertraulicher Spurensicherung, auch wenn die Beweise fehlen und ganz besonders, wenn das Trauma ihnen die Sprache raubt."], ["comment", "(Ulle Schauws [BÜNDNIS 90/DIE GRÜNEN]: Genau!)"], ["text", "Unsere Verantwortung endet nicht mit Paragrafen, sondern sie beginnt dort, wo Prävention und Schutz endlich im Alltag der Betroffenen ankommen, zum Beispiel bei geschultem Fachpersonal, bei Awareness-Konzepten in Klubs, bei einer bundesweit einheitlichen Erfassung der Fälle, wo Betäubungsmittel für Gewalt missbraucht wurden."], ["text", "K.-o.-Tropfen nehmen Menschen die Erinnerung; der Staat darf ihnen nicht auch noch den Schutz nehmen."], ["comment", "(Beifall bei der Linken sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"], ["text", "Schließen wir also diese Rechtslücke, aber sorgen wir gleichzeitig auch für Prävention! Die Scham muss die Seite wechseln. Deswegen machen wir klar: Nur Ja heißt Ja."], ["comment", "(Beifall bei der Linken sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"], ["text", "Sicherheit ist kein Zufall, sie ist eine politische Entscheidung."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der Linken sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die SPD-Fraktion darf ich Carmen Wegge das Wort erteilen."], ["comment", "(Beifall bei der SPD und der CDU/CSU)"]]}, {"id": "ID219516500", "x": -6.241, "y": 2.329, "cluster": 1, "speaker": "Carmen Wegge", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 2884, "comments": 4, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516000", "ID219516800", "ID219516700", "ID219516200", "ID219516400"], "next": "ID219516600", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Sehr geehrte Demokratinnen und Demokraten! Was wäre, wenn Sie morgen aufwachen und sich an die letzten Stunden Ihres Abends nicht mehr richtig klar erinnern können? Vielleicht wissen Sie nicht mehr, wann Sie heimgekommen sind. Vielleicht wissen Sie nicht mehr, wer Sie begleitet hat. Vielleicht wissen Sie nicht einmal mehr, ob Ihnen jemand etwas angetan hat."], ["text", "Es gibt einen Satz, den insbesondere junge Frauen kennen: Pass auf dein Getränk auf! – Wir sagen ihn unseren Freundinnen. Wir hören ihn von unseren Müttern. Hinter diesem Satz steckt keine harmlose Partyregel; dahinter steckt die Angst vor K.-o.-Tropfen. Und für mich ist ganz klar: Wir müssen darüber sprechen; denn hinter dem Begriff „K.-o.-Tropfen“ steckt viel zu oft noch die Vorstellung von einer vermeintlichen Partystory, von einem alkoholreichen Abend."], ["text", "Aber K.-o.-Tropfen sind keine Partystory, sie sind gefährlich. Sie sind ein Mittel, um Menschen wehrlos zu machen, um ihre Entscheidungsfähigkeit auszuschalten. Ganz bewusst. Und besonders häufig trifft es Frauen. Das bedeutet: Wenn wir über K.-o.-Tropfen sprechen, sprechen wir immer auch über Gewalt gegen Frauen. Wir sprechen über sexualisierte Gewalt. Und wir sprechen über Täter – häufig Männer –, die einen Moment erzeugen, in dem ein anderer Mensch, meist eine Frau, sich nicht mehr selbst schützen kann, um ihr etwas anzutun."], ["text", "Dabei ist eines ganz entscheidend – und das möchte ich unmissverständlich für alle hier deutlich machen –: Die Schuld liegt niemals beim Opfer. Nicht bei ihrem Getränk. Nicht bei ihrem Outfit. Nicht bei der Frage, wie viel sie denn wohl getrunken habe."], ["comment", "(Beifall bei der SPD, der CDU/CSU und dem BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der Linken und des Abg. Gereon Bollmann [AfD])"], ["text", "Wir reden hier in diesem Haus oft über Selbstbestimmung. Aber Selbstbestimmung bedeutet eben nicht nur, frei entscheiden zu können. Selbstbestimmung bedeutet auch, dass niemand einem Mitmenschen diese Entscheidung heimlich aus der Hand nehmen darf. Und genau deshalb müssen wir K.-o.-Tropfen ernst nehmen. Wir müssen Betroffene schützen und Täter konsequent zur Verantwortung ziehen. Denn eine Nacht, an die sich jemand nicht erinnern kann, darf nicht bedeuten, dass diese Tat keine Konsequenzen hat."], ["text", "Der BGH hat im Oktober 2024 beschlossen, dass K.-o.-Tropfen im Zusammenhang mit sexuellen Übergriffen nicht als gefährliche Werkzeuge anzusehen seien. Ich bin froh, dass wir mit diesem Gesetzentwurf klarstellen, dass wir hier einen Wertungswiderspruch sehen, und deshalb die §§ 177 und 250 StGB um die „gefährlichen Mittel“ erweitern. Es ist richtig, K.-o.-Tropfen als gefährliche Mittel einzustufen und somit die Mindeststrafe bei einer Verurteilung zu erhöhen."], ["text", "Für mich gilt: Nur Ja heißt Ja, und K.-o.-Tropfen nehmen Betroffenen die Möglichkeit, Ja zu sagen."], ["comment", "(Beifall bei der SPD)"], ["text", "Wir müssen also hinschauen. Wir müssen handeln, und wir müssen Betroffenen sagen: Du bist nicht schuld. Wir helfen dir. Wir glauben dir, und du bist nicht allein."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der SPD und der CDU/CSU)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die AfD-Fraktion darf ich Gereon Bollmann das Wort erteilen."], ["comment", "(Beifall bei der AfD)"]]}, {"id": "ID219516600", "x": -6.403, "y": 2.079, "cluster": 1, "speaker": "Gereon Bollmann", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 3353, "comments": 7, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516400", "ID219516200", "ID219516000", "ID219516700", "ID219516300"], "next": "ID219516700", "paragraphs": [["text", "Herr Präsident! Meine Damen und Herren! Wir befassen uns heute mit zwei Straftatbeständen, die besonders widerwärtig sind. Zum einen geht es um sexualisierte Gewalt, die überwiegend unsere Frauen und Töchter betrifft; zum anderen geht es um die räuberische Wegnahme fremden Eigentums. Die Opfer sind beileibe nicht nur jung, sondern auch ältere Frauen mit schmaler Rente gehören dazu. Wer solche Straftaten begeht, stellt sich gegen fundamentale Prinzipien unserer Gesellschaft. Sein Verhalten ist mit hiesigen Werten und Normen einfach nicht kompatibel. Entsprechend hart müssen ihn die Folgen seiner Tat treffen. Deshalb begrüßen wir ausdrücklich die beiden Entwürfe."], ["text", "Die Zahl der in Deutschland gemeldeten Vergewaltigungen ist deutlich gestiegen. Letztes Jahr gab es mehr als 14 000 Vergewaltigungen, also fast 40 täglich. Das ist im Vergleich zum Vorjahr ein Anstieg von 8,5 Prozent. Seit 2018 ist die Zahl der Vergewaltigungen gar um 72 Prozent gestiegen. Die Zahl der gemeldeten Sexualdelikte beträgt mehr als 131 000 im Jahr 2025; das sind 2,8 Prozent mehr als im Vorjahr. Das ist insbesondere deshalb bedeutsam, weil die Zahl der Gewaltdelikte insgesamt um 2,3 Prozent gesunken ist."], ["text", "Es drängt sich also die Frage auf, welche Ursachen zu diesen beklemmenden Ergebnissen geführt haben. Das mag auch an einer nicht hinreichenden Strafandrohung bei Verwendung der K.-o.-Tropfen liegen, mit denen sich ja beide Entwürfe beschäftigen; aber das allein kann es doch nicht sein. Warum schleichen wir eigentlich immer noch wie die Katze um den heißen Brei herum? Der Museumsbesucher in Dostojewskis Roman „Die Dämonen“ ist derart auf kleine Exponate fixiert, dass ihm ein riesiger Elefant entgeht, nämlich der metaphorische Elefant im Raum. Und auch hier steht er wieder, der weiße Elefant im Raum: Gerade letztes Wochenende sollen in Halle an der Saale mehrere Mädchen mit K.-o.-Tropfen betäubt und in einer Wohnung mutmaßlich vergewaltigt worden sein. Die Verdächtigen: vier 13- bis 16-Jährige aus Mali und Portugal."], ["text", "Nun sind nicht alle Ausländer schlechthin kriminell. Ja, die Mehrzahl von ihnen benimmt sich entsprechend unseren grundlegenden Normen, sind also keine Straftäter. Ja, sie sind hier sogar willkommen, soweit sie als Fachkräfte gebraucht werden, einer Arbeit nachgehen und unsere Gepflogenheiten in Bezug auf den Respekt vor Frauen teilen. Aber wir können nicht immer noch die Augen vor dem weißen Elefanten verschließen, dass auch Menschen zu uns kommen, die sich nicht an unsere Gesetze halten. Die muslimische Frauenrechtlerin Seyran Ateş sieht das Problem im frauenverachtenden Weltbild mancher Mohammedaner."], ["comment", "(Zuruf der Abg. Anne-Mieke Bremer [Die Linke])"], ["text", "Wir haben in Deutschland und Europa über Jahrhunderte ein Weltbild und Werte entwickelt – über Jahrhunderte! –, die unser Zusammenleben bestimmen. Aus dem Koran ergeben sich demgegenüber Werte, insbesondere mit Blick auf Frauen, die damit nicht vereinbar sind."], ["comment", "(Beifall bei der AfD)"], ["text", "So waren afghanische Männer 2024 bei Vergewaltigungen fast 11-mal so häufig tatverdächtig wie deutsche Männer."], ["comment", "(Zuruf von der Linken)"], ["text", "Algerier waren bei Raubdelikten rund 109-mal so häufig vertreten wie Deutsche. Ich zitiere hier nur die Kriminalstatistik."], ["comment", "(Zuruf der Abg. Carmen Wegge [SPD] – Gegenruf des Abg. Dr. Bernd Baumann [AfD])"], ["text", "Das wird man bei der Strafprävention berücksichtigen müssen, wenn man zukünftig die potenziellen Opfer schützen will. Nur wenn einem die Opfer egal sind, macht man so weiter wie bisher."], ["comment", "(Beifall bei der AfD – Zuruf der Abg. Kathrin Gebel [Die Linke])"], ["text", "Vielen Dank für Ihre Aufmerksamkeit."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Wir hören Axel Müller für die CDU/CSU-Fraktion."], ["comment", "(Beifall bei der CDU/CSU und der SPD)"]]}, {"id": "ID219516700", "x": -6.086, "y": 2.058, "cluster": 1, "speaker": "Axel Müller", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 4222, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516800", "ID219516200", "ID219516000", "ID219516100", "ID219516300"], "next": "ID219516800", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Herr Staatssekretär! Werte Kolleginnen und Kollegen! Meine sehr geehrten Damen und Herren! Der Schutz von Frauen vor Gewalt und Ausbeutung ist ein Kernanliegen unserer Koalition. Sicherheit vor Gewalt im öffentlichen Nahraum und im sozialen Nahraum ist uns wichtig. Frauen müssen sicher sein, egal ob zu Hause oder in der Öffentlichkeit. Mit dem Gesetzentwurf zur erhöhten Strafbarkeit für den Einsatz von K.-o.-Tropfen machen wir heute dazu einen weiteren Schritt. Das Gewaltschutzgesetz, das die Frauen zu Hause besser schützen soll, ist bereits erwähnt worden."], ["text", "Das gewaltsame Brechen des entgegenstehenden Willens eines anderen Menschen ist grundsätzlich immer eine Straftat. In erster Linie denkt man dabei an die Fälle, in denen Täter ihren Opfern unter Androhung oder Anwendung von körperlicher Gewalt, eventuell sogar mit Waffeneinsatz, ihren Willen aufzwingen. Es gibt jedoch auch die Fälle, in denen sich hinterhältige Täter eines anderen gefährlichen Mittels bedienen. Und um diese geht es sowohl in dem heute eingebrachten Gesetzentwurf der Bundesregierung als auch in dem des Bundesrates, die beide die gleiche Zielrichtung verfolgen und sich im Grunde nur in Nuancen unterscheiden. Ich teile hierzu allerdings die Ansicht der Bundesregierung, dass der Gesetzentwurf der Bundesregierung objektiv wie subjektiv weiter gehend ist. Er erscheint mir daher auch besser geeignet, einen umfassenden Schutz der Opfer durch Abschreckung der Täter zu gewährleisten."], ["text", "Konkret geht es um den Einsatz – wir haben es gehört – von Gamma-Butyrolacton. Ich bin in Chemie immer schlecht gewesen, aber das Ding heißt kurz „GBL“, und im Volksmund wird es „K.-o.-Tropfen“ genannt. Es handelt sich um eine Industriechemikalie – das muss man sich immer vor Augen führen –, die dem Opfer heimlich zugeführt wird. Sie ist klar, farblos, und wenn man sie einem Getränk beimischt, ist sie auch geschmacklos und kann vom Opfer somit nicht erkannt werden; nicht anders als ein solches Glas Wasser hier. Nach der Einnahme wird das Opfer nach einer Zeit bewusstlos und willenlos. Auf der Opferseite können manchmal auch noch Drogen und Alkohol im Spiel sein. Es besteht daraufhin eine erhöhte Gefahr für Leib und Leben, beispielsweise wenn eben eine Bewusstlosigkeit eintritt, das Opfer sich erbrechen muss, die Zunge in den Schlund rutscht und es deswegen zu ersticken droht."], ["text", "Mindestens genauso schwerwiegend sind die oftmals schwersten psychischen Folgen für die Opfer. Sie kämpfen mit Erinnerungslücken, wissen nicht, was in ihrer Bewusstlosigkeit mit ihnen geschehen ist bzw. in welcher Form der Täter sich an ihnen vergangen hat. Das sind traumatische Folgen."], ["text", "Das Perfide an GBL ist, dass es sich – das haben wir auch von einem der Vorredner gehört – im Körper des Opfers in eine körpereigene Substanz, das GHB, also Buttersäure, verwandelt. GBL kann daher als körperfremder Stoffe im Blut lediglich für eine ganz begrenzte Zeitdauer von drei bis sechs Stunden und maximal acht bis zwölf Stunden im Urin nachgewiesen werden. Das ist neben der Scham der Opfer ein weiterer Grund für das große Dunkelfeld."], ["text", "Lebensgefährliche Gewalt führt bei der Verwendung von Waffen im Falle einer Vergewaltigung oder bei einem schweren Raub zu einer Mindeststrafe von 5 Jahren und zu einer Höchststrafe von 15 Jahren. Die Entscheidung des Bundesgerichtshofs, die den Anlass für den heutigen Gesetzentwurf gegeben hat, ist erwähn
