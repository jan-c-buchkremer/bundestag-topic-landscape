t worden: 2024 hat der BGH GBL eben nicht als Waffe eingestuft. Der Unrechtsgehalt – das konnten die bisherigen Reden und meine, denke ich, auch aufzeigen – ist bei der Verwendung von GBL nicht geringer. Mit der aktuellen Gesetzesfassung wird dieses Unrecht jedoch noch nicht ausreichend abgedeckt. Daher ergänzen wir das StGB in den beiden genannten §§ 177 und 250 um den Begriff „gefährliches Mittel“, eben das GBL. Und wir schließen damit auch einen Kreis, den wir mit dem Neue-psychoaktive-Stoffe-Gesetz – kurz: NPSG – im April 2026 begonnen haben. Da haben wir festgelegt, dass unter bestimmten Bedingungen Handel und Besitz von GBL verboten ist."], ["text", "Nachdem nun die Debatte nicht allzu kontrovers verlaufen ist, freue ich mich auf die weiteren Beratungen im Rechtsausschuss."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der CDU/CSU und der SPD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Als letzte Stimme in der Aussprache hören wir für die CDU/CSU-Fraktion Dr. Martin Plum."], ["comment", "(Beifall bei der CDU/CSU und der SPD)"]]}, {"id": "ID219516800", "x": -5.959, "y": 2.296, "cluster": 1, "speaker": "Dr. Martin Plum", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/5", "agenda": "A) Erste Beratung des von der Bundesregierung eingebrachten Entwurfs eines … Gesetzes zur Änderung des Strafgesetzbuches – Stärkung des strafrechtlichen Schutzes vor sogenannten K.-o.-Tropfen", "top": "Tagesordnungspunkt 3", "drucksachen": ["21/7560", "21/551"], "chars": 3127, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516700", "ID219516200", "ID219516500", "ID219516100", "ID219516000"], "next": "ID219516900", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Meine sehr geehrten Damen und Herren! Liebe Kolleginnen und Kollegen! Wir gehen heute einen weiteren wichtigen Schritt, um den Schutz von Menschen in unserem Land vor Gewalt zu verbessern. Ich freue mich, dass wir das in großer Einmütigkeit tun. Mit dem Gesetzentwurf der Bundesregierung stärken wir den strafrechtlichen Schutz vor K.-o.-Tropfen, und wir beseitigen zugleich einen Wertungswiderspruch aus dem Strafgesetzbuch."], ["text", "Ich möchte das anhand eines Beispiels deutlich machen, das nicht in einer Bar, sondern in einem Krankenhaus spielt. Verabreicht ein Pfleger einer Patientin mittels einer Infusion, einer Spritze oder eines Sprays ein Narkosemittel, um der anschließend bewusstlosen Patientin ihre Wertsachen zu entwenden oder sich an ihr sexuell zu vergehen, dann droht ihm eine Mindestfreiheitsstrafe von fünf Jahren. Verabreicht er ihr das gleiche Narkosemittel über ein Getränk wie ein Glas Wasser, eine Tasse Tee oder mittels eines Pflasters, droht ihm dagegen nur eine Mindestfreiheitsstrafe von drei Jahren. Der Unrechtsgehalt der Taten ist in allen Fällen gleich, der Strafrahmen ist unterschiedlich. Das kann nicht richtig sein, das ist nicht richtig, und genau deshalb beseitigen wir diesen Wertungswiderspruch im Strafgesetzbuch."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Wir wählen dafür einen anderen und im Ergebnis überzeugenderen Ansatz als der Bundesrat in seinem Gesetzentwurf, den wir heute ebenfalls beraten. Ich will das einmal im Einzelnen aufdröseln."], ["text", "Erstens. Unser Gesetzentwurf schützt umfassend. Er erfasst nicht nur Sexual- und Raubtaten, bei denen Opfern Gift oder gesundheitsschädliche Stoffe verabreicht werden; er erfasst die Verwendung jedes gefährlichen Mittels bei diesen Taten."], ["text", "Zweitens. Unser Gesetzentwurf ist genau deshalb zukunftsgerichtet. Er beschränkt sich nicht nur auf bekannte Fälle wie K.-o.-Tropfen, sondern ist auch für andere Substanzen und für neue Begehungsformen offen."], ["text", "Drittens. Unser Gesetzentwurf ist rechtssicher. Er knüpft an bekannte Begriffe an. Der Begriff „Mittel“ ist im Strafgesetzbuch seit Langem in den §§ 177 und 250, aber auch in den §§ 219b oder 244 StGB enthalten. Der Begriff „gefährlich“ ist im Zusammenspiel mit dem Begriff „Werkzeug“ hinreichend konturiert. Erfasst wird jedes Mittel, das nach seiner Beschaffenheit und der konkreten Art seiner Verwendung dazu geeignet ist, erhebliche Verletzungen oder Schäden herbeizuführen."], ["text", "Viertens. Unser Gesetzentwurf erleichtert die Strafverfolgung. Er vermeidet Beweisschwierigkeiten, indem er auf ein subjektives Tatbestandsmerkmal verzichtet. Der Täter muss das gefährliche Mittel nicht bereits in der Absicht verwenden, einen Raub oder eine Vergewaltigung zu begehen. Es reicht aus, dass er das Mittel bei der Tat, also in einem finalen Zusammenhang mit ihr, verwenden will."], ["text", "Liebe Kolleginnen und Kollegen, wer Menschen heimlich betäubt, um sie anschließend zu berauben oder zu vergewaltigen, der muss dafür konsequent zur Verantwortung gezogen werden. Für das Unrecht solcher Taten ist nicht entscheidend, wie, sondern dass das Opfer betäubt wird. Genau das stellen wir heute mit diesem Gesetzentwurf klar."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219516900", "x": -5.978, "y": -0.971, "cluster": 2, "speaker": "Kay Gottschalk", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/6", "agenda": "Drucksache 21/8065", "top": "Tagesordnungspunkt 4", "drucksachen": ["21/8065"], "chars": 7613, "comments": 7, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517000", "ID219517200", "ID219517400", "ID219517300", "ID219517100"], "next": "ID219517000", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Wie immer: Liebe Steuerzahler! Gerade mal zwei Wochen ist es her, dass ich in meiner Rede zum Haushalt 2027 auf die Segnungen des Stabilitätsgesetzes von 1967 hingewiesen habe – den Erfolgsgaranten für wirtschaftlichen Aufschwung in der Folge. Nun muss ich schon wieder darauf eingehen; allerdings sitzt Herr Klingbeil diesmal nicht hier."], ["text", "Das Gesetz steht immer noch im Bundesgesetzblatt. Doch die dortigen geldpolitischen Instrumente der Bundesbank sind seit über 27 Jahren komplett gegenstandslos, weil die Geldpolitik auf die Europäische Zentralbank übergegangen ist. Sie haben das Gesetz links – so will ich das mal sagen – liegen gelassen."], ["text", "Ich behaupte: Wenn die Bundesbank noch Herr des Verfahrens wäre, dann hätten wir das aktuelle wirtschaftliche und finanzielle Dilemma jedenfalls nicht. Sie hätte den heutigen laienhaften Protagonisten der Finanzpolitik, die eigentlich hier auf der Bank sitzen müssten, jedenfalls nicht so viele Überschreitungen durchgehen lassen. Sie hätte vor allen Dingen Leitplanken gesetzt. Und wir hätten nicht dieses finanzpolitische Desaster, vor dem wir stehen. Dieses Stabilitätsgesetz ist viel mehr als eine Petitesse, es ist symptomatisch."], ["text", "Wenn Sie und frühere Bundesregierungen es nicht einmal schaffen, ein gegenstandsloses Wirtschaftsgesetz aus dem Gesetzblatt zu entfernen, wie soll man dann eigentlich glauben, dass Sie die viel dringendere Frage der kalten Progression, die Sie alle draußen etwas angeht, wenn Sie eine Gehaltserhöhung bekommen, mit der notwendigen Konsequenz angehen?"], ["comment", "(Beifall bei der AfD)"], ["text", "Sie kassieren damit mittels einer Steuererhöhung ab, die sich der parlamentarischen Kontrolle entzieht. Wer eine Lohnerhöhung erhält, die nur die Inflation ausgleicht, wird real nicht bessergestellt, aber steuerlich stärker belastet, weil er in einen höheren Grenzsteuersatz hineinrutscht und die Steuerlast dadurch steigt. Das ist eine kalte Enteignung der arbeitenden Mitte, der fleißigen Unternehmer in unserem Lande durch bloßes gesetzgeberisches Unterlassen."], ["text", "Schaut man auf die nackten Zahlen, werden des Ministers feuchte Träume erkennbar. Die kalte Progression im weiteren Sinne, die neben dem Effekt „steigende Preise“ auch den Effekt „steigende Reallöhne“ berücksichtigt, führte allein im Zeitraum 2011 bis 2016 zu gigantischen Steuermehreinnahmen von 70,1 Milliarden Euro. Hier wird deutlich, wie die SPD die Arbeiter und Angestellten mit der kalten Progression abkassiert hat und es jetzt wieder vorhat."], ["text", "Schuld daran ist ebendieser Tarifverlauf. Die Kurve der ersten Progressionszone ist nämlich überproportional steil und hat eine dramatische Steigung. Obwohl der Ausgleich seit 2016 in den meisten Jahren de facto politisch beschlossen wurde, gibt es in Deutschland keinen gesetzlichen Automatismus. Und so drücken Sie sich 2027 klammheimlich vor dem Ausgleich. Deswegen ist ja auch so ein Koalitionsfrieden bei Ihnen eingekehrt. So schätzt das IDW das zusätzliche Steueraufkommen durch das Ausbleiben des vollständigen Ausgleichs auf zweistellige Milliardenbeträge bis 2030."], ["text", "Gleichzeitig heben Sie die Beitragsbemessungsgrenzen bei den Sozialversicherungen an, doppelt bei der gesetzlichen Krankenversicherung. Das ist eine Unverschämtheit gegenüber den Beitragszahlern – gerade wenn man berücksichtigt und bedenkt, dass allein die gesetzlich Versicherten mit über 12 Milliarden Euro auch die Bürgergeldempfänger alimentieren, meine Damen und Herren."], ["comment", "(Beifall bei der AfD)"], ["text", "So verstärkt sich eben die Gesamtbelastung aus Steuern und Abgaben für mittlere und höhere Einkommen kumulativ."], ["text", "Unser Tarif auf Rädern, den wir hier übrigens seit 2019 fordern, koppelt hingegen bei den Steuerparametern und den Progressionszonen die Inflation und das Wachstum der Realeinkommen, um dann eine faire Steuerquote und eine Entlastung, die der Inflation entspricht, zu gewährleisten. Aber auch bei diesem Tarif auf Rädern steigen die Steuern proportional mit dem Wachstum von Preisniveau und Reallöhnen."], ["text", "Ich nenne weitere positive Effekte:"], ["text", "Der Tarif auf Rädern nimmt dem Staat die perverse Anreizstruktur, von der Geldentwertung fiskalisch zu profitieren. Denn ein Staat, der nicht mehr heimlich von der Inflation lebt – ich habe es eben beschrieben – hat wenig Anreiz, so hoffe ich es zumindest, eine inflationstreibende Fiskalpolitik zu machen."], ["text", "Der Tarif auf Rädern schafft außerdem echte Arbeitsanreize, weil er verhindert, dass Lohnsteigerungen von der Progression aufgefressen werden."], ["text", "Der Tarif auf Rädern bewirkt und stärkt unmittelbar das zweite Ziel des magischen Vierecks: einen hohen Beschäftigungsgrad durch Leistungsanreize, nicht durch Verwaltung von Erwerbslosigkeit im Bürgergeldsystem, meine Damen und Herren."], ["comment", "(Beifall bei der AfD)"], ["text", "Ein Steuersystem, das die kalte Progression institutionell abschafft, schafft Planungssicherheit für Bürger und Unternehmen. Der Tarif auf Rädern ist damit kein isoliertes Steuergeschenk, sondern auch ein struktureller Baustein unserer hier immer wieder vorgetragenen Steuerreform 2025. Zusammen mit dem erhöhten Grundfreibetrag, den Freibeträgen für Erwachsene und Kinder, erzeugen diese Elemente in jenem magischen Viereck nämlich ein angemessenes und stetiges Wirtschaftswachstum bei den Bürgern. – Das gibt Ihnen auf der Tribüne Luft zum Atmen, damit Sie wieder Urlaub machen können, damit Sie sich Ihr Auto noch leisten können oder vielleicht auch das ein oder andere Schöne nebenbei. – Das tun Sie mit Ihrer Steuerpolitik jedenfalls nicht, meine Damen und Herren."], ["comment", "(Beifall bei der AfD)"], ["text", "Ein Steuersystem, das Bürger und Unternehmen Jahr für Jahr real stärker belastet, ohne dass dies politisch und offen entschieden wird, ist ein Wettbewerbsnachteil im internationalen Vergleich. Machen Sie jedoch so weiter wie geplant, wird dem privaten Haushalt real weniger Nettoeinkommen zur Verfügung stehen und die Binnennachfrage und Konsumneigung weiter gebremst. Das werden Sie auf Dauer mit Ihren Schuldenorgien nicht ausgleichen können. Und dann wundern Sie sich angesichts Ihrer Politik ernsthaft über die Wahlergebnisse? Denn die Politik, die Sie betreiben, spiegelt sich seit über zehn Jahren im Portemonnaie der Bürgerinnen und Bürger dort oben wider."], ["text", "Österreich beispielsweise hat den Tarif auf Rädern gesetzlich verankert. In der Schweiz hat der Abbau der kalten Progression sogar Verfassungsrang, meine Damen und Herren. Doch statt einer gesetzlichen Regelung des Tarifs auf Rädern starten Sie sogar einen finanzpolitischen Rückschritt: nämlich als der Koalitionsausschuss verkündete, wie die versprochene Einkommensteuerreform aussehen könnte. Aber vom Abbau der kalten Progression – deswegen haben Sie ja so ein bisschen Knatsch, meine Damen und Herren von der CDU und der SPD – war keine Rede mehr. Es droht wieder der heimliche Abschied von einer seit elf Jahren praktizierten Tarifindexierung. Deshalb gilt nach wie vor: Du darfst Sozialdemokraten kein Geld anvertrauen; denn sie geben es für die sinnlosesten Dinge aus."], ["comment", "(Beifall bei der AfD)"], ["text", "Also ein weiteres Argument, diesen Tarif auf Rädern nun endlich einzuführen."], ["text", "Der Tarif auf Rädern ist das Minimum an notwendiger staatlicher Regelbildung, um den Bürgern das Maximum an wirtschaftlicher Freiheit und Fairness zurückzugeben. Er ist der Kern unserer Steuerreform und der wirksamste Hebel, mit dem wir an allen vier Ecken des magischen Vierecks gleichzeitig für eine Stärkung sorgen können."], ["text", "Meine Damen und Herren von der CDU, machen Sie sich endlich ehrlich! Setzen Sie mit uns endlich den Tarif auf Rädern um, befreien Sie die Bürger von der kalten Progression, sorgen Sie für Wirtschaftswachstum und Fairness, und schaffen Sie Leistungsanreize, damit sich Arbeit in Deutschland wieder lohnt!"], ["text", "Vielen Dank."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die CDU/CSU-Fraktion darf ich Dr. Matthias Hiller das Wort erteilen."], ["comment", "(Beifall bei der CDU/CSU sowie der Abg. Nadine Heselhaus [SPD])"]]}, {"id": "ID219517000", "x": -5.677, "y": -1.382, "cluster": 2, "speaker": "Dr. Matthias Hiller", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/6", "agenda": "Drucksache 21/8065", "top": "Tagesordnungspunkt 4", "drucksachen": ["21/8065"], "chars": 4474, "comments": 7, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516900", "ID219517300", "ID219517200", "ID219517400", "ID219517100"], "next": "ID219517100", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Sehr geehrte Kolleginnen und Kollegen! Meine sehr geehrten Damen und Herren! Die größte Herausforderung für unser Land ist das Wirtschaftswachstum. Unser Wohlstand, unsere Arbeitsplätze und letztlich auch die Leistungsfähigkeit unseres Sozialstaates hängen davon ab, was wir erwirtschaften. Im Juni 2025 haben wir hier im Parlament daher die größte Unternehmensteuerreform der letzten 15 Jahre beschlossen. Die darin enthaltenen Maßnahmen"], ["comment", "(Zuruf des Abg. Jörn König [AfD])"], ["text", "umfassen Investitionsförderung, Forschungsförderung, Investitionsstärkung und strukturelle Entlastungen im Volumen von 45 Milliarden Euro. Das halte ich für richtig."], ["text", "Mit dem Standortfördergesetz, ebenfalls noch im letzten Jahr beschlossen, haben wir zusätzliches privates Kapital mobilisiert, das in Investitionen in Start-ups, in Infrastruktur und in erneuerbare Energien fließen wird. Auch das war eine richtige steuerliche Maßnahme. Ebenfalls beschlossen sind die Aktivrente, die Senkung der Stromsteuer und das Ehrenamtspaket. Wir haben also in 16 Monaten schon viele Maßnahmen im Steuerbereich auf den Weg gebracht. Das war richtig und notwendig."], ["comment", "(Beifall bei der CDU/CSU)"], ["text", "Jetzt zum Tarif auf Rädern und zur Belastung von Privatpersonen. Gerade bei niedrigen und mittleren Einkommen müssen wir ansetzen. Aber das Wichtige ist: Bis zu einem zu versteuernden Einkommen von 70 000 Euro sind die Beiträge zur Sozialversicherung eine größere Belastung als die Einkommensteuer. Genau hier haben wir bereits angesetzt. Durch das GKV-Beitragssatzstabilisierungsgesetz vermeiden wir, dass die Beiträge in der gesetzlichen Krankenversicherung weiter ansteigen."], ["comment", "(Andreas Paul [AfD]: Kahlschlag! Das ist ein Kahlschlag! – Zuruf des Abg. Kay Gottschalk [AfD])"], ["text", "Auch im zweiten Bereich, bei der Rente, wollen wir ansetzen. Hierzu liegen erste Vorschläge vor, die dauerhaft Entlastungen mit sich bringen werden."], ["text", "Der sogenannte Tarif auf Rädern wird bereits seit über 30 Jahren in der Wissenschaft diskutiert. Das ist jetzt kein Einfall der AfD-Fraktion, sondern ein Konzept, das schon relativ lange in der Wissenschaft diskutiert wird."], ["comment", "(Jörn König [AfD]: Sie hätten es ja umsetzen können! – Kay Gottschalk [AfD]: Ja! Dann setzen Sie es endlich um!)"], ["text", "Ich muss sagen: Ich kann diesem Konzept grundsätzlich in einigen Punkten etwas abgewinnen. Gleichzeitig kenne ich jedoch auch die rechtlichen Bedenken, die gegen den vorliegenden Gesetzentwurf sprechen. Ich will dies an einer Auswahl von Beispielen begründen."], ["text", "Das derzeitige Verfahren zum Ausgleich der kalten Progression ist klar strukturiert: Die Inflation wird ermittelt, der Progressionsbericht vorgestellt und die Höhe der Anpassung hier im Bundestag beschlossen. Die AfD fordert Folgendes: eine automatische Anpassung von Freibeträgen, Freigrenzen, Pausch- und Höchstbeträgen. Anschließend soll das gleiche Verfahren – Beschluss im Bundestag und im Bundesrat – Anwendung finden. Das heißt, es handelt sich hier nur um eine verfahrensrechtliche Änderung, keine materiell-rechtliche Änderung."], ["text", "Doch was vielleicht überzeugend klingen mag, ist es nicht. Ich will dies an einem Beispiel ausführen: an der Erhöhung der Ehrenamtspauschale, die wir hier im Haus schon beschlossen haben. Eine Mehrheit im Deutschen Bundestag hält das Ehrenamt für eine wichtige Institution und für eine wertvolle Stütze unserer Gesellschaft, und das auch zu Recht. Die Ehrenamtspauschale haben wir in diesem Haus im letzten Jahr angepasst. Wir haben sie um circa 14 Prozent erhöht, womit sie deutlich höher liegt als das Inflationsniveau. Hätte der Beschlussvorschlag der AfD damals vorgelegen, hätten wir diese Anpassung gar nicht vornehmen können."], ["comment", "(Beifall bei der CDU/CSU – Kay Gottschalk [AfD]: Das stimmt nicht!)"], ["text", "Wir halten an dem Ziel fest, die Einkommensteuer zu reformieren und die kalte Progression auszugleichen. Das entlastet die arbeitende Mitte. Wie wollen wir das schaffen? In erster Linie geht es darum, dafür zu sorgen, dass unser Staat wieder Wirtschaftswachstum verzeichnet. Ich habe erwähnt, welche Maßnahmen wir im Steuerbereich bereits auf den Weg gebracht haben."], ["text", "Was vor diesem Hintergrund positiv und vielversprechend ist, sind die Prognosen der Wirtschaftsforschungsinstitute, die eine deutliche Steigerung der wirtschaftlichen Leistung im nächsten und auch in diesem Jahr vorhergesagt haben. Unsere Wirtschaft gewinnt wieder an Dynamik und gibt uns den Spielraum, künftige Reformen anzugehen. Dies zeigt, dass unsere Politik wirkt, und es motiviert auch mit Blick auf die Reformanstrengungen der nächsten Zeit."], ["text", "Mit Erlaubnis des Präsidenten möchte ich aus dem AfD-Antrag die Formel zitieren, anhand derer die kalte Progression in Zukunft ausgeglichen werden soll: „R=(1+A)/(1+B)*(1+C)“. Nach einer wirklichen Vereinfachung klingt das nicht."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD – Kay Gottschalk [AfD]: Es ist das Verhältnis der tatsächlich gemessenen zur prognostizierten Inflation, mit dem entsprechenden Steuertarif multipliziert! Mehr ist es nicht!)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Wir hören für Bündnis 90/Die Grünen Sascha Müller."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219517100", "x": -5.88, "y": -1.04, "cluster": 2, "speaker": "Sascha Müller", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/6", "agenda": "Drucksache 21/8065", "top": "Tagesordnungspunkt 4", "drucksachen": ["21/8065"], "chars": 4101, "comments": 9, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517400", "ID219517300", "ID219516900", "ID219517000", "ID219517200"], "next": "ID219517200", "paragraphs": [["text", "Herr Präsident! Meine Damen und Herren! Erneut ein Tagesordnungspunkt der AfD-Fraktion zu Steuerfragen. Auch diesmal ist Ihr Ansinnen nicht wirklich zielführend. Natürlich ist es sinnvoll, wenn sich der Gesetzgeber regelmäßig die Inflationsentwicklung anschaut, seine Schlüsse daraus zieht und den Einkommensteuertarif dann gegebenenfalls anpasst."], ["comment", "(Kay Gottschalk [AfD]: „Gegebenenfalls“, eben! Und wir wollen, dass er es muss!)"], ["text", "Im Idealfall ist das nur eine kleine Routineübung. Im besonderen Fall – und dieses Jahr scheint mir wieder so ein besonderer Fall zu sein; ich komme gegen Ende darauf zurück – müssen wir uns eben intensiver mit der Frage der kalten Progression auseinandersetzen."], ["text", "Damit ist zu der Vorlage der AfD eigentlich schon das Wesentliche gesagt. Wir behandeln das Thema hier auch nicht zum ersten Mal; ich kann auf zahlreiche Debatten verweisen, die wir dazu hier hatten."], ["text", "Schauen wir lieber auf die, um die es hier gehen muss: auf die Menschen im Land, von denen viele gerade andere Sorgen haben als kleinere jährliche Anpassungen im Einkommensteuertarif."], ["comment", "(Lachen des Abg. Jörn König [AfD] – Kay Gottschalk [AfD]: Bitte?)"], ["text", "Denn sie spüren jeden Monat, wie knapp es geworden ist: beim Bäcker am Morgen, bei der Miete, beim Heizen, beim Tanken. Nehmen wir diese Menschen in den Blick und stellen die entscheidende Frage: Wen wollen wir eigentlich entlasten?"], ["text", "Ein einfacher Ausgleich der kalten Progression ist eines natürlich nicht: eine gezielte Entlastung für Menschen mit kleinen Einkommen. Denn wer wenig verdient, zahlt häufig wenig oder gar keine Einkommensteuer."], ["comment", "(Kay Gottschalk [AfD]: Ich habe Ihnen aber eben den Steuerverlauf der Einkommenskurve dargelegt!)"], ["text", "Wer hier wirklich entlasten will, muss über die Einkommensteuer hinausgehen. Denn auf dem Gehaltszettel stehen auch Sozialversicherungsbeiträge, und genau da müssen wir ran. Wir Grüne wollen die Beiträge zur Krankenversicherung senken. Das merkt die Verkäuferin auf ihrem Gehaltszettel, das merkt die Friseurin, das merkt der Erzieher – Monat für Monat. Denn für viele geht es nicht um abstrakte Tarifeckwerte, sondern um konkrete Fragen wie: Reicht das Geld für die Klassenfahrt der Kinder, für den Wocheneinkauf?"], ["comment", "(Zuruf des Abg. Reinhard Mixl [AfD])"], ["text", "Daran muss sich Entlastungspolitik messen lassen: Was bleibt am Ende des Monats übrig?"], ["comment", "(Reinhard Mixl [AfD]: Genau! – Kay Gottschalk [AfD]: Dann fangen Sie bei der CO2-Bepreisung an, Herr Kollege!)"], ["text", "Zu einer ehrlichen Debatte gehört natürlich auch: Wer entlasten will, muss auch sagen, wie er das finanziert. Wir wollen Gerechtigkeitslücken im Steuersystem schließen, zum Beispiel bei großen Immobiliengeschäften, die so gestaltet werden, dass weniger Grunderwerbsteuer anfällt."], ["comment", "(Kay Gottschalk [AfD]: Da wird wieder Neid geschürt!)"], ["text", "Wir haben auch viele andere Vorschläge gemacht und hier eingebracht, über die wir in den nächsten Wochen abstimmen werden. Entlastung darf nicht bedeuten, dass am Ende an anderer Stelle – bei Bildung, bei unserer Infrastruktur oder gar bei Familien – gekürzt wird. Für mich heißt Gerechtigkeit beides: denen mehr Luft zu verschaffen, die jeden Euro zweimal umdrehen müssen, und diejenigen stärker in die Verantwortung zu nehmen, die problemlos mehr tragen können, es aber im Moment noch nicht tun."], ["text", "Und damit zum Schluss noch mal an die Koalitionsfraktionen: Es ist ja zu lesen, dass Sie beim Ausgleich der kalten Progression noch uneinig sind. Ja, ich kenne diesen Zwiespalt und die Diskussionen aus unserer Regierungszeit noch sehr gut. Die einen sagen: Ein vollständiger Ausgleich auch bei hohen Einkommen kostet Bund, Länder und Kommunen viele Milliarden. – Die anderen warnen vor einer Steuererhöhung durch die Hintertür. Mein Rat wäre: Schauen Sie bei dieser Frage nicht nur auf den Steuertarif! Schauen Sie auf die Gehaltszettel, auf die der Friseurin und des Erziehers, auf diejenigen, die jeden Tag arbeiten und trotzdem kaum über die Runden kommen! Und vor allem: Verkeilen Sie sich nicht in steuerdogmatischen Debatten! Zeigen Sie Handlungsfähigkeit, und – verdammt noch mal – einigen Sie sich!"], ["comment", "(Beifall der Abg. Karoline Otte [BÜNDNIS 90/DIE GRÜNEN])"], ["text", "Dieses Land bräuchte gerade in diesen Zeiten eine funktionierende Regierung und eine funktionierende Regierungsmehrheit."], ["text", "Wir als grüne Oppositionsfraktion geben Ihnen Hinweise, machen Verbesserungsvorschläge, zeigen Alternativen auf. Wir machen unseren Job. Ihr Job ist es, dieses Land durch schwierige Zeiten zu führen. Und ich kann Sie nur an Ihre Verantwortung erinnern: Erledigen Sie diesen Job! Denn dafür sind Sie gewählt."], ["text", "Ich danke für die Aufmerksamkeit."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die SPD-Fraktion hören wir Parsa Marvi."], ["comment", "(Beifall bei der SPD)"]]}, {"id": "ID219517200", "x": -5.861, "y": -1.235, "cluster": 2, "speaker": "Parsa Marvi", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/6", "agenda": "Drucksache 21/8065", "top": "Tagesordnungspunkt 4", "drucksachen": ["21/8065"], "chars": 3481, "comments": 7, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516900", "ID219517000", "ID219517300", "ID219517400", "ID219517500"], "next": "ID219517300", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Liebe Kolleginnen und Kollegen! Wir reden heute wieder einmal über Entlastungen bei der Einkommensteuer. Diese Koalition hat vor der Sommerpause im Koalitionsausschuss eine Einkommensteuerreform geeint, und wir werden diese Grundlage zum Gegenstand der in Kürze beginnenden parlamentarischen Beratung machen. Es ist also Bewegung drin."], ["text", "Ich finde es in diesem Kabinettsbeschluss zunächst einmal gut, dass wir den Grundfreibetrag, den Kinderfreibetrag, das Kindergeld und den Arbeitnehmerpauschbetrag erhöhen wollen. Damit setzen wir den Schwerpunkt auf die Entlastung kleiner und mittlerer Einkommen und nehmen zugleich sehr hohe Einkommen stärker in die Verantwortung. Wenn etwas von vielen Wählerinnen und Wählern in diesem Land angemahnt und kritisiert wird, dann genau das. Die Topverdiener in diesem Land sollen sich stärker an der Finanzierung des Gemeinwesens beteiligen. Das haben wir mit dem Ausbau der sogenannten Reichensteuer jetzt auch gemacht. Es ist ein fundamentaler, richtiger Schritt, dass wir das auf den Weg bringen wollen."], ["comment", "(Beifall bei der SPD)"], ["text", "Ich sage ausdrücklich: Für uns Sozialdemokratinnen und Sozialdemokraten kann die Debatte damit nicht beendet sein. Genau deswegen nehmen wir die parlamentarischen Verhandlungen ernst. Ich sage ausdrücklich: Wenn über das, was geeint ist, weitere Entlastungen gerade für Menschen mit kleinen und mittleren Einkommen möglich sind, sind wir bereit, diese Chancen zu ergreifen. Aber dann gehört zu einer seriösen Debatte auch die Beantwortung der Frage: Was kostet das, wie finanzieren wir das, für wen geht das und für wen geht das wie stark?"], ["comment", "(Zuruf des Abg. Kay Gottschalk [AfD])"], ["text", "Natürlich reden wir im Parlament nicht zum ersten Mal über die kalte Progression. Dazu haben wir bewährte Verfahren. Die Bundesregierung legt regelmäßig den Existenzminimumbericht und den Steuerprogressionsbericht vor, und anschließend entscheidet der Deutsche Bundestag über die gesetzlichen Anpassungen. Zuletzt haben wir – da war Olaf Scholz Bundeskanzler – die Tarifeckwerte für 2025 und 2026 zum Ausgleich der Kaufkraftlücken verschoben mit Ausnahme bei der Reichensteuer. Ihr Gesetzentwurf geht nun deutlich weiter. Sie wollen nicht nur den Einkommensteuertarif jährlich indexieren, Sie wollen darüber hinaus alle Freigrenzen, Freibeträge, Pausch- und Höchstbeträge"], ["comment", "(Kay Gottschalk [AfD]: Ja!)"], ["text", "des Einkommensteuergesetzes an die Preisentwicklung automatisch anpassen. Aber diese steuerlichen Größen erfüllen ganz unterschiedliche Funktionen. Der Grundfreibetrag hat eine andere Aufgabe als beispielsweise der Arbeitnehmerpauschbetrag."], ["comment", "(Frauke Heiligenstadt [SPD]: So ist es!)"], ["text", "Und es kann ja so sein, dass das im europäischen Raum irgendwo erledigt ist, und wenn es nur darum geht, irgendwelche Puzzleteile zu finden, die man sich zusammenstellt, und daraus dann Politik macht, dann kann man das so machen. Das ist aber nicht meine Auffassung als Demokrat. Ich halte es für richtig, dass der Gesetzgeber auch künftig prüfen und entscheiden kann, wo und in welchem Umfang eine Anpassung sinnvoll ist, statt diese unterschiedlichen Entscheidungen dauerhaft an einen Automatismus zu binden, sei er nun verfahrensrechtlich oder materiell-rechtlich."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU und des BÜNDNISSES 90/DIE GRÜNEN – Kay Gottschalk [AfD]: Sie wollen sich mit Steuermehreinnahmen regenerieren!)"], ["text", "Und dann kommt zum Abschluss der entscheidende Punkt. Sie schreiben in Ihrem eigenen Gesetzentwurf, dass dadurch Steuermindereinnahmen entstehen, aber Sie beziffern diese nicht, und konkrete Maßnahmen zur Gegenfinanzierung Ihrer Vorschläge legen Sie ebenfalls nicht vor."], ["text", "Damit hat sich meine Aufmerksamkeit für Ihren Gesetzentwurf erschöpft. Wir werden ihn ablehnen."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Die nächste Rednerin in dieser Debatte ist für die Fraktion Die Linke Doris Achelwilm."], ["comment", "(Beifall bei der Linken)"]]}, {"id": "ID219517300", "x": -6.342, "y": -1.252, "cluster": 2, "speaker": "Doris Achelwilm", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/6", "agenda": "Drucksache 21/8065", "top": "Tagesordnungspunkt 4", "drucksachen": ["21/8065"], "chars": 3044, "comments": 6, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517500", "ID219517000", "ID219516900", "ID219517100", "ID219517200"], "next": "ID219517400", "paragraphs": [["text", "Frau Präsidentin! Die AfD spielt gerne mit Ängsten, und heute macht sie das über den Daueraufreger der kalten Progression. Ja, der Effekt der kalten Progression muss uns beschäftigen. Wenn man inflationsbedingt mehr verdient, mehr Einkommensteuer zahlt und am Ende weniger Netto und weniger Kaufkraft hat, dann gilt es hinzusehen, wen das betrifft und was man dann steuerpolitisch macht."], ["comment", "(Kay Gottschalk [AfD]: Das hat nichts mit Angst zu tun! Mit Fairness hat das zu tun!)"], ["text", "Aber die AfD nutzt diese berechtigten Sorgen vor Ungerechtigkeiten, um am Ende vor allen Dingen Gutverdienende wieder besserzustellen. Sie inszeniert sich als Anwältin der Steuerzahler, will den Progressionsausgleich automatisieren und liefert mit dem Tarif auf Rädern eine latente Umverteilung nach oben. Wir kennen es schon. Haben wir davon nicht schon genug? Ich würde sagen: Ja, das haben wir."], ["comment", "(Beifall bei der Linken – Kay Gottschalk [AfD]: Der Entlastungseffekt ist wissenschaftlich nachgewiesen bis 50 000 Euro brutto! Wissenschaftlich!)"], ["text", "In Ihrem Gesetzentwurf wird behauptet, dass der Tarif auf Rädern den Haushalt nicht belastet. Das ist wieder so ein AfD-Rechentrick. Ihr Vorschlag kostet Gestaltungsspielraum für Prioritäten; ob diese Prioritäten nun in der Entlastung kleinerer Einkommen liegen oder in der besseren Finanzierung von Kommunen und Krankenhäusern. Gegenüber dem Status quo ist Ihr Konzept für den Haushalt teurer, ohne dass das Ganze dort hilft und wirkt, wo es am meisten nötig ist."], ["text", "Wir haben hier das übliche Muster. Die AfD will nicht die kleinen und mittleren Einkommen entlasten, sie will, dass verteilungslogisch alles seine ungerechte Ordnung hat. Wir kennen das von der Idee der Flat Tax. Rund 25 Prozent Steuern für alle, das klingt doch einfach und gut. Übersetzt in die Realität heißt das dann aber: Reiche profitieren, Ärmere werden mit rechten Pseudowahrheiten getäuscht."], ["comment", "(Beifall bei der Linken und dem BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Liebe Kolleginnen und Kollegen, von der Einkommensteuerreform, die hier und heute der Hintergrund ist, waren keine großen Wunder zu erwarten, aber doch mehr als kosmetische Anpassungen. Es sollte das Projekt der Koalition zur Entlastung kleinerer und mittlerer Einkommen werden. Dass die Reform dieses Entlastungsversprechen nicht einlöst, hat viele Gründe, etwa, dass die Bundesregierung die Einkommensvorlasten nicht stärker heranzieht und für die Allgemeinheit neue Kosten und Kürzungen auftürmt. Es ist nicht schwer, zu begreifen, dass normale Einkommen in Deutschland dringend entlastet gehören und dass Vermögen oder Riesenerbschaften überhaupt erst wieder zu besteuern sind. Statt Automatismen, die nur dem Anschein nach neutral sind, braucht es die politische Entscheidung, von oben nach unten zurückzuverteilen."], ["comment", "(Beifall bei der Linken)"], ["text", "Bei der Einkommensteuer brauchen wir einen höheren Grundfreibetrag und substanziellere Reichensteuern. Wir wollen die Vermögensteuer reaktivieren. Eine unabhängige Studie des DIW zeigt, dass unser Konzept umsetzbar ist. Daneben braucht es eine Erbschaftsteuer ohne diese absurden Privilegien und aktuell – zentral – eine schnelle Übergewinnsteuer auf Krisen- und Ölkonzernprofite. Das ständige Entlasten nach oben, während Lebenshaltungskosten und Mieten aus dem Ruder laufen, muss beendet werden. Die AfD ist dabei keine Hilfe, sondern macht die Lage nur schlimmer."], ["comment", "(Beifall bei der Linken)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Der nächste Redner in dieser Debatte ist Florian Dorn für die Unionsfraktion."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219517400", "x": -5.856, "y": -1.153, "cluster": 2, "speaker": "Dr. Florian Dorn", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/6", "agenda": "Drucksache 21/8065", "top": "Tagesordnungspunkt 4", "drucksachen": ["21/8065"], "chars": 4204, "comments": 3, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219516900", "ID219517100", "ID219517000", "ID219517200", "ID219517300"], "next": "ID219517500", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Sehr geehrte Kolleginnen und Kollegen! Ja, bei der kalten Progression geht es im Kern um eine einfache Frage: Was bleibt den Menschen von einer Lohnerhöhung tatsächlich übrig, wenn wir die Inflation mitberücksichtigen? Wer beispielsweise 5 Prozent mehr Lohn bekommt, während die Preise ebenfalls um 5 Prozent steigen, ist real keinen Cent reicher geworden. Und wenn dieses höhere Nominaleinkommen dann dazu führt, dass ein größerer Teil des Einkommens besteuert wird, dann verliert dieser Mensch tatsächlich sogar real an Kaufkraft. Genau das ist der Effekt der kalten Progression. Und das ist dann am Ende nicht nur eine rein technische steuerpolitische Frage, sondern unterm Strich auch eine wirtschaftspolitische Frage, meine Damen und Herren. Denn wenn von der Lohnerhöhung real weniger übrig bleibt, fehlt dieses Geld beim Konsum oder auch bei privaten Investitionen. Deshalb ist die Diskussion über den Ausgleich der kalten Progression oder auch über einen Tarif auf Rädern eine lange Debatte, auch hier im Deutschen Bundestag, und keinesfalls eine Idee der AfD."], ["text", "Tatsächlich beschäftigt sich der Bundestag seit Jahren mit dieser Entwicklung. Seit 2005 beispielsweise legt das Bundesfinanzministerium alle zwei Jahre einen Existenzminimum- und Steuerprogressionsbericht vor. Seit 2016 ist es gängige Praxis, den Einkommensteuertarif auf dieser Grundlage an die Preisentwicklung anzupassen und auch die kalte Progression auszugleichen. Meine Damen und Herren, es ist auch richtig, die Kaufkraft der Menschen zu erhalten; denn eine rein inflationsbedingte höhere Steuerbelastung ist keine höhere wirtschaftliche Leistungsfähigkeit."], ["text", "Der Regierungsentwurf zur Entlastung bei der Einkommensteuer ist ein erster wichtiger Schritt. Er sieht höhere Grund- und Kinderfreibeträge vor, um das verfassungsrechtlich gebotene Existenzminimum steuerfrei zu stellen. Zudem sollen auch Anpassungen beim Arbeitnehmerpauschbetrag sowie Tarifeckwerte für den Spitzensteuersatz zumindest schon etwas später greifen, damit die Belastung gerade bei mittleren Einkommen weniger stark ansteigt."], ["text", "Dieser Entwurf ist nun auch Grundlage in diesem Herbst für unsere parlamentarischen Beratungen. Natürlich kommt es beim Ausgleich der kalten Progression letztlich darauf an, was wirklich bei der Nettoentlastung herauskommt, also wie viel von diesen steuerlichen Mehreinnahmen wir tatsächlich zurückgeben an die Bürgerinnen und Bürger. Das werden wir spätestens wissen, wenn wir diesen Herbst den Existenzminimumbericht und den Steuerprogressionsbericht vorgelegt bekommen. Dann werden wir auch sehen, wie viel wir noch ausgleichen müssten, um die kalte Progression zurückzugeben. Denn am Ende kommt es doch darauf an: Die Menschen merken, wenn sie jeden Tag aufstehen und zur Arbeit gehen, ob am Ende des Monats tatsächlich mehr in der Tasche übrig bleibt."], ["comment", "(Reinhard Mixl [AfD]: Wahlergebnisse!)"], ["text", "Aber selbst dabei darf dann die Debatte bei dieser Diskussion noch nicht stehen bleiben. Wir haben es heute auch schon gehört: Entscheidend ist doch, was insgesamt netto vom Brutto nach Steuern und Abgaben übrig bleibt. Deshalb müssen wir insgesamt natürlich die Steuer- und Abgabenentwicklung gemeinsam betrachten. Also: Wie entwickeln sich Steuern, die Sozialbeiträge, aber auch Verschiebungen bei Beitragsbemessungsgrenzen? Wie wirkt sich das auf das Netto der Menschen aus?"], ["text", "Damit kommen wir zur entscheidenden Frage: Wie entwickeln sich diese Belastungen entlang der gesamten Einkommensverteilung? Wie stark steigt die Grenzbelastung bei jedem nächsten hinzuverdienten Euro tatsächlich? Und welche Auswirkungen hat das auf Arbeitsanreize, auf zusätzliche Arbeitsstunden und auch auf die Leistungsbereitschaft?"], ["text", "Meine Damen und Herren, bei einer Einkommensteuerreform und auch beim Ausgleich der kalten Progression muss es doch darum gehen, die Menschen insgesamt zu entlasten, aber auch darum, dass sich Arbeit und Leistung entlang der Einkommensverteilung wieder spürbar mehr für alle Menschen in diesem Land lohnen. Dann bringen wir dieses Land für die Menschen spürbar voran. Jeder merkt das bei sich selbst im Geldbeutel. Darüber sollten wir diesen Herbst – dann auf Grundlage belastbarer Zahlen – weiter sprechen."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der CDU/CSU – Jörn König [AfD]: Nee! Sie sollen was tun und nicht weiter sprechen! – Gegenruf des Abg. Dr. Florian Dorn [CDU/CSU]: Der Bericht liegt noch nicht vor! – Gegenruf des Abg. Kay Gottschalk [AfD]: Deswegen sollte man die Formel verwenden! Das nächste Mal erkläre ich es Ihnen!)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Die nächste Rednerin in dieser Debatte ist für die SPD-Fraktion Frauke Heiligenstadt."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"]]}, {"id": "ID219517500", "x": -6.408, "y": -1.134, "cluster": 2, "speaker": "Frauke Heiligenstadt", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/6", "agenda": "Drucksache 21/8065", "top": "Tagesordnungspunkt 4", "drucksachen": ["21/8065"], "chars": 2537, "comments": 11, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517300", "ID219517200", "ID219517000", "ID219516900", "ID219517100"], "next": "ID219517600", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Meine sehr verehrten Kolleginnen und Kollegen! Meine sehr geehrten Damen und Herren! Mit dem vorliegenden Gesetzentwurf versucht die AfD mal wieder, das Thema der Steuerminimierung zu behandeln. Sie versteht unter Gerechtigkeit, dass Menschen mit hohen Einkommen automatisch entlastet werden – statt Menschen mit kleinen Einkommen."], ["comment", "(Jörn König [AfD]: 70 000 sind ein hohes Einkommen, ne?)"], ["text", "Deshalb fordert sie den sogenannten Steuertarif auf Rädern."], ["comment", "(Kay Gottschalk [AfD]: In der oberen Klasse haben wir eine flache Kurve! Irre! Bei fix 47 Prozent haben Sie keine kalte Progression! Weil Sie zahlen 47 Prozent!)"], ["text", "Meine sehr verehrten Damen und Herren, das kostet den Staat, also uns alle, sehr viel Geld. Aber das ist nicht neu: Allein die Einkommensteuerreformvorschläge der AfD würden uns alle jährlich 181 Milliarden Euro kosten; das hat das DIW ausgerechnet. Außerdem: Die AfD will aus der EU austreten. Gesamtwirtschaftliche Kosten: 690 Milliarden Euro."], ["comment", "(Kay Gottschalk [AfD]: Das schmerzt!)"], ["text", "Auch die Abschiebefantasien bzw. „Remigrationspläne“ und die rückwärtsgewandte Energiepolitik der AfD würden unseren Unternehmen und unserer Wirtschaft die Lebensgrundlage entziehen."], ["comment", "(Kay Gottschalk [AfD]: Was hat das mit dem Tarif auf Rädern zu tun?)"], ["text", "Dann wären die Steuereinnahmen deutlich niedriger, da nicht mehr ausreichend Arbeitskräfte hier wären, die die Unternehmen beschäftigen könnten."], ["comment", "(Reinhard Mixl [AfD]: Wir ersticken im Wirtschaftswachstum! Wir ersticken im Wachstum! – Kay Gottschalk [AfD]: In der Schule würde man sagen: „Thema verfehlt!“, Frau Heiligenstadt!)"], ["text", "Meine sehr verehrten Damen und Herren, wenn wir die Steuergesetzgebung an die Inflation ketten, wie die AfD es möchte, nehmen wir uns als Gesetzgeber die Spielräume,"], ["comment", "(Kay Gottschalk [AfD]: …, um kleine Leute abzukassieren! Das wäre die richtige Fortsetzung des Satzes!)"], ["text", "um im Bereich des Einkommensteuerrechts zielgerichtet, schnell und entscheidend auf Veränderungen reagieren zu können."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU und des BÜNDNISSES 90/DIE GRÜNEN)"], ["text", "Für einen guten Ausgleich zwischen Arm und Reich muss der Gesetzgeber immer abwägen können. Dass es keinen Automatismus in der Steuergesetzgebung gibt, ist also kein Fehler des Steuergesetzgebers, sondern eine Notwendigkeit in parlamentarischen Gesetzgebungsprozessen, um alle gesellschaftlichen Aspekte vor einer Entscheidung abwägen zu können."], ["text", "Und ja, meine Damen und Herren, kleine und mittlere Einkommen müssen entlastet werden. Deshalb hat sich die Regierung auch darauf verständigt, kleine und mittlere Einkommen über die Einkommensteuer gezielt in den Fokus zu nehmen. Der entsprechende Entwurf liegt vor; den werden wir demnächst hier beraten."], ["text", "Wir brauchen aber keine Gießkanne bei der Steuerentlastung,"], ["comment", "(Kay Gottschalk [AfD]: Es ist keine!)"], ["text", "wie es die AfD hier vorschlägt, und schon gar nicht bei den Reichen."], ["comment", "(Kay Gottschalk [AfD]: Es geht nicht bei den Reichen! Die zahlen fix 47 Prozent, die Reichen! Da gibt es keine Progression! – Jörn König [AfD]: Das sind Leute, die gut verdienen, und nicht Leute, die reich sind! – Zuruf des Abg. Reinhard Mixl [AfD])"], ["text", "Wir brauchen sinnvolle Steuerentlastungen bei denjenigen Menschen – wie es auch mein Kollege Herr Dorn gesagt hat –, die die Entlastungen auch für den Konsum nutzen können. Und dass die AfD ihre Vorschläge noch nicht mal gegenfinanziert, ist sowieso selbstverständlich."], ["comment", "(Reinhard Mixl [AfD]: Wollen wir ja auch gar nicht! Wollen wir gar nicht! Wir wollen Geld beim Bürger lassen, damit wir wieder Wachstum haben!)"], ["text", "Diese Mühe machen die sich nie. Dieser Gesetzentwurf ist schlicht und ergreifend abzulehnen."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU und des BÜNDNISSES 90/DIE GRÜNEN – Jörn König [AfD]: Der Staat muss sparen, nicht der Bürger! – Kay Gottschalk [AfD]: Wenn du keine progressive Kurve hast, hast du auch keine Progression!)"]]}, {"id": "ID219517600", "x": -4.692, "y": 1.654, "cluster": 0, "speaker": "Dr. Karsten Wildberger", "fraction": "ohne Fraktion", "role": "Bundesminister für Digitales und Staatsmodernisierung", "date": "2026-09-23", "agenda_id": "21/95/7", "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "top": "Tagesordnungspunkt 5", "drucksachen": ["21/7408"], "chars": 3087, "comments": 7, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518100", "ID219517800", "ID219517700", "ID219518300", "ID219517900"], "next": "ID219517700", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Sehr geehrte Damen und Herren Abgeordnete! Wir haben lange genug darüber gesprochen, was Digitalisierung für Menschen möglich machen könnte. Jetzt machen wir es. Ein Konto eröffnen, sich bei einer Behörde ausweisen: Das wird künftig sicher mit dem Smartphone gehen, ohne Papierkopien, ohne einen zusätzlichen Weg. Dafür entwickeln wir die digitale Brieftasche d-you."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Der Auftrag ist sehr klar: Jetzt mit Mut und Tempo die Dinge einfacher machen, spürbar für die Menschen und leicht in der Anwendung. Das ist das Leitmotiv der digitalen Brieftasche. Mit ihr können Sie sich ausweisen und wichtige Nachweise vorlegen. Sie geben dabei nur die Angaben weiter, die tatsächlich gebraucht werden. Wer nur seine Volljährigkeit nachweist, der kann seine Anschrift für sich behalten."], ["text", "Die Brieftasche ist auch eine Antwort auf die Risiken künstlicher Intelligenz. Wenn Bilder und Dokumente täuschend echt gefälscht werden können, brauchen wir verlässliche Nachweise. Damit wollen wir Identitätsmissbrauch erschweren und Menschen vor Betrug schützen."], ["text", "Wir bauen diese Infrastruktur gemeinsam in Europa. Wer in Frankreich studiert, in Spanien arbeitet oder in einem anderen Mitgliedstaat ein Konto eröffnet, soll seine digitalen Nachweise dort genauso selbstverständlich nutzen können wie zu Hause. Wir reden oft über den europäischen Binnenmarkt, hier machen wir ihn im Alltag erlebbar."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Ich nehme auch diejenigen sehr ernst, die Zweifel haben und sich um ihre Daten sorgen. Unsere Identität ist etwas sehr Persönliches. Wer nach den Risiken fragt, hat Anspruch auf klare Antworten. Deshalb werden die Nachweise verschlüsselt auf dem Smartphone gespeichert. Sie entscheiden über die Weitergabe und können nachvollziehen, wem Sie welche Daten übermitteln. Wer die Brieftasche bereitstellt, darf damit Ihren digitalen Alltag nicht überwachen. Das gilt natürlich auch für den Staat. Und die Sicherheit muss unabhängig überprüft werden. Die Nutzung bleibt freiwillig. Wer darauf verzichtet, darf nicht benachteiligt werden. Unsere digitale Identität gehört den Menschen, nicht dem Staat, nicht den Plattformen, nicht den Unternehmen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Deshalb gilt für die digitale Brieftasche: Sie entscheiden, welche Daten Sie weitergeben. Sie behalten die Kontrolle. Sicherheit ist unsere Verantwortung, Selbstbestimmung ist Ihr Recht."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Dafür arbeite ich, und das ist mein Fokus, meine Damen und Herren."], ["text", "Mit diesem Gesetz schaffen wir die Grundlage, um die Zukunft unseres Landes zu bauen. Wir geben den Startschuss für eine Infrastruktur, auf der ein ganzes Ökosystem wachsen kann. Anfang 2027 beginnen wir mit den ersten Anwendungen. Schritt für Schritt kommen weitere hinzu. Behörden, Unternehmen, Hochschulen und Städte können neue Dienste entwickeln: vom Studierendenausweis bis zum einfachen Zugang zu Verwaltungsleistungen. Dieses Gesetz ist der Anfang. Mit jeder neuen Anwendung wird die Brieftasche nützlicher."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Am Ende sollen die Menschen sagen: Ja, das macht mein Leben leichter. – Dafür machen wir Politik. Lassen Sie uns diesen Anspruch gemeinsam einlösen."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Der nächste Redner in dieser Debatte ist Tobias Ebenberger für die AfD-Fraktion."], ["comment", "(Beifall bei der AfD)"]]}, {"id": "ID219517700", "x": -4.637, "y": 1.285, "cluster": 0, "speaker": "Tobias Ebenberger", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/7", "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "top": "Tagesordnungspunkt 5", "drucksachen": ["21/7408"], "chars": 3802, "comments": 9, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517800", "ID219518100", "ID219517900", "ID219517600", "ID219518200"], "next": "ID219517800", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrte Damen und Herren Abgeordnete! Liebe Bürger! Das Digitale Identitätengesetz soll nun also den nationalen Rechtsrahmen für die Europäische Brieftasche und damit einhergehend die digitale Identität schaffen – eine digitale Identität auf Geheiß der EU,"], ["comment", "(Joachim Ebmeyer [CDU/CSU]: Bingo!)"], ["text", "ausgerechnet der Institution, die beispielsweise am liebsten unsere gesamte private digitale Kommunikation mitlesen möchte – Stichwort „Chatkontrolle“ – oder mit dem Digital Services Act und dem Democracy Shield systematisch den digitalen Raum zensiert."], ["comment", "(Beifall des Abg. Alexander Arpaschi [AfD] – Zuruf der Abg. Rebecca Lenhard [BÜNDNIS 90/DIE GRÜNEN])"], ["text", "Was kann da schon schiefgehen? Was für eine tolle Idee das alles ist, meine Damen und Herren. Nichts für ungut, aber von Ursula von der Leyen und ihrer Kommission würde ich mir persönlich noch nicht mal ein Ladekabel andrehen lassen und schon gar kein EU-weites digitales Identitätsökosystem."], ["comment", "(Beifall bei der AfD – Dr. Inge Gräßle [CDU/CSU]: Was sind Sie denn für ein Loser?)"], ["text", "Diese EU steht eben nicht für Innovation, Modernisierung und Fortschritt. Diese EU steht für Repression, Kontrolle und Krieg."], ["text", "Wie ich schon öfters betonte, geht es hier nicht allein darum, fortan ganz entspannt und schneller sein Auto an- und abzumelden oder seine Zeugnisse beglaubigen zu lassen. Hier geht es um die digitale Neuvermessung unseres gesamten Alltags. Wie hatte Frau von der Leyen bei der Ankündigung im Jahr 2020 gesagt – Zitat –: Eine digitale Identität für alles, „vom Steuern zahlen bis hin zum Fahrrad mieten“. Ja, diese digitale Identität soll überall zum Einsatz kommen: beim Amt, beim Arzt, bei Amazon. Doch dazu hat Sie kein Bürger jemals beauftragt; denn Sie haben dazu keinen Bürger jemals um seine Meinung gebeten."], ["comment", "(Beifall bei der AfD)"], ["text", "Stattdessen vermarktet der Digitalminister das Vorhaben wie einen Produktlaunch von Media Markt. Werfen wir mal einen Blick auf den Namen: In Deutschland soll diese digitale Identität „d-you“ heißen. „D“ für „digital“, „Deutschland“, „you“ solle die Nutzer in den Mittelpunkt stellen. Ich zitiere den Minister: „Mit d-you entwickeln wir eine digitale Anwendung, die echten Mehrwert bietet, den Menschen in den Mittelpunkt stellt und Vertrauen schafft.“ Natürlich, klar. Wen interessieren da noch Bedenken über die Datensicherheit und Datensouveränität, geschweige denn über das Missbrauchspotenzial?"], ["text", "Ich weiß, Sie betonen immer, das Ganze sei absolut freiwillig."], ["comment", "(Zuruf der Abg. Dr. Inge Gräßle [CDU/CSU])"], ["text", "Jawohl, das steht auch tatsächlich im Gesetz. Aber mit der Freiwilligkeit ist das eben immer so eine Sache. Die Nutzung von Kartenzahlung in einem Geschäft ist auch freiwillig. Wenn das Geschäft kein Bargeld annimmt, dann wird es ein bisschen schwierig, an der Kartenzahlung vorbeizukommen. Die Nutzung von SB-Kassen ist auch freiwillig. Wenn Sie sie aus Prinzip nicht nutzen möchten, müssen Sie in Kauf nehmen, dass Sie an einer der letzten verbliebenen Personalkassen eine Viertelstunde oder 20 Minuten in der Schlange stehen. Und auch die Coronaspritze war angeblich freiwillig."], ["comment", "(Rebecca Lenhard [BÜNDNIS 90/DIE GRÜNEN]: Zum Thema!)"], ["text", "Nur war man als Ungeimpfter dann eben – Zitat – „raus aus dem gesellschaftlichen Leben“, wie es 2022 der damalige saarländische Ministerpräsident der CDU, Tobias Hans, sagte. Nein, werte Kollegen, wer tatsächlich glaubt, die Nutzung der digitalen Identität bliebe wirklich freiwillig, glaubt auch, dass ein sehr bekannter Energydrink tatsächlich Flügel verleiht."], ["comment", "(Beifall bei der AfD)"], ["text", "Die bessere Option hat die AfD-Fraktion im Juni längst eingebracht. Wir fordern, die Pläne der EU für ihre digitale Identität zu durchkreuzen und eine nationale Wallet, ausschließlich zur Verbesserung von behördlichen Vorgängen, zu entwickeln. Analoge Alternativen wollen wir bewahren und deren vollumfängliche, gleichberechtigte Anerkennung jederzeit gewährleisten. So stellen wir sicher, dass der Staat den Bürgern die digitale Identität nicht per Salamitaktik aufnötigt und dann gegen sie scharf stellen könnte. Das ist die Brandmauer, die Deutschland braucht: eine Firewall für unsere Freiheit."], ["text", "Herzlichen Dank."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Der nächste Redner in dieser Debatte ist Parsa Marvi für die SPD-Fraktion."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"]]}, {"id": "ID219517800", "x": -4.619, "y": 1.39, "cluster": 0, "speaker": "Parsa Marvi", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/7", "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "top": "Tagesordnungspunkt 5", "drucksachen": ["21/7408"], "chars": 5169, "comments": 6, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518100", "ID219517700", "ID219517900", "ID219517600", "ID219518200"], "next": "ID219517900", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Liebe Kolleginnen und Kollegen! Wir alle kennen solche Situationen, und auch ich habe sie natürlich mehr als einmal erlebt: Sie wollen ein Paket bei der Post abholen und müssen nachweisen, wer Sie sind. Dann stellen Sie fest: Der Ausweis ist nicht da, sondern liegt zu Hause. Das Smartphone hat man dabei; aber das hilft einem in dem Moment auch nicht weiter. Und selbst wenn man den Ausweis dabeihat, zeigt man für einen einfachen Identitätsnachweis gleich den Namen, das Geburtsdatum, den Geburtsort, die Anschrift. Und wenn man den Ausweis umdreht, erfährt man auch etwas über die Augenfarbe und die Körpergröße. Vieles davon ist schlichtweg gar nicht erforderlich. – Genau hier kann die digitale Brieftasche einen echten Unterschied machen."], ["text", "Mit der d-you-Wallet sollen Bürgerinnen und Bürger künftig ihren Personalausweis, später auch den Führerschein und weitere Nachweise digital auf dem Smartphone nutzen können. Ab dem 2. Januar 2027 soll die Wallet zunächst über einen Soft Launch bereitstehen und anschließend Schritt für Schritt erweitert werden. Dabei geht es um mehr als nur darum, den Personalausweis einfach vom Portemonnaie auf das Smartphone zu übertragen. Der europäische Ansatz ist, eine digitale Identität zu schaffen, die auch grenzüberschreitend funktioniert, statt 27 voneinander getrennte Lösungen nebeneinanderzustellen."], ["text", "Wichtig ist – und das betone ich angesichts der Rede, die vorhin gehalten wurde –: Der physische Ausweis verschwindet natürlich nicht. Die Nutzung der Wallet bleibt freiwillig."], ["comment", "(Beifall bei Abgeordneten der SPD und der CDU/CSU)"], ["text", "Aber wir werben dafür, dass viele Bürgerinnen und Bürger diese Chance ergreifen und nutzen, weil sie einen Mehrwert bietet; denn die Wallet kann auch dafür sorgen, dass wir weniger persönliche Daten preisgeben müssen. Wenn ich beispielsweise nur nachweisen muss, dass ich über 18 Jahre alt bin, soll künftig genau diese eine Information reichen, ohne gleichzeitig Geburtsdatum, Geburtsort, Adresse und was weiß ich alles offenzulegen. Im Kern geht es um ein einfaches Prinzip: „So viele Daten wie nötig“ und nicht „so viele wie möglich“."], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Herr Kollege, es gibt eine Frage aus der AfD-Fraktion. Wollen Sie die zulassen?"], ["text", "Nein, ich möchte gerne fortfahren. – Der europäische Rechtsrahmen steht bereits mit der novellierten eIDAS-Verordnung. Mit dem Digitale Identitätengesetz schaffen wir nun die notwendigen nationalen Zuständigkeiten und Verfahren: Das Bundesministerium für Digitales und Staatsmodernisierung trägt die zentrale Verantwortung für die Bereitstellung der Wallet. Das BSI übernimmt wichtige Aufgaben bei Sicherheit und Zertifizierung. Das Bundesverwaltungsamt führt das Register der Beteiligten, und die Bundesnetzagentur übernimmt die Aufsicht über die Wallet-Anbieter. Zugleich wird geregelt, unter welchen Voraussetzungen Unternehmen und Behörden Informationen aus der Wallet abfragen dürfen. Wer das tun will, muss registriert sein und angeben, welche Daten zu welchem Zweck benötigt werden. Das ist ein wichtiger Schritt."], ["text", "Aber damit die Wallet dauerhaft auf Interesse stößt, muss sie mehr sein als ein digitaler Personalausweis auf dem Smartphone. Sie wird nur dann im Alltag ankommen, wenn sie konkrete und lebensnahe Anwendungen bietet. Deshalb darf es nicht bei Personalausweis und Führerschein bleiben. Die eigentliche Aufgabe beginnt danach: die schrittweise Integration weiterer Nachweise und Anwendungsfälle – überall dort, wo die Wallet Wege einfacher macht, Zeit spart und unnötige Dateneingaben vermeidet."], ["comment", "(Beifall bei Abgeordneten der SPD und der CDU/CSU)"], ["text", "Denn entscheidend wird sein, ob die Wallet lediglich technisch verfügbar ist oder ob sie zu einem selbstverständlichen Werkzeug im Alltag der Menschen wird."], ["text", "Dafür braucht es neben dem Nutzen vor allem Vertrauen. Sicherheit, Datenschutz und Datensparsamkeit sind keine Ergänzungen zu diesem Projekt; sie sind die zentrale Voraussetzung für den Erfolg. Wenn Menschen künftig ihren Personalausweis und weitere persönliche Nachweise auf dem Smartphone nutzen, müssen sie sich darauf verlassen können, dass diese Daten bestmöglich geschützt sind. Deshalb werden die Sicherheitsanforderungen und die Kontrolle über die eigenen Daten für uns als Bundestagsfraktion im parlamentarischen Verfahren ein zentraler Maßstab sein. Bürgerinnen und Bürger müssen nachvollziehen können, wer welche Informationen abfragt und wofür. Sie dürfen nicht dazu gedrängt werden, mehr preiszugeben, als tatsächlich erforderlich ist."], ["text", "Und wir müssen darauf achten, dass einzelne Nutzungsvorgänge nicht zu umfassenden Nutzungsprofilen miteinander verknüpft werden. Denn eine digitale Identität darf nicht dazu führen, dass wir im digitalen Raum mehr über uns offenlegen als heute mit dem Ausweis in der Hand."], ["comment", "(Beifall der Abg. Dr. Inge Gräßle [CDU/CSU])"], ["text", "Im Gegenteil: Wenn wir es richtig machen, kann die Wallet zu mehr Datensparsamkeit führen, und genau darin liegt ihre Chance."], ["comment", "(Beifall bei Abgeordneten der SPD und der CDU/CSU)"], ["text", "Wir unterstützen den Aufbau einer europäischen digitalen Identität. Wir wollen im parlamentarischen Verfahren gemeinsam mit der Union sicherstellen, dass ein gutes technisches Konzept mit einem sicheren, datensparsamen und vertrauenswürdigen Angebot für den Alltag verbunden ist. Denn am Ende wird sich die Wallet daran messen lassen müssen, ob sie funktioniert, ob sie sicher ist und ob die Menschen sie freiwillig und gerne nutzen."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der SPD und der CDU/CSU)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Die nächste Rednerin in dieser Debatte ist Rebecca Lenhard für die Fraktion Bündnis 90/Die Grünen."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219517900", "x": -4.563, "y": 1.417, "cluster": 0, "speaker": "Rebecca Lenhard", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/7", "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "top": "Tagesordnungspunkt 5", "drucksachen": ["21/7408"], "chars": 4114, "comments": 6, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517800", "ID219517700", "ID219518100", "ID219517600", "ID219518300"], "next": "ID219518000", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Sehr geehrte Abgeordnete! Unsere Demokratie steht unter Druck, und das nicht erst seit wenigen Wochen. Wir sehen das insbesondere seit den vergangenen Wahlen. Gleichzeitig wissen wir: Wenn wir einen Staat haben, der das Leben der Menschen einfacher macht, dann stärkt das auch das Vertrauen in die Demokratie. Deshalb bedeutet ein digital funktionierender Staat am Ende auch Demokratieschutz."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Was wir heute diskutieren, ist der nationale Rechtsrahmen der Wallet, die kommen soll: die d-you-Wallet; sie hat jetzt auch einen wundervollen Namen. Kommen soll sie am 2. Januar 2027. Ich hatte heute Morgen meiner argentinischen Freundin erzählt, dass ich heute dazu sprechen will. Sie war total schockiert, dass wir das nicht längst haben. Aber ich bin froh, dass sie jetzt auf den Weg gebracht wird. Die Frage ist nur, wie."], ["text", "Erst mal möchte ich mich bedanken, dass seit dem Referentenentwurf noch Verbesserungen in das Gesetz eingeflossen sind und dass auch geprüft wird, ob noch mehr Souveränitätskriterien aufgenommen werden können."], ["text", "Trotzdem muss ich sagen: Es gibt mehrere Fragezeichen, zum Beispiel, warum die App nicht von Anfang an im vollen Funktionsumfang bereitstehen wird. Denn am Ende muss man sagen: Das Vertrauen in digitale Produkte hat sich in der Vergangenheit nicht immer als Selbstläufer erwiesen. Es gab viele Digitalprodukte, die gescheitert sind, die die Menschen nicht genutzt haben. Vertrauen kann man nicht mit einem Update aufspielen. Deshalb ist Sicherheit von vornherein ein ganz wichtiges Gut."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Mit der Wallet sollen wir uns ausweisen können. Das Ziel ist, dass wir Verträge abschließen können. Aber es ist vor allem wichtig, dass sie datensparsam eingesetzt wird. Deswegen verstehe ich nicht ganz, warum zum einen die pseudonyme Nutzung nicht von Anfang an gegeben ist – das würde Vertrauen schaffen – und zum anderen der Zero-Knowledge-Proof noch nicht anwendbar ist. Was ist das? Das würde bedeuten, dass, wenn ich zum Beispiel ein Produkt kaufen möchte, das erst ab 18 ist, ich nicht meine vollständigen Ausweisdaten mit Geburtsdatum nennen muss, sondern einfach nur bestätigen kann: Ich bin 18. – Das wäre wichtig gewesen für das Vertrauen von Anfang an. Das fehlt, und das finde ich natürlich nicht gut."], ["text", "Ich hatte vorhin gesagt: Die Wallet werden wir alle nutzen können. Aber ich muss ein bisschen Wasser in den Wein gießen, wie man so sagt; denn leider wird die Wallet fürs Erste nur für Android und iOS verfügbar sein. Das halte ich für ein großes Problem; denn viele Menschen haben sich auf den Weg in Richtung Unabhängigkeit gemacht, und genau diese Menschen können die Wallet nicht von Beginn an nutzen. Da besteht auf jeden Fall Nachbesserungsbedarf."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Ich möchte auch noch die Kommunen erwähnen. Die Kommunen stehen derzeit enorm unter Druck. Die Kommunen sind der Ort, wo die Menschen Politik und den Staat direkt erleben. Meine Heimatstadt Nürnberg hat eine Haushaltssperre verhängt. Ich muss ganz klar sagen: Alles, was die Kommunen derzeit entlastet, hilft. Deshalb wäre es so wichtig, dass die Wallet zu einer echten Entlastung führt und nicht zu einer weiteren Belastung wird. Wenn ich aber direkt mit den Kommunen spreche, dann sagen die mir, dass sie zu dem Projekt, das schon in drei Monaten kommen soll, bisher nur allgemeine Informationen bekommen haben, obwohl die Menschen, wenn sie Fragen zum Einsatz der Wallet haben, bei den Kommunen aufschlagen werden. Deswegen sage ich an der Stelle ganz klar: Die Kommunen müssen dringend besser eingebunden werden."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Aus meiner Sicht kann das Vorzeigeprojekt der Bundesregierung nur erfolgreich sein, wenn es von Anfang an sicher, von Anfang datensparsam und von Anfang an verbraucher/-innenfreundlich ist und nicht erst irgendwann. Wir müssen mit dieser Wallet beweisen, dass Vertrauen in den Staat möglich ist. Nur dann kann dieses Projekt gelingen. Und Vertrauen kann man, wie gesagt, nicht im Nachhinein aufbauen; es muss von vornherein mitgedacht werden. Sie müssen an dieser Stelle noch einiges nacharbeiten. Wir freuen uns trotzdem auf die Beratungen."], ["text", "Bis dahin erst mal vielen Dank."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Die nächste Rednerin in dieser Debatte ist Sonja Lemke für die Fraktion Die Linke."], ["comment", "(Beifall bei der Linken)"]]}, {"id": "ID219518000", "x": -4.514, "y": 1.341, "cluster": 0, "speaker": "Sonja Lemke", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/7", "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "top": "Tagesordnungspunkt 5", "drucksachen": ["21/7408"], "chars": 3144, "comments": 6, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518200", "ID219517700", "ID219517800", "ID219517900", "ID219518100"], "next": "ID219518100", "paragraphs": [["text", "Sehr geehrte Zuhörende! Frau Präsidentin! Das EUDI-Wallet heißt jetzt also „d-you“ oder „dyou“? So genau weiß man das nicht."], ["comment", "(Dr. Inge Gräßle [CDU/CSU]: Doch, man weiß es ganz genau!)"], ["text", "Vielleicht ist das auch gar nicht so schlimm. Was schlimm ist, ist, dass die Kommunen jetzt, drei Monate vor dem geplanten Start, immer noch nicht wissen, wie sie das Ding überhaupt einbinden sollen. Wenn man die BundID hat, dann sei das ein Selbstläufer, heißt es aus dem Ministerium. Damit ist es aber eine reine Doppellösung; denn die BundID und den ePerso kann man bereits seit Jahren nutzen, um einen Teil der Verwaltungsleistungen digital zu erledigen, nur weiß das halt wirklich niemand. Das Problem dabei ist nicht die verfügbare Technik, es ist die Kommunikation und das Wissen. Da muss man ran."], ["comment", "(Beifall bei der Linken)"], ["text", "Doch stattdessen wird eine komplett neue Lösung geschaffen, bei der es von Anfang an fragwürdige Entscheidungen gab, angefangen mit der Vergabe an die SPRIND, ursprünglich gedacht für reine Wirtschaftsförderung, die – man kann es nicht oft genug sagen – durch ein eigenes Gesetz von den normalen Compliance-Regeln befreit ist. Und ob es dort dann Interessenkonflikte gibt – wer weiß?"], ["text", "Die SPRIND hat nun die technische Entscheidung getroffen, signierte Daten zu verwenden. Das heißt, auf allen Daten, die man mit dem EUDI-Wallet überträgt, ist ein staatliches Echtzeitsiegel. Das kann man dann auch munter weitergeben, und wir wissen, wie schon jetzt selbst mit höchst sensiblen Standortdaten weltweit gehandelt wird. Damit soll man sich jetzt nicht nur bei der Verwaltung identifizieren, sondern auch bei Unternehmen. Diese Unternehmen können frei entscheiden, welche Daten sie gerne abfragen möchten, ohne dass es überprüft wird. Es wird lediglich registriert, und jeder kann das einsehen, in der Hoffnung, die Zivilgesellschaft werde es schon irgendwie richten. Wer so Daten schützen will, der lässt auch sein Fahrrad unangeschlossen draußen stehen, in der Hoffnung, dass schon irgendjemand klingeln wird, wenn es geklaut wird. Das kann doch wirklich nicht Ihr Ernst sein!"], ["comment", "(Beifall bei der Linken)"], ["text", "Das Mindeste, was es braucht, ist, dass die Unternehmen nur die Daten abrufen können, zu deren Erhebung sie verpflichtet sind. Für Banken und Mobilfunkanbieter zum Beispiel, die zwingend die Identität prüfen müssen, ist das sinnvoller als das Video-Ident-Verfahren, wo mit dem Perso vor einer Kamera herumgewedelt wird. Für den Rest muss es die Möglichkeit geben, Pseudonyme zu verwenden, um nur minimale Infos preiszugeben, wie zum Beispiel, dass man volljährig ist, ohne das Geburtsdatum zu übermitteln. Diese Möglichkeit darf auch nicht dazu führen, dass man sich am Ende in jeder Ecke des Internets authentifizieren muss und ein Teil der Bevölkerung einfach aufgrund des Alters komplett ausgeschlossen wird. Da muss es klare Grenzen geben."], ["comment", "(Beifall bei der Linken)"], ["text", "Herr Wildberger, so wie es jetzt aussieht, können Sie die EUDI-Wallet unmöglich am 2. Januar 2027 an den Start gehen lassen. Stoppen Sie diesen Termin! Nehmen Sie sich Zeit, das vernünftig zu machen. Setzen Sie sich auf EU-Ebene dafür ein, dass die Fristen verschoben werden; denn wenn diese hochsensiblen Daten einmal im Umlauf sind, dann kann man sie nicht mehr zurückholen."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der Linken)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Der nächste Redner in dieser Debatte ist Dr. Markus Reichel für die Unionsfraktion."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219518100", "x": -4.398, "y": 1.591, "cluster": 0, "speaker": "Dr. Markus Reichel", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/7", "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "top": "Tagesordnungspunkt 5", "drucksachen": ["21/7408"], "chars": 3019, "comments": 7, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219517800", "ID219517600", "ID219517700", "ID219517900", "ID219518300"], "next": "ID219518200", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Liebe Kolleginnen und Kollegen! Zunächst, Frau Lemke: Das Ding, wie Sie sagten, heißt „d-you“. Und ich muss sagen: Ich bin Ihnen, Herr Minister, ausgesprochen dankbar, dass wir dank Ihrer Arbeit und der Arbeit Ihres Ministeriums heute darüber und über dieses Gesetz sprechen können. Vielen Dank dafür."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD – Felix Schreiner [CDU/CSU]: Endlich mal gute Laune hier!)"], ["text", "Denn es wird unser tägliches Leben verändern, und zwar zum Besseren."], ["text", "Ein paar Beispiele: Wenn ich heute ein Auto ausleihe, muss ich meinen Führerschein persönlich vorlegen. Wenn meine Frau in der Sitzungswoche ein Einschreiben für mich abholen will, dann braucht sie eine schriftliche Vollmacht von mir. Das ermöglichen wir künftig online, digital, sicher und mit wenigen Klicks. Genau deswegen führen wir jetzt die digitale Brieftasche, die „d-you“-Wallet ein."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Sie ist nicht einfach nur eine neue App fürs Handy, sondern der Anfang einer digitalen Infrastruktur, mit der wir alle irgendwann jeden Nachweis, den wir besitzen, genauso einfach, aber viel sicherer – Herr Minister, Sie haben es gesagt – vorzeigen können, sicherer als ein Dokument aus Papier."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["text", "Um das möglich zu machen, beraten wir heute dieses Gesetz. Denn es geht darum, den rechtlichen Rahmen dafür, wie Bürger, Unternehmen und Staat künftig mit sicheren digitalen Identitäten zusammenarbeiten können, zu schaffen, und das europaweit. Das ist großartig."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Ganz konkret: Ab dem 2. Januar 2027 soll die staatliche Wallet starten. Man kann sie sich vorstellen wie ein digitales Portemonnaie, aber statt Plastikkarten liegen darin Nachweise: zuerst der Personalausweis, später Führerschein, Rentenausweis, Zeugnisse. Denn eine Wallet, die nur den Ausweis zeigen würde, wäre eben noch kein Fortschritt. Den Unterschied merkt man erst, wenn man damit wirklich etwas erledigen kann. Deswegen ist es auch so wichtig, dass immer mehr Behörden, Kommunen und Unternehmen diese Nachweise sowohl ausstellen als auch annehmen werden. Das ist dann der Fortschritt: kein Behördengang mehr, kein Papier, kein Scannen, kein Warten. So erhöhen wir ganz konkret die Lebensqualität in unserem Land."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Ich weiß, dass viele Bürgerinnen und Bürger die Sorge haben: Ist das denn sicher? Wer sieht, was ich vorzeige? – Diese Fragen sind nachvollziehbar. Aber die digitale Brieftasche ist eben keine Bedrohung für Sicherheit und Datenschutz. Ganz im Gegenteil, sie erhöht Sicherheit und Datenschutz; denn sie wird beides können: einfacher nachweisen und weniger preisgeben. Ein Beispiel: Wenn junge Erwachsene im Klub oder im Laden ihr Alter nachweisen müssen, dann zeigen sie heute ihren ganzen Ausweis. Künftig ist es nur noch die Abfrage: über 18 – ja oder nein. Der klassische Ausweis bleibt, die digitale Brieftasche ist hier eine Ergänzung."], ["text", "Die Wallet ist also ein enormer Schritt für die digitale Infrastruktur Deutschlands und der EU. Und ich hoffe, dass wir bald auch unseren digitalen Abgeordnetenausweis in die Wallet hineinbringen können."], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Die Redezeit."], ["text", "Ich bitte alle Fraktionen um eine konstruktive Beratung dieses Gesetzentwurfs."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der CDU/CSU und der SPD)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Der nächste Redner in dieser Debatte ist Steffen Janich für die AfD-Fraktion."], ["comment", "(Beifall bei der AfD)"]]}, {"id": "ID219518200", "x": -4.509, "y": 1.381, "cluster": 0, "speaker": "Steffen Janich", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/7", "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "top": "Tagesordnungspunkt 5", "drucksachen": ["21/7408"], "chars": 2505, "comments": 4, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518000", "ID219517700", "ID219517800", "ID219518100", "ID219517900"], "next": "ID219518300", "paragraphs": [["text", "Frau Präsidentin! Meine Damen und Herren! Mit dem vorliegenden Digitale Identitätengesetz soll das europäische EUDI-Wallet in deutsches Recht überführt werden. Darunter versteht man jene digitale Brieftasche, die künftig Personalausweis, Führerschein, Zeugnisse und noch viel mehr beinhalten soll. Die Bundesregierung behauptet, dies führe zu wesentlichen Vereinfachungen für den Bürger in vielfältigen Lebens- und Wirtschaftslagen."], ["text", "Wir als AfD sehen dieses Gesetz differenzierter. Zur Wahrheit gehört: Es gibt an diesem Gesetz auch Positives. Nach Angaben der Bundesregierung sinkt der jährliche Zeitaufwand für die Bürger um 3,9 Millionen Stunden. Bürokratieabbau ist das, was wir gerade für unsere Wirtschaft von Beginn an fordern und begrüßen."], ["text", "Zur Wahrheit gehört aber auch: Die vielbeschworene Freiwilligkeit der Wallet ist auf dem Papier verbrieft; aber in der Praxis sieht das anders aus. Digitalminister Wildberger konnte in der Regierungsbefragung letztes Jahr nicht garantieren, dass aus der Wallet nicht doch ein faktischer Zwang entsteht, etwa über den schleichenden Abbau analoger Alternativen. Wir kennen eine derartige digitale Zwangsverpflichtung bereits leidlich aus dem Onlinezugangsgesetz."], ["text", "Kritisch sehen wir auch die Gefahr, dass ausstellende Behörden nachvollziehen können, wann und wo Bürger ihre digitale Identität nutzen. Genau das haben wir bereits vergangenes Jahr in unserer Kleinen Anfrage hinterfragt, ohne eine befriedigende Antwort der Bundesregierung zu erhalten."], ["comment", "(Beifall bei der AfD)"], ["text", "Abschließend sei noch erwähnt: Deutschland ist nicht Pakistan. Berlin ist noch nicht Pakistan. Aber in Pakistan hat die Regierung bereits als Reaktion auf regierungskritische Proteste Tausende computerisierte nationale Personalausweise sperren lassen. Das sollten wir, besonders nach dem Wahlsieg der Linken in Berlin, niemals vergessen!"], ["comment", "(Beifall bei der AfD)"], ["text", "Meine Damen und Herren, wir haben es Ihnen erst im Juni dieses Jahres vorgelegt: Wir fordern den Stopp der Umsetzung der EUDI-Wallet und stattdessen eine rein nationale, auf Verwaltungsvorgänge begrenzte digitale Lösung – bei vollem Erhalt gleichwertiger analoger Wege. Das ist nicht rückständig, das ist die konsequente Fortsetzung dessen, was wir als AfD immer vertreten haben: das Recht auf ein analoges Leben, Bargeld als Freiheit und Schutz vor Totalüberwachung – Grundsätze, die wir fest in unserem Wahlprogramm verankert haben."], ["text", "Die AfD-Fraktion stuft den Gesetzentwurf daher als grundrechtlich riskant und in der vorliegenden Form nicht zustimmungsfähig ein."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsidentin Andrea Lindholz:"], ["chair", "Der nächste und letzte Redner in dieser Debatte ist für die Unionsfraktion Hansjörg Durz."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219518300", "x": -4.382, "y": 1.576, "cluster": 0, "speaker": "Hansjörg Durz", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/7", "agenda": "Zur Durchführung der unionsrechtlichen Vorschriften über die Europäische Brieftasche für die Digitale Identität sowie zur Änderung anderer Rechtsvorschriften (Digitale Identitätengesetz – DIdG)", "top": "Tagesordnungspunkt 5", "drucksachen": ["21/7408"], "chars": 2832, "comments": 4, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219518100", "ID219517600", "ID219517700", "ID219517800", "ID219517900"], "next": "ID219518400", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Verehrte Kolleginnen und Kollegen! Meine sehr geehrten Damen und Herren! Wenn man die Debatte so verfolgt, ist es immer wieder erstaunlich, zu sehen, wie versucht wird, selbst Lösungen, die von internationalen
