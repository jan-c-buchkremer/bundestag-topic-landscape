nungspunkt 1", "drucksachen": [], "chars": 656, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219510800", "ID219511400", "ID219504000", "ID219508800", "ID219510400"], "next": "ID219511900", "paragraphs": [["text", "Vielen Dank. – Sehr geehrter Herr Minister, ich hätte eine Frage zur zeitlichen Planung. Wir werden ja das HiB-Gesetz verabschieden, um die Entbürokratisierung voranzutreiben. Dort gibt es eine Regelung für die Kinder- und Jugendpsychotherapie, nämlich dass in der Bedarfsplanung es zukünftig so sein wird, dass, wenn ein Psychotherapeut für Kinder aufhört, sich keiner für Erwachsene niederlassen kann, sondern es soll eine gesonderte Bedarfsplanung für Erwachsene und für Kinder geben. Wann soll dieses HiB-Gesetz, dieses sehr wichtige und wesentliche Gesetz für die bessere Versorgung von Kindern bei der Psychotherapie, verabschiedet werden und kommen?"]]}, {"id": "ID219511900", "x": -5.646, "y": -4.009, "cluster": 7, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 724, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219512700", "ID219503300", "ID219512100", "ID219503100", "ID219500900"], "next": "ID219512100", "paragraphs": [["text", "Vielen Dank für die Frage. – Wichtig ist, dass wir die 112, die von vielen Menschen angerufen wird, verbinden mit der digitalen Ersteinschätzung und auch mit der 116 117, dass das als ganzheitliches System verstanden wird. Darüber hinaus ist es, glaube ich, wichtig, im Rettungsdienst Verbesserungen zu schaffen. Und drittens müssen wir bei den Integrierten Notfallzentren vorangehen, sodass Menschen, die einen Befund haben, einen Ansprechpartner haben, der entscheidet, ob sie wirklich in die Notaufnahme müssen oder zum Bereitschaftsdienst der KV. Ich erhoffe mir sehr viel davon, muss aber ehrlich sagen: Das alles geht nicht von heute auf morgen. Aber diese Reform ist zentral für eine bessere Steuerung in Deutschland."]]}, {"id": "ID219512100", "x": -5.847, "y": -3.915, "cluster": 7, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 738, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219512700", "ID219503300", "ID219503100", "ID219511900", "ID219512400"], "next": "ID219512200", "paragraphs": [["text", "Zur Wahrheit gehört, dass, glaube ich, schon zwei oder sogar drei Minister vor mir, die für Gesundheit zuständig waren, sich mit dieser Notfallreform beschäftigt haben. Und natürlich geht es bei den Ländern vor allen Dingen auch um das Thema Finanzen. Ich verstehe das auch, weil es natürlich beim Rettungsdienst jetzt die Neuerung gibt, dass es nicht mehr diese bekannten Leerfahrten gibt, sondern dass es auch Vergütungen geben wird für einzelne Phasen, etwa wenn jemand vor Ort hilft. Ich glaube, das wird noch mal zu einer Auseinandersetzung mit den Ländern führen, wie wir das finanzieren. Das wissen die Länder, das wissen wir. Aber das Ziel ist wichtig – und da sind wir uns einig –, nämlich eine bessere Versorgung in Deutschland."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Zu einer Nachfrage hat das Wort der Abgeordnete Dr. Janosch Dahmen."]]}, {"id": "ID219512200", "x": -4.081, "y": -3.406, "cluster": -1, "speaker": "Dr. Janosch Dahmen", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 614, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503800", "ID219513000", "ID219504000", "ID219512100", "ID219512400"], "next": "ID219512400", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Sehr geehrter Herr Minister, in Ihrer Heimat, in Ostwestfalen, kämpfen viele Rettungsdienste mit akuten Finanzierungsfragen. Die ergeben sich nicht nur ganz generell aus der Frage der Refinanzierbarkeit von Gebühren und Leerfahrten, sondern auch durch das Beitragssatzstabilisierungsgesetz und die Deckelung, die dort beim Rettungsdienst vorgesehen ist. Planen Sie, im parlamentarischen Verfahren, vor Verabschiedung hier im Bundestag, bei der Finanzierung des Rettungsdienstes zu einer stabilen Änderung zu kommen? Oder wollen Sie das erst im Bundesrat mit den Ländern verhandeln?"]]}, {"id": "ID219512400", "x": -5.586, "y": -4.126, "cluster": 7, "speaker": "Emmi Zeulner", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 586, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219512700", "ID219512100", "ID219511900", "ID219512800", "ID219503300"], "next": "ID219512700", "paragraphs": [["text", "Vielen herzlichen Dank. – Lieber Herr Minister, Sie nehmen jetzt eine Aufgabe an – nämlich, die Notfallreform auf den Weg zu bringen –, die jahrelang einfach nicht bearbeitet wurde, auch unter der Ampel leider liegen geblieben ist."], ["comment", "(Zuruf der Abg. Sabine Dittmar [SPD])"], ["text", "Deswegen ist das ein wichtiger Schritt."], ["text", "Wozu ich Sie gerne fragen wollen würde, ist das Thema der Kompetenzen. Also, die Notfallsanitäter in unserem Land haben vielfältige Kompetenzen. Stimmen Sie mir zu, dass wir diese Kompetenzen stärker nutzen müssen? Zum Beispiel, dass sie fallabschließend auch am Unfallort behandeln können, wenn es zulässig ist."]]}, {"id": "ID219512700", "x": -5.645, "y": -3.847, "cluster": 7, "speaker": "Dr. Carsten Linnemann", "fraction": "CDU/CSU", "role": "Bundesminister für Gesundheit", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 728, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219512100", "ID219503300", "ID219503100", "ID219511900", "ID219500900"], "next": "ID219512800", "paragraphs": [["text", "Ich glaube, dass die Notfallreform, gepaart mit den Krankenhausgesetzen, zu den größten Strukturreformen dieses Landes im Gesundheitsbereich gehören wird. Machen wir uns nichts vor: Das wird eine ganz große Kraftanstrengung. Denken wir an die Integrierten Notfallzentren: Die werden wir nicht von heute auf morgen überall schaffen können. In meinem Wahlkreis beispielsweise ist so was schneller machbar, weil auch die Historie so ist, dass der Bereitschaftsdienst dort schon in der Nähe ist. Wir müssen das ja aber auch baulich hinbekommen. Aber durch die neuen Möglichkeiten der künstlichen Intelligenz, der Digitalisierung, –"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Minister."], ["text", "– die wir mitdenken müssen, bin ich guter Dinge, dass wir hier einen vernünftigen Wurf hinbekommen."], ["comment", "(Beifall bei der CDU/CSU)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Die nächste Nachfrage hat der Abgeordnete Dr. Armin Grau."]]}, {"id": "ID219512800", "x": -4.72, "y": -3.764, "cluster": 5, "speaker": "Dr. Armin Grau", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 697, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219503800", "ID219511100", "ID219500900", "ID219504000", "ID219504300"], "next": "ID219513000", "paragraphs": [["text", "Vielen Dank für die Möglichkeit der Nachfrage. – Herr Minister, wir haben ein Koordinierungsdefizit im deutschen Gesundheitswesen: in der Notfall-, aber auch in der Regelversorgung. Deswegen ist es wichtig – das haben Sie angekündigt –, dass es ein Primärversorgungssystem geben wird. Ich möchte Sie fragen: Wie ist Ihr konkreter Zeitplan? Wann werden Sie einen Gesetzentwurf vorlegen? Wird dieser Gesetzentwurf dann auch regeln, wie Menschen in allen Regionen in Deutschland in guter Erreichbarkeit eine primärversorgende Praxis erreichen werden?"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Abgeordneter, kommen Sie zum Ende."], ["text", "Und wird dieser Gesetzentwurf auch einen Leistungskatalog mit wesentlichen Versorgungsaufgaben und ein Qualitätsmonitoring enthalten? – Vielen Dank."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219513000", "x": -3.814, "y": -3.09, "cluster": -1, "speaker": "Nicole Hess", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 547, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219512200", "ID219504800", "ID219503600", "ID219512100", "ID219517000"], "next": "ID219513600", "paragraphs": [["text", "Herzlichen Dank, Frau Präsidentin. – Herr Linnemann, ich komme noch einmal zurück auf mein Lieblingsthema, die Datengrundlagen. Ich bin doch ein bisschen entsetzt, dass wir zwar die Anzahl der Leerfahrten im Bereich des Rettungsdienstes bundesweit senken wollen, aber dazu laut Aussage des BMG keine Zahlen haben. Ich meine, die Zahlen liegen ja in den Ländern vor. Meiner Ansicht nach wäre es originäre Aufgabe der Bundesregierung, diese zusammenzutragen. Wann werden Sie das veranlassen, damit wir auch hier eine Arbeitsgrundlage haben? – Danke."]]}, {"id": "ID219513600", "x": -3.179, "y": -1.971, "cluster": -1, "speaker": "Kay-Uwe Ziegler", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 713, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219509800", "ID219504800", "ID219517700", "ID219500700", "ID219518100"], "next": "ID219513800", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Herr Minister Linnemann, Sie sprachen ja gerade von Daten und Corona. Ich sitze in der Corona-Enquete-Kommission. Wir haben Ende letzten Jahres nachgefragt, wie es mit den Protokollen zu Wirkungen/Nebenwirkungen der Impfstoffe aussieht. Es wurde uns erst gesagt, es gebe keine. Dann wurde Anfang des Jahres 2026 gesagt, es gebe doch welche. Und seit diesem Zeitpunkt warten wir darauf, dass wir diese Protokolle bekommen. Könnten Sie sich bitte dafür einsetzen, dass der Corona-Enquete-Kommission diese Daten zur Verfügung gestellt werden? Sie sagen: Wir brauchen Daten. – Wir haben Daten und würden sie gerne benutzen."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Abgeordneter, der Herr Minister kann jetzt antworten."], ["text", "Vielleicht könnten Sie sich dafür einsetzen. – Vielen Dank."]]}, {"id": "ID219513800", "x": -5.608, "y": 0.176, "cluster": 3, "speaker": "Agnieszka Brugger", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1039, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219513900", "ID219500800", "ID219501500", "ID219500900", "ID219501400"], "next": "ID219513900", "paragraphs": [["text", "Vielen Dank, Frau Präsidentin. – Herr Minister, Russlands barbarischer Krieg in der Ukraine eskaliert eigentlich Woche für Woche und gleichzeitig der Schattenkrieg gegen unser Land und gegen eine Reihe von europäischen Partnern. Ich formuliere diplomatisch: Das transatlantische Verhältnis hat schon bessere Zeiten gesehen."], ["text", "Die Antwort auf all das ist ja mehr europäische Stärke, Souveränität und Zusammenarbeit. Gleichzeitig erlebe ich immer wieder im Gespräch mit Bürgerinnen und Bürgern die Wahrnehmung, dass die Zusammenarbeit – ich nenne zum Beispiel das Prestigeprojekt von Deutschland und Frankreich, das Kampfflugzeug FCAS, welches gescheitert ist – irgendwie nicht so funktioniert, wie sie sollte. Vieles muss schnell gehen, vieles wird dann doch eher national gemacht. Verschiedene Hauptstädte zeigen immer mit dem Finger auf die anderen."], ["text", "Was ist denn aber unser deutscher Beitrag für genau diese europäische Stärke und Souveränität und dafür, dass dies dann auch schnell, interoperabel, klug und marktverfügbar umgesetzt wird?"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219513900", "x": -5.601, "y": 0.395, "cluster": 3, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1173, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219513800", "ID219501500", "ID219500800", "ID219514100", "ID219510100"], "next": "ID219514000", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrte Frau Kollegin, Sie beschreiben eines unserer großen Dilemmata, in denen wir gerade agieren. Einerseits wollen alle Nationalstaaten ihre nationalen Industrien stützen, auch im Bereich der Rüstungsindustrie. Gleichzeitig wollen alle – und das begrüße ich sehr – eben auch europäische Rüstungskooperationsprojekte, die wir dringend brauchen, sowohl zur Synergiesteigerung als auch zum Zwecke der Interoperabilität innerhalb der europäischen NATO-Alliierten. Dieses Dilemma aufzulösen, ist nicht banal, wie Sie sich denken können."], ["text", "Es gibt viele gute Beispiele. Wir arbeiten bei Odin’s Eye und bei JEWEL mit den Franzosen zusammen. Wir arbeiten mit Großbritannien und den Franzosen bei DPS und vielen anderen Dingen zusammen. Also: Es gibt die guten Beispiele. Aber es gibt eben leider auch einige, gerade die aus der Vergangenheit, die nicht so aufgesetzt waren, dass sie bis heute tragen."], ["text", "Unser Auftrag ist, für die Zukunft dafür zu sorgen, dass unsere Souveränität als Europäer und unsere Unabhängigkeit stärker ausgeprägt werden, ohne dass wir jemals das Ziel haben sollten, von unseren amerikanischen Alliierten komplett unabhängig zu sein."]]}, {"id": "ID219514000", "x": -5.432, "y": -1.756, "cluster": -1, "speaker": "Agnieszka Brugger", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 561, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219513800", "ID219505200", "ID219504000", "ID219512400", "ID219517000"], "next": "ID219514100", "paragraphs": [["text", "Vielen Dank, Herr Minister. – Gleichzeitig hat es niemanden, der sich mit dem ganzen Komplex FCAS beschäftigt hat, überrascht, dass das Projekt an einem gewissen Punkt zum Ende gekommen ist. Gerade auch, damit nicht der Eindruck einer europäischen Handlungsschwäche bei den Menschen in Europa übrig bleibt, hätte man sich gewünscht, dass mit dem Scheitern auch eine Lösung aufgezeigt wird, wie es europäisch weitergeht. Ich weiß, das beschäftigt Sie sehr. Aber die Frage wäre dann: Wann bekommen wir denn hier eine Antwort, was die europäische Lösung sein wird?"]]}, {"id": "ID219514100", "x": -5.41, "y": 0.5, "cluster": 3, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 632, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219513900", "ID219501500", "ID219500800", "ID219510100", "ID219500700"], "next": "ID219514300", "paragraphs": [["text", "Das ist eine berechtigte Frage, sehr geehrte Frau Kollegin. Es gibt nicht so viele Projekte, in die wir einsteigen könnten. Es gibt daneben die Möglichkeit, ein eigenes mit anderen Partnern aufzusetzen. Wir sind gerade in der Sondierung, welche Möglichkeiten für uns am effektivsten, am schnellsten und auch am kostengünstigsten sind. Auch das ist keine banale Frage, zumal wir nicht über ein Kampfflugzeug der fünften, sondern der sechsten Generation reden. Dessen Spezifikation kann heute noch gar keiner so richtig beschreiben, aber man kennt die Grundanforderungen. Das jetzt aufzulösen, ist der Auftrag für die nächsten Monate."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Dazu gibt es noch eine Nachfrage von dem Abgeordneten Dr. Rainer Kraft."]]}, {"id": "ID219514300", "x": -6.756, "y": 1.105, "cluster": -1, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 538, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515300", "ID219500800", "ID219517000", "ID219516200", "ID219500400"], "next": "ID219514400", "paragraphs": [["text", "Sehr geehrter Herr Abgeordneter, Sie werden verstehen, dass ich Ihnen keine Prozentzahl oder Stückzahl sagen kann. Was ich Ihnen aber sagen kann, ist, dass wir schon vor einigen Jahren begonnen haben, sehr genau hinzusehen, in welchen nicht sicherheitsrelevanten Bereichen wir mit chinesischen Produkten arbeiten können, um gleichzeitig hinzusehen, dass sie in jedem auch nur latent sicherheitsrelevanten Bereich ausgeschlossen werden. Das ist sehr erfolgreich; das tun wir sehr effektiv. Ich kann Ihnen aber keine konkreten Zahlen sagen."], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Dann kommen wir zur nächsten Hauptfrage. Die stellt für die SPD-Fraktion die Abgeordneten Sabine Dittmar."]]}, {"id": "ID219514400", "x": -6.243, "y": 1.26, "cluster": -1, "speaker": "Sabine Dittmar", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 590, "comments": 0, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219514500", "ID219507800", "ID219516300", "ID219516700", "ID219510000"], "next": "ID219514500", "paragraphs": [["text", "Meine Frage geht an Bundesminister Pistorius. Jeder Fall von sexualisiertem Fehlverhalten in der Bundeswehr ist einer zu viel und darf keinen Platz haben. Deshalb ist es auch gut, dass die Dunkelfeldstudie in Auftrag gegeben worden ist und die Ergebnisse jetzt sehr zeitnah vorliegen. Meine Frage an Sie ist: Wie wollen Sie sicherstellen, dass wir mit der Studie nicht nur eine Lagefeststellung erhalten, sondern dies auch wirklich der Auftakt zu einem neuen Umgang mit sexualisiertem Fehlverhalten ist? Und können Sie uns erläutern, wie dadurch ein Rückgang der Fallzahlen zu bewirken ist?"]]}, {"id": "ID219514500", "x": -6.297, "y": 1.367, "cluster": -1, "speaker": "Boris Pistorius", "fraction": "SPD", "role": "Bundesminister der Verteidigung", "date": "2026-09-23", "agenda_id": "21/95/2", "agenda": "Befragung der Bundesregierung", "top": "Tagesordnungspunkt 1", "drucksachen": [], "chars": 1395, "comments": 1, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219500800", "ID219516200", "ID219514400", "ID219516700", "ID219516400"], "next": "ID219514800", "paragraphs": [["text", "Frau Präsidentin! Sehr geehrte Frau Kollegin, ich stimme völlig mit Ihnen überein: Jeder Vorfall sexualisierten Fehlverhaltens, ganz egal auf welchem Level, ist einer zu viel. – Gleichzeitig brauchen wir die Studie nicht, um zu erkennen, dass Handlungsbedarf besteht; dem sind wir schon vor zwei Jahren durch eine neue Richtlinie zum Umgang mit sexualisiertem Fehlverhalten nachgekommen."], ["text", "Gleichzeitig hat es Fälle aus der Vergangenheit, auch aus der jüngeren Vergangenheit, gegeben, die danach aufgeploppt sind. Wir gehen damit sehr konsequent um. Unser Ziel muss sein und ist es, auch mithilfe der Studie, die dann vorliegen wird, noch mal klar zu schauen: Wo liegen die Verantwortlichkeiten? Wo liegen die Mechanismen? Inwieweit können wir den Opferschutz wirklich so machen, dass die Opfer von sexualisiertem Fehlverhalten am Ende nicht noch von Karrierenachteilen betroffen sind?"], ["text", "Aber vor allen Dingen geht es immer auch um die Rolle der Vorgesetzten auf allen Ebenen, darum, dass konsequent eingeschritten wird, dass nicht negiert wird, nicht verdrängt wird, nicht aus falscher Kameradschaft weggeschaut wird, sondern dass sehr konsequent durchgegriffen wird. Warum? Weil es um unsere Werte aus dem Grundgesetz geht. Es geht um Menschenwürde, um Kameradschaft und darum, sicherzustellen, dass Frauen wie Männer –"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Herr Minister."], ["text", "– sicher in dieser Bundeswehr arbeiten und ihren Dienst verrichten können."], ["comment", "(Beifall bei der SPD sowie der Abg. Diana Herbstreuth [CDU/CSU])"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Danke. – Sie können noch eine Nachfrage stellen."]]}, {"id": "ID219514800", "x": -7.999, "y": 0.783, "cluster": 4, "speaker": "Dr. Gottfried Curio", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 5109, "comments": 11, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515800", "ID219514900", "ID219515200", "ID219515100", "ID219515400"], "next": "ID219514900", "paragraphs": [["text", "Sehr geehrte Präsidentin! Meine Damen und Herren! In einer Zeit, in der es in der Hauptstadt jede Woche Schießereien und täglich zehn Messerangriffe gibt – die Hälfte der Täter Ausländer –, plant die Linkspartei in Berlin eine komplette Kehrtwende in der inneren Sicherheit. Im Wahlprogramm heißt es, man wolle die immer weitere Aufrüstung der Polizei stoppen, die Mittel umverteilen und Polizeiarbeit durch Sozialarbeit ersetzen."], ["text", "Fakt ist: Kriminelle, Judenfeinde und Islamisten wollen in Berlin schon demografisch endlich eine Interessenvertretung. Und diese Partei, Die Linke, will liefern: komplette Aushöhlung der Sicherheitsstrukturen in der Stadt, die als Schwerpunkt Organisierter Kriminalität und migrantischer Clanstrukturen gilt; eine Partei, die Polizeiarbeit als „Repression“ versteht, die es zurückzufahren gelte. Einer solchen Partei die Aufsicht über die innere Sicherheit anzuvertrauen, das hieße wahrlich, den Bock zum Gärtner zu machen."], ["comment", "(Beifall bei der AfD – Zuruf des Abg. Sebastian Fiedler [SPD])"], ["text", "Die kameragestützte Überwachung im öffentlichen Raum soll nach Willen der Linken wieder abgebaut werden, die polizeiliche Ausweisung besonders kriminalitätsbelasteter Orte ebenso, weil die dortigen Kontrollen zu rassistischer Diskriminierung führten. Man kommt nicht umhin, zu bemerken, dass hier offenbar die Täternähe der Partei bei ihren Forderungen die Feder geführt hat."], ["text", "Wer Polizeiarbeit durch Sozialarbeit und Dialogformate ersetzen will, hat offensichtlich kein Interesse an der Bekämpfung der Kriminalität. Stattdessen will man die Kompetenzen derjenigen Instanzen ausbauen, die die Polizei überwachen sollen, wie der Bürger- und Polizeibeauftragte. Das passt ins für Die Linke typische polizeifeindliche Bild – genau passend für SPD und Grüne. Die wollen da natürlich gerne als Steigbügelhalter fungieren."], ["comment", "(Beifall bei der AfD)"], ["text", "Die Spitzenkandidatin hält schon den Begriff „Clankriminalität“ für „problematisch“. Razzien in Shishabars sind da nur Diskriminierung. Auch den Begriff „Integration“ lehnt Die Linke als „einseitige Anpassungsleistung“ ab. Was man will, ist der absolute Abschiebestopp. Zitat: „Jede Abschiebung ist eine zu viel.“ Die Partei der Inländerfeinde fordert Bleiberecht für alle – genau passend für SPD und Grüne. Um noch effektiver gegen die Berliner arbeiten zu können, will die Partei Die Linke Wahlrecht für alle in Berlin lebenden Personen, unabhängig von der Staatsbürgerschaft –"], ["comment", "(Zurufe von der Linken)"], ["text", "streng verfassungswidrig, genau passend für alle Inländerfeinde, genau passend für SPD und Grüne."], ["text", "Illegale Wohnungsbesetzung soll zu dauerhaftem Wohnrecht führen, also Unrecht zu Recht machen. Sind es am Ende einfach Merkel-Fans?"], ["comment", "(Heiterkeit des Abg. Bernd Schattner [AfD])"], ["text", "Die Großunterkünfte wie Tegel sollen aufgelöst werden zugunsten der Unterbringung in Wohnungen, die man vorher enteignet. Die Linke ist die Partei, die maximale Wohnungsnot schafft. Wir sagen: Abschieben schafft Wohnraum!"], ["comment", "(Beifall bei der AfD)"], ["text", "Über 50 Prozent der muslimischen Wähler haben in der Berlin Die Linke gewählt, die erste klar ethnische Wahl in Deutschland. Gewählt wurde dabei der dezidierte Antisemitismus der Partei. Der Terrorunterstützer Ibrahim sagt, sein Wahlaufruf für die Linkspartei – als parlamentarischen Arm seiner Terrororganisation – entstand „nach Gesprächen“. Und dank der CDU wird jedes Jahr eine weitere muslimische Großstadt eingebürgert, während noch eine neu einwandert. Integration wird es nicht geben, dafür Mobbing deutscher Kinder in den Schulen und Ausbeutung der Sozialsysteme. Parallelgesellschaften, importierte Kriminalität nehmen rasant zu."], ["comment", "(Luigi Pantisano [Die Linke]: Purer Rassismus, was Sie da sagen!)"], ["text", "Da ist es nur noch eine ironische Randnotiz, dass der von CDU und SPD forcierte Einbürgerungsrausch nun der Linken statt der SPD zugutekommt. Die Revolution frisst ihre Kinder."], ["text", "Die Partei Die Linke selbst ist dabei längst bis zur Kenntlichkeit entstellt. Landeschef, Fraktionschef, etliche Senatoren: Alle bekannten Köpfe sind in den letzten Jahren wegen des explodierenden Antisemitismus ausgetreten. Dass ein Clanoberhaupt überhaupt auf der Wahlparty der Linken auftaucht und erklärt, sich von der Partei unterstützt zu fühlen, dass ein Abgeordneter ihn respektvoll grüßen lässt,"], ["comment", "(Zuruf der Abg. Katrin Fey [Die Linke])"], ["text", "dass zur Wahl-Intifada aufgerufen wird, das alles passt ins Bild."], ["text", "Sollten SPD und Grüne diesen Wahnsinn in letzter Sekunde stoppen,"], ["comment", "(Ines Schwerdtner [Die Linke]: Ein guter Rat von der AfD!)"], ["text", "wird CDU-Mann Evers als Preis die ultimative Kapitulationserklärung gegenüber den Forderungen der rot-grünen Königsmacher unterzeichnen müssen. Das sind die Optionen: Die SPD unterwirft sich der Linken, oder die CDU unterwirft sich Rot-Grün. Die Regierungsparteien sind so was von fertig. Berlin, unsere deutsche Hauptstadt, hat wahrlich was Besseres verdient."], ["comment", "(Beifall bei der AfD – Zuruf der Abg. Ines Schwerdtner [Die Linke])"], ["text", "Und das gilt nicht nur landes-, sondern auch bundespolitisch. Wenn dann nach dem Willen der CDU-Merkelianer nach der Bundestagswahl mit Rot-Grün statt wie bisher nur mit der SPD weitergewurschtelt werden soll und die Union dann denen gegenüber bereits in der Minderheit ist, dann wird auch dem letzten CDU-Wähler im Land klar: Wer CDU wählt, bekommt auf jeden Fall rot-grüne Politik. Selbst der CDU-Kanzler meint: „Wir haben, […] auf zu viele Fragen keine zufriedenstellenden Antworten mehr.“ Doch hat er kürzlich die Antwort schon selbst gegeben: Wegtreten!"], ["text", "Ich danke Ihnen."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Für die CDU/CSU-Fraktion hat jetzt das Wort die Abgeordnete Dr. Ottilie Klein."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219514900", "x": -7.825, "y": 1.293, "cluster": 4, "speaker": "Dr. Ottilie Klein", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 4425, "comments": 19, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515800", "ID219515100", "ID219515600", "ID219515300", "ID219515700"], "next": "ID219515000", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Liebe Kolleginnen und Kollegen! Ich muss Ihnen ehrlich sagen: In den letzten Tagen habe ich mich bei der Linkspartei gefühlt wie im falschen Film."], ["comment", "(Stephan Brandner [AfD]: Nee! Das war ein Wahrheitsfilm!)"], ["text", "Allein die Tatsache, dass die Spitzenkandidatin der Linkspartei Elif Eralp beim Wahlergebnis von einem – Zitat – Sieg der Liebe spricht, ist ein weiteres Zeichen für das völlig verquere Weltbild dieser Partei."], ["comment", "(Luigi Pantisano [Die Linke]: Nein! Schrecklich!)"], ["text", "Denn wer „Yallah, Yallah Intifada“ für einen Ausdruck der Liebe hält, der hält offenbar auch Verbrecher für Wohltäter, Extremisten für Unterstützer und Judenhass für einen Dienst an der gerechten Sache."], ["comment", "(Beifall bei der CDU/CSU und der AfD sowie bei Abgeordneten der SPD – Stephan Brandner [AfD]: Genau so machen die das!)"], ["text", "Bei so viel Moralakrobatik platzt mittlerweile selbst vielen Linken die rote Hutschnur. Ehemalige Senatoren haben wegen des grassierenden Judenhasses schon vor Jahren diese Partei verlassen. Und wenn die ehemalige Bundestagsvizepräsidentin Petra Pau den Abgeordneten Ferat Koçak öffentlich angreift und ihn an seine Verantwortung erinnert, dann hat sie damit mal einfach vollkommen recht. Lassen Sie mich das hier klar sagen: Ferat Koçak mag ein guter Vertreter der Clans und der Extremen sein. Ein guter Vertreter der Neuköllner ist er nicht."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der SPD und der Abg. Dr. Irene Mihalic [BÜNDNIS 90/DIE GRÜNEN] – Ines Schwerdtner [Die Linke]: Er wurde von ihnen gewählt! – Weiterer Zuruf des Abg. Luigi Pantisano [Die Linke])"], ["text", "Er sollte Konsequenzen ziehen, Verantwortung zeigen – es wäre auch schön, wenn er bei so einer Debatte mal hier wäre –,"], ["comment", "(Alexander Throm [CDU/CSU]: Der macht gerade Sonderurlaub!)"], ["text", "und vor allen Dingen sollte er sein Mandat niederlegen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der SPD – Heidi Reichinnek [Die Linke]: Was denn jetzt? Soll er hier sein, oder soll er sein Mandat niederlegen? – Luigi Pantisano [Die Linke]: Wo ist eigentlich Jens Spahn? Wo ist er?)"], ["text", "Aber es geht nicht nur um einzelne Personen, sondern um eine Grundgefahr, die von dieser radikalen Partei ausgeht. Denn wenn sich Gesetzgeber mit Gesetzesbrechern verbrüdern,"], ["comment", "(Mirze Edis [Die Linke]: Ja! So wie das die CDU letztes Jahr gemacht hat, ne? – Gegenruf des Abg. Siegfried Walch [CDU/CSU]: Ihr seid doch ein Witz!)"], ["text", "dann ist das keine Lappalie. Dann ist das eine Gefahr für unsere Demokratie, dann ist das eine Gefahr für unseren Rechtsstaat, dann ist das eine Gefahr für die Freiheit jedes Einzelnen."], ["comment", "(Mirze Edis [Die Linke]: Schöne Grüße an den Herrn Spahn!)"], ["text", "Denn was bedeutet das? Was bedeutet das? Heißt das, dass die kriminellen Clans jetzt am Tisch des Innenausschusses des Deutschen Bundestages sitzen?"], ["comment", "(Mirze Edis [Die Linke]: Ja! Spahn-Kriminalität!)"], ["text", "Heißt das, dass Strukturen der Organisierten Kriminalität bald womöglich einen direkten Draht ins Rote Rathaus haben?"], ["comment", "(Stephan Brandner [AfD]: Ihre Koalitionspartner in Thüringen faktisch, Frau Klein! Reden Sie mal mit Dr. Mario Voigt!)"], ["text", "Heißt das, dass ich, wenn ich als Neuköllner Abgeordnete auf der Sonnenallee Gespräche mit Bürgern führe, Sorge haben muss, dass die Clanbosse vorbeikommen und mir einen Besuch abstatten? Das ist Kai Wegner bei uns in Berlin übrigens auch schon passiert."], ["comment", "(Zurufe von der Linken)"], ["text", "Werden ehrenamtliche und hauptamtliche Politiker jetzt zur Zielscheibe des Organisierten Verbrechens?"], ["text", "Und was ist eigentlich mit unseren Polizisten? Bekommen wir jetzt eine Landesregierung, deren Herz für Kriminelle mehr schlägt als für unsere Polizistinnen und Polizisten?"], ["comment", "(Luigi Pantisano [Die Linke]: O Gott!)"], ["text", "Wer schützt eigentlich jene, die uns schützen?"], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der SPD – Zuruf des Abg. Luigi Pantisano [Die Linke])"], ["text", "Vor allem sind das Fragen, liebe Kolleginnen und Kollegen von den Sozialdemokraten und von den Grünen, mit denen Sie sich allen Ernstes auseinandersetzen wollen; denn genau darum geht es jetzt nach dieser Wahl. Man muss auch die Frage stellen, mit welchem Gefühl und mit welcher Angst unsere jüdischen Mitbürger in Berlin in diesen Tagen aufwachen. Denn der Antisemitismus in der Berliner Linkspartei ist eben kein Einzelfall. Feste mit Hamasunterstützern, Konzerte mit antisemitischen Rappern und judenfeindliche Vorfälle immer und immer wieder: Das ist eine klare, unmissverständliche Sprache. Und Sie schaffen es einfach nicht, sie schaffen es nicht, in Ihrer Partei dem etwas entgegenzusetzen. Der Kampf gegen Judenhass, der erschöpft sich eben nicht in leeren Gesten und müden Statements."], ["text", "Die Probleme der Linkspartei hören beim Antisemitismus auch nicht auf. Denn wenn sich die Terrororganisation PFLP über die gute Zusammenarbeit mit der Linkspartei freut,"], ["comment", "(Heidi Reichinnek [Die Linke]: Sie springen auch über jedes Stöckchen!)"], ["text", "dann ist das das größte denkbare Warnsignal für unsere Gesellschaft. Hinter der Tiktok-Partyfassade zeigt sich immer mehr eine unheilige Allianz mit Clankriminalität, Islamismus und Judenhass. Und deshalb darf es hier keine Verharmlosung dieser extremen Partei geben."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der SPD – Stephan Brandner [AfD]: Aber in Thüringen schon, oder wie? In Thüringen geht das?)"], ["text", "Liebe Kolleginnen und Kollegen, politische Verantwortung ist keine Netflixserie. Man kann nicht einfach abschalten, wenn einem die Szene nicht gefällt. Die Entscheidungen, die heute getroffen werden, haben drastische Folgen für die Menschen in Berlin und darüber hinaus. Deshalb ist mein Appell vor allem an SPD und Grüne gerichtet:"], ["comment", "(Luigi Pantisano [Die Linke]: Darum geht’s euch! Darum geht’s euch! Mit der AfD kuscheln, aber hier groß Theater machen!)"], ["text", "Wenn Ihr Einsatz für Freiheit, für Vielfalt, für Rechtsstaatlichkeit mehr als nur ein Lippenbekenntnis sein soll, dann zeigen Sie hier klare Kante:"], ["comment", "(Mirze Edis [Die Linke]: Wenn Herr Merz über Juden als Ausländer spricht, dann ist das okay, ja? Das ist dann kein Antisemitismus! – Gegenruf des Abg. Siegfried Walch [CDU/CSU]: Zuhören! – Gegenruf des Abg. Mirze Edis [Die Linke]: Und ruhig bleiben dahinten! – Alexander Throm [CDU/CSU]: Das sagt der Richtige!)"], ["text", "Sorgen Sie dafür, dass Sie auch in Zukunft noch guten Gewissens in den Spiegel schauen können! Erteilen Sie Koalitionsgesprächen mit diesen extremen Linken in Berlin eine Absage!"], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der SPD)"], ["chair", "Vizepräsidentin Josephine Ortleb:"], ["chair", "Für die Fraktion Bündnis 90/Die Grünen hat jetzt das Wort die Abgeordnete Dr. Irene Mihalic."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"]]}, {"id": "ID219515000", "x": -8.353, "y": 1.506, "cluster": 4, "speaker": "Dr. Irene Mihalic", "fraction": "BÜNDNIS 90/DIE GRÜNEN", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 4781, "comments": 12, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515500", "ID219515200", "ID219515600", "ID219514900", "ID219515700"], "next": "ID219515100", "paragraphs": [["text", "Sehr geehrte Frau Präsidentin! Liebe Kolleginnen! Liebe Kollegen! Am 7. Oktober jährt sich der grausame Terroranschlag der Hamas auf Israel zum dritten Mal. Über 1 000 Menschen wurden ermordet, Tausende verletzt, gefoltert, vergewaltigt. Rund 250 Menschen wurden als Geiseln genommen. Mehr als die Hälfte von ihnen hat das nicht überlebt. Es war ein tiefer Schock – bis heute: für Israel und für die Jüdinnen und Juden weltweit."], ["text", "Über die Reaktionen darauf in Gaza, über eine in Teilen rechtsextreme israelische Regierung und die Lage im Nahen Osten insgesamt können und müssen wir politisch streiten, meine Damen und Herren. Das ist hochkomplex. Und ich traue niemandem, der hier einfache Antworten präsentiert. Aber eines muss sehr klar sein, und zwar unmissverständlich: Der Ausgangspunkt war das Massaker der Hamas, getränkt von Israelhass und Antisemitismus. Wer Israelhass und Antisemitismus relativiert, akzeptiert oder sogar politisch integriert, vergiftet die politische Kultur in unserem Land."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN, bei der CDU/CSU und der SPD)"], ["text", "Genau diese Gefahr sehe ich bei Teilen der Linken. Und ich muss es Ihnen so deutlich sagen: Lippenbekenntnisse und nachträgliche Distanzierungen reichen nicht, wenn sich bei Ihnen Menschen mit offenem Israelhass und antisemitischen Positionen erkennbar wohlfühlen und Sie damit auch noch Wahlkampf machen. Sie können nicht immer von Liebe sprechen, während sich dieser Hass in Teilen Ihrer Partei ungehemmt ausbreitet. Wenn sich sogar Abgeordnete Ihrer Fraktion so positionieren, dann muss man sich von ihnen trennen. Punkt!"], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN und bei der CDU/CSU sowie bei Abgeordneten der SPD – Siegfried Walch [CDU/CSU]: Ganz genau!)"], ["text", "Deshalb verstehe ich nicht, warum Ferat Koçak trotz offen zur Schau gestellten Sympathien für Personen und Organisationen, deren Namen sogar auf der europäischen Terrorliste stehen, weiterhin Mitglied der Linksfraktion im Bundestag sein darf. Von diesen Leuten, mit denen Fotos auf Wahlpartys gemacht wurden, werden die Verbrechen der Hamas nicht nur relativiert, sie werden sogar verherrlicht. Mit denen darf sich niemand, der in Deutschland politische Verantwortung trägt, gemeinmachen, meine Damen und Herren."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN und bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Wenn es Die Linke also mit dem Kampf gegen Antisemitismus wirklich ernst meint, dann darf sie ihn nicht in ihren Reihen dulden, sondern muss konsequent und glaubhaft dagegen vorgehen."], ["text", "Aber – und das muss genauso klar gesagt werden – dass sich ausgerechnet die AfD hier zum Ankläger des Antisemitismus aufschwingt,"], ["comment", "(Stephan Brandner [AfD]: Das ist goldrichtig! Entspricht genau unserer Linie!)"], ["text", "ist ein politischer Treppenwitz, meine Damen und Herren."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der CDU/CSU und der SPD)"], ["text", "Denn es ist die AfD, die immer wieder die Verbrechen des Nationalsozialismus relativiert und die deutsche Erinnerungskultur angreift."], ["comment", "(Widerspruch bei der AfD – Stephan Brandner [AfD]: Wo denn?)"], ["text", "Ob Alexander Gaulands „Vogelschiss“ oder Björn Höckes Ruf nach einer erinnerungspolitischen 180-Grad-Wende und einem Ende des sogenannten Schuldkults, in aktuellen AfD-Programmen ist von einem angeblichen Nationalmasochismus die Rede, den die Deutschen endlich ablegen müssten. Und dass die AfD mit der verbotenen SA-Parole „Alles für Deutschland“ kokettiert"], ["comment", "(Stephan Brandner [AfD]: Oh, oh! Was haben Sie da gesagt?)"], ["text", "und „Alice für Deutschland“ daraus macht, spricht Bände."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der CDU/CSU und der SPD)"], ["text", "Sie bejubeln das. Sie drucken es auf Plakate, auf Buttons und T-Shirts. Das ist geschichtsvergessen und widerlich, meine Damen und Herren."], ["text", "Die Verbrechen des Nationalsozialismus dürfen niemals relativiert werden. Wer die deutsche Erinnerungskultur abschaffen oder ihre Grundlage beschädigen will, der beschädigt auch den demokratischen Konsens, der aus unserer Geschichte entstanden ist und das Fundament der Bundesrepublik Deutschland bildet. Antisemitismus darf man niemals nur dann thematisieren, wenn er sich gegen politische Gegner instrumentalisieren lässt. Wir müssen ihn bekämpfen – immer und überall, meine Damen und Herren."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der SPD)"], ["text", "Deshalb sei mir auch dieser Hinweis an die Koalition erlaubt: Liebe Kolleginnen und Kollegen von CDU/CSU und SPD, wir haben nicht zu viel politische Bildung in Deutschland. Wir haben auch nicht zu viel historische Bildung oder Demokratiebildung in Deutschland. Wir brauchen mehr davon."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN)"], ["text", "Gerade junge Menschen müssen doch verstehen, was in diesem Land geschehen ist, was die Shoah war, welche Lehren daraus zu ziehen sind und welche Verantwortung daraus erwächst. Wer hier spart, macht einen Riesenfehler."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Frau Abgeordnete, würden Sie eine Zwischenfrage aus der AfD-Fraktion gestatten?"], ["text", "Nein. – Margot Friedländer hat immer wieder gemahnt. Sie hat gesagt: „So hat es damals auch angefangen“, und sie sagte weiter: Es darf nur nie wieder geschehen. Es ist in eurer Hand, dass ihr vorsichtig seid. – Meine Damen und Herren, diese Mahnung gilt uns allen. Für uns als Bündnis 90/Die Grünen ist deshalb völlig klar: Antisemitismus darf nirgendwo einen Platz haben – nicht auf unseren Straßen, nicht an unseren Schulen, nicht in unseren Parlamenten, nirgendwo in unserem Land. Das ist unsere historische Verantwortung und unsere Verantwortung gegenüber den Jüdinnen und Juden, die heute hier leben und für deren Sicherheit wir einstehen."], ["text", "Ganz herzlichen Dank."], ["comment", "(Beifall beim BÜNDNIS 90/DIE GRÜNEN sowie bei Abgeordneten der CDU/CSU und der SPD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die SPD-Fraktion darf ich Sebastian Fiedler das Wort erteilen."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"]]}, {"id": "ID219515100", "x": -7.908, "y": 0.975, "cluster": 4, "speaker": "Sebastian Fiedler", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 5095, "comments": 5, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515900", "ID219515300", "ID219515600", "ID219515700", "ID219514900"], "next": "ID219515200", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Liebe Kolleginnen und Kollegen! Ich möchte in der Debatte einen zusätzlichen Fokus setzen, und zwar auf die Organisierte Kriminalität, und die Frage an den Anfang stellen: Was will eigentlich generell Organisierte Kriminalität? Die Antwort lautet: Zugang, Einfluss und Macht. Das ist keine Theorie, sondern steht so in der Definition von „Organisierter Kriminalität“, die wir schon seit 1990 heranziehen. Eines der Merkmale lautet ausdrücklich „Einflussnahme auf Politik, Medien, öffentliche Verwaltung, Justiz oder Wirtschaft“. Die Frage ist: Warum? Weil Kontakte Türen öffnen, weil Informationen einen Wert haben, weil politische Bekanntschaften Ansehen verschaffen, weil ein Foto Reputation erzeugen kann, weil Kontakte Tarnstrukturen und Geschäfte erleichtern können und weil aus einem Kontakt ein Zugang, aus einem Zugang Einfluss und aus Einfluss irgendwann Abhängigkeit werden kann. Das Ziel kann am Ende die Unterwanderung staatlicher und gesellschaftlicher Strukturen sein. Sie beginnt eben nicht mit dem berühmten Geldkoffer, sondern viel unspektakulärer: Man kennt sich, man hilft sich, man verschafft sich Reichweite, man öffnet eine Tür."], ["text", "Deshalb betrachten unsere Sicherheitsbehörden Netzwerke, und sie beschreiben diese netzwerkartigen Strukturen auch sehr gut. Sie beschreiben Kennverhältnisse und Kooperationsformen zwischen den unterschiedlichen Milieus. Und da kommen die Dinge zusammen: Die PFLP – bekannt aus der Entführung der „Landshut“ –, die bis heute noch immer Terror in Israel verübt, die Hamas, die Hisbollah, salafistische Akteure und Strukturen der Organisierten Kriminalität und der Clankriminalität sind nicht dasselbe – sie haben unterschiedliche Ziele und Organisationsformen –; aber die Welten sind nicht mehr hermetisch voneinander abgetrennt. Das sind keine Silos mehr. Der Verfassungsschutz in Berlin dokumentiert – um nur ein Beispiel zu nennen – die enge Zusammenarbeit von PFLP und Hamas. Man muss also nicht dieselbe Ideologie haben, um miteinander zu kooperieren, man braucht nur gemeinsame Interessen, persönliche Beziehungen, einen gegenseitigen Nutzen."], ["text", "Und jetzt, genau an diesem Punkt, kommen wir zu den Berliner Linken. Es geht nämlich nicht nur um ein Foto und um Ferat Koçak, sondern um eine strukturelle Frage, die hier im Mittelpunkt steht: Warum finden Akteure aus solchen Milieus immer wieder Anschluss an das politische Umfeld der Berliner Linken?"], ["comment", "(Zuruf von der Linken: Und der CDU!)"], ["text", "Warum taucht Ibrahim Ibrahim dort auf? Wie erklären sich Kontakte in das Rammo-Umfeld? Wer kennt wen, wer öffnet Türen, und wer gewinnt eigentlich dadurch gesellschaftliche oder politische Reputation? Beim Kontakt von Koçak und Rammo wissen wir inzwischen: Es ging um Reichweite für ein Video einer Rede zur Clankriminalität. – Und da muss in der Tat jeder Innenpolitiker hellhörig werden. Denn es geht um die Perspektive: Was wollte Koçak von Rammo? Das kann man auch umdrehen: Was wollte das Gegenüber eigentlich von diesem politischen Kontakt? Das beweist jetzt noch keine Unterwanderung der Partei; aber die Häufung dieser Vorgänge beweist die strukturelle Verwundbarkeit der Berliner Linken."], ["text", "Genau dazu gehört auch der Antisemitismus, zu dem mein Kollege Helge Lindh gleich noch intensiver ausführen wird. Berlin erlebt eine extremistische Szene, in der das Existenzrecht Israels bestritten und der Terror der Hamas gefeiert wird. Der Berliner Verfassungsschutz beschreibt diese Entwicklung ausdrücklich. Demokratische Parteien dürfen diesen Akteuren keinen Resonanzraum bieten."], ["text", "Diese Aktuelle Stunde – das ist gerade schon von meiner Kollegin gesagt worden – ist von der AfD beantragt worden. Zu Recht hat meine Kollegin Mihalic das als Treppenwitz bezeichnet; denn der Maßstab gilt für alle hier im Haus."], ["comment", "(Beifall bei der SPD und dem BÜNDNIS 90/DIE GRÜNEN – Zuruf von der Linken: Auch für die CDU!)"], ["text", "Die Einflussnahme anderer Akteure und fremder Mächte – um über die Fraktion auf der rechten Seite des Hauses zu sprechen und Putin und Russland ins Feld zu führen –"], ["comment", "(Lachen bei der AfD)"], ["text", "ist für alle ein großes Problem. Unsere Sicherheitsbehörden sind deswegen weder auf dem rechten noch auf dem linken Auge blind. Wir brauchen in diesem Land Stabilität und eine Politik, die nicht von Hysterie geleitet ist, sondern die die Organisierte Kriminalität bekämpft, ohne Menschen unter Generalverdacht zu stellen, die Islamismus und Terrorismus bekämpft, ohne Muslime unter Generalverdacht zu stellen, und die Antisemitismus bekämpft, egal woher er kommt."], ["text", "Ein starker Rechtsstaat und ein gesellschaftlicher Zusammenhalt sind der Grund dafür, dass ich froh bin, dass wir genau in dieser Bundesregierung gerade Verantwortung tragen, und zwar in der Mitte dieser Gesellschaft. Und ich bin froh, dass die Grünen hier ebenfalls unmissverständliche Worte gefunden haben. Kollege Gysi, ich bin sehr gespannt darauf – Sie persönlich sind unverdächtig in all diesen Fragen –, wie hart Sie sich zu der Berliner Linken in genau diesen Fragen gleich äußern und welche Konsequenzen Sie ankündigen. Ich von mir aus würde sagen – das erwarte ich eigentlich auch von Ihnen –: Mit den Berliner Linken ist kein Staat zu machen. Regierungsverantwortung wünsche ich mir für sie dort nicht."], ["comment", "(Beifall bei der SPD und der CDU/CSU – Alexander Throm [CDU/CSU]: Respekt!)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die Fraktion Die Linke darf ich Dr. Gregor Gysi das Wort erteilen."], ["comment", "(Beifall bei der Linken)"]]}, {"id": "ID219515200", "x": -8.516, "y": 0.841, "cluster": 4, "speaker": "Dr. Gregor Gysi", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 5361, "comments": 30, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515600", "ID219515300", "ID219515500", "ID219515700", "ID219515800"], "next": "ID219515300", "paragraphs": [["text", "Herr Präsident! Liebe Kolleginnen und Kollegen! Der Antisemitismusvorwurf gegen uns aus dem Munde der AfD ist eine Frechheit."], ["comment", "(Beifall bei der Linken)"], ["text", "Sie sind rassistisch. In Ihren Reihen gibt es viele Antisemiten, ich sage nur: Höcke. Der Höcke, der Landesvorsitzende und Landtagsfraktionsvorsitzende der AfD in Thüringen, hat das Holocaustmahnmal als „Denkmal der Schande“ bezeichnet. Ihre AfD-Fraktion im Landtag von Schwerin hat beantragt, alle Zahlungen für die Holocaustdenkmäler zu halbieren."], ["comment", "(Peter Bohnhof [AfD]: Zum Thema! Linke Berlin!)"], ["text", "Und als einzige Partei hat sie die Aufnahme des Schutzes jüdischen Lebens in der Landesverfassung verweigert. Das ist die Wahrheit! Das ist Ihre Haltung!"], ["comment", "(Beifall bei der Linken und dem BÜNDNIS 90/DIE GRÜNEN sowie des Abg. David Mandrella [SPD])"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter, würden Sie eine Zwischenfrage aus der AfD-Fraktion gestatten?"], ["text", "Nein."], ["text", "Dass die CDU mitmacht, ist auch mehr als absurd. Der Bundeskanzler hat gesagt – ich zitiere ihn wörtlich –: „Antisemitismus ist die perfideste Form der Ausländerfeindlichkeit.“ Damit hat er die deutschen Jüdinnen und Juden zu Ausländerinnen und Ausländern erklärt."], ["comment", "(Dr. Ottilie Klein [CDU/CSU]: Reden Sie doch mal zum Thema! Zu sich selber!)"], ["text", "Es tut mir leid: Das war auch die Haltung der Nazis. Einem Bundeskanzler darf eine solche Fehlformulierung nicht passieren."], ["comment", "(Beifall bei der Linken sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN – Siegfried Walch [CDU/CSU]: Das ist eine Frechheit, so etwas!)"], ["text", "Meine Partei hat mit großer Mehrheit beschlossen, dass wir für einen souveränen und sicheren Staat Israel sind, den es aber nur geben wird, wenn es endlich auch einen souveränen und sicheren Staat Palästina gibt."], ["comment", "(Beifall bei der Linken – Dr. Ottilie Klein [CDU/CSU]: Wie sieht es denn aus mit dem Existenzrecht Israels?)"], ["text", "Unsere Spitzenkandidatin in Berlin, Elif Eralp, hat ein Fünf-Punkte-Programm vorgelegt, wie man Antisemitismus wirksamer bekämpfen und das Leben jüdischer Menschen in Berlin besser schützen kann als gegenwärtig. Das ist unsere Haltung."], ["comment", "(Beifall bei der Linken – Dr. Bernd Baumann [AfD]: Ihrer Islamisten!)"], ["text", "Natürlich kritisieren wir die Politik der israelischen Regierung, die zum Beispiel mit den USA einen völkerrechtswidrigen Angriffskrieg gegen den Iran führt. Wir kritisieren aber jedes Kriegsverbrechen und jede Menschenrechtsverletzung, egal von wem sie begangen wird."], ["comment", "(Beifall bei der Linken – Dr. Bernd Baumann [AfD]: Sagen Sie doch mal was zu den Linken!)"], ["text", "Wenn man Menschen mit Migrationshintergrund unbegründet vorwirft, antisemitisch zu sein, dann ist das auch noch rassistisch."], ["comment", "(Beifall bei der Linken – Dr. Bernd Baumann [AfD]: Was?)"], ["text", "Wir haben auch einige Mitglieder, die die Israelkritik deutlich überziehen."], ["comment", "(Dr. Bernd Baumann [AfD]: Überziehen, ja?)"], ["text", "Damit müssen wir uns auseinandersetzen und tun es auch. Dafür brauchen wir weder Ihre Pädagogik"], ["comment", "(Siegfried Walch [CDU/CSU]: Oh doch!)"], ["text", "noch Ihre Drohung noch Ihre Hinweise und schon gar nicht die Beobachtung durch den Verfassungsschutz."], ["comment", "(Beifall bei der Linken)"], ["text", "Der Antisemitismus ist und bleibt ein Problem in Deutschland, dem wir gemeinsam begegnen müssen. Hören Sie auf, den Antisemitismus zu missbrauchen, um gegen Die Linke zu hetzen!"], ["comment", "(Dr. Ottilie Klein [CDU/CSU]: Unverschämtheit! Eine Unverschämtheit ist das, Herr Kollege!)"], ["text", "Wer den Antisemitismus instrumentalisiert, kann ihn nicht wirksam bekämpfen."], ["comment", "(Beifall bei der Linken)"], ["text", "Nun geht es auch noch um unsere vermeintlichen Verbindungen zu kriminellen Clans. Also erstens: Ich kenne nur eine Partei im Bundestag, die man auch als kriminelle Vereinigung ansehen darf."], ["comment", "(Dr. Bernd Baumann [AfD]: Das ist Ihre!)"], ["text", "Selbstverständlich hat unser Abgeordneter Ferat Koçak einen Fehler begangen."], ["comment", "(Dr. Bernd Baumann [AfD]: Einen Fehler! – Heiterkeit bei der AfD)"], ["text", "Wir untersuchen das. Aber er erklärt, es nicht gewusst, nicht überschaut zu haben. Das ist für Sie unglaubwürdig. Aber wenn Ihr in Berlin wiedergewählter CDU-Abgeordneter Christian Zander denselben Clanchef ins Parlament einlädt und dann erklärt, er habe es nicht gewusst, dann ist das für Sie höchst glaubwürdig."], ["comment", "(Beifall bei der Linken)"], ["text", "Sehen Sie: Der Kai Wegner empfängt Kriminelle, Amthor empfängt Kriminelle, und das gilt alles für Sie nicht,"], ["comment", "(Dr. Bernd Baumann [AfD]: Das entschuldigt Sie aber nicht!)"], ["text", "und das ist das, was Vernünftige nicht leiden können: dass man bei den Mitgliedern der eigenen Partei völlig andere Maßstäbe anlegt als bei Mitgliedern anderer Parteien."], ["comment", "(Beifall bei der Linken – Sebastian Fiedler [SPD]: Das ist ein anderer Sachverhalt!)"], ["text", "Und die Polizei muss auch keine Angst haben. Ich möchte nur eine Korrektur in der Rechtsprechung dahin gehend, dass die Gesundheit endlich mehr geschützt wird als das Eigentum. Der Kapitalismus schützt Eigentum mehr als Gesundheit, und das müssen wir ändern."], ["comment", "(Beifall bei der Linken)"], ["text", "Worum geht es in Wirklichkeit? Die CDU möchte in Berlin wieder den Regierenden Bürgermeister stellen. Sie wollen, dass Berlin so schlecht weiterregiert wird wie bisher, aus kleinbürgerlichem Machtdünkel."], ["comment", "(Dr. Ottilie Klein [CDU/CSU]: Junge, Junge, Junge!)"], ["text", "Sie haben den Aufschrei in Berlin nicht begriffen. Wenn sich die SPD darauf einlassen sollte, dann sage ich Ihnen: Wenn Sie keinen Mut zu einem Linksbündnis haben, werden Sie weiter verdorren."], ["comment", "(Sebastian Fiedler [SPD]: Thema verfehlt, Herr Gysi!)"], ["text", "Die Berlinerinnen und Berliner haben Elif Eralp und Die Linke zur stärksten Kraft gewählt,"], ["comment", "(Dr. Bernd Baumann [AfD]: Islamistenunterstützung!)"], ["text", "weil sie ein anderes Berlin wollen."], ["comment", "(Beifall bei der Linken)"], ["text", "Sie wollen 25 Prozent ihres Einkommens für Miete bezahlen und nicht 50 Prozent. Im Unterschied zum bisherigen Senat wollen wir nicht an den stadteigenen Wohnungen verdienen, sondern die Mieten gerecht deckeln."], ["comment", "(Dr. Ottilie Klein [CDU/CSU]: Sie haben doch die stadteigenen Wohnungen verkauft!)"], ["text", "Wir wollen in Übereinstimmung mit dem Volksentscheid die großen Wohnkonzerne vergesellschaften. 57 Prozent der Wählerinnen und Wähler haben dazu Ja gesagt."], ["comment", "(Siegfried Walch [CDU/CSU]: Zum Thema!)"], ["text", "Wir achten den Artikel 15 Grundgesetz. Sie stehen nicht auf dem Boden des Grundgesetzes."], ["comment", "(Beifall bei der Linken – Dr. Johannes Fechner [SPD]: Jetzt aber!)"], ["text", "Sie behaupten, die Investoren würden fliehen. Mich haben welche angesprochen, die hoffen, dass es unter einem linken Senat Verbesserungen geben wird."], ["comment", "(Zuruf der Abg. Beatrix von Storch [AfD])"], ["text", "Die Bearbeitung eines großen Bauantrags dauert in Berlin 14 Jahre."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter."], ["text", "Ich sage Ihnen: Wenn wir regieren, wird sehr viel schneller entschieden: ja oder nein."], ["text", "Lassen Sie mich zum Schluss kommen, Herr Präsident. Übrigens haben wir bewiesen, was wir diesbezüglich können. Wirtschaft und soziale Gerechtigkeit muss zusammen gedacht werden."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter."], ["text", "Und wir hatten einen Ministerpräsidenten in Thüringen, Bodo Ramelow, der es bewiesen hat."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter!"], ["text", "So, meine Zeit ist um. Ein Satz: –"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Nein."], ["text", "– Wenn Sie nicht den Mut haben, von der Hauptstadt aus Deutschland zu verändern, dann geht es bergab"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter!"], ["text", "Und wenn wir das nicht zustande bringen, dann, sage ich Ihnen, wird die AfD in der nächsten Regierung indirekt mitregieren."], ["comment", "(Beifall bei der Linken – Dr. Gottfried Curio [AfD]: Heute haben Sie Ihr Andenken zerstört, Herr Gysi!)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die CDU/CSU-Fraktion darf ich Alexander Throm das Wort erteilen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"]]}, {"id": "ID219515300", "x": -8.011, "y": 0.871, "cluster": 4, "speaker": "Alexander Throm", "fraction": "CDU/CSU", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 5260, "comments": 23, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515200", "ID219515900", "ID219515100", "ID219515700", "ID219515600"], "next": "ID219515400", "paragraphs": [["text", "Sehr geehrter Herr Präsident! Werte Kolleginnen und Kollegen! Herr Abgeordneter Gysi, die Not muss bei der Linken groß sein, wenn man Sie ins Rennen schickt."], ["comment", "(Heiterkeit bei der CDU/CSU)"], ["text", "Sie haben heute eine Rede gehalten, die nicht nur billig, sondern auch unter Ihrer Würde war, Herr Gysi."], ["comment", "(Beifall bei der CDU/CSU und der AfD sowie bei Abgeordneten der SPD und des BÜNDNISSES 90/DIE GRÜNEN)"], ["text", "Sie müssen den Antisemitismusvorwurf der AfD nicht ernst nehmen, den von uns nicht, den von der SPD nicht. Aber Sie von den Linken sollten, wenn Sie noch ein bisschen Glaubwürdigkeit und Ehre im Leib haben, den Antisemitismusvorwurf des Zentralrats der Juden ernst nehmen. Dieser hat nämlich vor einer links geführten Regierung in Berlin gewarnt, weil er Angst vor einer Normalisierung des Judenhasses hat, werte Kolleginnen und Kollegen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der SPD)"], ["text", "Da wundert es mich schon sehr, wenn ein weiterer Abgeordneter der Linkspartei, der Kollege Ramelow, in die Medien geht und sagt, dass er dafür keinerlei Verständnis hat."], ["text", "Ich will darauf hinweisen, dass es in Deutschland die durchaus gut gewählte Übung gibt, dass wir aufgrund unserer Geschichte sehr genau auf das hören, was uns der Zentralrat der Juden mitteilen will. Und wer das so schnell wegwischt, der verharmlost auch ein Stück weit, welche Geschichte wir in Deutschland mit uns herumtragen, liebe Kolleginnen und Kollegen."], ["comment", "(Beifall bei der CDU/CSU sowie des Abg. Sebastian Fiedler [SPD])"], ["text", "Ich finde es umso bemerkenswerter, dass die ehemalige Vizepräsidentin des Bundestages, die ehemalige Kollegin Petra Pau, hier die notwendige Haltung gezeigt hat."], ["comment", "(Siegfried Walch [CDU/CSU]: Sehr gut!)"], ["text", "Das genießt unseren Respekt, liebe Kolleginnen und Kollegen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Ja, und wenn ich, schwer vorstellbar, Mitglied eines arabischen Clans wäre, würde ich auch die Linkspartei wählen, selbstverständlich. Die Linken wollen die Polizei reduzieren, die wollen den Verfassungsschutz abschaffen. Sie wollen offene, unbegrenzte Einwanderung, damit die Clans noch größer werden."], ["comment", "(Zuruf des Abg. Luigi Pantisano [Die Linke])"], ["text", "Sie sind offen antisemitisch und bekämpfen Israel. Das alles ist ein Sicherheitsrisiko für unser Land."], ["comment", "(Zuruf von der Linken: Das ist billig!)"], ["text", "Sie, die Linkspartei, wenn Sie tatsächlich regieren würden, sind ein Sicherheitsrisiko für unser Land, und nicht nur für Berlin."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Der Abgeordnete Koçak ist doch nur die Spitze des Eisbergs."], ["comment", "(Ulle Schauws [BÜNDNIS 90/DIE GRÜNEN]: Wie undifferenziert wollen Sie noch sein?)"], ["text", "Er war zu ungeschickt und hat sich dabei erwischen lassen. Es gibt eine strukturelle und strategische Partnerschaft zwischen großen Teilen der Linkspartei hier in Berlin und der Organisierten Kriminalität und den Clans."], ["comment", "(Luigi Pantisano [Die Linke]: Das ist absurd!)"], ["text", "Sie sind propalästinensisch, antijüdisch, antiisraelisch. Es gibt Netzwerke zwischen den propalästinensischen Organisationen und den Clans und zwischen den Clans und Ihren Parteigliederungen, vor allem hier in Berlin, verehrte Kolleginnen und Kollegen."], ["comment", "(Zuruf der Abg. Desiree Becker [Die Linke])"], ["text", "Deshalb – wir haben das heute Morgen im Innenausschuss beraten – müssen wir ernsthaft prüfen, ob zumindest die Berliner Linkspartei wieder Anlass gibt, vom Verfassungsschutz beobachtet zu werden, liebe Kolleginnen und Kollegen."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der AfD und der SPD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter, würden Sie eine Zwischenfrage aus der Linksfraktion zulassen?"], ["text", "Ja, sehr gerne."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Beutin."], ["zwischenfrage", "ID219515300-2"], ["text", "Ein kleines Ablenkungsmanöver, das Sie hier zu starten versuchen."], ["comment", "(Lachen bei Abgeordneten der Linken – Zuruf des Abg. Luigi Pantisano [Die Linke])"], ["text", "Das war heute Morgen im Innenausschuss auch schon so."], ["text", "Wissen Sie, es ist etwas anderes, wenn ein Abgeordneter, der Herr Koçak, im Bundestag hier Reden hält und Zwischenfragen stellt genau mit dem gleichen Narrativ wie Sie, das Sprechen über Clankriminalität sei gelebter Rassismus. So ein Unsinn!"], ["comment", "(Zuruf von der Linken: Wissenschaftlich belegtes Narrativ!)"], ["text", "Genau das hat er gemacht. Er hat im Übrigen im Abgeordnetenhaus entsprechende Anfragen zur Clankriminalität gestellt. Darüber hinaus hat er seinen „Bruder“ eingeladen, seine Themen zu verbreiten, entsprechende Reichweite zu schaffen."], ["comment", "(Zurufe von der Linken: Frage beantworten!)"], ["text", "Und die entsprechenden Personen haben inzwischen auch schon öffentlich bekundet, dass sie sich nicht nur freuen, dass die Linkspartei die Wahl gewonnen hat, sondern dass sie auch mit dazu beigetragen haben, dass die Linkspartei die Wahl gewonnen hat. Das heißt, Sie stehen auf dem Fundament der Unterstützung der Clans und der Organisierten Kriminalität, und genau das machen wir hier zum Thema."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["text", "Sie stellen Fragen, und ich beantworte die Fragen, so wie ich es möchte."], ["comment", "(Luigi Pantisano [Die Linke]: Ja, es ist schon klar, dass Sie nicht über die italienische Mafia reden!)"], ["text", "Meine sehr verehrten Damen und Herren, wir haben den Herrn Koçak, der jetzt zum Bauernopfer wird. Er wurde noch nicht ganz zurückgezogen, aber ich wage die Behauptung: Auf dem laden Sie jetzt alles ab, und dann machen Sie irgendwelche Papiere, Fünfpunktepläne oder worauf auch immer Sie sich berufen. Das ist alles Quatsch und heiße Luft. Wenn Sie tatsächlich ins Rote Rathaus einziehen und Ihre Abgeordneten an die Macht kommen, dann ziehen auch Antisemitismus und Organisierte Kriminalität ins Rote Rathaus ein."], ["text", "Wir haben schon im Zusammenhang mit der Wahl in Sachsen-Anhalt diskutiert, wie wir bzw. die Sicherheitsbehörden des Bundes dann mit der Weitergabe von sensiblen Informationen an diese Landesregierung umgehen können. Wenn Sie im Roten Rathaus die Bürgermeisterin stellen,"], ["comment", "(Luigi Pantisano [Die Linke]: Dann enteignen wir die großen Wohnungskonzerne! Davor haben Sie Angst! Das ist Ihr Problem!)"], ["text", "dann müssen die Sicherheitsbehörden des Bundes und aller Länder prüfen, inwiefern sensible Daten, über Organisierte Kriminalität beispielsweise, noch an die Landesregierung von Berlin weitergegeben werden können."], ["comment", "(Beifall bei Abgeordneten der CDU/CSU)"], ["text", "Letzte Bemerkung. Ich erspare mir einen Appell an SPD und Grüne,"], ["comment", "(Ulle Schauws [BÜNDNIS 90/DIE GRÜNEN]: Ja, lass es lieber!)"], ["text", "sich bei ihren Landesverbänden in Berlin dafür einzusetzen, –"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter."], ["text", "– dass es nicht zu einer solchen Regierungsbildung kommt. Ich habe hohen Respekt vor den Kolleginnen und Kollegen der SPD hier im Bund."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Herr Abgeordneter!"], ["text", "Wir sind eine Sicherheitskoalition, und wir sollten schauen, dass das auch in anderen Bereichen dieses Landes so bleibt."], ["text", "Herzlichen Dank."], ["comment", "(Beifall bei der CDU/CSU sowie bei Abgeordneten der SPD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die AfD-Fraktion darf ich Beatrix von Storch das Wort erteilen."], ["comment", "(Beifall bei der AfD)"]]}, {"id": "ID219515300-2", "x": -8.175, "y": 0.702, "cluster": 4, "speaker": "Lorenz Gösta Beutin", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 639, "comments": 3, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515300", "ID219515700", "ID219515600", "ID219515100", "ID219514900"], "next": "ID219515400", "paragraphs": [["text", "Schönen Dank. – In diesem Hohen Hause ist ja schon weidlich über die Spahn-Kriminalität in Ihren Reihen gesprochen worden."], ["comment", "(Lachen bei Abgeordneten der CDU/CSU)"], ["text", "Aber wenn wir über die Clankriminalität reden, dann verbreiten Sie hier rassistische Stereotype."], ["comment", "(Lachen bei Abgeordneten der CDU/CSU und der AfD)"], ["text", "Aber ich möchte Sie doch ganz gerne einmal fragen: Der erwähnte Chef des Rammo-Clans ist 2021 aufgetaucht bei einer Wahlkampfveranstaltung der CDU mit Kai Wegner. 2025 ist er auf Einladung der CDU im Berliner Abgeordnetenhaus gewesen. Von uns hat er keine Einladung bekommen. Von Ihnen hat er eine Einladung bekommen. Können wir deshalb von engen Verbindungen der CDU-Fraktion zur Organisierten Kriminalität ausgehen?"], ["comment", "(Beifall bei der Linken sowie der Abg. Corinna Rüffer [BÜNDNIS 90/DIE GRÜNEN])"], ["antwort", "ID219515300"]]}, {"id": "ID219515400", "x": -8.508, "y": 1.269, "cluster": 4, "speaker": "Beatrix von Storch", "fraction": "AfD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 5044, "comments": 11, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515200", "ID219515900", "ID219515600", "ID219515100", "ID219514800"], "next": "ID219515500", "paragraphs": [["text", "Herr Präsident! Meine Damen und Herren! Wir reden heute über den Antisemitismus innerhalb der Berliner Linken. Es geht dabei ausdrücklich nicht um einzelne Entgleisungen Einzelner in Neukölln. Es geht um deren Strategie und um das ganze sie tragende Umfeld."], ["text", "Noch nie seit dem Krieg hat eine Partei den Hass auf Juden zur Wählermobilisierung eingesetzt so wie jetzt Die Linke in Berlin."], ["comment", "(Zuruf von der Linken: Das müssen Sie gerade sagen!)"], ["text", "Die Linke wurde nicht trotz ihres Antisemitismus gewählt, sondern wegen."], ["comment", "(Luigi Pantisano [Die Linke]: Was hat denn Ihr Opa gemacht?)"], ["text", "Linke-Wahlkampfveranstaltung in Neukölln. Ein Rapper singt: „Yallah, Yallah, Intifada!“, „Tod der israelischen Armee!“ Allein die zweite Intifada, das waren über 20 000 Terroranschläge, 138 Selbstmordanschläge, Abertausende Tote und Verletzte. „Yallah, Yallah, Intifada“, frei auf Deutsch übersetzt: „Auf geht’s! Lasst uns Juden ermorden!“ – Und die ganze linke Menge hat gejubelt und getanzt; wir haben es gesehen."], ["comment", "(Luigi Pantisano [Die Linke]: Eine Lüge!)"], ["text", "In Neukölln ist es nicht einmal mehr möglich, in der Bezirksverordnetenversammlung Gäste aus Israel zu empfangen. Als der Bürgermeister der israelischen Partnerstadt in Neukölln zu Besuch war, wurde er aufs Niederträchtigste beleidigt vom Fraktionschef der Linken, Ahmed Abed. Im Wahlkampf posierte der dann vor einer Palästinafahne mit einer Kalaschnikow – und wird nun zum Bürgermeister von Neukölln."], ["text", "Vanessa Emde, Linke Berlin, im Mai 2026 zum Existenzrecht Israels – Zitat –: „Es gibt kein Existenzrecht für Staaten.“ Heißt: Israel soll von der Landkarte verschwinden."], ["text", "Und Ferat Koçak? „Bro“, „Bruder“ im Herzen des Sohns des Rammo-Clan-Chefs und von Ibrahim Ibrahim, dem Aktivisten der PFLP. Die PFLP ist die Terrororganisation, die eine Air-France-Maschine entführt und – zusammen mit deutschen Linksextremisten – Juden ausselektiert hat, um sie zu ermorden – Juden ausselektieren, zur Ermordung. Das sind die Freunde der Linken."], ["text", "Nun macht Herr Koçak eine kurze Pause und wartet, bis Ihre und Ihre Parteifreunde im Abgeordnetenhaus den Linken-Terrorpaten an die Macht geholfen haben. Ordnungsmaßnahmen, Ämtersperren, Parteiausschluss? Fehlanzeige! Frau Schwerdtner, Frau Reichinnek und Frau Eralp haben nichts dagegen getan, und sie werden dagegen auch nichts tun, weil sie wissen: Das sind ihre wichtigsten Wahlhelfer. Rammo-Clan, Hamas, PFLP, das ist das tragende Umfeld der Linken."], ["text", "Die Linke hat den Osten an die AfD verloren"], ["comment", "(Luigi Pantisano [Die Linke]: Wer hat Lichtenberg gewonnen?)"], ["text", "und brauchte ein neues Geschäftsmodell zur Zerstörung unserer Kultur und Werte. Das neue Geschäftsmodell basiert auf Antisemitismus als Mittel der Massenmobilisierung. Das neue Geschäftsmodell heißt Islamo-Sozialismus."], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Frau Abgeordnete, würden Sie eine Zwischenfrage aus der Linksfraktion zulassen?"], ["text", "Bitte schön."], ["zwischenfrage", "ID219515400-2"], ["text", "Herr Kollege, Intifadas hat es in der Vergangenheit schon gegeben, und bei diesen Intifadas ging es nicht um Widerstand, sondern um 20 000 Terroranschläge, 138 Selbstmordattentate, über 7 000 Verletzte und über 1 000 Tote. Das ist Intifada. Wenn Sie jetzt so tun, als wäre das ein harmloses Widerstandstänzchen, dann wollen Sie uns Sand in die Augen streuen."], ["comment", "(Beifall bei der AfD)"], ["text", "Aber das funktioniert nicht mehr. Wir wissen, wo Sie stehen, und wir wissen, was Sie wollen und was Sie meinen."], ["text", "Das Geschäftsmodell heißt Islamo-Sozialismus: Masseneinwanderung, Masseneinbürgerung und Massenmobilisierung, vom Flüchtlingsheim über die Gazademo als neues deutsches Volk zur Wahlurne. „Refugees welcome“, „Open Borders“, „Kein Mensch ist illegal“, all diese linke Phrasen haben ein Ziel: die Wählerbasis der radikalen Linken zu vergrößern. Neukölln ist die Blaupause, die Vorhut. Nach Berlin kommt dann das Ruhrgebiet usw."], ["text", "Und die Strategie geht auf: 52 Prozent der Muslime in Berlin haben Die Linke gewählt, und zwar nicht, weil sie queer-feministische Politik wollen."], ["comment", "(Heiterkeit des Abg. Alexander Throm [CDU/CSU])"], ["text", "Der Antisemitismus ist der Kitt zwischen der Linken und ihren muslimischen Wählern. Sie setzt auf die Mischung aus Sozialneid und Judenhass. Enteignung und Gazaprotest sind die zwei Säulen dieser Mobilisierung. Dieser neue Islamo-Sozialismus hat zwei Feindbilder: die Reichen und die Juden. Das finale Ziel: Reiche erschießen und Juden ins Meer."], ["text", "Und: Die Islamo-Sozialisten bekommen langsam Mehrheiten, – ganz „demokratisch“. Dieses Frankenstein-Monster hat Angela Merkels Willkommenspolitik erschaffen."], ["comment", "(Beifall bei der AfD)"], ["text", "Der kontinuierliche Strom judenfeindlicher Migranten aus Nahost ist Wasser auf die Mühlen der radikalen Linken. 332 000 Einbürgerungen allein im letzten Jahr, die meisten davon Syrer, 900 täglich! Die und künftig deren Kinder – im Schnitt so drei bis fünf –, das ist das künftige deutsche Wahlvolk, mit dem die radikale Linke die bürgerliche Gesellschaft zerstören will. In Berlin haben die jetzt gewonnen. Issa Rammo – der neue Polizeipräsident Berlins. Und eine Generation später stellt dann der Rammo-Clan das ganze Kabinett."], ["text", "Liebe Kollegen von der Union, kommen Sie bitte zur Vernunft, und zwar schnell. Die Geister, die Sie riefen, werden Sie alleine nicht mehr los – und mit denen dort links auch nicht. Die blau-schwarze Mehrheit in diesem Parlament"], ["comment", "(Zurufe von der Linken: Aha!)"], ["text", "kann das stoppen – nur die."], ["comment", "(Luigi Pantisano [Die Linke]: Dann sind wir wieder bei Ihrem Opa! Was war denn mit Ihrem Opa?)"], ["text", "Die Mehrheiten sind da – gegen 900 Einbürgerungen am Tag. Die Alternative, vor der Deutschland steht, heißt AfD oder Islamo-Sozialismus."], ["text", "Vielen Dank."], ["comment", "(Beifall bei der AfD)"], ["chair", "Vizepräsident Bodo Ramelow:"], ["chair", "Für die SPD-Fraktion darf ich Helge Lindh das Wort erteilen."], ["comment", "(Beifall bei der SPD sowie bei Abgeordneten der CDU/CSU)"]]}, {"id": "ID219515400-2", "x": -8.394, "y": 1.628, "cluster": 4, "speaker": "Mirze Edis", "fraction": "Die Linke", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 663, "comments": 2, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515500", "ID219515900", "ID219515000", "ID219515400", "ID219515600"], "next": "ID219515500", "paragraphs": [["text", "Frau von Storch, Sie haben eben die Unwahrheit gesagt, indem Sie „Yallah, yallah, Intifada!“ als eine Kampfansage bezeichnet haben. Eigentlich heißt das: „Los, los, Aufstand!“"], ["comment", "(Dr. Ottilie Klein [CDU/CSU]: Ach!)"], ["text", "Also, das ist jetzt nicht unbedingt ein Aufruf zum Krieg oder, wie auch immer, zum Töten, sondern zum Aufstand."], ["comment", "(Lachen bei Abgeordneten der AfD – Alexander Throm [CDU/CSU]: Danke für die Bestätigung!)"], ["text", "Dann will ich Sie noch mal eines fragen. Die Definition für einen Faschisten ist: Als Faschist wird im politikwissenschaftlichen und historischen Sinn eine Person bezeichnet, die eine extrem rechtsgerichtete, antidemokratische und ultranationalistische Ideologie vertritt. – Würden Sie es als Beschimpfung empfinden, wenn jemand Sie als Faschist beschimpft oder bezeichnet?"], ["antwort", "ID219515400"]]}, {"id": "ID219515500", "x": -8.331, "y": 1.666, "cluster": 4, "speaker": "Helge Lindh", "fraction": "SPD", "role": null, "date": "2026-09-23", "agenda_id": "21/95/4", "agenda": "Fälle von Antisemitismus, Polizeifeindlichkeit sowie Nähe zu Islamisten, Linksextremisten und Clans bei den Linken Berlin – Jüngste Entwicklungen in den Blick nehmen", "top": "Zusatzpunkt 1", "drucksachen": [], "chars": 6758, "comments": 16, "pdf": "https://dserver.bundestag.de/btp/21/21095.pdf", "cite": "BT-PlPr. 21/95", "similar": ["ID219515000", "ID219515200", "ID219515600", "ID219515700", "ID219515900"], "next": "ID219515600", "paragraphs": [["text", "Herr Präsident! Liebe Kolleginnen und Kollegen! Ich bin mir nicht sicher, ob diese Debatte wenigstens in Teilen dem Umstand des grassierenden Antisemitismus in diesem Land seit dem 7. Oktober 2023 gerecht wird."], ["text", "Vor einigen Tagen traf ein Brandsatz die Wuppertaler Synagoge. Es fand also – auf Deutsch formuliert – ein Brandanschlag auf die Wuppertaler Synagoge in meinem Wahlkreis statt. Danach versammelte sich eine Mahnwache von – wenn man jeden am Rand Stehenden noch mitzählt – vielleicht 25 Personen, was symptomatisch ist für die jetzige Zeit. Und wir erlebten als dort Stehende, wie junge Erwachsene – Zitat – „Ihr Judenschweine!“ riefen. Darüber reden wir. Das ist eine Erfahrung, die Jüdinnen und Juden als Nachfahren der Ermordeten der Shoah in diesem Land machen."], ["comment", "(Dr. Katja Strauss-Köster [CDU/CSU]: Beschämend!)"], ["text", "Und wir erleben, dass sich mit Sicherheit diejenigen, die dort gerufen haben, und derjenige, der den Brandsatz geworfen hat, ermutigt fühlen durch Debatten, in denen Antizionismus und Antisemitismus geleugnet, relativiert, verharmlost werden. Darüber reden wir – um nicht weniger geht es –: über Menschen, die Opfer sind."], ["comment", "(Beifall bei Abgeordneten der SPD und der CDU/CSU)"], ["text", "Es ist ziemlich absurd, dass die AfD jetzt dieses Thema nutzt und es instrumentalisieren will, während sie ja immer wieder Verharmlosung und Relativierung des Nationalsozialismus betreibt"], ["comment", "(Dr. Malte Kaufmann [AfD]: Das stimmt doch gar nicht!)"], ["text", "und auch den Begriff „Schuldkult“ verwendet. Das ist inakzeptabel. Gleichzeitig aber muss ich, wenn ich Ihnen die Verwendung des Begriffs „Schuldkult“ vorwerfe, genauso deutlich sagen, dass es auch inakzeptabel ist, Formulierungen wie „Free Palestine from German Guilt“ zu verwenden. Denn auch das ist nichts anderes als eine Sch
