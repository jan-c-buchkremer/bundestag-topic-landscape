<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themenlandschaft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1f2328; --muted: #6b7280; --faint: #a1a1aa; --line: #e7e7e3; --accent: #2563eb; --accent-soft: #e8efff;
  --cdu: #2f2f2f; --spd: #d7263d; --afd: #1f8fd6; --gru: #3f9a3f; --lin: #c0397d; --frl: #8a8a8a; --reg: #a08a2e;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.5 Inter, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }

header { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: var(--card); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
header h1 a { color: inherit; }
header .meta { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.weekwrap { position: relative; }
.weekbtn { font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.weekbtn:hover { border-color: #cdcdc8; background: var(--bg); }
.weekbtn::before { content: ''; width: 11px; height: 11px; border: 1.5px solid var(--muted); border-top-width: 4px; border-radius: 2px; }
#weekCal { position: absolute; left: 0; top: 36px; z-index: 30; display: none; gap: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); padding: 12px 14px 10px; }
#weekCal.open { display: flex; }
#weekCal b { display: block; font-size: 12px; margin-bottom: 6px; }
#weekCal .mo { display: flex; gap: 3px; align-items: center; margin-bottom: 3px; }
#weekCal .mo span { width: 30px; font-size: 11px; color: var(--faint); }
#weekCal .wk { width: 26px; height: 22px; line-height: 22px; text-align: center; border-radius: 6px; font-size: 11px; color: #cfcfca; font-variant-numeric: tabular-nums; }
#weekCal .wk.has { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
#weekCal .wk.has:hover { background: var(--accent); color: #fff; text-decoration: none; }
#weekCal .wk.cur { background: var(--accent); color: #fff; }
#dayScale { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; display: none; align-items: center; gap: 14px; pointer-events: none;
  background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
#dayScale i { display: inline-block; width: 44px; height: 8px; border-radius: 4px; vertical-align: middle; margin-right: 6px; }
#dayScale .hint { color: var(--faint); }
header .help { color: var(--faint); font-size: 12.5px; }

#layout { display: grid; grid-template-columns: 270px 1fr 390px; height: calc(100% - 52px); }
aside, #panel { background: var(--card); overflow-y: auto; }
aside { border-right: 1px solid var(--line); padding: 14px 16px 24px; }
#panel { border-left: 1px solid var(--line); padding: 22px 24px 32px; }
#map { min-width: 0; position: relative; }
#tip { position: absolute; z-index: 5; width: 300px; pointer-events: none; display: none; transform: translate(-50%, -100%);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 9px; box-shadow: 0 6px 20px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05); font-size: 12.5px; line-height: 1.45; }
#tip::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: var(--card); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.lbl { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px;
  background: rgba(255,255,255,.72); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.06);
  font-size: 11.5px; font-weight: 500; color: #374151; letter-spacing: -.005em; transition: transform .15s, box-shadow .15s; }
.lbl .dot { width: 7px; height: 7px; }
.lbl .n { color: var(--faint); font-weight: 400; font-size: 10.5px; }
.lbl:hover { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 4px 12px rgba(0,0,0,.12); border-color: currentColor; z-index: 4; }
.lbl.zoomed { font-size: 12.5px; padding: 4px 11px 4px 8px; }
#tip.below { transform: translate(-50%, 0); }

/* tours */
.tourbtn { font-size: 12.5px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.tourbtn:hover { border-color: #cdcdc8; background: var(--bg); }
#tourMenu { position: absolute; right: 22px; top: 46px; z-index: 30; width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); padding: 6px; display: none; }
#tourMenu.open { display: block; }
#tourMenu .t { display: block; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: inherit; }
#tourMenu .t:hover { background: var(--bg); text-decoration: none; }
#tourMenu .t b { display: block; font-weight: 600; font-size: 13px; }
#tourMenu .t span { color: var(--muted); font-size: 12px; }
#tourDim { position: fixed; inset: 0; z-index: 20; background: rgba(15,23,42,.32); pointer-events: none; display: none; }
#tourDim.show { display: block; }
.tour-target { position: relative; z-index: 21; border-radius: 8px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 7px var(--accent-soft); background: var(--card); }
#map.tour-target { border-radius: 0; box-shadow: inset 0 0 0 3px var(--accent); background: transparent; }
#map.tour-keep { position: relative; z-index: 21; }
#tourCard { position: fixed; z-index: 22; width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 14px 16px 12px; display: none; font-size: 13px; line-height: 1.5; }
#tourCard.show { display: block; }
#tourCard .bar { height: 3px; margin: 0 0 10px; background: var(--line); }
#tourCard .bar i { background: var(--accent); }
#tourCard .step { color: var(--faint); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
#tourCard h4 { margin: 2px 0 6px; font-size: 14px; font-weight: 600; }
#tourCard p { margin: 0 0 10px; color: var(--muted); }
#tourCard p b { color: var(--text); font-weight: 500; }
#tourCard .row { display: flex; gap: 12px; align-items: center; }
#tourCard .row .spacer { flex: 1; }
#tourCard .next { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
#tourCard .wait { color: var(--accent); font-size: 12.5px; }
#tourCard.done { border-color: #3f9a3f; box-shadow: 0 0 0 3px #e3f3e3, 0 10px 30px rgba(0,0,0,.14); }
#tourCard.done .wait { color: #3f9a3f; }
#tip.below::after { bottom: auto; top: -6px; transform: translateX(-50%) rotate(-135deg); }
#tip .who { font-weight: 600; display: flex; align-items: center; gap: 6px; }
#tip .who span { font-weight: 400; color: var(--muted); }
#tip .when { color: var(--faint); font-size: 11.5px; margin-bottom: 5px; }
#tip .top { color: var(--text); margin-bottom: 1px; }
#tip .topic { color: var(--accent); font-size: 11.5px; margin-bottom: 6px; }
#tip .excerpt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; mask-image: linear-gradient(#000 45%, transparent 100%); -webkit-mask-image: linear-gradient(#000 45%, transparent 100%); }
#map .cursor-move { cursor: default !important; }  /* Plotly's four-arrow pan cursor */

.sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.sidebar-head b { font-size: 13px; font-weight: 600; }
#count { color: var(--muted); font-size: 12px; }
.linkbtn { font-size: 12.5px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.linkbtn:hover { text-decoration: underline; }

.group { border-top: 1px solid var(--line); padding: 8px 0; }
.group .title { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 3px 0; }
.group .title .arrow { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--faint); transition: transform .2s; margin-left: auto; }
.group.collapsed .title .arrow { transform: rotate(-90deg); }
.group .title .badge { font-size: 10.5px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 6px; }
.group .title .reload { font-size: 13px; color: var(--faint); cursor: pointer; padding: 0 2px; }
.group .title .reload:hover { color: var(--text); }
.group .content { padding-top: 4px; }
.group.collapsed .content { display: none; }
.list { max-height: 264px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.item { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 6px; cursor: pointer; font-size: 12.5px; line-height: 1.35; }
.item:hover { background: var(--bg); }
.item:hover .name { color: var(--accent); }
.item input { margin: 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .n { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.item.zero { opacity: .45; }
.item.day { font-weight: 600; margin-top: 6px; }
.item.day:first-child { margin-top: 0; }
.item.day .dot { width: 22px; border-radius: 4px; }
.item:not(.day)[data-key=agenda] { padding-left: 14px; }
.item .x { color: var(--faint); font-size: 14px; line-height: 1; padding: 0 2px; }
.item .x:hover { color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }

.searchrow { display: flex; gap: 0; margin-bottom: 6px; }
.searchrow input { flex: 1; min-width: 0; border-radius: 8px 0 0 8px; }
.searchrow button { border: 1px solid var(--line); border-left: 0; background: var(--bg); color: var(--text); border-radius: 0 8px 8px 0; padding: 0 10px; font-size: 12.5px; cursor: pointer; }
.searchrow button:hover { background: #ecece8; }
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 6px; }
.segmented button { border: 0; background: transparent; border-radius: 6px; padding: 5px 2px; font-size: 12px; color: var(--muted); cursor: pointer; }
.segmented button.on { background: var(--card); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
select, input[type=text] { width: 100%; font: inherit; font-size: 12.5px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
select:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; cursor: pointer; font-size: 12.5px; }
.toggle input { appearance: none; width: 30px; height: 18px; border-radius: 999px; background: #d9d9d4; position: relative; cursor: pointer; margin: 0; transition: background .15s; flex: none; }
.toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { left: 14px; }

#panel .hint { color: var(--muted); }
#panel .hint kbd { font: inherit; font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--bg); }
#panel h2 { font-size: 16px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; line-height: 1.35; }
#panel .meta { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-bottom: 16px; }
#panel .meta b { color: var(--text); font-weight: 500; }
#panel p { margin: 0 0 10px; }
#panel p.comment { color: var(--faint); font-style: italic; font-size: 12.5px; padding-left: 12px; border-left: 2px solid var(--line); }
#panel p.chair { color: var(--muted); font-size: 12.5px; padding-left: 12px; border-left: 2px solid #cfd8ea; }
#panel mark { background: #fff3a8; color: inherit; border-radius: 2px; }
#panel h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
#panel table { border-collapse: collapse; width: 100%; font-size: 13px; }
#panel td { padding: 4px 0; vertical-align: top; }
#panel td:last-child { text-align: right; color: var(--muted); white-space: nowrap; padding-left: 10px; }
#panel ul { padding-left: 0; margin: 0; list-style: none; }
#panel li { margin-bottom: 6px; }
#panel li .sub { color: var(--faint); font-size: 12px; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; }
.similar { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; margin-bottom: 6px; transition: border-color .12s, background .12s; }
.similar:hover { border-color: #cdcdc8; background: var(--bg); }
.similar .who { font-weight: 500; }
.similar .who span { color: var(--faint); font-weight: 400; }
.similar .what { color: var(--muted); font-size: 12px; }
.similar .kind { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.similar.marker { margin: 4px 0 12px; }
.similar .full { display: none; margin-top: 6px; }
.similar.open .full { display: block; }
.similar.open .what { display: none; }
#panel .similar .full p { font-size: 12.5px; margin: 0 0 6px; }
#panel table.dist tr { cursor: pointer; }
#panel table.dist tr:hover td:first-child { color: var(--accent); }
#panel details summary { color: var(--muted); font-size: 12px; cursor: pointer; margin: 2px 0 4px; }
.close { float: right; color: var(--faint); background: none; border: 0; font-size: 18px; line-height: 1; cursor: pointer; margin: -4px -6px 0 0; }
.close:hover { color: var(--text); }

@media (max-width: 1000px) { #layout { grid-template-columns: 1fr; grid-auto-rows: auto; height: auto; } aside, #panel { border: 0; border-bottom: 1px solid var(--line); } #map { min-height: 70vh; } header .help { display: none; } }
</style>
</head>
<body>
<header>
  <h1><a href="index.html">Themenlandschaft</a></h1>
  <span class="weekwrap"><button class="weekbtn" id="weekBtn" title="Sitzungswoche wählen"></button><div id="weekCal"></div></span>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span class="help">Scrollen: Zoom · Ziehen: Verschieben · Doppelklick: Zurücksetzen</span>
  <button class="tourbtn" id="tourBtn">Tour</button>
  <div id="tourMenu"></div>
</header>
<div id="tourDim"></div><div id="tourCard"></div>
<div id="layout">
  <aside>
    <div class="sidebar-head"><b>Filter</b><span><span id="count"></span> · <button class="linkbtn" id="reset">zurücksetzen</button></span></div>
    <div class="group" id="g-search"><div class="title">Suche<span class="arrow"></span></div><div class="content">
      <div class="searchrow"><input type="text" id="search" placeholder="Text, Name, Tagesordnungspunkt…"><button id="addSearch" title="Suchbegriff als Filter speichern (Enter)">+</button></div>
      <div class="list" id="searchList"></div>
    </div></div>
    <div class="group collapsed" id="g-fraction"><div class="title">Fraktion<span class="arrow"></span></div><div class="content"><div class="list" data-key="fraction"></div></div></div>
    <div class="group collapsed" id="g-agenda"><div class="title">Tagesordnung<span class="reload" data-key="agenda" title="Nach Häufigkeit in der aktuellen Ansicht sortieren">↻</span><span class="arrow"></span></div><div class="content"><div class="list" data-key="agenda"></div></div></div>
    <div class="group collapsed" id="g-cluster"><div class="title">Thema<span class="reload" data-key="cluster" title="Nach Häufigkeit in der aktuellen Ansicht sortieren">↻</span><span class="arrow"></span></div><div class="content"><div class="list" data-key="cluster"></div></div></div>
    <div class="group collapsed" id="g-speaker"><div class="title">Redner:in<span class="reload" data-key="speaker" title="Nach Häufigkeit in der aktuellen Ansicht sortieren">↻</span><span class="arrow"></span></div><div class="content"><div class="list" data-key="speaker"></div></div></div>
    <div class="group" id="g-view"><div class="title">Anzeige<span class="arrow"></span></div><div class="content">
      <div class="segmented" id="color">
        <button data-mode="cluster" class="on">Thema</button><button data-mode="fraction">Fraktion</button><button data-mode="weekday">Tag</button><button data-mode="agenda">TOP</button><button data-mode="mdb">Rolle</button>
      </div>
      <label class="toggle">Gefilterte abdunkeln statt ausblenden <input type="checkbox" id="dim"></label>
      <label class="toggle">Regierungsbefragung zeigen <input type="checkbox" id="befragung"></label>
      <label class="toggle">Größe nach Redelänge <input type="checkbox" id="size"></label>
      <label class="toggle">Themen-Labels <input type="checkbox" id="showLabels"></label>
    </div></div>
  </aside>
  <div id="map"><div id="labels"></div><div id="tip"></div><div id="dayScale"></div></div>
  <div id="panel"></div>
</div>
<script>
const DATA = __DATA__;
const S = DATA.speeches;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FRACTION_COLORS = { 'CDU/CSU': css('--cdu'), 'SPD': css('--spd'), 'AfD': css('--afd'), 'BÜNDNIS 90/DIE GRÜNEN': css('--gru'), 'Die Linke': css('--lin'), 'fraktionslos': css('--frl'), 'ohne Fraktion': css('--reg') };
const ROLE_COLORS = ['#2a78d6', '#eb6834'];  // Abgeordnete, Regierung
const NOISE = '#d4d4d0';
const FRACTION_ORDER = Object.keys(FRACTION_COLORS);
const DAY_ORDER = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const weekdayOf = d => DAY_ORDER[(new Date(d).getUTCDay() + 6) % 7];
const clusterById = Object.fromEntries(DATA.clusters.map(c => [c.id, c]));
const median = a => { const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };
const hsv = (h, s, v) => { const f = n => { const k = (n + h * 6) % 6; return Math.round(255 * v * (1 - s * Math.max(0, Math.min(k, 4 - k, 1)))); }; return `rgb(${f(5)},${f(3)},${f(1)})`; };
const CLUSTER_COLOR = (() => {  // evenly spaced vivid hues, ordered by each cluster's angle around the map centre so the map reads like a colour wheel
  const cx = median(S.map(s => s.x)), cy = median(S.map(s => s.y));
  const angle = c => { const g = S.filter(s => s.cluster === c.id); return Math.atan2(median(g.map(s => s.y)) - cy, median(g.map(s => s.x)) - cx); };
  const ordered = DATA.clusters.map(c => [c.id, angle(c)]).sort((a, b) => a[1] - b[1]);
  return Object.fromEntries(ordered.map(([id], i) => [id, hsv(i / ordered.length, .75, .92)]));
})();
const ACRONYMS = new Set(['usa', 'nato', 'eu', 'uno', 'un', 'csd', 'ard', 'zdf', 'kfw', 'dfb', 'fifa', 'ki', 'eeg', 'geg', 'stpo', 'bgb', 'sgb', 'bka', 'bnd', 'öpnv', 'lng', 'co2', 'nis', 'tv', 'gkv', 'pkv', 'iwf', 'oecd', 'wto']);
const cap = w => ACRONYMS.has(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1);
const clusterLabel = (c, n = 3) => c < 0 ? 'ohne Thema' : clusterById[c].terms.slice(0, n).map(cap).join(' · ');
const excerpt = s => { const t = s.paragraphs.find(p => p[0] === 'text'); return t ? t[1].slice(0, 140) + '…' : ''; };
const byId = Object.fromEntries(S.map(s => [s.id, s]));
const fmt = d => d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4);
S.forEach(s => {
  s.weekday = weekdayOf(s.date);
  s.befragung = s.agenda === 'Befragung der Bundesregierung';
  s.text = s.paragraphs.filter(p => p[0] === 'text').map(p => p[1]).join('\n');
  s.haystack = `${s.speaker}\n${s.role || ''}\n${s.agenda}\n${s.text}`.toLowerCase();
});
const AGENDA = [...Map.groupBy(S, s => s.agenda_id).values()].map(v => v[0]).sort((a, b) => a.agenda_id.localeCompare(b.agenda_id, 'de', {numeric: true}));
const AGENDA_BY = Object.fromEntries(AGENDA.map(a => [a.agenda_id, a]));
const dates = [...new Set(S.map(s => s.date))].sort();
const DAY_HUES = [.585, .07, .36, .74];  // blue, orange, green, purple: the hues of the day scales below
const AGENDA_COLOR = Object.fromEntries([...Map.groupBy(AGENDA, a => a.date)].flatMap(([d, items]) => {
  const h = DAY_HUES[dates.indexOf(d) % DAY_HUES.length];  // AGENDA holds each item's first speech, so S order = speaking order
  return items.sort((a, b) => S.indexOf(a) - S.indexOf(b)).map((a, j) => {
    const t = items.length > 1 ? j / (items.length - 1) : .5;

const keyOf = { cluster: s => s.cluster, fraction: s => s.fraction, weekday: s => s.weekday, agenda: s => s.agenda_id, mdb: s => s.role ? 'Regierung' : 'Abgeordnete' };

let labelAnchors = [];
const labelLayer = document.getElementById('labels');
function placeLabels() {
  const fl = map._fullLayout;
  if (!fl || !state.showLabels) { labelLayer.innerHTML = ''; return; }
  const xa = fl.xaxis, ya = fl.yaxis, W = map.clientWidth, H = map.clientHeight;
  const zoom = SPAN / (xa.range[1] - xa.range[0]);  // 1 ≈ the whole week in view
  const terms = zoom > 2 ? 4 : 3, zoomed = zoom > 1.6;
  const px = a => ({ x: xa.l2p(a.x) + fl._size.l, y: ya.l2p(a.y) + fl._size.t });
  const items = labelAnchors.map(a => ({ ...a, ...px(a) })).filter(a => a.x > 0 && a.x < W && a.y > 0 && a.y < H).sort((a, b) => b.n - a.n);
  const colour = id => state.mode === 'cluster' ? GROUPS.cluster.color(id) : '#b4b4b0';  // labels carry the topic colour only when points do
  labelLayer.innerHTML = items.map(a => `<div class="lbl${zoomed ? ' zoomed' : ''}" data-c="${a.id}" style="left:${a.x}px;top:${a.y}px;color:${colour(a.id)}">${dot(colour(a.id))}<span style="color:#374151">${esc(clusterLabel(a.id, terms))}</span><span class="n">${a.n}</span></div>`).join('');
  // greedy overlap resolution: bigger clusters first; a colliding label slides up or down, else hides
  const placed = [];
  labelLayer.querySelectorAll('.lbl').forEach((el, i) => {
    const w = el.offsetWidth + 6, h = el.offsetHeight + 4, x = Math.min(Math.max(items[i].x, w / 2 + 4), W - w / 2 - 4);
    el.style.left = x + 'px';
    let y = items[i].y, ok = false;
    for (const dy of [0, -1, 1, -2, 2, -3, 3]) {
      const yy = items[i].y + dy * h;
      if (!placed.some(r => Math.abs(r.x - x) < (r.w + w) / 2 && Math.abs(r.y - yy) < (r.h + h) / 2)) { y = yy; ok = true; break; }
    }
    if (!ok) { el.remove(); return; }
    el.style.top = y + 'px'; placed.push({ x, y, w, h });
    el.onclick = () => showCluster(+el.dataset.c);
  });
}

    { target: () => document.getElementById('dim').closest('.toggle'), prepare: () => { expand('g-view'); if (!state.dim) { state.dim = true; draw(); } }, keepMap: true, title: 'Kontext behalten', text: '„Gefilterte abdunkeln“ ist eingeschaltet: gefilterte Reden bleiben blass sichtbar, statt zu verschwinden. So bleibt der Rest der Woche als Kontext stehen.' },
    { target: '#color button[data-mode=agenda]', keepMap: true, title: 'Farbe nach Tagesordnungspunkt', text: '<b>Wähle die Farbe „TOP“.</b> Jede Debatte bekommt eine eigene Farbe.', done: () => state.mode === 'agenda' },
    { target: '#map', title: 'Verteilung', text: '„{agenda}“ verteilt sich auf <b>{agendaClusters} Themen</b>. Die Farbe dieser Debatte taucht an mehreren Stellen der Karte auf.' },
    { target: () => listRow('agenda', pick.agenda), prepare: () => { expand('g-agenda'); listRow('agenda', pick.agenda)?.scrollIntoView({ block: 'center' }); }, keepMap: true, title: 'Nur diese Debatte', text: '<b>Hake „{agenda}“ an.</b> Alles andere wird abgedunkelt.', done: () => state.checked.agenda.has(pick.agenda) },
    { target: '#color button[data-mode=fraction]', prepare: () => expand('g-view'), keepMap: true, title: 'Wer spricht wo', text: '<b>Wähle die Farbe „Fraktion“.</b> Jetzt siehst du, welche Fraktion in welcher Ecke der Debatte spricht.', done: () => state.mode === 'fraction' },
    { target: '#map', title: 'Ein Thema in der Debatte', text: '<b>Klicke ein Themen-Label</b> innerhalb der Debatte. Die Balken zeigen die Fraktionen dieses Themas.', done: () => panelKind === 'cluster' },
  ] },
  person: { title: 'Einer Person folgen', blurb: 'Alle Reden einer Person, ihre Themen und ähnliche Reden anderer.', steps: [
    { intro: true, title: 'Eine Person', text: 'Jede Rede gehört zu einer Person. In dieser Tour wählst du eine aus, siehst ihre Themen und Reden der Woche und springst über ähnliche Reden zu anderen Personen.' },
    { target: '#g-speaker .reload', prepare: () => expand('g-speaker'), title: 'Die aktivsten zuerst', text: '<b>Klicke ↻</b> neben „Redner:in“. Die Liste wird nach Häufigkeit sortiert.', done: () => flags.reloaded.speaker },
    { target: () => listEls.speaker.querySelector('.item'), keepMap: true, title: 'Eine Person wählen', text: '<b>Klicke auf einen Namen</b>, zum Beispiel {speaker}. Der Name öffnet das Profil, das Häkchen davor würde die Karte filtern.', done: () => panelKind === 'group' && flags.card.k === 'speaker' },
    { target: '#panel', title: 'Das Profil der Woche', text: 'Fraktion, Tage, Themen und Tagesordnungspunkte dieser Person als Balken, darunter alle ihre Reden – auch Antworten aus der Regierungsbefragung.' },
    { target: '#panel', keepMap: true, title: 'Eine Rede öffnen', text: '<b>Öffne eine Rede aus der Liste.</b>', done: () => state.open !== '' },
    { target: '#panel', keepMap: true, title: 'Über Fraktionsgrenzen', text: '<b>Klicke unter „Ähnliche Reden“ eine Rede einer anderen Person.</b> So springst du von Argument zu Gegenargument.', done: () => state.open !== '' && byId[state.open].speaker !== flags.card.v },
    { target: '#meta', title: 'Teilen', text: 'Alles, was du eingestellt hast, steckt in der Adresszeile. Kopiere die URL, um genau diese Ansicht zu teilen.' },
  ] },
};
const tour = { id: '', step: 0 };
const card = document.getElementById('tourCard'), tourMenu = document.getElementById('tourMenu');
const fill = t => t.replace('{cluster}', esc(pick.clusterLabel)).replace('{agenda}', esc(pick.agendaTitle.slice(0, 60))).replace('{agendaClusters}', pick.agendaClusters).replace('{speaker}', esc(pick.speaker));
const spot = el => { document.querySelectorAll('.tour-target').forEach(x => x.classList.remove('tour-target')); if (el) el.classList.add('tour-target'); };
function startTour(id) { tour.id = id; tour.step = 0; tourMenu.classList.remove('open'); document.getElementById('tourDim').classList.add('show'); showStep(); }
function endTour() { tour.id = ''; spot(null); map.classList.remove('tour-keep'); card.classList.remove('show', 'done'); document.getElementById('tourDim').classList.remove('show'); }
function showStep() {
  const steps = TOURS[tour.id].steps;
  if (tour.step >= steps.length) {  // closing card
    spot(null);
    const others = Object.entries(TOURS).filter(([k]) => k !== tour.id).map(([k, t]) => `<a href="#" onclick="startTour('${k}');return false">${t.title}</a>`).join(' · ');
    card.className = 'show';
    card.innerHTML = `<div class="bar"><i style="width:100%;display:block;height:100%"></i></div><div class="step">Fertig</div><h4>${TOURS[tour.id].title}</h4><p>Das war die Tour. <a href="#" onclick="document.getElementById('reset').click();return false">Zurücksetzen</a> oder weiter mit: ${others}</p><div class="row"><span class="spacer"></span><button class="next" onclick="endTour()">Schließen</button></div>`;
    place(document.getElementById('map')); return;
  }
  const st = steps[tour.step];
  st.prepare?.();
  const el = st.intro ? null : typeof st.target === 'function' ? st.target() : document.querySelector(st.target);
  spot(el);
  document.getElementById('tourDim').classList.toggle('show', !st.intro);
  map.classList.toggle('tour-keep', !!st.keepMap && el !== map);
  card.className = 'show';
  card.innerHTML = `<div class="bar"><i style="width:${100 * tour.step / steps.length}%;display:block;height:100%"></i></div>
    <div class="step">Schritt ${tour.step + 1} von ${steps.length}</div><h4>${fill(st.title)}</h4><p>${fill(st.text)}</p>
    <div class="row"><a href="#" class="linkbtn" onclick="tour.step++;showStep();return false">Überspringen</a><a href="#" class="linkbtn" onclick="endTour();return false">Beenden</a><span class="spacer"></span>
    ${st.done ? '<span class="wait">Warte auf dich …</span>' : '<button class="next" onclick="tour.step++;showStep()">Weiter</button>'}</div>`;
  place(el);
}
function place(el) {
  const r = (el || document.getElementById('map')).getBoundingClientRect(), W = innerWidth, H = innerHeight, cw = 320, ch = card.offsetHeight || 160;
  let x, y;
  if (r.width < W / 2) { x = r.right + 14 < W - cw ? r.right + 14 : r.left - cw - 14; y = r.top; }  // beside a sidebar / panel element
  else { x = r.left + r.width / 2 - cw / 2; y = r.top + 24; }                                     // over the map
  card.style.left = Math.min(Math.max(x, 8), W - cw - 8) + 'px'; card.style.top = Math.min(Math.max(y, 8), H - ch - 8) + 'px';
}
let advancing = false;
function tourCheck() {
  if (!tour.id || advancing) return;
  const st = TOURS[tour.id].steps[tour.step];
  if (!st || !st.done || !st.done()) return;
  advancing = true; card.classList.add('done'); card.querySelector('.wait').textContent = 'Erledigt ✓';
  setTimeout(() => { advancing = false; tour.step++; showStep(); }, 700);
}
tourMenu.innerHTML = Object.entries(TOURS).map(([k, t]) => `<a class="t" href="#" onclick="startTour('${k}');return false"><b>${t.title}</b><span>${t.blurb} · ${t.steps.length} Schritte</span></a>`).join('');
document.getElementById('tourBtn').onclick = e => { e.stopPropagation(); tourMenu.classList.toggle('open'); };
document.addEventListener('click', e => { if (!tourMenu.contains(e.target)) tourMenu.classList.remove('open'); if (!weekCal.contains(e.target)) weekCal.classList.remove('open'); });
window.addEventListener('resize', () => { if (tour.id) place(document.querySelector('.tour-target')); });

// --- side panel -----------------------------------------------------------------------
const panel = document.getElementById('panel');
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
const dot = color => `<span class="dot" style="background:${color}"></span>`;
const highlight = t => {
  const terms = state.terms.filter(x => x.on).map(x => x.term).concat(state.live.length > 1 ? [state.live] : []);
  return terms.reduce((h, term) => h.replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`), esc(t));
};
// info cards: every distribution of a set of speeches as bars; a row opens that value's own card
const DIMS = [['fraction', 'Fraktionen'], ['weekday', 'Tage'], ['cluster', 'Themen'], ['agenda', 'Tagesordnungspunkte'], ['speaker', 'Redner:innen']];
const barName = { weekday: GROUPS.weekday.name, agenda: v => AGENDA_BY[v].agenda, cluster: v => clusterLabel(v), fraction: v => v, speaker: v => v };
const bars = (k, g) => {
  const by = Map.groupBy(g, GROUPS[k].of), vals = [...by.keys()], max = Math.max(...[...by.values()].map(v => v.length));
  if (k === 'fraction' || k === 'weekday') vals.sort(GROUPS[k].order); else vals.sort((a, b) => by.get(b).length - by.get(a).length);
  const tr = v => { const n = by.get(v).length, c = GROUPS[k].color(v);
    return `<tr data-card="${k}" data-v="${esc(v)}"><td>${dot(c)} ${esc(barName[k](v))}<div class="bar"><i style="width:${100 * n / max}%;background:${c}"></i></div></td><td>${n}</td></tr>`; };
  const head = vals.slice(0, 12).map(tr).join(''), rest = vals.slice(12);
  return `<table class="dist">${head}</table>${rest.length ? `<details><summary>${rest.length} weitere</summary><table class="dist">${rest.map(tr).join('')}</table></details>` : ''}`;
};
const breakdown = (g, skip) => DIMS.filter(([k]) => k !== skip).map(([k, title]) => `<h3>${title}</h3>${bars(k, g)}`).join('');
const speechCard = (o, what, head = '') => `<div class="similar" data-open="${o.id}">${head}<div class="who">${dot(GROUPS.fraction.color(o.fraction))} ${esc(o.speaker)} <span>· ${esc(o.fraction)}${o.weekday ? ' · ' + o.weekday : ''}</span></div><div class="what">${what}</div></div>`;
const firstText = o => (o.paragraphs.find(p => p[0] === 'text') || ['', ''])[1];
const cut = (t, n) => t.length > n ? t.slice(0, n) + '…' : t;

// Zwischenfragen: a card where another person took the floor; one too short to be a point expands in place
const MARKERS = { zwischenfrage: 'Zwischenfrage', kurzintervention: 'Kurzintervention', antwort: 'Antwort in der Rede' };
function markerCard(kind, id, s) {
  const o = byId[id] || DATA.linked[id];
  if (!o) return '';
  let what = firstText(o);
  if (kind === 'antwort') {  // the main speech from where it answers this one
    const i = o.paragraphs.findIndex(([k, t]) => k in MARKERS && t === s.id);
    what = (o.paragraphs.slice(i + 1).find(p => p[0] === 'text') || ['', what])[1];
  }
  const head = `<div class="kind">${MARKERS[kind]}</div>`;
  if (byId[id]) return speechCard(o, esc(cut(what, 180)), head).replace('class="similar"', 'class="similar marker"');
  const full = o.paragraphs.filter(([k]) => !(k in MARKERS)).map(([k, t]) => `<p class="${k}">${esc(t)}</p>`).join('');
  return `<div class="similar marker" data-aside>${head}<div class="who">${dot(GROUPS.fraction.color(o.fraction))} ${esc(o.speaker)} <span>· ${esc(o.fraction)}</span></div><div class="what">${esc(cut(what, 180))}</div><div class="full">${full}</div></div>`;
}

function showHint() {
  panelKind = 'hint';
  panel.innerHTML = `<p class="hint">Jeder Punkt ist eine Rede der Sitzungswoche; nahe Punkte handeln von Ähnlichem. Die Beschriftungen sind die Themen, die sich aus den Reden ergeben.</p>
    <p class="hint">Filter links: das Häkchen filtert, ein Klick auf den Namen zeigt die Übersicht. Innerhalb einer Gruppe „oder“, zwischen Gruppen „und“; nichts angehakt heißt alles. Suchbegriffe markieren Treffer, <kbd>Enter</kbd> macht sie zum Filter.<br>Punkt anklicken: die Rede mit Zwischenrufen, Zwischenfragen, Quelle, der nächsten und ähnlichen Reden. Label anklicken: wer spricht zu diesem Thema. <kbd>Esc</kbd> schließt.</p>`;
}
function showSpeech(s) {
  panelKind = 'speech';
  state.open = s.id;
  if (s.befragung) state.befragung = true;
  const paras = s.paragraphs.map(([k, t]) => k in MARKERS ? markerCard(k, t, s) : `<p class="${k}">${k === 'text' ? highlight(t) : esc(t)}</p>`).join('');
  const next = byId[s.next];
  panel.innerHTML = `
    <button class="close" onclick="state.open='';showHint();draw()" title="Schließen (Esc)">×</button>
    <h2>${esc(s.speaker)}</h2>
    <div class="meta"><b>${esc(s.fraction)}</b>${s.role ? ' · ' + esc(s.role) : ''} · <a href="#" onclick="setSpeaker(${esc(JSON.stringify(s.speaker))});return false">alle Reden</a><br>
      ${s.weekday} ${fmt(s.date)} · ${esc(s.top)}<br>${dot(AGENDA_COLOR[s.agenda_id])} ${esc(s.agenda)}<br>
      Thema: <a href="#" onclick="setCluster(${s.cluster});return false">${esc(clusterLabel(s.cluster))}</a> · ${s.chars.toLocaleString('de')} Zeichen · ${s.comments} Zwischenrufe/Beifall<br>
      <a href="${s.pdf}" target="_blank" rel="noopener">${esc(s.cite)} (PDF)</a> · Rede ${s.id}${s.drucksachen.length ? ' · Drs. ' + s.drucksachen.join(', ') : ''}</div>
    ${paras}
    ${next ? `<h3>Nächste Rede</h3>${speechCard(next, esc(next.agenda.slice(0, 80)))}` : ''}
    <h3>Ähnliche Reden</h3>${s.similar.map(id => speechCard(byId[id], esc(byId[id].agenda.slice(0, 80)))).join('')}`;
  panel.scrollTop = 0;
  tourCheck();
}
function showCluster(id) {
  panelKind = 'cluster';
  const c = clusterById[id], g = S.filter(s => s.cluster === id);
  panel.innerHTML = `<button class="close" onclick="showHint()" title="Schließen">×</button>
    <h2>${esc(c.terms.join(' · '))}</h2>
    <div class="meta">${g.length} Reden · <a href="#" onclick="setCluster(${id});return false">nur dieses Thema zeigen</a></div>${breakdown(g, 'cluster')}`;
  panel.scrollTop = 0;
  tourCheck();
}
function showGroup(g, title, subtitle, k, v) {
  panelKind = 'group';
  flags.card = { k, v };
  const only = k ? ` · <a href="#" data-only="${k}" data-v="${esc(v)}">nur diese zeigen</a>` : '';
  const list = g.length <= 40 ? `<h3>Reden</h3>${g.map(o => speechCard(o, `${esc(o.agenda.slice(0, 70))}<br>${esc(excerpt(o).slice(0, 110))}`)).join('')}` : '';
  panel.innerHTML = `<button class="close" onclick="showHint()" title="Schließen">×</button>
    <h2>${esc(title)}</h2>
    <div class="meta">${subtitle ? esc(subtitle) + ' · ' : ''}${g.length} Reden · ${g.reduce((a, s) => a + s.chars, 0).toLocaleString('de')} Zeichen · ${g.reduce((a, s) => a + s.comments, 0)} Zwischenrufe/Beifall${only}</div>${breakdown(g, k)}${list}`;
  panel.scrollTop = 0;
  tourCheck();
}
// the card of one filter value: from a name in the sidebar or a bar in another card
function showCard(k, v) {
  if (k === 'cluster' && v >= 0) return showCluster(v);
  const g = S.filter(s => GROUPS[k].of(s) === v), a = g[0];
  if (k === 'agenda') return showGroup(g, a.agenda, `${a.weekday} ${fmt(a.date)} · ${a.top}`, k, v);
  if (k === 'weekday') return showGroup(g, `${v} ${fmt(a.date)}`, 'Sitzungstag', k, v);
  showGroup(g, GROUPS[k].name(v), { fraction: 'Fraktion', speaker: 'alle Reden dieser Woche', cluster: 'Reden ohne Thema' }[k], k, v);
}
panel.addEventListener('click', e => {
  const el = e.target.closest('[data-open], [data-aside], [data-card], [data-only]');
  if (!el) return;
  e.preventDefault();
  if (el.dataset.open) { showSpeech(byId[el.dataset.open]); draw(); return; }
  if ('aside' in el.dataset) { el.classList.toggle('open'); return; }
  const k = el.dataset.card || el.dataset.only, v = k === 'cluster' ? +el.dataset.v : el.dataset.v;
  el.dataset.card ? showCard(k, v) : setOnly(k, v);
});
if (byId[state.open]) showSpeech(byId[state.open]); else showHint();
draw();
if (TOURS[startTourId]) startTour(startTourId);
map.on('plotly_relayouting', placeLabels);
map.on('plotly_relayout', placeLabels);
map.on('plotly_afterplot', placeLabels);
window.addEventListener('resize', () => setTimeout(placeLabels, 50));
const tip = document.getElementById('tip');
map.on('plotly_hover', e => {
  const s = byId[e.points[0].customdata], ev = e.event, r = map.getBoundingClientRect();
  if (!s || !ev) return;
  tip.innerHTML = `<div class="who">${dot(GROUPS.fraction.color(s.fraction))}${esc(s.speaker)} <span>${esc(s.fraction)}</span></div>
    <div class="when">${s.weekday} ${fmt(s.date)} · ${esc(s.top)}${s.role ? ' · ' + esc(s.role) : ''}</div>
    <div class="top">${esc(s.agenda.slice(0, 120))}</div>
    <div class="topic">${esc(clusterLabel(s.cluster))}</div>
    <div class="excerpt">${esc(s.text.slice(0, 400))}</div>`;
  tip.style.display = 'block';
  flags.hovered = true; tourCheck();
  const x = Math.min(Math.max(ev.clientX - r.left, 160), r.width - 160), cy = ev.clientY - r.top;
  const below = cy - 16 < tip.offsetHeight + 8;
  tip.classList.toggle('below', below);
  tip.style.left = x + 'px'; tip.style.top = (below ? cy + 16 : cy - 16) + 'px';
});
map.on('plotly_unhover', () => tip.style.display = 'none');
map.addEventListener('mouseleave', () => tip.style.display = 'none');
map.on('plotly_click', e => {
  const id = e.points[0].customdata;
  if (id === state.open) { state.open = ''; showHint(); } else showSpeech(byId[id]);  // second click on the open speech closes it
  draw();
});
</script>
</body>
</html>
