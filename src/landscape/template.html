<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themenlandschaft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1f2328; --muted: #6b7280; --faint: #a1a1aa; --line: #e7e7e3; --accent: #2563eb; --accent-soft: #e8efff;
  --cdu: #2f2f2f; --spd: #d7263d; --afd: #1f8fd6; --gru: #3f9a3f; --lin: #c0397d; --frl: #8a8a8a; --reg: #a08a2e;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.5 Inter, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }

header { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: var(--card); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
header h1 a { color: inherit; }
header .meta { color: var(--muted); font-size: 13px; }
header select { width: auto; }
header .spacer { flex: 1; }
header .help { color: var(--faint); font-size: 12.5px; }

#layout { display: grid; grid-template-columns: 250px 1fr 390px; height: calc(100% - 52px); }
aside, #panel { background: var(--card); overflow-y: auto; }
aside { border-right: 1px solid var(--line); padding: 18px 18px 24px; }
#panel { border-left: 1px solid var(--line); padding: 22px 24px 32px; }
#map { min-width: 0; }

.section { margin-bottom: 20px; }
.section > .label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; user-select: none; font-size: 12.5px; background: var(--card); transition: background .12s, border-color .12s; }
.chip:hover { border-color: #cdcdc8; }
.chip small { color: var(--faint); font-size: 11px; }
.chip.off { color: var(--faint); background: transparent; border-style: dashed; }
.chip.off .dot { opacity: .25; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border-radius: 8px; padding: 3px; }
.segmented button { border: 0; background: transparent; border-radius: 6px; padding: 5px 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.segmented button.on { background: var(--card); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
select, input[type=text] { width: 100%; font: inherit; font-size: 12.5px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
select:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; cursor: pointer; font-size: 12.5px; }
.toggle input { appearance: none; width: 30px; height: 18px; border-radius: 999px; background: #d9d9d4; position: relative; cursor: pointer; margin: 0; transition: background .15s; flex: none; }
.toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { left: 14px; }
#count { color: var(--muted); font-size: 12.5px; }
.linkbtn { font-size: 12.5px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.linkbtn:hover { text-decoration: underline; }

#panel .hint { color: var(--muted); }
#panel .hint kbd { font: inherit; font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--bg); }
#panel h2 { font-size: 16px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; line-height: 1.35; }
#panel .meta { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-bottom: 16px; }
#panel .meta b { color: var(--text); font-weight: 500; }
#panel p { margin: 0 0 10px; }
#panel p.comment { color: var(--faint); font-style: italic; font-size: 12.5px; padding-left: 12px; border-left: 2px solid var(--line); }
#panel p.chair { color: var(--muted); font-size: 12.5px; padding-left: 12px; border-left: 2px solid #cfd8ea; }
#panel h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
#panel table { border-collapse: collapse; width: 100%; font-size: 13px; }
#panel td { padding: 4px 0; vertical-align: top; }
#panel td:last-child { text-align: right; color: var(--muted); white-space: nowrap; padding-left: 10px; }
#panel ul { padding-left: 0; margin: 0; list-style: none; }
#panel li { margin-bottom: 6px; }
#panel li .sub { color: var(--faint); font-size: 12px; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; }
.similar { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; margin-bottom: 6px; transition: border-color .12s, background .12s; }
.similar:hover { border-color: #cdcdc8; background: var(--bg); }
.similar .who { font-weight: 500; }
.similar .what { color: var(--muted); font-size: 12px; }
.close { float: right; color: var(--faint); background: none; border: 0; font-size: 18px; line-height: 1; cursor: pointer; margin: -4px -6px 0 0; }
.close:hover { color: var(--text); }

@media (max-width: 1000px) { #layout { grid-template-columns: 1fr; grid-auto-rows: auto; height: auto; } aside, #panel { border: 0; border-bottom: 1px solid var(--line); } #map { min-height: 70vh; } header .help { display: none; } }
</style>
</head>
<body>
<header>
  <h1><a href="index.html">Themenlandschaft</a></h1>
  <select id="weekSel" title="Sitzungswoche"></select>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span class="help">Scrollen: Zoom · Ziehen: Verschieben · Doppelklick: Zurücksetzen</span>
</header>
<div id="layout">
  <aside>
    <div class="section"><div class="label">Farbe</div><div class="segmented" id="color">
      <button data-mode="cluster" class="on">Cluster</button><button data-mode="fraction">Fraktion</button><button data-mode="weekday">Tag</button><button data-mode="mdb">Rolle</button>
    </div></div>
    <div class="section"><div class="label">Fraktion</div><div class="chips" id="fractions"></div></div>
    <div class="section"><div class="label">Tag</div><div class="chips" id="days"></div></div>
    <div class="section"><div class="label">Tagesordnungspunkt</div><select id="agenda"><option value="">alle</option></select></div>
    <div class="section"><div class="label">Cluster</div><select id="clusterSel"><option value="">alle</option></select></div>
    <div class="section"><div class="label">Redner:in</div><input type="text" id="speaker" list="speakers" placeholder="Name…"><datalist id="speakers"></datalist></div>
    <div class="section">
      <label class="toggle">Regierungsbefragung zeigen <input type="checkbox" id="befragung"></label>
      <label class="toggle">Größe nach Redelänge <input type="checkbox" id="sizeByLength"></label>
      <label class="toggle">Cluster-Labels <input type="checkbox" id="showLabels" checked></label>
      <label class="toggle">Auswahl-Werkzeug (Lasso) <input type="checkbox" id="lasso"></label>
    </div>
    <div class="section"><span id="count"></span> · <button class="linkbtn" id="reset">zurücksetzen</button></div>
  </aside>
  <div id="map"></div>
  <div id="panel"></div>
</div>
<script>
const DATA = __DATA__;
const S = DATA.speeches;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FRACTION_COLORS = { 'CDU/CSU': css('--cdu'), 'SPD': css('--spd'), 'AfD': css('--afd'), 'BÜNDNIS 90/DIE GRÜNEN': css('--gru'), 'Die Linke': css('--lin'), 'fraktionslos': css('--frl'), 'ohne Fraktion': css('--reg') };
const PALETTE = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948','#8db8ea','#f5a88a','#7ed4b3','#f5c96a','#f3b4c9','#6fbf6f','#a49bd9','#f09a9a'];
const NOISE = '#d4d4d0';
const FRACTION_ORDER = Object.keys(FRACTION_COLORS);
const DAY_ORDER = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const clusterById = Object.fromEntries(DATA.clusters.map(c => [c.id, c]));
const clusterLabel = c => c < 0 ? 'ohne Cluster' : clusterById[c].terms.slice(0, 3).join(' · ');
const excerpt = s => { const t = s.paragraphs.find(p => p[0] === 'text'); return t ? t[1].slice(0, 140) + '…' : ''; };
const byId = Object.fromEntries(S.map(s => [s.id, s]));
S.forEach(s => {
  s.weekday = DAY_ORDER[(new Date(s.date).getUTCDay() + 6) % 7];
  s.befragung = s.agenda === 'Befragung der Bundesregierung';
  s.hover = `<b>${s.speaker}</b> · ${s.fraction}${s.role ? ' · ' + s.role : ''}<br>${s.weekday} ${s.date} · ${s.top}<br>${s.agenda.slice(0, 90)}<br><i>${clusterLabel(s.cluster)}</i><br><span style="color:#888">${excerpt(s)}</span>`;
});
const FRACTIONS = [...new Set(S.map(s => s.fraction))].sort((a, b) => (FRACTION_ORDER.indexOf(a) + 1 || 99) - (FRACTION_ORDER.indexOf(b) + 1 || 99));
const DAYS = DAY_ORDER.filter(d => S.some(s => s.weekday === d));
const dates = [...new Set(S.map(s => s.date))].sort();
const fmt = d => d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4);
document.getElementById('meta').textContent = `${fmt(dates[0])} – ${fmt(dates[dates.length - 1])} · ${S.length} Reden · ${DATA.clusters.length} Themen`;
document.title = `Themenlandschaft ${DATA.week}`;
const weekSel = document.getElementById('weekSel');
DATA.weeks.forEach(w => weekSel.add(new Option(w, w, false, w === DATA.week)));
weekSel.onchange = e => location.href = e.target.value + '.html';

// --- state, kept in the URL hash so a view can be shared -----------------------------
const state = { mode: 'cluster', fractions: new Set(FRACTIONS), days: new Set(DAYS), agenda: '', cluster: '', speaker: '', befragung: false, open: '' };
const encodeState = () => {
  const h = new URLSearchParams();
  if (state.mode !== 'cluster') h.set('farbe', state.mode);
  const fOff = FRACTIONS.filter(f => !state.fractions.has(f)); if (fOff.length) h.set('ohne', fOff.join('|'));
  const dOff = DAYS.filter(d => !state.days.has(d)); if (dOff.length) h.set('ohneTag', dOff.join('|'));
  if (state.agenda) h.set('top', state.agenda);
  if (state.cluster !== '') h.set('cluster', state.cluster);
  if (state.speaker) h.set('redner', state.speaker);
  if (state.befragung) h.set('befragung', '1');
  if (state.open) h.set('rede', state.open);
  history.replaceState(null, '', h.size ? '#' + h : location.pathname);
};
const decodeState = () => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('farbe')) state.mode = h.get('farbe');
  (h.get('ohne') || '').split('|').filter(Boolean).forEach(f => state.fractions.delete(f));
  (h.get('ohneTag') || '').split('|').filter(Boolean).forEach(d => state.days.delete(d));
  state.agenda = h.get('top') || ''; state.cluster = h.get('cluster') ?? ''; state.speaker = h.get('redner') || '';
  state.befragung = h.get('befragung') === '1'; state.open = h.get('rede') || '';
};
decodeState();

// --- controls -------------------------------------------------------------------------
const chipEls = {};
const chips = (containerId, values, set, colorOf) => {
  const el = document.getElementById(containerId);
  values.forEach(v => {
    const c = document.createElement('span'); c.className = 'chip' + (set.has(v) ? '' : ' off');
    c.innerHTML = `<span class="dot" style="background:${colorOf(v)}"></span>${v} <small></small>`;
    c.onclick = e => {
      if (e.altKey || e.shiftKey) { set.clear(); set.add(v); }  // shift-click: only this one
      else if (set.has(v)) set.delete(v); else set.add(v);
      draw();
    };
    chipEls[v] = c; el.appendChild(c);
  });
};
chips('fractions', FRACTIONS, state.fractions, f => FRACTION_COLORS[f] || NOISE);
chips('days', DAYS, state.days, d => PALETTE[DAY_ORDER.indexOf(d)]);
const agendaSel = document.getElementById('agenda');
[...Map.groupBy(S, s => s.agenda_id).values()].map(v => v[0]).sort((a, b) => a.agenda_id.localeCompare(b.agenda_id, 'de', {numeric: true}))
  .forEach(s => agendaSel.add(new Option(`${s.weekday} · ${s.agenda.slice(0, 60)}`, s.agenda_id)));
const clusterSel = document.getElementById('clusterSel');
DATA.clusters.forEach(c => clusterSel.add(new Option(`${c.terms.join(', ')} (${c.n})`, c.id)));
const speakerInput = document.getElementById('speaker');
[...new Set(S.map(s => s.speaker))].sort().forEach(n => document.getElementById('speakers').appendChild(new Option(n)));
agendaSel.onchange = e => { state.agenda = e.target.value; draw(); if (state.agenda) { const g = S.filter(s => s.agenda_id === state.agenda); showGroup(g, g[0].agenda, `${g[0].weekday} ${fmt(g[0].date)} · ${g[0].top}`); } };
clusterSel.onchange = e => { state.cluster = e.target.value; draw(); if (state.cluster !== '') showCluster(+state.cluster); };
let typing;
speakerInput.oninput = e => { state.speaker = e.target.value.trim(); clearTimeout(typing); typing = setTimeout(draw, 120); };
document.getElementById('befragung').onchange = e => { state.befragung = e.target.checked; draw(); };
['sizeByLength', 'showLabels', 'lasso'].forEach(id => document.getElementById(id).onchange = draw);
document.querySelectorAll('#color button').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; draw(); });
document.getElementById('reset').onclick = () => {
  Object.assign(state, { mode: 'cluster', fractions: new Set(FRACTIONS), days: new Set(DAYS), agenda: '', cluster: '', speaker: '', befragung: false, open: '' });
  showHint(); draw();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') { state.open = ''; showHint(); draw(); } });
const setSpeaker = name => { state.speaker = name; draw(); showGroup(S.filter(s => s.speaker === name), name, 'alle Reden dieser Woche'); };
const setCluster = id => { state.cluster = String(id); draw(); };

function syncControls() {
  document.querySelectorAll('#color button').forEach(x => x.classList.toggle('on', x.dataset.mode === state.mode));
  FRACTIONS.forEach(f => chipEls[f].classList.toggle('off', !state.fractions.has(f)));
  DAYS.forEach(d => chipEls[d].classList.toggle('off', !state.days.has(d)));
  agendaSel.value = state.agenda; clusterSel.value = state.cluster;
  if (document.activeElement !== speakerInput) speakerInput.value = state.speaker;
  document.getElementById('befragung').checked = state.befragung;
}

const visible = s => state.fractions.has(s.fraction) && state.days.has(s.weekday)
  && (!state.agenda || s.agenda_id === state.agenda) && (state.cluster === '' || s.cluster === +state.cluster)
  && (!state.speaker || s.speaker.toLowerCase().includes(state.speaker.toLowerCase())) && (state.befragung || state.speaker || state.agenda || !s.befragung);  // an explicit speaker/TOP filter overrides the Befragung hide

// --- drawing --------------------------------------------------------------------------
const keyOf = { cluster: s => s.cluster, fraction: s => s.fraction, weekday: s => s.weekday, mdb: s => s.role ? 'Regierung' : 'Abgeordnete' };
const colorOf = {
  cluster: k => k < 0 ? NOISE : PALETTE[k % PALETTE.length],
  fraction: k => FRACTION_COLORS[k] || NOISE,
  weekday: k => PALETTE[DAY_ORDER.indexOf(k)],
  mdb: k => k === 'Abgeordnete' ? PALETTE[0] : PALETTE[1],
};
const nameOf = { cluster: clusterLabel, fraction: k => k, weekday: k => k, mdb: k => k };
const order = { cluster: (a, b) => a - b, fraction: (a, b) => FRACTIONS.indexOf(a) - FRACTIONS.indexOf(b), weekday: (a, b) => DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b), mdb: (a, b) => a < b ? -1 : 1 };
const FONT = 'Inter, system-ui, sans-serif';

function draw() {
  syncControls(); encodeState();
  const mode = state.mode;
  const sizeBy = document.getElementById('sizeByLength').checked;
  const shown = S.filter(visible);
  document.getElementById('count').textContent = `${shown.length} von ${S.length} Reden`;
  const counts = Map.groupBy(shown, s => s.fraction), dcounts = Map.groupBy(shown, s => s.weekday);
  FRACTIONS.forEach(f => chipEls[f].querySelector('small').textContent = (counts.get(f) || []).length || '');
  DAYS.forEach(d => chipEls[d].querySelector('small').textContent = (dcounts.get(d) || []).length || '');
  const size = s => sizeBy ? 5 + 11 * Math.sqrt(s.chars / 8000) : 8;
  const groups = Map.groupBy(shown, keyOf[mode]);
  const traces = [...groups.keys()].sort(order[mode]).map(k => {
    const g = groups.get(k);
    return {
      type: 'scattergl', mode: 'markers', name: nameOf[mode](k),
      x: g.map(s => s.x), y: g.map(s => s.y), customdata: g.map(s => s.id), text: g.map(s => s.hover), hoverinfo: 'text',
      marker: { color: colorOf[mode](k), size: g.map(size), opacity: .9, line: { width: 1, color: '#ffffff' } },
    };
  });
  const open = byId[state.open];
  if (open) traces.push({ type: 'scattergl', mode: 'markers', name: 'geöffnet', showlegend: false, hoverinfo: 'skip',
    x: [open.x], y: [open.y], customdata: [open.id], marker: { color: 'rgba(0,0,0,0)', size: size(open) + 10, line: { width: 2, color: '#1f2328' } } });
  const annotations = document.getElementById('showLabels').checked ? DATA.clusters.map(c => {
    const g = shown.filter(s => s.cluster === c.id);
    if (g.length < 3) return null;
    return { x: g.reduce((a, s) => a + s.x, 0) / g.length, y: g.reduce((a, s) => a + s.y, 0) / g.length,
      text: clusterLabel(c.id), showarrow: false, captureevents: true,
      font: { size: 11.5, color: '#374151', family: FONT }, bgcolor: 'rgba(255,255,255,.82)', borderpad: 3, _cluster: c.id };
  }).filter(Boolean) : [];
  Plotly.react('map', traces, {
    paper_bgcolor: css('--bg'), plot_bgcolor: css('--bg'), font: { color: css('--muted'), family: FONT, size: 12 },
    margin: { l: 16, r: 16, t: 16, b: 16 }, hovermode: 'closest',
    dragmode: document.getElementById('lasso').checked ? 'lasso' : 'pan',
    xaxis: { visible: false }, yaxis: { visible: false, scaleanchor: 'x' },
    hoverlabel: { bgcolor: '#ffffff', bordercolor: '#e7e7e3', font: { color: '#1f2328', size: 12, family: FONT }, align: 'left' },
    showlegend: mode !== 'cluster', legend: { orientation: 'h', y: 0, x: 0.5, xanchor: 'center', yanchor: 'bottom', bgcolor: 'rgba(255,255,255,.7)' },
    annotations, uirevision: 'keep',
  }, { responsive: true, scrollZoom: true, displayModeBar: false, doubleClick: 'reset' });
}

// --- side panel -----------------------------------------------------------------------
const panel = document.getElementById('panel');
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const dot = color => `<span class="dot" style="background:${color}"></span>`;
const bars = (items, colorOf) => `<table>${items.map(([k, n, total]) =>
  `<tr><td>${dot(colorOf(k))} ${esc(k)}<div class="bar"><i style="width:${100 * n / total}%;background:${colorOf(k)}"></i></div></td><td>${n}</td></tr>`).join('')}</table>`;
const breakdown = (g, withTopics = true) => {
  const byF = Map.groupBy(g, s => s.fraction), byA = Map.groupBy(g, s => s.agenda_id), byC = Map.groupBy(g, s => s.cluster), byS = Map.groupBy(g, s => s.speaker);
  return `
    <h3>Fraktionen</h3>${bars(FRACTIONS.filter(f => byF.has(f)).map(f => [f, byF.get(f).length, g.length]), f => FRACTION_COLORS[f] || NOISE)}
    ${withTopics ? '<h3>Themen</h3>' + bars([...byC].sort((a, b) => b[1].length - a[1].length).map(([c, v]) => [clusterLabel(c), v.length, g.length]), c => PALETTE[0]) : ''}
    <h3>Tagesordnungspunkte</h3><ul>${[...byA.values()].sort((a, b) => b.length - a.length).map(v => `<li>${esc(v[0].agenda.slice(0, 110))} <span class="sub">${v[0].weekday} · ${v.length}</span></li>`).join('')}</ul>
    <h3>Redner:innen</h3><p>${[...byS].sort((a, b) => b[1].length - a[1].length).slice(0, 12).map(([n, v]) => `<a href="#" onclick="setSpeaker(${JSON.stringify(n)});return false">${esc(n)}</a>${v.length > 1 ? ' (' + v.length + ')' : ''}`).join(', ')}</p>`;
};
function showHint() {
  panel.innerHTML = `<p class="hint">Jeder Punkt ist eine Rede der Sitzungswoche; nahe Punkte handeln von Ähnlichem. Die Beschriftungen sind die Themen, die sich aus den Reden ergeben.</p>
    <p class="hint">Punkt anklicken: die Rede mit Zwischenrufen, Quelle und ähnlichen Reden.<br>Label anklicken: wer spricht zu diesem Thema.<br>Lasso einschalten und Punkte umkreisen: Zusammensetzung der Auswahl.<br>Shift-Klick auf einen Chip: nur diesen zeigen. <kbd>Esc</kbd> schließt.</p>`;
}
function showSpeech(s) {
  state.open = s.id;
  if (s.befragung) state.befragung = true;
  const paras = s.paragraphs.map(([k, t]) => `<p class="${k}">${esc(t)}</p>`).join('');
  const similar = s.similar.map(id => byId[id]).map(o => `<div class="similar" onclick="showSpeech(byId['${o.id}']);draw()"><div class="who">${dot(FRACTION_COLORS[o.fraction] || NOISE)} ${esc(o.speaker)} <span class="sub" style="color:var(--faint);font-weight:400">· ${esc(o.fraction)}</span></div><div class="what">${esc(o.agenda.slice(0, 80))}</div></div>`).join('');
  panel.innerHTML = `
    <button class="close" onclick="state.open='';showHint();draw()" title="Schließen (Esc)">×</button>
    <h2>${esc(s.speaker)}</h2>
    <div class="meta"><b>${esc(s.fraction)}</b>${s.role ? ' · ' + esc(s.role) : ''} · <a href="#" onclick="setSpeaker(${JSON.stringify(s.speaker)});return false">alle Reden</a><br>
      ${s.weekday} ${fmt(s.date)} · ${esc(s.top)}<br>${esc(s.agenda)}<br>
      Thema: <a href="#" onclick="setCluster(${s.cluster});return false">${esc(clusterLabel(s.cluster))}</a> · ${s.chars.toLocaleString('de')} Zeichen · ${s.comments} Zwischenrufe/Beifall<br>
      <a href="${s.pdf}" target="_blank" rel="noopener">${esc(s.cite)} (PDF)</a> · Rede ${s.id}${s.drucksachen.length ? ' · Drs. ' + s.drucksachen.join(', ') : ''}</div>
    ${paras}
    <h3>Ähnliche Reden</h3>${similar}`;
  panel.scrollTop = 0;
}
function showCluster(id) {
  const c = clusterById[id], g = S.filter(s => s.cluster === id);
  panel.innerHTML = `<button class="close" onclick="showHint()" title="Schließen">×</button>
    <h2>${esc(c.terms.join(' · '))}</h2>
    <div class="meta">${g.length} Reden · <a href="#" onclick="setCluster(${id});return false">nur dieses Thema zeigen</a></div>${breakdown(g, false)}`;
  panel.scrollTop = 0;
}
function showGroup(g, title, subtitle) {
  const list = g.length <= 40 ? `<h3>Reden</h3>${g.map(o => `<div class="similar" onclick="showSpeech(byId['${o.id}']);draw()"><div class="who">${dot(FRACTION_COLORS[o.fraction] || NOISE)} ${esc(o.speaker)} <span style="color:var(--faint);font-weight:400">· ${esc(o.fraction)} · ${o.weekday}</span></div><div class="what">${esc(o.agenda.slice(0, 70))}<br>${esc(excerpt(o).slice(0, 110))}</div></div>`).join('')}` : '';
  panel.innerHTML = `<button class="close" onclick="showHint()" title="Schließen">×</button>
    <h2>${esc(title)}</h2>
    <div class="meta">${subtitle ? esc(subtitle) + ' · ' : ''}${g.length} Reden · ${g.reduce((a, s) => a + s.chars, 0).toLocaleString('de')} Zeichen · ${g.reduce((a, s) => a + s.comments, 0)} Zwischenrufe/Beifall</div>${breakdown(g)}${list}`;
  panel.scrollTop = 0;
}
const map = document.getElementById('map');
if (byId[state.open]) showSpeech(byId[state.open]); else showHint();
draw();
map.on('plotly_click', e => { showSpeech(byId[e.points[0].customdata]); draw(); });
map.on('plotly_clickannotation', e => showCluster(e.annotation._cluster));
map.on('plotly_selected', e => { if (e && e.points.length) showGroup(e.points.map(p => byId[p.customdata]), `${e.points.length} ausgewählte Reden`, 'Lasso-Auswahl'); });
</script>
</body>
</html>
